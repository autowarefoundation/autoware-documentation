<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="ros-nodes-parameter-schema-flow-title">
  <title id="ros-nodes-parameter-schema-flow-title">
    The schema file validates the parameter file in the CI and generates the parameter table of the web documentation, and the node reads the parameter file at startup without validation.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="900" height="270"/>
  <circle class="halo" cx="150" cy="135" r="110"/>
  <circle class="halo cyan" cx="500" cy="135" r="120"/>

  <!-- Schema file -->
  <rect class="box primary" x="30" y="100" width="230" height="70" rx="14"/>
  <circle class="icon-bg on" cx="64" cy="135" r="17"/>
  <path class="icon-line" d="M60 126 Q56 126 56 130 V132 Q56 135 53 135 Q56 135 56 138 V140 Q56 144 60 144 M68 126 Q72 126 72 130 V132 Q72 135 75 135 Q72 135 72 138 V140 Q72 144 68 144"/>
  <text class="lbl on-primary" x="92" y="124" dominant-baseline="central">Schema file</text>
  <text class="code on-primary" x="92" y="146" dominant-baseline="central">*.schema.json</text>

  <!-- Parameter file -->
  <rect class="card" x="390" y="34" width="230" height="70" rx="14"/>
  <circle class="icon-bg" cx="424" cy="69" r="17"/>
  <path class="icon-line" d="M418 59 H427 L431 63 V79 H418 Z M421 67 H428 M421 71 H428 M421 75 H426"/>
  <text class="lbl" x="452" y="58" dominant-baseline="central">Parameter file</text>
  <text class="code" x="452" y="80" dominant-baseline="central">*.param.yaml</text>

  <!-- Web documentation -->
  <rect class="card" x="390" y="166" width="230" height="70" rx="14"/>
  <circle class="icon-bg" cx="424" cy="201" r="17"/>
  <path class="icon-line" d="M415 193 H433 V209 H415 Z M415 199 H433 M415 204 H433 M421 193 V209"/>
  <text class="lbl" x="452" y="190" dominant-baseline="central">Web documentation</text>
  <text class="sub" x="452" y="212" dominant-baseline="central">Parameter table</text>

  <!-- ROS node -->
  <rect class="card" x="710" y="34" width="170" height="70" rx="14"/>
  <text class="lbl" x="795" y="56" text-anchor="middle" dominant-baseline="central">ROS node</text>
  <text class="code" x="795" y="76" text-anchor="middle" dominant-baseline="central">declare_parameter()</text>
  <text class="sub" x="795" y="92" text-anchor="middle" dominant-baseline="central">No runtime validation</text>

  <!-- Edges -->
  <path class="edge accent" d="M260 122 H320 V69 H384"/>
  <path class="flow flow-accent" pathLength="100" d="M260 122 H320 V69 H380"/>
  <path class="edge accent head" d="M260 122 H320 V69 H384"/>
  <text class="edge-lbl" x="320" y="95" text-anchor="middle" dominant-baseline="central">Validation (CI)</text>

  <path class="edge accent" d="M260 148 H320 V201 H384"/>
  <path class="flow flow-accent" pathLength="100" d="M260 148 H320 V201 H380"/>
  <path class="edge accent head" d="M260 148 H320 V201 H384"/>
  <text class="edge-lbl" x="320" y="175" text-anchor="middle" dominant-baseline="central">Generate</text>

  <path class="edge" d="M620 69 H704"/>
  <path class="flow" pathLength="100" d="M620 69 H700"/>
  <path class="edge head" d="M620 69 H704"/>
  <text class="edge-lbl" x="664" y="52" text-anchor="middle" dominant-baseline="central">At startup</text>
</svg>
