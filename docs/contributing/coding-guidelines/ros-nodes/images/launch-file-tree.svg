<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="ros-nodes-launch-file-tree-title">
  <title id="ros-nodes-launch-file-tree-title">
    The launch files of autoware_launch 0.53.0 from the simulator launch files through autoware.launch.xml and component_localization.launch.xml to the launch files of the localization node packages.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="960" height="620"/>
  <circle class="halo cyan" cx="480" cy="128" r="110"/>
  <circle class="halo" cx="466" cy="420" r="150"/>
  <circle class="halo" cx="790" cy="470" r="120"/>

  <!-- Simulator launch files -->
  <rect class="card" x="20" y="20" width="280" height="44" rx="12"/>
  <text class="code" x="160" y="42" text-anchor="middle" dominant-baseline="central">logging_simulator.launch.xml</text>
  <rect class="card" x="340" y="20" width="280" height="44" rx="12"/>
  <text class="code" x="480" y="42" text-anchor="middle" dominant-baseline="central">planning_simulator.launch.xml</text>
  <rect class="card" x="660" y="20" width="280" height="44" rx="12"/>
  <text class="code" x="800" y="42" text-anchor="middle" dominant-baseline="central">e2e_simulator.launch.xml</text>

  <path class="edge dash" d="M160 64 V128 H324"/>
  <path class="edge dash" d="M480 64 V94"/>
  <path class="edge dash" d="M800 64 V128 H636"/>
  <text class="edge-lbl" x="240" y="128" text-anchor="middle" dominant-baseline="central">includes</text>
  <text class="edge-lbl" x="720" y="128" text-anchor="middle" dominant-baseline="central">includes</text>

  <!-- The main launch file -->
  <rect class="box primary" x="330" y="100" width="300" height="56" rx="14"/>
  <circle class="icon-bg on" cx="362" cy="128" r="16"/>
  <path class="icon-line" d="M357 120 L369 128 L357 136 Z"/>
  <text class="code lbl on-primary" x="388" y="119" dominant-baseline="central">autoware.launch.xml</text>
  <text class="sub on-primary" x="388" y="139" dominant-baseline="central">The entry point of Autoware</text>

  <path class="edge accent" d="M480 156 V176 H156 V190"/>
  <path class="flow flow-accent" pathLength="100" d="M480 156 V176 H156 V186"/>
  <path class="edge accent head" d="M480 156 V176 H156 V190"/>

  <!-- Panel A: included by autoware.launch.xml -->
  <rect class="glass-panel" x="16" y="196" width="280" height="298" rx="18"/>
  <text class="code lbl" x="32" y="221" dominant-baseline="central">autoware_launch</text>
  <text class="sub" x="32" y="239" dominant-baseline="central">Included by autoware.launch.xml</text>

  <rect class="card" x="28" y="256" width="256" height="38" rx="10"/>
  <text class="code" x="156" y="275" text-anchor="middle" dominant-baseline="central">component_map.launch.xml</text>
  <rect class="card" x="28" y="302" width="256" height="38" rx="10"/>
  <text class="code" x="156" y="321" text-anchor="middle" dominant-baseline="central">component_sensing.launch.xml</text>
  <rect class="card" x="28" y="348" width="256" height="38" rx="10"/>
  <text class="code lbl" x="156" y="367" text-anchor="middle" dominant-baseline="central">component_localization.launch.xml</text>
  <rect class="card" x="28" y="394" width="256" height="38" rx="10"/>
  <text class="code" x="156" y="413" text-anchor="middle" dominant-baseline="central">pointcloud_container.launch.py</text>
  <rect class="box muted" x="28" y="440" width="256" height="40" rx="10"/>
  <text class="sub" x="156" y="453" text-anchor="middle" dominant-baseline="central">More components: perception,</text>
  <text class="sub" x="156" y="468" text-anchor="middle" dominant-baseline="central">planning, control, and others</text>

  <!-- Parameter files of the localization launch files -->
  <rect class="box muted" x="16" y="510" width="280" height="94" rx="14"/>
  <text class="lbl" x="32" y="532" dominant-baseline="central">Parameter files</text>
  <text class="code" x="32" y="556" dominant-baseline="central">autoware_localization_config</text>
  <text class="sub" x="32" y="578" dominant-baseline="central">The localization launch files read</text>
  <text class="sub" x="32" y="594" dominant-baseline="central">their parameter files from here.</text>

  <path class="edge accent" d="M284 367 H302"/>
  <path class="flow flow-accent" pathLength="100" d="M284 367 H300"/>
  <path class="edge accent head" d="M284 367 H302"/>

  <!-- Panel B: autoware_localization_launch -->
  <rect class="glass-panel" x="308" y="196" width="316" height="408" rx="18"/>
  <text class="code lbl" x="324" y="221" dominant-baseline="central">autoware_localization_launch</text>
  <text class="sub" x="324" y="239" dominant-baseline="central">Included by component_localization</text>

  <rect class="card" x="320" y="256" width="292" height="46" rx="10"/>
  <text class="code" x="332" y="271" dominant-baseline="central">ndt_scan_matcher.launch.xml</text>
  <text class="sub" x="332" y="289" dominant-baseline="central">Pose estimator (pose_source:=ndt)</text>

  <rect class="card" x="320" y="310" width="292" height="46" rx="10"/>
  <text class="code" x="332" y="325" dominant-baseline="central">gyro_odometer.launch.xml</text>
  <text class="sub" x="332" y="343" dominant-baseline="central">Twist estimator (twist_source:=gyro_odom)</text>

  <rect class="box muted" x="320" y="364" width="292" height="46" rx="10"/>
  <text class="lbl" x="332" y="379" dominant-baseline="central">Other estimators</text>
  <text class="sub" x="332" y="397" dominant-baseline="central">yabloc, eagleye, artag, lidar-marker</text>

  <rect class="card" x="320" y="418" width="292" height="46" rx="10"/>
  <text class="code" x="332" y="433" dominant-baseline="central">util.launch.xml</text>
  <text class="sub" x="332" y="451" dominant-baseline="central">Pose initializer</text>

  <rect class="card" x="320" y="472" width="292" height="46" rx="10"/>
  <text class="code lbl" x="332" y="487" dominant-baseline="central">pose_twist_fusion_filter.launch.xml</text>
  <text class="sub" x="332" y="505" dominant-baseline="central">Fuses the pose and the twist</text>

  <rect class="card" x="320" y="526" width="292" height="46" rx="10"/>
  <text class="code" x="332" y="541" dominant-baseline="central">localization_error_monitor.launch.xml</text>
  <text class="sub" x="332" y="559" dominant-baseline="central">Monitors the pose error</text>

  <path class="edge accent" d="M612 495 H630"/>
  <path class="flow flow-accent" pathLength="100" d="M612 495 H628"/>
  <path class="edge accent head" d="M612 495 H630"/>

  <!-- Panel C: launch files of the node packages -->
  <rect class="glass-panel" x="636" y="328" width="308" height="276" rx="18"/>
  <text class="lbl" x="652" y="353" dominant-baseline="central">Node packages</text>
  <text class="sub" x="652" y="371" dominant-baseline="central">Included by pose_twist_fusion_filter</text>

  <rect class="card" x="648" y="388" width="284" height="44" rx="10"/>
  <text class="code" x="660" y="402" dominant-baseline="central">ekf_localizer.launch.xml</text>
  <text class="sub" x="660" y="419" dominant-baseline="central">autoware_ekf_localizer</text>

  <rect class="card" x="648" y="440" width="284" height="44" rx="10"/>
  <text class="code" x="660" y="454" dominant-baseline="central">stop_filter.launch.xml</text>
  <text class="sub" x="660" y="471" dominant-baseline="central">autoware_stop_filter</text>

  <rect class="card" x="648" y="492" width="284" height="44" rx="10"/>
  <text class="code" x="660" y="506" dominant-baseline="central">twist2accel.launch.xml</text>
  <text class="sub" x="660" y="523" dominant-baseline="central">autoware_twist2accel</text>

  <rect class="card" x="648" y="544" width="284" height="44" rx="10"/>
  <text class="code" x="660" y="558" dominant-baseline="central">pose_instability_detector.launch.xml</text>
  <text class="sub" x="660" y="575" dominant-baseline="central">autoware_pose_instability_detector</text>
</svg>
