<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="carla-bridge-title">
  <title id="carla-bridge-title">
    The autoware_carla_interface bridge sends CARLA sensor data, vehicle status, and the clock to Autoware, and sends the control commands of Autoware back to CARLA.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="900" height="500"/>
  <circle class="halo" cx="300" cy="260" r="180"/>
  <circle class="halo cyan" cx="640" cy="200" r="130"/>

  <!-- Autoware -->
  <rect class="card" x="250" y="18" width="400" height="80" rx="14"/>
  <circle class="icon-bg" cx="284" cy="58" r="18"/>
  <rect class="icon-line" x="275" y="52" width="18" height="9" rx="3"/>
  <path class="icon-line" d="M278 52 L281 47 H287 L290 52"/>
  <circle class="icon-dot" cx="279" cy="63" r="2.2"/>
  <circle class="icon-dot" cx="289" cy="63" r="2.2"/>
  <text class="lbl" x="314" y="40" dominant-baseline="central">Autoware</text>
  <text class="code" x="314" y="60" dominant-baseline="central">e2e_simulator.launch.xml</text>
  <text class="sub" x="314" y="80" dominant-baseline="central">simulator_type:=carla, sensor_model:=carla_sensor_kit</text>

  <!-- The bridge -->
  <rect class="glass-panel" x="150" y="150" width="600" height="196" rx="18"/>
  <text class="ttl" x="170" y="172" dominant-baseline="central">Bridge</text>
  <text class="code" x="290" y="172" dominant-baseline="central">autoware_carla_interface.launch.xml</text>

  <rect class="box primary" x="170" y="192" width="230" height="136" rx="14"/>
  <circle class="icon-bg on" cx="196" cy="218" r="15"/>
  <path class="icon-line" d="M189 214 H203 M199 210 L203 214 L199 218 M203 222 H189 M193 218 L189 222 L193 226"/>
  <text class="code lbl on-primary" x="285" y="252" text-anchor="middle" dominant-baseline="central">autoware_carla_interface</text>
  <text class="sub on-primary" x="285" y="274" text-anchor="middle" dominant-baseline="central">Spawns the ego vehicle</text>
  <text class="sub on-primary" x="285" y="292" text-anchor="middle" dominant-baseline="central">Publishes sensors and status</text>
  <text class="sub on-primary" x="285" y="310" text-anchor="middle" dominant-baseline="central">Ticks the simulation clock</text>

  <rect class="box" x="476" y="192" width="260" height="58" rx="10"/>
  <text class="code" x="606" y="212" text-anchor="middle" dominant-baseline="central">autoware_raw_vehicle_cmd_converter</text>
  <text class="sub" x="606" y="232" text-anchor="middle" dominant-baseline="central">Calibrated for the CARLA Prius</text>

  <rect class="box muted" x="476" y="268" width="260" height="60" rx="10"/>
  <text class="code" x="606" y="288" text-anchor="middle" dominant-baseline="central">multi_camera_combiner</text>
  <text class="sub" x="606" y="308" text-anchor="middle" dominant-baseline="central">Joins six cameras for RViz</text>

  <path class="edge" d="M476 221 H402"/>
  <text class="edge-lbl" x="438" y="207" text-anchor="middle" dominant-baseline="central">actuation</text>
  <text class="edge-lbl" x="438" y="235" text-anchor="middle" dominant-baseline="central">command</text>
  <path class="edge" d="M400 298 H474"/>
  <text class="edge-lbl" x="438" y="284" text-anchor="middle" dominant-baseline="central">camera</text>
  <text class="edge-lbl" x="438" y="312" text-anchor="middle" dominant-baseline="central">images</text>

  <!-- Bridge to Autoware -->
  <path class="edge accent" d="M230 192 V100"/>
  <path class="flow flow-accent" pathLength="100" d="M230 192 V104"/>
  <path class="edge accent head" d="M230 192 V100"/>
  <text class="edge-lbl code" x="222" y="106" text-anchor="end" dominant-baseline="central">/sensing/*</text>
  <text class="edge-lbl code" x="222" y="122" text-anchor="end" dominant-baseline="central">/vehicle/status/*</text>
  <text class="edge-lbl code" x="222" y="138" text-anchor="end" dominant-baseline="central">/clock</text>

  <!-- Autoware to the bridge -->
  <path class="edge" d="M606 98 V190"/>
  <path class="flow" pathLength="100" d="M606 98 V186"/>
  <path class="edge head" d="M606 98 V190"/>
  <text class="edge-lbl code" x="614" y="128" dominant-baseline="central">/control/command/control_cmd</text>

  <!-- CARLA -->
  <rect class="card" x="250" y="410" width="400" height="76" rx="14"/>
  <circle class="icon-bg" cx="284" cy="448" r="18"/>
  <circle class="icon-line" cx="284" cy="448" r="8"/>
  <ellipse class="icon-line" cx="284" cy="448" rx="3.8" ry="8"/>
  <path class="icon-line" d="M276 448 H292"/>
  <text class="lbl" x="314" y="430" dominant-baseline="central">CARLA server</text>
  <text class="code" x="314" y="450" dominant-baseline="central">carlasim/carla:0.9.16</text>
  <text class="sub" x="314" y="470" dominant-baseline="central">RPC port 2000</text>

  <!-- The bridge and CARLA -->
  <path class="edge accent" d="M220 410 V330"/>
  <path class="flow flow-accent" pathLength="100" d="M220 410 V334"/>
  <path class="edge accent head" d="M220 410 V330"/>
  <text class="edge-lbl" x="212" y="366" text-anchor="end" dominant-baseline="central">Sensor data</text>
  <text class="edge-lbl" x="212" y="382" text-anchor="end" dominant-baseline="central">and ego state</text>
  <path class="edge" d="M340 328 V408"/>
  <path class="flow" pathLength="100" d="M340 328 V404"/>
  <path class="edge head" d="M340 328 V408"/>
  <text class="edge-lbl" x="348" y="374" dominant-baseline="central">Vehicle control</text>

  <!-- Spectator camera -->
  <rect class="box muted" x="700" y="418" width="180" height="60" rx="10"/>
  <text class="code" x="790" y="438" text-anchor="middle" dominant-baseline="central">spectator_follow</text>
  <text class="sub" x="790" y="458" text-anchor="middle" dominant-baseline="central">Chase camera, optional</text>
  <path class="edge dash" d="M700 448 H652"/>
</svg>
