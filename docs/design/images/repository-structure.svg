<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="repository-structure-title">
  <title id="repository-structure-title">
    The repositories of autoware.repos in three groups: Autoware Core, Autoware Universe, and the sensor components. Core feeds Universe, and all three feed autoware_launch. The tools and the scenario
    simulator are optional.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-group: color-mix(in
    srgb, var(--aw-c-indigo) 6%, var(--md-default-bg-color)); --aw-d-group-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 25%, transparent); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} .box.ext {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-dasharray: 6 5;
} .group {
  fill: var(--aw-d-group);
  stroke: var(--aw-d-group-stroke);
  stroke-width: 1.5;
} .group.dashed {
  stroke-dasharray: 7 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="880" height="600"/>
  <circle class="halo" cx="155" cy="420" r="110"/>
  <circle class="halo cyan" cx="455" cy="150" r="120"/>
  <circle class="halo" cx="740" cy="300" r="90"/>

  <!-- Autoware Core -->
  <rect class="glass-panel" x="20" y="20" width="290" height="520" rx="18"/>
  <text class="ttl" x="40" y="46">Autoware Core</text>
  <rect class="card" x="32" y="60" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="75" text-anchor="middle" dominant-baseline="central">autoware_msgs</text>
  <rect class="card" x="32" y="98" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="113" text-anchor="middle" dominant-baseline="central">autoware_adapi_msgs</text>
  <rect class="card" x="32" y="136" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="151" text-anchor="middle" dominant-baseline="central">autoware_internal_msgs</text>
  <rect class="card" x="32" y="174" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="189" text-anchor="middle" dominant-baseline="central">autoware_cmake</text>
  <rect class="card" x="32" y="212" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="227" text-anchor="middle" dominant-baseline="central">autoware_utils</text>
  <rect class="card" x="32" y="250" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="265" text-anchor="middle" dominant-baseline="central">autoware_lanelet2_extension</text>
  <rect class="card" x="32" y="288" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="303" text-anchor="middle" dominant-baseline="central">autoware_rviz_plugins</text>
  <rect class="card" x="32" y="326" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="341" text-anchor="middle" dominant-baseline="central">autoware_simple_planning_simulator</text>
  <rect class="card" x="32" y="364" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="379" text-anchor="middle" dominant-baseline="central">autoware_system_designer</text>
  <rect class="card" x="32" y="402" width="266" height="30" rx="10"/>
  <text class="code" x="165" y="417" text-anchor="middle" dominant-baseline="central">agnocast</text>
  <rect class="box primary" x="32" y="452" width="266" height="64" rx="14"/>
  <circle class="icon-bg on" cx="60" cy="484" r="17"/>
  <path class="icon-line" d="M60 475 L68 479.5 V488.5 L60 493 L52 488.5 V479.5 Z M52 479.5 L60 484 L68 479.5 M60 484 V493"/>
  <text class="code lbl on-primary" x="177" y="474" text-anchor="middle" dominant-baseline="central">autoware_core</text>
  <text class="sub on-primary" x="177" y="496" text-anchor="middle" dominant-baseline="central">Quality-assured packages</text>

  <!-- Autoware Universe -->
  <rect class="glass-panel" x="330" y="20" width="250" height="300" rx="18"/>
  <text class="ttl" x="350" y="46">Autoware Universe</text>
  <rect class="box primary" x="342" y="60" width="226" height="58" rx="14"/>
  <circle class="icon-bg on" cx="368" cy="89" r="16"/>
  <circle class="icon-line" cx="368" cy="89" r="7.5"/>
  <ellipse class="icon-line" cx="368" cy="89" rx="3.5" ry="7.5"/>
  <path class="icon-line" d="M360.5 89 H375.5"/>
  <text class="code lbl on-primary" x="469" y="80" text-anchor="middle" dominant-baseline="central">autoware_universe</text>
  <text class="sub on-primary" x="469" y="100" text-anchor="middle" dominant-baseline="central">Community packages</text>
  <rect class="box muted" x="342" y="134" width="226" height="30" rx="10"/>
  <text class="code" x="455" y="149" text-anchor="middle" dominant-baseline="central">tier4_autoware_msgs</text>
  <rect class="box muted" x="342" y="172" width="226" height="30" rx="10"/>
  <text class="code" x="455" y="187" text-anchor="middle" dominant-baseline="central">cuda_blackboard</text>
  <rect class="box muted" x="342" y="210" width="226" height="30" rx="10"/>
  <text class="code" x="455" y="225" text-anchor="middle" dominant-baseline="central">managed_transform_buffer</text>
  <rect class="box muted" x="342" y="248" width="226" height="30" rx="10"/>
  <text class="code" x="455" y="263" text-anchor="middle" dominant-baseline="central">bevdet_vendor</text>
  <text class="sub" x="455" y="300" text-anchor="middle" dominant-baseline="central">and 8 more external packages</text>

  <!-- Sensor components -->
  <rect class="glass-panel" x="330" y="340" width="250" height="220" rx="18"/>
  <text class="ttl" x="350" y="366">Sensor components</text>
  <rect class="card" x="342" y="380" width="226" height="28" rx="10"/>
  <text class="code" x="455" y="394" text-anchor="middle" dominant-baseline="central">nebula</text>
  <rect class="card" x="342" y="414" width="226" height="28" rx="10"/>
  <text class="code" x="455" y="428" text-anchor="middle" dominant-baseline="central">sensor_component_description</text>
  <rect class="card" x="342" y="448" width="226" height="28" rx="10"/>
  <text class="code" x="455" y="462" text-anchor="middle" dominant-baseline="central">sync_tooling_msgs</text>
  <rect class="card" x="342" y="482" width="226" height="28" rx="10"/>
  <text class="code" x="455" y="496" text-anchor="middle" dominant-baseline="central">transport_drivers</text>
  <rect class="card" x="342" y="516" width="226" height="28" rx="10"/>
  <text class="code" x="455" y="530" text-anchor="middle" dominant-baseline="central">ros2_socketcan</text>

  <!-- Optional repositories -->
  <rect class="group dashed" x="620" y="20" width="240" height="180" rx="16"/>
  <text class="ttl" x="640" y="46">Optional</text>
  <rect class="box ext" x="640" y="60" width="200" height="56" rx="12"/>
  <text class="code lbl" x="740" y="80" text-anchor="middle" dominant-baseline="central">autoware_tools</text>
  <text class="sub" x="740" y="100" text-anchor="middle" dominant-baseline="central">tools.repos</text>
  <rect class="box ext" x="640" y="128" width="200" height="56" rx="12"/>
  <text class="code lbl" x="740" y="148" text-anchor="middle" dominant-baseline="central">scenario_simulator_v2</text>
  <text class="sub" x="740" y="168" text-anchor="middle" dominant-baseline="central">simulator.repos</text>

  <!-- Launch -->
  <rect class="box primary" x="620" y="250" width="240" height="64" rx="14"/>
  <circle class="icon-bg on" cx="648" cy="282" r="17"/>
  <path class="icon-line" d="M644 275 L654 282 L644 289 Z"/>
  <text class="code lbl on-primary" x="758" y="272" text-anchor="middle" dominant-baseline="central">autoware_launch</text>
  <text class="sub on-primary" x="758" y="294" text-anchor="middle" dominant-baseline="central">Launch files and parameters</text>

  <!-- Dependencies -->
  <path class="edge accent" d="M310 89 H322"/>
  <path class="edge accent" d="M580 170 H600 V272 H612"/>
  <path class="edge accent" d="M580 450 H600 V294 H612"/>
  <path class="edge accent" d="M165 540 V580 H740 V322"/>
</svg>
