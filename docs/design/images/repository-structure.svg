<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" role="img" aria-labelledby="repository-structure-title">
  <title id="repository-structure-title">The repositories of autoware.repos in three groups: Autoware Core, Autoware Universe, and the sensor components. Core feeds Universe, and all three feed autoware_launch. The tools and the scenario simulator are optional.</title>

  <!-- Autoware Core -->
  <rect class="group" x="20" y="20" width="270" height="520" rx="16"/>
  <text class="ttl" x="40" y="46">Autoware Core</text>
  <rect class="box" x="32" y="60" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="75" text-anchor="middle" dominant-baseline="central">autoware_msgs</text>
  <rect class="box" x="32" y="98" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="113" text-anchor="middle" dominant-baseline="central">autoware_adapi_msgs</text>
  <rect class="box" x="32" y="136" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="151" text-anchor="middle" dominant-baseline="central">autoware_internal_msgs</text>
  <rect class="box" x="32" y="174" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="189" text-anchor="middle" dominant-baseline="central">autoware_cmake</text>
  <rect class="box" x="32" y="212" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="227" text-anchor="middle" dominant-baseline="central">autoware_utils</text>
  <rect class="box" x="32" y="250" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="265" text-anchor="middle" dominant-baseline="central">autoware_lanelet2_extension</text>
  <rect class="box" x="32" y="288" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="303" text-anchor="middle" dominant-baseline="central">autoware_rviz_plugins</text>
  <rect class="box" x="32" y="326" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="341" text-anchor="middle" dominant-baseline="central">autoware_simple_planning_simulator</text>
  <rect class="box" x="32" y="364" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="379" text-anchor="middle" dominant-baseline="central">autoware_system_designer</text>
  <rect class="box" x="32" y="402" width="246" height="30" rx="8"/>
  <text class="code" x="155" y="417" text-anchor="middle" dominant-baseline="central">agnocast</text>
  <rect class="box primary" x="32" y="452" width="246" height="64" rx="10"/>
  <text class="code lbl on-primary" x="155" y="474" text-anchor="middle" dominant-baseline="central">autoware_core</text>
  <text class="sub on-primary" x="155" y="496" text-anchor="middle" dominant-baseline="central">Quality-assured packages</text>

  <!-- Autoware Universe -->
  <rect class="group" x="310" y="20" width="250" height="300" rx="16"/>
  <text class="ttl" x="330" y="46">Autoware Universe</text>
  <rect class="box primary" x="322" y="60" width="226" height="58" rx="10"/>
  <text class="code lbl on-primary" x="435" y="80" text-anchor="middle" dominant-baseline="central">autoware_universe</text>
  <text class="sub on-primary" x="435" y="100" text-anchor="middle" dominant-baseline="central">Community packages</text>
  <rect class="box muted" x="322" y="134" width="226" height="30" rx="8"/>
  <text class="code" x="435" y="149" text-anchor="middle" dominant-baseline="central">tier4_autoware_msgs</text>
  <rect class="box muted" x="322" y="172" width="226" height="30" rx="8"/>
  <text class="code" x="435" y="187" text-anchor="middle" dominant-baseline="central">cuda_blackboard</text>
  <rect class="box muted" x="322" y="210" width="226" height="30" rx="8"/>
  <text class="code" x="435" y="225" text-anchor="middle" dominant-baseline="central">managed_transform_buffer</text>
  <rect class="box muted" x="322" y="248" width="226" height="30" rx="8"/>
  <text class="code" x="435" y="263" text-anchor="middle" dominant-baseline="central">bevdet_vendor</text>
  <text class="sub" x="435" y="300" text-anchor="middle" dominant-baseline="central">and 8 more external packages</text>

  <!-- Sensor components -->
  <rect class="group" x="310" y="340" width="250" height="220" rx="16"/>
  <text class="ttl" x="330" y="366">Sensor components</text>
  <rect class="box" x="322" y="380" width="226" height="28" rx="8"/>
  <text class="code" x="435" y="394" text-anchor="middle" dominant-baseline="central">nebula</text>
  <rect class="box" x="322" y="414" width="226" height="28" rx="8"/>
  <text class="code" x="435" y="428" text-anchor="middle" dominant-baseline="central">sensor_component_description</text>
  <rect class="box" x="322" y="448" width="226" height="28" rx="8"/>
  <text class="code" x="435" y="462" text-anchor="middle" dominant-baseline="central">sync_tooling_msgs</text>
  <rect class="box" x="322" y="482" width="226" height="28" rx="8"/>
  <text class="code" x="435" y="496" text-anchor="middle" dominant-baseline="central">transport_drivers</text>
  <rect class="box" x="322" y="516" width="226" height="28" rx="8"/>
  <text class="code" x="435" y="530" text-anchor="middle" dominant-baseline="central">ros2_socketcan</text>

  <!-- Optional repositories -->
  <rect class="group dashed" x="600" y="20" width="240" height="180" rx="16"/>
  <text class="ttl" x="620" y="46">Optional</text>
  <rect class="box ext" x="620" y="60" width="200" height="56" rx="10"/>
  <text class="code lbl" x="720" y="80" text-anchor="middle" dominant-baseline="central">autoware_tools</text>
  <text class="sub" x="720" y="100" text-anchor="middle" dominant-baseline="central">tools.repos</text>
  <rect class="box ext" x="620" y="128" width="200" height="56" rx="10"/>
  <text class="code lbl" x="720" y="148" text-anchor="middle" dominant-baseline="central">scenario_simulator_v2</text>
  <text class="sub" x="720" y="168" text-anchor="middle" dominant-baseline="central">simulator.repos</text>

  <!-- Launch -->
  <rect class="box primary" x="600" y="250" width="240" height="64" rx="10"/>
  <text class="code lbl on-primary" x="720" y="272" text-anchor="middle" dominant-baseline="central">autoware_launch</text>
  <text class="sub on-primary" x="720" y="294" text-anchor="middle" dominant-baseline="central">Launch files and parameters</text>

  <!-- Dependencies -->
  <path class="edge accent" d="M290 89 H302"/>
  <path class="edge accent" d="M560 170 H580 V272 H592"/>
  <path class="edge accent" d="M560 450 H580 V294 H592"/>
  <path class="edge accent" d="M155 540 V580 H720 V322"/>
</svg>
