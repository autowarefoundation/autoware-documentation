<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-labelledby="architecture-overview-title">
  <title id="architecture-overview-title">The stacks of Autoware. Sensing, map, and the vehicle interface feed localization. Localization, sensing, and the map feed perception and planning. Perception feeds planning, planning feeds control, and control drives the vehicle through the vehicle interface.</title>

  <!-- Lines that pass behind the localization bar come first, so that the bar covers them -->
  <path class="edge" d="M320 400 V372 H250 V270"/>
  <path class="edge" d="M520 400 V372 H590 V270"/>

  <!-- Perception -->
  <rect class="group" x="20" y="20" width="300" height="240" rx="16"/>
  <text class="ttl" x="40" y="44">Perception</text>
  <rect class="group" x="36" y="56" width="268" height="72" rx="10"/>
  <text class="sub" x="50" y="74">Dynamic objects</text>
  <rect class="box" x="48" y="86" width="80" height="30" rx="8"/>
  <text x="88" y="101" text-anchor="middle" dominant-baseline="central">Detection</text>
  <rect class="box" x="132" y="86" width="80" height="30" rx="8"/>
  <text x="172" y="101" text-anchor="middle" dominant-baseline="central">Tracking</text>
  <rect class="box" x="216" y="86" width="80" height="30" rx="8"/>
  <text x="256" y="101" text-anchor="middle" dominant-baseline="central">Prediction</text>
  <rect class="box" x="36" y="138" width="268" height="40" rx="8"/>
  <text x="170" y="158" text-anchor="middle" dominant-baseline="central">Obstacle segmentation</text>
  <rect class="group" x="36" y="188" width="268" height="60" rx="10"/>
  <text class="sub" x="50" y="206">Traffic lights</text>
  <rect class="box" x="48" y="214" width="122" height="26" rx="8"/>
  <text x="109" y="227" text-anchor="middle" dominant-baseline="central">Detection</text>
  <rect class="box" x="174" y="214" width="122" height="26" rx="8"/>
  <text x="235" y="227" text-anchor="middle" dominant-baseline="central">Classification</text>

  <!-- Planning -->
  <rect class="group" x="350" y="20" width="300" height="240" rx="16"/>
  <text class="ttl" x="370" y="44">Planning</text>
  <rect class="box" x="366" y="56" width="84" height="192" rx="8"/>
  <text class="lbl" x="408" y="152" text-anchor="middle" dominant-baseline="central">Mission</text>
  <rect class="group" x="460" y="56" width="176" height="192" rx="10"/>
  <text class="sub" x="474" y="74">Scenario</text>
  <rect class="box" x="472" y="84" width="152" height="34" rx="8"/>
  <text x="548" y="101" text-anchor="middle" dominant-baseline="central">Scenario selector</text>
  <rect class="box" x="472" y="128" width="74" height="110" rx="8"/>
  <text x="509" y="174" text-anchor="middle" dominant-baseline="central">Lane</text>
  <text x="509" y="192" text-anchor="middle" dominant-baseline="central">driving</text>
  <rect class="box" x="550" y="128" width="74" height="110" rx="8"/>
  <text x="587" y="183" text-anchor="middle" dominant-baseline="central">Parking</text>

  <!-- Control -->
  <rect class="group" x="680" y="20" width="160" height="240" rx="16"/>
  <text class="lbl" x="760" y="140" text-anchor="middle" dominant-baseline="central">Control</text>

  <path class="edge accent" d="M320 140 H342"/>
  <path class="edge accent" d="M650 140 H672"/>

  <!-- Localization -->
  <rect class="box primary" x="20" y="300" width="820" height="44" rx="10"/>
  <text class="lbl on-primary" x="430" y="322" text-anchor="middle" dominant-baseline="central">Localization</text>
  <path class="edge" d="M170 300 V268"/>
  <path class="edge" d="M500 300 V268"/>
  <path class="edge" d="M760 300 V268"/>

  <!-- Sensing, map, and vehicle interface -->
  <rect class="box primary" x="20" y="400" width="260" height="46" rx="10"/>
  <text class="lbl on-primary" x="150" y="423" text-anchor="middle" dominant-baseline="central">Sensing</text>
  <rect class="box primary" x="300" y="400" width="240" height="46" rx="10"/>
  <text class="lbl on-primary" x="420" y="423" text-anchor="middle" dominant-baseline="central">Map</text>
  <rect class="box primary" x="560" y="400" width="280" height="46" rx="10"/>
  <text class="lbl on-primary" x="700" y="423" text-anchor="middle" dominant-baseline="central">Vehicle interface</text>

  <path class="edge" d="M150 400 V352"/>
  <path class="edge" d="M420 400 V352"/>
  <path class="edge" d="M700 400 V352"/>
  <path class="edge" d="M20 423 H8 V140 H12"/>
  <path class="edge" d="M840 140 H852 V423 H848"/>

  <!-- Sensors and vehicle -->
  <rect class="box muted" x="20" y="480" width="260" height="44" rx="10"/>
  <text class="sub" x="150" y="502" text-anchor="middle" dominant-baseline="central">LiDAR, cameras, radars, GNSS/INS, IMU</text>
  <path class="edge" d="M150 480 V454"/>
  <rect class="box muted" x="560" y="480" width="280" height="44" rx="10"/>
  <path class="icon" d="M650 512 v-12 q0-5 5-5 h22 l8 8 h6 q4 0 4 4 v5 z"/>
  <circle class="icon" cx="660" cy="513" r="4"/>
  <circle class="icon" cx="686" cy="513" r="4"/>
  <text class="sub" x="712" y="503" dominant-baseline="central">Vehicle</text>
  <path class="edge both" d="M700 480 V454"/>
</svg>
