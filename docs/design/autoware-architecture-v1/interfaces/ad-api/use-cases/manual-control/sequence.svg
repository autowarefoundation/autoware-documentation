<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="adapi-manual-control-title">
  <title id="adapi-manual-control-title">
    The application selects a manual control mode, changes the operation mode to remote, and then sends commands and the operator heartbeat while it receives the vehicle status.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.dash {
  stroke-dasharray: 6 5;
} .edge.plain {
  marker-end: none;
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="760" height="480"/>
  <circle class="halo" cx="600" cy="250" r="150"/>

  <!-- Participants and lifelines -->
  <rect class="card" x="75" y="16" width="170" height="44" rx="12"/>
  <circle class="icon-bg" cx="121" cy="38" r="14"/>
  <rect class="icon-line" x="114" y="32" width="14" height="12" rx="2"/>
  <path class="icon-line" d="M114 36 H128"/>
  <text class="lbl" x="144" y="38" dominant-baseline="central">Application</text>
  <line class="edge plain dash" x1="160" y1="60" x2="160" y2="468"/>
  <rect class="box primary" x="515" y="16" width="170" height="44" rx="12"/>
  <circle class="icon-bg on" cx="574" cy="38" r="14"/>
  <path class="icon-line" d="M571 33 L566 38 L571 43 M577 33 L582 38 L577 43"/>
  <text class="lbl on-primary" x="597" y="38" dominant-baseline="central">AD API</text>
  <line class="edge plain dash" x1="600" y1="60" x2="600" y2="468"/>

  <!-- Messages -->
  <path class="edge" d="M162 94 H598"/>
  <path class="flow" pathLength="100" d="M162 94 H598"/>
  <path class="edge head" d="M162 94 H598"/>
  <text class="edge-lbl" x="380" y="83" text-anchor="middle" dominant-baseline="central">/api/manual/remote/control_mode/select</text>
  <path class="edge dash" d="M598 136 H162"/>
  <text class="edge-lbl" x="380" y="125" text-anchor="middle" dominant-baseline="central">response status</text>
  <path class="edge" d="M598 178 H162"/>
  <path class="flow" pathLength="100" d="M598 178 H162"/>
  <path class="edge head" d="M598 178 H162"/>
  <text class="edge-lbl" x="380" y="167" text-anchor="middle" dominant-baseline="central">/api/manual/remote/control_mode/status</text>
  <path class="edge" d="M162 220 H598"/>
  <path class="flow" pathLength="100" d="M162 220 H598"/>
  <path class="edge head" d="M162 220 H598"/>
  <text class="edge-lbl" x="380" y="209" text-anchor="middle" dominant-baseline="central">/api/operation_mode/change_to_remote</text>
  <path class="edge dash" d="M598 262 H162"/>
  <text class="edge-lbl" x="380" y="251" text-anchor="middle" dominant-baseline="central">response status</text>
  <rect class="box muted" x="100" y="294" width="560" height="32" rx="10"/>
  <text class="sub" x="380" y="310" text-anchor="middle" dominant-baseline="central">Repeat while driving</text>
  <path class="edge" d="M162 356 H598"/>
  <path class="flow" pathLength="100" d="M162 356 H598"/>
  <path class="edge head" d="M162 356 H598"/>
  <text class="edge-lbl" x="380" y="345" text-anchor="middle" dominant-baseline="central">/api/manual/remote/operator/heartbeat</text>
  <path class="edge" d="M162 398 H598"/>
  <path class="flow" pathLength="100" d="M162 398 H598"/>
  <path class="edge head" d="M162 398 H598"/>
  <text class="edge-lbl" x="380" y="387" text-anchor="middle" dominant-baseline="central">/api/manual/remote/command/*</text>
  <path class="edge" d="M598 440 H162"/>
  <path class="flow" pathLength="100" d="M598 440 H162"/>
  <path class="edge head" d="M598 440 H162"/>
  <text class="edge-lbl" x="380" y="429" text-anchor="middle" dominant-baseline="central">/api/vehicle/status</text>
</svg>
