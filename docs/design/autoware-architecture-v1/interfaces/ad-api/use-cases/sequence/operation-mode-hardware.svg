<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 302" role="img" aria-labelledby="adapi-operation-mode-hardware-title">
  <title id="adapi-operation-mode-hardware-title">The operator changes the control mode on the vehicle. The vehicle reports the control mode, and AD API sends the new operation mode state to the application.</title>

  <!-- Participants and lifelines -->
  <rect class="box" x="15" y="16" width="150" height="44" rx="10"/>
  <text class="lbl" x="90" y="38" text-anchor="middle" dominant-baseline="central">Operator</text>
  <line class="edge plain dash" x1="90" y1="60" x2="90" y2="290"/>
  <rect class="box" x="215" y="16" width="150" height="44" rx="10"/>
  <text class="lbl" x="290" y="38" text-anchor="middle" dominant-baseline="central">Application</text>
  <line class="edge plain dash" x1="290" y1="60" x2="290" y2="290"/>
  <rect class="box" x="455" y="16" width="150" height="44" rx="10"/>
  <text class="lbl" x="530" y="38" text-anchor="middle" dominant-baseline="central">AD API</text>
  <line class="edge plain dash" x1="530" y1="60" x2="530" y2="290"/>
  <rect class="box" x="675" y="16" width="150" height="44" rx="10"/>
  <text class="lbl" x="750" y="38" text-anchor="middle" dominant-baseline="central">Vehicle</text>
  <line class="edge plain dash" x1="750" y1="60" x2="750" y2="290"/>

  <!-- Messages -->
  <path class="edge" d="M92 94 H748"/>
  <text class="edge-lbl" x="420" y="83" text-anchor="middle" dominant-baseline="central">change the control mode with a switch</text>
  <path class="edge dash" d="M748 136 H92"/>
  <path class="edge" d="M748 178 H532"/>
  <text class="edge-lbl" x="640" y="167" text-anchor="middle" dominant-baseline="central">current control mode</text>
  <path class="edge" d="M528 220 H292"/>
  <text class="edge-lbl" x="410" y="209" text-anchor="middle" dominant-baseline="central">/api/operation_mode/state</text>
  <path class="edge" d="M288 262 H92"/>
  <text class="edge-lbl" x="190" y="251" text-anchor="middle" dominant-baseline="central">show the mode</text>
</svg>
