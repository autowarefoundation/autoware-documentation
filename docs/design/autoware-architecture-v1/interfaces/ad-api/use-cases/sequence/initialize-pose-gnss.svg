<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="adapi-initialize-pose-gnss-title">
  <title id="adapi-initialize-pose-gnss-title">The application calls the localization initialize API without a pose. Autoware uses the latest GNSS pose as the initial guess.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .on-primary {
  fill: #fff;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.dash {
  stroke-dasharray: 6 5;
} .edge.plain {
  marker-end: none;
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="840" height="520"/>
  <circle class="halo" cx="330" cy="280" r="220"/>

  <!-- Participants and lifelines -->
  <rect class="card" x="25" y="16" width="150" height="44" rx="12"/>
  <circle class="icon-bg" cx="61" cy="38" r="14"/>
  <rect class="icon-line" x="54" y="32" width="14" height="12" rx="2"/>
  <path class="icon-line" d="M54 36 H68"/>
  <text class="lbl" x="84" y="38" dominant-baseline="central">Application</text>
  <line class="edge plain dash" x1="100" y1="60" x2="100" y2="508"/>
  <rect class="box primary" x="255" y="16" width="150" height="44" rx="12"/>
  <circle class="icon-bg on" cx="304" cy="38" r="14"/>
  <path class="icon-line" d="M301 33 L296 38 L301 43 M307 33 L312 38 L307 43"/>
  <text class="lbl on-primary" x="327" y="38" dominant-baseline="central">AD API</text>
  <line class="edge plain dash" x1="330" y1="60" x2="330" y2="508"/>
  <rect class="card" x="485" y="16" width="150" height="44" rx="12"/>
  <circle class="icon-bg" cx="526" cy="38" r="14"/>
  <path class="icon-line" d="M521 34 L531 34 M521 34 L526 43 M531 34 L526 43"/>
  <circle class="icon-dot" cx="521" cy="34" r="2.4"/>
  <circle class="icon-dot" cx="531" cy="34" r="2.4"/>
  <circle class="icon-dot" cx="526" cy="43" r="2.4"/>
  <text class="lbl" x="549" y="38" dominant-baseline="central">Autoware</text>
  <line class="edge plain dash" x1="560" y1="60" x2="560" y2="508"/>
  <rect class="card" x="685" y="16" width="150" height="44" rx="12"/>
  <circle class="icon-bg" cx="737" cy="38" r="14"/>
  <circle class="icon-dot" cx="732" cy="43" r="2.2"/>
  <path class="icon-line" d="M732 36 A7 7 0 0 1 739 43"/>
  <path class="icon-line" d="M732 30 A13 13 0 0 1 745 43"/>
  <text class="lbl" x="760" y="38" dominant-baseline="central">GNSS</text>
  <line class="edge plain dash" x1="760" y1="60" x2="760" y2="508"/>

  <!-- Messages -->
  <path class="edge" d="M758 94 H562"/>
  <path class="flow" pathLength="100" d="M758 94 H562"/>
  <path class="edge head" d="M758 94 H562"/>
  <text class="edge-lbl" x="660" y="83" text-anchor="middle" dominant-baseline="central">pose</text>
  <path class="edge" d="M102 136 H328"/>
  <path class="flow" pathLength="100" d="M102 136 H328"/>
  <path class="edge head" d="M102 136 H328"/>
  <text class="edge-lbl" x="215" y="125" text-anchor="middle" dominant-baseline="central">/api/localization/initialize (no pose)</text>
  <path class="edge" d="M332 178 H558"/>
  <path class="flow" pathLength="100" d="M332 178 H558"/>
  <path class="edge head" d="M332 178 H558"/>
  <text class="edge-lbl" x="445" y="167" text-anchor="middle" dominant-baseline="central">initialize the pose</text>
  <path class="edge" d="M558 220 H332"/>
  <path class="flow" pathLength="100" d="M558 220 H332"/>
  <path class="edge head" d="M558 220 H332"/>
  <text class="edge-lbl" x="445" y="209" text-anchor="middle" dominant-baseline="central">INITIALIZING</text>
  <path class="edge" d="M328 262 H102"/>
  <path class="flow" pathLength="100" d="M328 262 H102"/>
  <path class="edge head" d="M328 262 H102"/>
  <text class="edge-lbl" x="215" y="251" text-anchor="middle" dominant-baseline="central">/api/localization/initialization_state</text>
  <path class="edge" d="M562 304 H596 V326 H564"/>
  <path class="flow" pathLength="100" d="M562 304 H596 V326 H564"/>
  <path class="edge head" d="M562 304 H596 V326 H564"/>
  <text class="edge-lbl" x="604" y="315" dominant-baseline="central">use the GNSS pose</text>
  <path class="edge" d="M558 354 H332"/>
  <path class="flow" pathLength="100" d="M558 354 H332"/>
  <path class="edge head" d="M558 354 H332"/>
  <text class="edge-lbl" x="445" y="343" text-anchor="middle" dominant-baseline="central">INITIALIZED or UNINITIALIZED</text>
  <path class="edge" d="M328 396 H102"/>
  <path class="flow" pathLength="100" d="M328 396 H102"/>
  <path class="edge head" d="M328 396 H102"/>
  <text class="edge-lbl" x="215" y="385" text-anchor="middle" dominant-baseline="central">/api/localization/initialization_state</text>
  <path class="edge dash" d="M558 438 H332"/>
  <text class="edge-lbl" x="445" y="427" text-anchor="middle" dominant-baseline="central">response status</text>
  <path class="edge dash" d="M328 480 H102"/>
  <text class="edge-lbl" x="215" y="469" text-anchor="middle" dominant-baseline="central">response status</text>
</svg>
