<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 900" role="img" aria-labelledby="adapi-drive-designated-position-title">
  <title id="adapi-drive-designated-position-title">The application sets a route. When the autonomous mode is available, the user requests a start and the application changes to the autonomous mode. At the goal, Autoware changes to the stop mode and the application clears the route.</title>

  <!-- Participants and lifelines -->
  <rect class="box" x="10" y="16" width="180" height="44" rx="10"/>
  <text class="lbl" x="100" y="38" text-anchor="middle" dominant-baseline="central">User</text>
  <line class="edge plain dash" x1="100" y1="60" x2="100" y2="888"/>
  <rect class="box" x="210" y="16" width="180" height="44" rx="10"/>
  <text class="lbl" x="300" y="38" text-anchor="middle" dominant-baseline="central">Application</text>
  <line class="edge plain dash" x1="300" y1="60" x2="300" y2="888"/>
  <rect class="box" x="445" y="16" width="180" height="44" rx="10"/>
  <text class="lbl" x="535" y="38" text-anchor="middle" dominant-baseline="central">AD API (operation mode)</text>
  <line class="edge plain dash" x1="535" y1="60" x2="535" y2="888"/>
  <rect class="box" x="670" y="16" width="180" height="44" rx="10"/>
  <text class="lbl" x="760" y="38" text-anchor="middle" dominant-baseline="central">AD API (routing)</text>
  <line class="edge plain dash" x1="760" y1="60" x2="760" y2="888"/>

  <!-- Messages -->

  <!-- Before the start -->
  <path class="edge" d="M533 94 H302"/>
  <text class="edge-lbl" x="417" y="83" text-anchor="middle" dominant-baseline="central">/api/operation_mode/state: autonomous not available</text>
  <path class="edge" d="M298 136 H102"/>
  <text class="edge-lbl" x="200" y="125" text-anchor="middle" dominant-baseline="central">not ready</text>
  <path class="edge" d="M302 178 H758"/>
  <text class="edge-lbl" x="530" y="167" text-anchor="middle" dominant-baseline="central">/api/routing/set_route_points</text>
  <path class="edge dash" d="M758 220 H302"/>
  <text class="edge-lbl" x="530" y="209" text-anchor="middle" dominant-baseline="central">response status</text>
  <path class="edge" d="M758 262 H302"/>
  <text class="edge-lbl" x="530" y="251" text-anchor="middle" dominant-baseline="central">/api/routing/state: SET</text>
  <path class="edge" d="M533 304 H302"/>
  <text class="edge-lbl" x="417" y="293" text-anchor="middle" dominant-baseline="central">/api/operation_mode/state: autonomous available</text>
  <path class="edge" d="M298 346 H102"/>
  <text class="edge-lbl" x="200" y="335" text-anchor="middle" dominant-baseline="central">ready to start</text>

  <!-- Start -->
  <path class="edge" d="M102 388 H298"/>
  <text class="edge-lbl" x="200" y="377" text-anchor="middle" dominant-baseline="central">request to start</text>
  <path class="edge" d="M302 430 H533"/>
  <text class="edge-lbl" x="417" y="419" text-anchor="middle" dominant-baseline="central">/api/operation_mode/change_to_autonomous</text>
  <path class="edge dash" d="M533 472 H302"/>
  <text class="edge-lbl" x="417" y="461" text-anchor="middle" dominant-baseline="central">response status</text>
  <path class="edge" d="M533 514 H302"/>
  <text class="edge-lbl" x="417" y="503" text-anchor="middle" dominant-baseline="central">/api/operation_mode/state: AUTONOMOUS</text>
  <rect class="box muted" x="40" y="546" width="780" height="32" rx="10"/>
  <text class="sub" x="430" y="562" text-anchor="middle" dominant-baseline="central">Driving</text>

  <!-- Arrival -->
  <path class="edge" d="M758 608 H302"/>
  <text class="edge-lbl" x="530" y="597" text-anchor="middle" dominant-baseline="central">/api/routing/state: ARRIVED</text>
  <path class="edge" d="M758 650 H537"/>
  <text class="edge-lbl" x="647" y="639" text-anchor="middle" dominant-baseline="central">change to the stop mode</text>
  <path class="edge" d="M533 692 H302"/>
  <text class="edge-lbl" x="417" y="681" text-anchor="middle" dominant-baseline="central">/api/operation_mode/state: STOP</text>
  <path class="edge" d="M298 734 H102"/>
  <text class="edge-lbl" x="200" y="723" text-anchor="middle" dominant-baseline="central">arrived</text>
  <path class="edge" d="M302 776 H758"/>
  <text class="edge-lbl" x="530" y="765" text-anchor="middle" dominant-baseline="central">/api/routing/clear_route</text>
  <path class="edge dash" d="M758 818 H302"/>
  <text class="edge-lbl" x="530" y="807" text-anchor="middle" dominant-baseline="central">response status</text>
  <path class="edge" d="M758 860 H302"/>
  <text class="edge-lbl" x="530" y="849" text-anchor="middle" dominant-baseline="central">/api/routing/state: UNSET</text>
</svg>
