<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 962" role="img" aria-labelledby="adapi-drive-designated-position-title">
  <title id="adapi-drive-designated-position-title">
    The application sets a route. When the autonomous mode is available, the user requests a start and the application changes to the autonomous mode. At the goal, Autoware changes to the stop mode
    and the application clears the route.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.dash {
  stroke-dasharray: 6 5;
} .edge.plain {
  marker-end: none;
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="962"/>
  <circle class="halo" cx="520" cy="481" r="240"/>

  <!-- Participants and lifelines -->
  <rect class="card" x="10" y="16" width="120" height="44" rx="12"/>
  <circle class="icon-bg" cx="48" cy="38" r="14"/>
  <circle class="icon-line" cx="48" cy="35" r="3.2"/>
  <path class="icon-line" d="M42 45 Q42 39.5 48 39.5 Q54 39.5 54 45"/>
  <text class="lbl" x="69" y="38" dominant-baseline="central">User</text>
  <line class="edge plain dash" x1="70" y1="60" x2="70" y2="950"/>
  <rect class="card" x="155" y="16" width="170" height="44" rx="12"/>
  <circle class="icon-bg" cx="195" cy="38" r="14"/>
  <rect class="icon-line" x="188" y="32" width="14" height="12" rx="2"/>
  <path class="icon-line" d="M188 36 H202"/>
  <text class="lbl" x="218" y="38" dominant-baseline="central">Application</text>
  <line class="edge plain dash" x1="240" y1="60" x2="240" y2="950"/>
  <rect class="box primary" x="415" y="16" width="210" height="44" rx="12"/>
  <circle class="icon-bg on" cx="439" cy="38" r="14"/>
  <path class="icon-line" d="M436 33 L431 38 L436 43 M442 33 L447 38 L442 43"/>
  <text class="lbl on-primary" x="462" y="38" dominant-baseline="central">AD API (operation mode)</text>
  <line class="edge plain dash" x1="520" y1="60" x2="520" y2="950"/>
  <rect class="box primary" x="670" y="16" width="180" height="44" rx="12"/>
  <circle class="icon-bg on" cx="705" cy="38" r="14"/>
  <path class="icon-line" d="M702 33 L697 38 L702 43 M708 33 L713 38 L708 43"/>
  <text class="lbl on-primary" x="728" y="38" dominant-baseline="central">AD API (routing)</text>
  <line class="edge plain dash" x1="760" y1="60" x2="760" y2="950"/>

  <!-- Messages -->
  <path class="edge" d="M518 108 H242"/>
  <path class="flow" pathLength="100" d="M518 108 H242"/>
  <path class="edge head" d="M518 108 H242"/>
  <text class="edge-lbl" x="380" y="83" text-anchor="middle" dominant-baseline="central">/api/operation_mode/state</text>
  <text class="edge-lbl" x="380" y="97" text-anchor="middle" dominant-baseline="central">is_autonomous_mode_available: false</text>
  <path class="edge" d="M238 150 H72"/>
  <path class="flow" pathLength="100" d="M238 150 H72"/>
  <path class="edge head" d="M238 150 H72"/>
  <text class="edge-lbl" x="155" y="139" text-anchor="middle" dominant-baseline="central">not ready to start</text>
  <path class="edge" d="M242 192 H758"/>
  <path class="flow" pathLength="100" d="M242 192 H758"/>
  <path class="edge head" d="M242 192 H758"/>
  <text class="edge-lbl" x="500" y="181" text-anchor="middle" dominant-baseline="central">/api/routing/set_route_points (or set_route)</text>
  <path class="edge dash" d="M758 234 H242"/>
  <text class="edge-lbl" x="500" y="223" text-anchor="middle" dominant-baseline="central">response status</text>
  <path class="edge" d="M758 276 H242"/>
  <path class="flow" pathLength="100" d="M758 276 H242"/>
  <path class="edge head" d="M758 276 H242"/>
  <text class="edge-lbl" x="500" y="265" text-anchor="middle" dominant-baseline="central">/api/routing/state: SET</text>
  <rect class="box muted" x="420" y="297" width="430" height="26" rx="8"/>
  <text class="sub" x="635" y="310" text-anchor="middle" dominant-baseline="central">Autoware checks the route, the localization, the planning, and more</text>
  <path class="edge" d="M518 368 H242"/>
  <path class="flow" pathLength="100" d="M518 368 H242"/>
  <path class="edge head" d="M518 368 H242"/>
  <text class="edge-lbl" x="380" y="343" text-anchor="middle" dominant-baseline="central">/api/operation_mode/state</text>
  <text class="edge-lbl" x="380" y="357" text-anchor="middle" dominant-baseline="central">is_autonomous_mode_available: true</text>
  <path class="edge" d="M238 410 H72"/>
  <path class="flow" pathLength="100" d="M238 410 H72"/>
  <path class="edge head" d="M238 410 H72"/>
  <text class="edge-lbl" x="155" y="399" text-anchor="middle" dominant-baseline="central">ready to start</text>
  <path class="edge" d="M72 452 H238"/>
  <path class="flow" pathLength="100" d="M72 452 H238"/>
  <path class="edge head" d="M72 452 H238"/>
  <text class="edge-lbl" x="155" y="441" text-anchor="middle" dominant-baseline="central">request to start</text>
  <path class="edge" d="M242 494 H518"/>
  <path class="flow" pathLength="100" d="M242 494 H518"/>
  <path class="edge head" d="M242 494 H518"/>
  <text class="edge-lbl" x="380" y="483" text-anchor="middle" dominant-baseline="central">/api/operation_mode/change_to_autonomous</text>
  <path class="edge dash" d="M518 536 H242"/>
  <text class="edge-lbl" x="380" y="525" text-anchor="middle" dominant-baseline="central">response status</text>
  <path class="edge" d="M518 578 H242"/>
  <path class="flow" pathLength="100" d="M518 578 H242"/>
  <path class="edge head" d="M518 578 H242"/>
  <text class="edge-lbl" x="380" y="567" text-anchor="middle" dominant-baseline="central">/api/operation_mode/state: AUTONOMOUS</text>
  <rect class="box muted" x="20" y="610" width="820" height="32" rx="10"/>
  <text class="sub" x="430" y="626" text-anchor="middle" dominant-baseline="central">Driving</text>
  <path class="edge" d="M758 682 H242"/>
  <path class="flow" pathLength="100" d="M758 682 H242"/>
  <path class="edge head" d="M758 682 H242"/>
  <text class="edge-lbl" x="500" y="671" text-anchor="middle" dominant-baseline="central">/api/routing/state: ARRIVED</text>
  <path class="edge" d="M758 724 H522"/>
  <path class="flow" pathLength="100" d="M758 724 H522"/>
  <path class="edge head" d="M758 724 H522"/>
  <text class="edge-lbl" x="640" y="713" text-anchor="middle" dominant-baseline="central">change to the stop mode</text>
  <path class="edge" d="M518 766 H242"/>
  <path class="flow" pathLength="100" d="M518 766 H242"/>
  <path class="edge head" d="M518 766 H242"/>
  <text class="edge-lbl" x="380" y="755" text-anchor="middle" dominant-baseline="central">/api/operation_mode/state: STOP</text>
  <path class="edge" d="M238 808 H72"/>
  <path class="flow" pathLength="100" d="M238 808 H72"/>
  <path class="edge head" d="M238 808 H72"/>
  <text class="edge-lbl" x="155" y="797" text-anchor="middle" dominant-baseline="central">arrived</text>
  <path class="edge" d="M242 850 H758"/>
  <path class="flow" pathLength="100" d="M242 850 H758"/>
  <path class="edge head" d="M242 850 H758"/>
  <text class="edge-lbl" x="500" y="839" text-anchor="middle" dominant-baseline="central">/api/routing/clear_route</text>
  <path class="edge dash" d="M758 892 H242"/>
  <text class="edge-lbl" x="500" y="881" text-anchor="middle" dominant-baseline="central">response status</text>
  <path class="edge" d="M758 934 H242"/>
  <path class="flow" pathLength="100" d="M758 934 H242"/>
  <path class="edge head" d="M758 934 H242"/>
  <text class="edge-lbl" x="500" y="923" text-anchor="middle" dominant-baseline="central">/api/routing/state: UNSET</text>
</svg>
