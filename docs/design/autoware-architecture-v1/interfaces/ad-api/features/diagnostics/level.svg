<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="adapi-diagnostics-level-title">
  <title id="adapi-diagnostics-level-title">A timing chart of level, input_level, and latch_level for latch times of 0.0, 1.0, and 2.0 seconds. The input is ERROR from 2.0 to 2.5 seconds and from 4.0 to 5.5 seconds. With a latch time of 0.0 seconds, the level latches at 2.0 seconds. With 1.0 second, it latches at 5.0 seconds. With 2.0 seconds, it does not latch. The reset at 10.0 seconds clears the latch.</title>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="820" height="440"/>
  <circle class="halo" cx="482" cy="220" r="200"/>

  <!-- Legend -->
  <rect class="box ok" x="170" y="10" width="80" height="22" rx="4"/>
  <text class="sub" x="210" y="21" text-anchor="middle" dominant-baseline="central">OK</text>
  <rect class="box warn" x="260" y="10" width="80" height="22" rx="4"/>
  <text class="sub" x="300" y="21" text-anchor="middle" dominant-baseline="central">ERROR</text>

  <!-- Time grid -->
  <path class="edge plain dash" d="M170 46 V392"/>
  <path class="edge plain dash" d="M218 46 V392"/>
  <path class="edge plain dash" d="M266 46 V392"/>
  <path class="edge plain dash" d="M314 46 V392"/>
  <path class="edge plain dash" d="M362 46 V392"/>
  <path class="edge plain dash" d="M410 46 V392"/>
  <path class="edge plain dash" d="M458 46 V392"/>
  <path class="edge plain dash" d="M506 46 V392"/>
  <path class="edge plain dash" d="M554 46 V392"/>
  <path class="edge plain dash" d="M602 46 V392"/>
  <path class="edge plain dash" d="M650 46 V392"/>
  <path class="edge plain dash" d="M698 46 V392"/>
  <path class="edge plain dash" d="M746 46 V392"/>
  <path class="edge plain dash" d="M794 46 V392"/>
  <text class="edge-lbl" x="650" y="46" text-anchor="middle" dominant-baseline="central">reset</text>
  <text class="sub" x="170" y="410" text-anchor="middle" dominant-baseline="central">0.0 s</text>
  <text class="sub" x="410" y="410" text-anchor="middle" dominant-baseline="central">5.0 s</text>
  <text class="sub" x="650" y="410" text-anchor="middle" dominant-baseline="central">10.0 s</text>

  <!-- latch = 0.0 s -->
  <text class="lbl" x="20" y="66" dominant-baseline="central">latch = 0.0 s</text>
  <text class="code" x="156" y="91" text-anchor="end" dominant-baseline="central">level</text>
  <rect class="box ok" x="170" y="80" width="96" height="22" rx="4"/>
  <rect class="box warn" x="266" y="80" width="384" height="22" rx="4"/>
  <rect class="box ok" x="650" y="80" width="144" height="22" rx="4"/>
  <text class="code" x="156" y="117" text-anchor="end" dominant-baseline="central">input_level</text>
  <rect class="box ok" x="170" y="106" width="96" height="22" rx="4"/>
  <rect class="box warn" x="266" y="106" width="24" height="22" rx="4"/>
  <rect class="box ok" x="290" y="106" width="72" height="22" rx="4"/>
  <rect class="box warn" x="362" y="106" width="72" height="22" rx="4"/>
  <rect class="box ok" x="434" y="106" width="360" height="22" rx="4"/>
  <text class="code" x="156" y="143" text-anchor="end" dominant-baseline="central">latch_level</text>
  <rect class="box ok" x="170" y="132" width="96" height="22" rx="4"/>
  <rect class="box warn" x="266" y="132" width="384" height="22" rx="4"/>
  <rect class="box ok" x="650" y="132" width="144" height="22" rx="4"/>

  <!-- latch = 1.0 s -->
  <text class="lbl" x="20" y="178" dominant-baseline="central">latch = 1.0 s</text>
  <text class="code" x="156" y="203" text-anchor="end" dominant-baseline="central">level</text>
  <rect class="box ok" x="170" y="192" width="96" height="22" rx="4"/>
  <rect class="box warn" x="266" y="192" width="24" height="22" rx="4"/>
  <rect class="box ok" x="290" y="192" width="72" height="22" rx="4"/>
  <rect class="box warn" x="362" y="192" width="288" height="22" rx="4"/>
  <rect class="box ok" x="650" y="192" width="144" height="22" rx="4"/>
  <text class="code" x="156" y="229" text-anchor="end" dominant-baseline="central">input_level</text>
  <rect class="box ok" x="170" y="218" width="96" height="22" rx="4"/>
  <rect class="box warn" x="266" y="218" width="24" height="22" rx="4"/>
  <rect class="box ok" x="290" y="218" width="72" height="22" rx="4"/>
  <rect class="box warn" x="362" y="218" width="72" height="22" rx="4"/>
  <rect class="box ok" x="434" y="218" width="360" height="22" rx="4"/>
  <text class="code" x="156" y="255" text-anchor="end" dominant-baseline="central">latch_level</text>
  <rect class="box ok" x="170" y="244" width="240" height="22" rx="4"/>
  <rect class="box warn" x="410" y="244" width="240" height="22" rx="4"/>
  <rect class="box ok" x="650" y="244" width="144" height="22" rx="4"/>

  <!-- latch = 2.0 s -->
  <text class="lbl" x="20" y="290" dominant-baseline="central">latch = 2.0 s</text>
  <text class="code" x="156" y="315" text-anchor="end" dominant-baseline="central">level</text>
  <rect class="box ok" x="170" y="304" width="96" height="22" rx="4"/>
  <rect class="box warn" x="266" y="304" width="24" height="22" rx="4"/>
  <rect class="box ok" x="290" y="304" width="72" height="22" rx="4"/>
  <rect class="box warn" x="362" y="304" width="72" height="22" rx="4"/>
  <rect class="box ok" x="434" y="304" width="360" height="22" rx="4"/>
  <text class="code" x="156" y="341" text-anchor="end" dominant-baseline="central">input_level</text>
  <rect class="box ok" x="170" y="330" width="96" height="22" rx="4"/>
  <rect class="box warn" x="266" y="330" width="24" height="22" rx="4"/>
  <rect class="box ok" x="290" y="330" width="72" height="22" rx="4"/>
  <rect class="box warn" x="362" y="330" width="72" height="22" rx="4"/>
  <rect class="box ok" x="434" y="330" width="360" height="22" rx="4"/>
  <text class="code" x="156" y="367" text-anchor="end" dominant-baseline="central">latch_level</text>
  <rect class="box ok" x="170" y="356" width="624" height="22" rx="4"/>
</svg>
