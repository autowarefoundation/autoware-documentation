  <path class="flow flow-accent" pathLength="100" d="M119 346 V302"/>
  <path class="edge accent head" d="M119 346 V302"/>
  <rect class="box ok" x="236" y="346" width="206" height="124" rx="12"/>
  <text class="sub" x="247" y="361" dominant-baseline="central">diags[1]</text>
  <text class="code" x="247" y="377" dominant-baseline="central">parent: 6</text>
  <text class="code" x="247" y="393" dominant-baseline="central">name: lidar</text>
  <text class="code" x="247" y="409" dominant-baseline="central">level: OK</text>
  <text class="code" x="247" y="425" dominant-baseline="central">message: ...</text>
  <text class="code" x="247" y="441" dominant-baseline="central">hardware_id: ...</text>
  <text class="code" x="247" y="457" dominant-baseline="central">values: ...</text>
  <path class="edge" d="M339 346 V302"/>
  <path class="flow" pathLength="100" d="M339 346 V302"/>
