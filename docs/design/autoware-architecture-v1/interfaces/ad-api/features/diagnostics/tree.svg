  <path class="edge" d="M559 128 V78"/>
  <path class="flow" pathLength="100" d="M559 128 V78"/>
  <path class="edge head" d="M559 128 V78"/>
  <text class="edge-lbl" x="559" y="103" text-anchor="middle" dominant-baseline="central">links[1]</text>
  <path class="edge" d="M752 128 V96 H597 V78"/>
  <path class="flow" pathLength="100" d="M752 128 V96 H597 V78"/>
