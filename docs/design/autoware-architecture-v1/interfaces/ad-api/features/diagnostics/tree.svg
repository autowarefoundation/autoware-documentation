  <rect class="box warn" x="16" y="346" width="206" height="124" rx="12"/>
  <text class="sub" x="27" y="361" dominant-baseline="central">diags[0]</text>
  <text class="code" x="27" y="377" dominant-baseline="central">parent: 5</text>
  <text class="code" x="27" y="393" dominant-baseline="central">name: camera</text>
