  <rect class="box warn" x="16" y="240" width="206" height="58" rx="12"/>
  <text class="sub" x="27" y="254" dominant-baseline="central">nodes[5]</text>
  <text class="code" x="27" y="271" dominant-baseline="central">path: /sensor/camera</text>
  <text class="code" x="27" y="286" dominant-baseline="central">level: ERROR</text>
  <rect class="box ok" x="236" y="240" width="206" height="58" rx="12"/>
  <text class="sub" x="247" y="254" dominant-baseline="central">nodes[6]</text>
  <text class="code" x="247" y="271" dominant-baseline="central">path: /sensor/lidar</text>
  <text class="code" x="247" y="286" dominant-baseline="central">level: OK</text>
  <rect class="box ok" x="456" y="240" width="206" height="58" rx="12"/>
  <text class="sub" x="467" y="254" dominant-baseline="central">nodes[7]</text>
  <text class="code" x="467" y="271" dominant-baseline="central">path: /sensor/imu</text>
  <text class="code" x="467" y="286" dominant-baseline="central">level: OK</text>
  <rect class="box ok" x="676" y="240" width="206" height="58" rx="12"/>
  <text class="sub" x="687" y="254" dominant-baseline="central">nodes[8]</text>
  <text class="code" x="687" y="271" dominant-baseline="central">path: /vehicle/interface</text>
  <text class="code" x="687" y="286" dominant-baseline="central">level: OK</text>

  <!-- Links from the children to the parents -->
  <path class="edge accent" d="M119 128 V96 H521 V78"/>
  <path class="flow flow-accent" pathLength="100" d="M119 128 V96 H521 V78"/>
  <path class="edge accent head" d="M119 128 V96 H521 V78"/>
