<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" role="img" aria-labelledby="adapi-cooperation-decisions-title">
  <title id="adapi-cooperation-decisions-title">
    The merged decision follows the operator decision if it is activate or deactivate. If the operator decision is none, the cooperation policy decides: required gives deactivate, and optional uses
    the module decision. If the operator decision is autonomous, the module decision is used.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-green: #00e678; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.ok {
  fill: color-mix(in srgb, var(--aw-green) 14%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-c-green) 70%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.plain {
  marker-end: none;
} .icon {
  fill: var(--aw-d-muted);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="840" height="580"/>
  <circle class="halo" cx="419" cy="200" r="190"/>
  <circle class="halo cyan" cx="665" cy="330" r="120"/>

  <!-- Start and the operator decision -->
  <circle class="icon" cx="419" cy="22" r="10"/>
  <path class="edge" d="M419 32 V50"/>
  <path class="flow" pathLength="100" d="M419 32 V50"/>
  <path class="edge head" d="M419 32 V50"/>
  <rect class="card" x="309" y="54" width="220" height="44" rx="12"/>
  <text class="lbl" x="419" y="76" text-anchor="middle" dominant-baseline="central">Check the operator decision</text>
  <path class="edge" d="M419 98 V116"/>
  <path class="flow" pathLength="100" d="M419 98 V116"/>
  <path class="edge head" d="M419 98 V116"/>
  <path class="card" d="M419 120 L439 140 L419 160 L399 140 Z"/>

  <!-- Operator decision: deactivate and activate -->
  <path class="edge" d="M399 140 H91 V428"/>
  <path class="flow" pathLength="100" d="M399 140 H91 V428"/>
  <path class="edge head" d="M399 140 H91 V428"/>
  <text class="edge-lbl" x="91" y="300" text-anchor="middle" dominant-baseline="central">[deactivate]</text>
  <path class="edge" d="M255 140 V428"/>
  <path class="flow" pathLength="100" d="M255 140 V428"/>
  <path class="edge head" d="M255 140 V428"/>
  <text class="edge-lbl" x="255" y="300" text-anchor="middle" dominant-baseline="central">[activate]</text>

  <!-- Operator decision: none -->
  <path class="edge" d="M419 160 V196"/>
  <path class="flow" pathLength="100" d="M419 160 V196"/>
  <path class="edge head" d="M419 160 V196"/>
  <text class="edge-lbl" x="419" y="178" text-anchor="middle" dominant-baseline="central">[none]</text>
  <rect class="card" x="309" y="200" width="220" height="44" rx="12"/>
  <text class="lbl" x="419" y="222" text-anchor="middle" dominant-baseline="central">Check the cooperation policy</text>
  <path class="edge" d="M419 244 V262"/>
  <path class="flow" pathLength="100" d="M419 244 V262"/>
  <path class="edge head" d="M419 244 V262"/>
  <path class="card" d="M419 266 L439 286 L419 306 L399 286 Z"/>
  <path class="edge" d="M419 306 V428"/>
  <path class="flow" pathLength="100" d="M419 306 V428"/>
  <path class="edge head" d="M419 306 V428"/>
  <text class="edge-lbl" x="419" y="368" text-anchor="middle" dominant-baseline="central">[required]</text>
  <path class="edge" d="M439 286 H556"/>
  <path class="flow" pathLength="100" d="M439 286 H556"/>
  <path class="edge head" d="M439 286 H556"/>
  <text class="edge-lbl" x="497" y="286" text-anchor="middle" dominant-baseline="central">[optional]</text>

  <!-- Operator decision: autonomous -->
  <path class="edge" d="M439 140 H665 V260"/>
  <path class="flow" pathLength="100" d="M439 140 H665 V260"/>
  <path class="edge head" d="M439 140 H665 V260"/>
  <text class="edge-lbl" x="665" y="200" text-anchor="middle" dominant-baseline="central">[autonomous]</text>

  <!-- The module decision -->
  <rect class="card" x="560" y="264" width="210" height="44" rx="12"/>
  <text class="lbl" x="665" y="286" text-anchor="middle" dominant-baseline="central">Check the module decision</text>
  <path class="edge" d="M665 308 V326"/>
  <path class="flow" pathLength="100" d="M665 308 V326"/>
  <path class="edge head" d="M665 308 V326"/>
  <path class="card" d="M665 330 L685 350 L665 370 L645 350 Z"/>
  <path class="edge" d="M645 350 H583 V428"/>
  <path class="flow" pathLength="100" d="M645 350 H583 V428"/>
  <path class="edge head" d="M645 350 H583 V428"/>
  <text class="edge-lbl" x="583" y="392" text-anchor="middle" dominant-baseline="central">[activate]</text>
  <path class="edge" d="M685 350 H747 V428"/>
  <path class="flow" pathLength="100" d="M685 350 H747 V428"/>
  <path class="edge head" d="M685 350 H747 V428"/>
  <text class="edge-lbl" x="747" y="392" text-anchor="middle" dominant-baseline="central">[deactivate]</text>

  <!-- Results -->
  <rect class="card" x="16" y="432" width="150" height="56" rx="12"/>
  <text class="lbl" x="91" y="451" text-anchor="middle" dominant-baseline="central">deactivate</text>
  <text class="sub" x="91" y="471" text-anchor="middle" dominant-baseline="central">by operator decision</text>

  <rect class="box ok" x="180" y="432" width="150" height="56" rx="12"/>
  <text class="lbl" x="255" y="451" text-anchor="middle" dominant-baseline="central">activate</text>
  <text class="sub" x="255" y="471" text-anchor="middle" dominant-baseline="central">by operator decision</text>

  <rect class="card" x="344" y="432" width="150" height="56" rx="12"/>
  <text class="lbl" x="419" y="451" text-anchor="middle" dominant-baseline="central">deactivate</text>
  <text class="sub" x="419" y="471" text-anchor="middle" dominant-baseline="central">by cooperation policy</text>

  <rect class="box ok" x="508" y="432" width="150" height="56" rx="12"/>
  <text class="lbl" x="583" y="451" text-anchor="middle" dominant-baseline="central">activate</text>
  <text class="sub" x="583" y="471" text-anchor="middle" dominant-baseline="central">by module decision</text>

  <rect class="card" x="672" y="432" width="150" height="56" rx="12"/>
  <text class="lbl" x="747" y="451" text-anchor="middle" dominant-baseline="central">deactivate</text>
  <text class="sub" x="747" y="471" text-anchor="middle" dominant-baseline="central">by module decision</text>

  <!-- End -->
  <path class="edge plain" d="M91 488 V514 H747 V488"/>
  <path class="edge plain" d="M255 488 V514"/>
  <path class="edge plain" d="M583 488 V514"/>
  <path class="edge" d="M419 488 V538"/>
  <path class="flow" pathLength="100" d="M419 488 V538"/>
  <path class="edge head" d="M419 488 V538"/>
  <circle class="edge plain" cx="419" cy="554" r="13"/>
  <circle class="icon" cx="419" cy="554" r="8"/>
</svg>
