<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="adapi-cooperation-scenes-title">
  <title id="adapi-cooperation-scenes-title">
    A two-lane road with three scenes. In scene 1234, the vehicle changes to the right lane because the decision is activate. In scene 5678, the lane change back is not done because the decision is
    deactivate. Scene ABCD is a left turn at the intersection with the decision activate.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-green: #00e678; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .aw-d-arrow--route {
  fill: var(--aw-c-green);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
} .area {
  fill: color-mix(in srgb, var(--aw-green) 25%, transparent);
  stroke: var(--aw-c-green);
  stroke-width: 2;
  stroke-dasharray: 6 4;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .route {
  fill: none;
  stroke: var(--aw-c-green);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  marker-end: url("#aw-arrow-route");
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-route {
  stroke: color-mix(in srgb, var(--aw-c-green) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} .car-body {
  fill: url("#aw-grad-car");
} .car-glass {
  fill: url("#aw-grad-car-glass");
  stroke: #ffffffb3;
  stroke-width: 1;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
} .headlight {
  fill: #9ff3ff;
  filter: url("#aw-glow");
} .lidar {
  fill: url("#aw-grad-ai");
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow-route" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--route" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <filter id="aw-glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.35" stop-color="#3f2ee3"/>
      <stop offset="0.75" stop-color="#2a6df2"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Road -->
  <rect class="road" x="0" y="110" width="860" height="140"/>
  <rect class="road" x="740" y="0" width="80" height="110"/>
  <path class="mark" d="M0 110 H740 M820 110 H860"/>
  <path class="mark" d="M0 250 H860"/>
  <path class="mark" d="M740 110 V0 M820 110 V0"/>
  <path class="mark dash" d="M0 180 H730"/>
  <path class="mark thick" d="M724 116 V176"/>

  <!-- Scenes -->
  <rect class="area" x="150" y="100" width="80" height="160"/>
  <rect class="area" x="420" y="100" width="80" height="160"/>
  <rect class="area" x="700" y="100" width="140" height="160"/>

  <!-- Obstacle -->
  <rect class="box muted" x="290" y="128" width="90" height="34" rx="10"/>
  <text class="sub" x="335" y="145" text-anchor="middle" dominant-baseline="central">obstacle</text>

  <!-- Ego vehicle and its paths -->
  <g transform="translate(41 125) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <path class="bound alt" d="M150 145 H282"/>
  <path class="route" d="M90 145 H150 L230 215 H600"/>
  <path class="flow flow-route" pathLength="100" d="M90 145 H150 L230 215 H600"/>
  <path class="route head" d="M90 145 H150 L230 215 H600"/>
  <path class="bound alt" d="M420 215 L500 145 H780 V12"/>

  <!-- Scene information -->
  <rect class="card" x="100" y="6" width="180" height="70" rx="12"/>
  <text class="lbl" x="114" y="25" dominant-baseline="central">Scene ID: 1234</text>
  <text class="sub" x="114" y="44" dominant-baseline="central">Behavior: lane-change</text>
  <text class="sub" x="114" y="61" dominant-baseline="central">Decision: activate</text>
  <path class="leader" d="M190 76 V100"/>

  <rect class="card" x="330" y="6" width="180" height="70" rx="12"/>
  <text class="lbl" x="344" y="25" dominant-baseline="central">Scene ID: 5678</text>
  <text class="sub" x="344" y="44" dominant-baseline="central">Behavior: lane-change</text>
  <text class="sub" x="344" y="61" dominant-baseline="central">Decision: deactivate</text>
  <path class="leader" d="M460 76 V100"/>

  <rect class="card" x="540" y="6" width="180" height="70" rx="12"/>
  <text class="lbl" x="554" y="25" dominant-baseline="central">Scene ID: ABCD</text>
  <text class="sub" x="554" y="44" dominant-baseline="central">Behavior: intersection</text>
  <text class="sub" x="554" y="61" dominant-baseline="central">Decision: activate</text>
  <path class="leader" d="M720 41 H730 V100"/>
</svg>
