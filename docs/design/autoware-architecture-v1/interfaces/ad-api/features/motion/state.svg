<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 260" role="img" aria-labelledby="adapi-motion-state-title">
  <title id="adapi-motion-state-title">
    The motion state starts at STOPPED. When the vehicle tries to start, the state changes to STARTING, and the accept start API changes it to MOVING. If the accept is not required, the state changes
    from STOPPED to MOVING directly. When the vehicle stops, the state changes back to STOPPED. BRAKING is a planned state.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-green: #00e678; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.ok {
  fill: color-mix(in srgb, var(--aw-green) 14%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-c-green) 70%, transparent);
} .box.ext {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-dasharray: 6 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.both {
  marker-start: url("#aw-arrow");
} .edge.accent.both {
  marker-start: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .icon {
  fill: var(--aw-d-muted);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="770" height="260"/>
  <circle class="halo" cx="401" cy="130" r="125"/>
  <circle class="halo cyan" cx="661" cy="128" r="100"/>

  <!-- Initial state -->
  <circle class="icon" cx="22" cy="128" r="9"/>
  <path class="edge accent" d="M31 128 H52"/>
  <path class="flow flow-accent" pathLength="100" d="M31 128 H52"/>
  <path class="edge accent head" d="M31 128 H52"/>

  <!-- States -->
  <rect class="card" x="56" y="100" width="170" height="56" rx="12"/>
  <text class="lbl" x="141" y="128" text-anchor="middle" dominant-baseline="central">STOPPED</text>

  <rect class="card" x="316" y="16" width="170" height="56" rx="12"/>
  <text class="lbl" x="401" y="44" text-anchor="middle" dominant-baseline="central">STARTING</text>

  <rect class="box ok" x="576" y="100" width="170" height="56" rx="12"/>
  <text class="lbl" x="661" y="128" text-anchor="middle" dominant-baseline="central">MOVING</text>

  <rect class="box ext" x="316" y="186" width="170" height="56" rx="12"/>
  <text class="lbl" x="401" y="206" text-anchor="middle" dominant-baseline="central">BRAKING</text>
  <text class="sub" x="401" y="226" text-anchor="middle" dominant-baseline="central">planned</text>

  <!-- STOPPED and STARTING -->
  <path class="edge accent" d="M100 100 V30 H312"/>
  <path class="flow flow-accent" pathLength="100" d="M100 100 V30 H312"/>
  <path class="edge accent head" d="M100 100 V30 H312"/>
  <text class="edge-lbl" x="210" y="30" text-anchor="middle" dominant-baseline="central">start requested</text>
  <path class="edge" d="M316 58 H170 V96"/>
  <path class="flow" pathLength="100" d="M316 58 H170 V96"/>
  <path class="edge head" d="M316 58 H170 V96"/>
  <text class="edge-lbl" x="250" y="58" text-anchor="middle" dominant-baseline="central">start canceled</text>

  <!-- STARTING to MOVING -->
  <path class="edge accent" d="M486 44 H661 V96"/>
  <path class="flow flow-accent" pathLength="100" d="M486 44 H661 V96"/>
  <path class="edge accent head" d="M486 44 H661 V96"/>
  <text class="edge-lbl" x="574" y="44" text-anchor="middle" dominant-baseline="central">accept start</text>

  <!-- STOPPED and MOVING -->
  <path class="edge" d="M226 118 H572"/>
  <path class="flow" pathLength="100" d="M226 118 H572"/>
  <path class="edge head" d="M226 118 H572"/>
  <text class="edge-lbl" x="401" y="118" text-anchor="middle" dominant-baseline="central">start requested (accept not required)</text>
  <path class="edge" d="M576 140 H230"/>
  <path class="flow" pathLength="100" d="M576 140 H230"/>
  <path class="edge head" d="M576 140 H230"/>
  <text class="edge-lbl" x="401" y="140" text-anchor="middle" dominant-baseline="central">stopped</text>

  <!-- The planned BRAKING state -->
  <path class="edge dash both" d="M661 160 V214 H490"/>
  <path class="edge dash" d="M316 214 H141 V160"/>
</svg>
