<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="new-feature-title">
  <title id="new-feature-title">
    Components A, B, and C connect to each other only through the component interface. A component for a new feature or new hardware connects to the same interface, so its developers need to know only
    the interface.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 14%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-cyan) 70%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.plain {
  marker-end: none;
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .card.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 8%, var(--aw-d-node));
  stroke: color-mix(in srgb, var(--aw-c-cyan) 65%, transparent);
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.ai {
  fill: url("#aw-grad-ai");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="760" height="380"/>
  <circle class="halo" cx="380" cy="240" r="124"/>
  <circle class="halo cyan" cx="380" cy="330" r="48"/>

  <!-- Existing components, with their private parts inside -->
  <rect class="glass-panel" x="20" y="16" width="220" height="150" rx="18"/>
  <text class="ttl" x="40" y="42">Component A</text>
  <rect class="card" x="44" y="62" width="76" height="34" rx="12"/>
  <rect class="card" x="140" y="104" width="76" height="34" rx="12"/>

  <rect class="glass-panel" x="270" y="16" width="220" height="150" rx="18"/>
  <text class="ttl" x="290" y="42">Component B</text>
  <rect class="card" x="294" y="62" width="64" height="76" rx="12"/>
  <rect class="card" x="390" y="62" width="76" height="30" rx="12"/>
  <rect class="card" x="390" y="104" width="76" height="30" rx="12"/>

  <rect class="glass-panel" x="520" y="16" width="220" height="150" rx="18"/>
  <text class="ttl" x="540" y="42">Component C</text>
  <rect class="card" x="640" y="62" width="76" height="34" rx="12"/>
  <rect class="card" x="544" y="104" width="76" height="34" rx="12"/>

  <!-- Only some parts use the interface -->
  <path class="edge plain" d="M82 96 V222 M178 138 V222 M326 138 V222 M678 96 V222"/>

  <!-- The component interface -->
  <rect class="box primary" x="20" y="222" width="720" height="50" rx="14"/>
  <circle class="icon-bg on" cx="282" cy="247" r="16"/>
  <circle class="icon-line" cx="278" cy="247" r="5"/>
  <circle class="icon-line" cx="286" cy="247" r="5"/>
  <text class="lbl on-primary" x="380" y="247" text-anchor="middle" dominant-baseline="central">Component interface</text>

  <!-- The new component -->
  <path class="edge plain" d="M380 272 V322"/>
  <rect class="card ai" x="166" y="322" width="428" height="44" rx="12"/>
  <circle class="icon-bg ai" cx="192" cy="344" r="15"/>
  <path class="icon-line" d="M192 338 V350 M186 344 H198"/>
  <text class="lbl" x="380" y="344" text-anchor="middle" dominant-baseline="central">Component of a new feature or new hardware</text>
</svg>
