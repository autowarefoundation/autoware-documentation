<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="unified-access-title">
  <title id="unified-access-title">One fleet management system operates a car, a bus, and a truck in the same way, because each vehicle runs Autoware with the same AD API.</title>

  <!-- The application -->
  <rect class="box primary" x="270" y="20" width="220" height="60" rx="10"/>
  <text class="lbl on-primary" x="380" y="42" text-anchor="middle" dominant-baseline="central">FMS</text>
  <text class="sub on-primary" x="380" y="62" text-anchor="middle" dominant-baseline="central">Fleet management system</text>

  <path class="edge plain" d="M380 80 V112 M130 112 H630 M130 112 V140 M380 112 V140 M630 112 V140"/>

  <!-- One AD API per vehicle -->
  <rect class="box" x="40" y="140" width="180" height="44" rx="10"/>
  <text class="lbl" x="130" y="162" text-anchor="middle" dominant-baseline="central">AD API</text>
  <rect class="box" x="290" y="140" width="180" height="44" rx="10"/>
  <text class="lbl" x="380" y="162" text-anchor="middle" dominant-baseline="central">AD API</text>
  <rect class="box" x="540" y="140" width="180" height="44" rx="10"/>
  <text class="lbl" x="630" y="162" text-anchor="middle" dominant-baseline="central">AD API</text>

  <path class="edge plain" d="M130 184 V212 M380 184 V212 M630 184 V212"/>

  <!-- The vehicles -->
  <rect class="box muted" x="40" y="212" width="180" height="96" rx="10"/>
  <path class="icon" d="M72 270 v-16 q0-6 6-8 l24-4 l18-18 h40 l20 18 h10 q8 0 8 8 v20 z"/>
  <circle class="icon" cx="96" cy="272" r="9"/>
  <circle class="icon" cx="164" cy="272" r="9"/>
  <text class="sub" x="130" y="294" text-anchor="middle" dominant-baseline="central">Car</text>

  <rect class="box muted" x="290" y="212" width="180" height="96" rx="10"/>
  <path class="icon" d="M314 270 v-40 q0-8 8-8 h112 q10 0 12 10 l4 38 z"/>
  <circle class="icon" cx="340" cy="272" r="9"/>
  <circle class="icon" cx="424" cy="272" r="9"/>
  <text class="sub" x="380" y="294" text-anchor="middle" dominant-baseline="central">Bus</text>

  <rect class="box muted" x="540" y="212" width="180" height="96" rx="10"/>
  <path class="icon" d="M566 270 v-26 l10-14 h26 v40 z M606 270 v-48 h88 v48 z"/>
  <circle class="icon" cx="588" cy="272" r="9"/>
  <circle class="icon" cx="672" cy="272" r="9"/>
  <text class="sub" x="630" y="294" text-anchor="middle" dominant-baseline="central">Truck</text>
</svg>
