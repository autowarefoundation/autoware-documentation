<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="unified-access-title">
  <title id="unified-access-title">One fleet management system operates a car, a bus, and a truck in the same way, because each vehicle runs Autoware with the same AD API.</title>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="760" height="330"/>
  <circle class="halo" cx="380" cy="60" r="58"/>
  <circle class="halo cyan" cx="380" cy="254" r="74"/>

  <!-- The application -->
  <rect class="box primary" x="270" y="20" width="220" height="60" rx="14"/>
  <circle class="icon-bg on" cx="302" cy="50" r="18"/>
  <path class="icon-line" d="M294 55 H309 A4.5 4.5 0 0 0 308 46 A6.5 6.5 0 0 0 296 47 A4 4 0 0 0 294 55 Z"/>
  <text class="lbl on-primary" x="330" y="41" dominant-baseline="central">FMS</text>
  <text class="sub on-primary" x="330" y="61" dominant-baseline="central">Fleet management system</text>

  <path class="edge plain" d="M380 80 V112 M130 112 H630 M130 112 V140 M380 112 V140 M630 112 V140"/>

  <!-- One AD API per vehicle -->
  <rect class="card" x="40" y="140" width="180" height="44" rx="12"/>
  <text class="lbl" x="130" y="162" text-anchor="middle" dominant-baseline="central">AD API</text>
  <rect class="card" x="290" y="140" width="180" height="44" rx="12"/>
  <text class="lbl" x="380" y="162" text-anchor="middle" dominant-baseline="central">AD API</text>
  <rect class="card" x="540" y="140" width="180" height="44" rx="12"/>
  <text class="lbl" x="630" y="162" text-anchor="middle" dominant-baseline="central">AD API</text>

  <path class="edge plain" d="M130 184 V212 M380 184 V212 M630 184 V212"/>

  <!-- The vehicles -->
  <rect class="card" x="40" y="212" width="180" height="96" rx="12"/>
  <ellipse class="car-shadow" cx="130" cy="281" rx="60" ry="4"/>
  <path class="car-body" d="M72 270 v-16 q0-6 6-8 l24-4 l18-18 h40 l20 18 h10 q8 0 8 8 v20 z"/>
  <path class="car-glass" d="M107 241 L121 227 H158 L173 241 Z"/>
  <path class="car-shine" d="M82 252 H186"/>
  <circle class="wheel" cx="96" cy="272" r="9"/>
  <circle class="rim" cx="96" cy="272" r="4.5"/>
  <circle class="wheel" cx="164" cy="272" r="9"/>
  <circle class="rim" cx="164" cy="272" r="4.5"/>
  <text class="sub" x="130" y="294" text-anchor="middle" dominant-baseline="central">Car</text>

  <rect class="card" x="290" y="212" width="180" height="96" rx="12"/>
  <ellipse class="car-shadow" cx="382" cy="281" rx="68" ry="4"/>
  <path class="car-body" d="M314 270 v-40 q0-8 8-8 h112 q10 0 12 10 l4 38 z"/>
  <rect class="car-glass" x="322" y="230" width="24" height="14" rx="3"/>
  <rect class="car-glass" x="352" y="230" width="24" height="14" rx="3"/>
  <rect class="car-glass" x="382" y="230" width="24" height="14" rx="3"/>
  <path class="car-glass" d="M412 230 H436 Q440 230 441 235 L442 244 H412 Z"/>
  <path class="car-shine" d="M322 253 H442"/>
  <circle class="wheel" cx="340" cy="272" r="9"/>
  <circle class="rim" cx="340" cy="272" r="4.5"/>
  <circle class="wheel" cx="424" cy="272" r="9"/>
  <circle class="rim" cx="424" cy="272" r="4.5"/>
  <text class="sub" x="380" y="294" text-anchor="middle" dominant-baseline="central">Bus</text>

  <rect class="card" x="540" y="212" width="180" height="96" rx="12"/>
  <ellipse class="car-shadow" cx="630" cy="281" rx="66" ry="4"/>
  <path class="car-body" d="M566 270 v-26 l10-14 h26 v40 z M606 270 v-48 h88 v48 z"/>
  <path class="car-glass" d="M571 244 L579 234 H597 V244 Z"/>
  <path class="car-shine" d="M614 230 H686"/>
  <circle class="wheel" cx="588" cy="272" r="9"/>
  <circle class="rim" cx="588" cy="272" r="4.5"/>
  <circle class="wheel" cx="672" cy="272" r="9"/>
  <circle class="rim" cx="672" cy="272" r="4.5"/>
  <text class="sub" x="630" y="294" text-anchor="middle" dominant-baseline="central">Truck</text>
</svg>
