<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 570" role="img" aria-labelledby="localization-interface-title">
  <title id="localization-interface-title">In the default Localization setup, the NDT scan matcher matches the LiDAR point cloud to the point cloud map, and the gyro odometer combines the IMU and the vehicle twist. The EKF localizer fuses both into the kinematic state, which goes to Planning and Control. The pose initializer gives the first pose.</title>

  <!-- Inputs -->
  <rect class="box muted" x="20" y="16" width="160" height="54" rx="10"/>
  <text class="lbl" x="100" y="43" text-anchor="middle" dominant-baseline="central">Map</text>
  <rect class="box muted" x="220" y="16" width="400" height="54" rx="10"/>
  <text class="lbl" x="420" y="43" text-anchor="middle" dominant-baseline="central">Sensing</text>
  <rect class="box muted" x="660" y="16" width="180" height="54" rx="10"/>
  <text class="lbl" x="750" y="43" text-anchor="middle" dominant-baseline="central">AD API</text>

  <!-- The Localization component -->
  <rect class="group" x="20" y="120" width="820" height="330" rx="16"/>
  <text class="ttl" x="470" y="148">Localization</text>

  <rect class="box" x="40" y="170" width="220" height="52" rx="10"/>
  <text class="lbl" x="150" y="196" text-anchor="middle" dominant-baseline="central">NDT scan matcher</text>
  <rect class="box" x="320" y="170" width="220" height="52" rx="10"/>
  <text class="lbl" x="430" y="196" text-anchor="middle" dominant-baseline="central">Gyro odometer</text>
  <rect class="box" x="620" y="170" width="200" height="52" rx="10"/>
  <text class="lbl" x="720" y="196" text-anchor="middle" dominant-baseline="central">Pose initializer</text>

  <rect class="box primary" x="40" y="290" width="520" height="52" rx="10"/>
  <text class="lbl on-primary" x="300" y="316" text-anchor="middle" dominant-baseline="central">EKF localizer</text>

  <rect class="box" x="40" y="380" width="220" height="46" rx="10"/>
  <text class="lbl" x="150" y="403" text-anchor="middle" dominant-baseline="central">Stop filter</text>
  <rect class="box" x="320" y="380" width="220" height="46" rx="10"/>
  <text class="lbl" x="430" y="403" text-anchor="middle" dominant-baseline="central">Twist to acceleration</text>

  <!-- Inputs to the nodes -->
  <path class="edge" d="M100 70 V164"/>
  <text class="edge-lbl" x="100" y="100" text-anchor="middle" dominant-baseline="central">Point cloud map</text>
  <path class="edge accent" d="M240 70 V164"/>
  <text class="edge-lbl" x="240" y="130" text-anchor="middle" dominant-baseline="central">LiDAR point cloud</text>
  <path class="edge" d="M430 70 V164"/>
  <text class="edge-lbl" x="430" y="100" text-anchor="middle" dominant-baseline="central">IMU, vehicle twist</text>
  <path class="edge" d="M600 70 V100 H680 V164"/>
  <text class="edge-lbl" x="640" y="100" text-anchor="middle" dominant-baseline="central">GNSS pose</text>
  <path class="edge dash" d="M760 70 V164"/>
  <text class="edge-lbl" x="760" y="100" text-anchor="middle" dominant-baseline="central">Initialize</text>

  <!-- Inside Localization -->
  <path class="edge accent" d="M150 222 V284"/>
  <text class="edge-lbl" x="150" y="254" text-anchor="middle" dominant-baseline="central">Pose</text>
  <path class="edge" d="M430 222 V284"/>
  <text class="edge-lbl" x="430" y="254" text-anchor="middle" dominant-baseline="central">Twist</text>
  <path class="edge" d="M720 222 V316 H566"/>
  <text class="edge-lbl" x="720" y="262" text-anchor="middle" dominant-baseline="central">Initial pose</text>
  <path class="edge accent" d="M150 342 V374"/>
  <path class="edge" d="M260 403 H314"/>

  <!-- Outputs -->
  <path class="edge accent" d="M150 426 V494"/>
  <text class="edge-lbl code" x="150" y="472" text-anchor="middle" dominant-baseline="central">/localization/kinematic_state</text>
  <path class="edge" d="M430 426 V494"/>
  <text class="edge-lbl code" x="430" y="472" text-anchor="middle" dominant-baseline="central">/localization/acceleration</text>
  <path class="edge" d="M560 330 H660 V494"/>
  <text class="edge-lbl code" x="660" y="472" text-anchor="middle" dominant-baseline="central">/tf</text>

  <rect class="box muted" x="20" y="500" width="560" height="50" rx="10"/>
  <text class="lbl" x="300" y="525" text-anchor="middle" dominant-baseline="central">Planning, Control, and other components</text>
  <rect class="box muted" x="600" y="500" width="240" height="50" rx="10"/>
  <text class="lbl" x="720" y="519" text-anchor="middle" dominant-baseline="central">TF tree</text>
  <text class="sub code" x="720" y="537" text-anchor="middle" dominant-baseline="central">map → base_link</text>
</svg>
