<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="vehicle-axes-title">
  <title id="vehicle-axes-title">
    The base_link frame is on the ground below the center of the rear axle. The x axis points forward, the y axis points to the left, and the z axis points up. Roll, pitch, and yaw are the rotations
    around x, y, and z.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-cyan: #00c8ff; --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .car-body {
  fill: url("#aw-grad-car");
} .car-glass {
  fill: url("#aw-grad-car-glass");
  stroke: #ffffffb3;
  stroke-width: 1;
} .wheel {
  fill: #1b1d29;
} .rim {
  fill: none;
  stroke: #c9ccd8;
  stroke-width: 2.5;
} .hub {
  fill: #c9ccd8;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
} .headlight {
  fill: #9ff3ff;
  filter: url("#aw-glow");
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <filter id="aw-glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="aw-grad-car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.35" stop-color="#3f2ee3"/>
      <stop offset="0.75" stop-color="#2a6df2"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid -->
  <rect class="dots" x="0" y="0" width="860" height="300"/>

  <!-- Top view -->
  <text class="ttl" x="20" y="24">Top view</text>
  <rect class="car-shadow" x="72" y="114" width="230" height="100" rx="14"/>
  <rect class="wheel" x="110" y="104" width="30" height="12" rx="3"/>
  <rect class="wheel" x="110" y="204" width="30" height="12" rx="3"/>
  <rect class="wheel" x="240" y="104" width="30" height="12" rx="3"/>
  <rect class="wheel" x="240" y="204" width="30" height="12" rx="3"/>
  <rect class="car-body" x="135" y="45" width="100" height="230" rx="14" transform="rotate(90 185 160)"/>
  <rect class="car-glass" x="222" y="120" width="18" height="80" rx="3"/>
  <rect class="car-glass" x="84" y="124" width="12" height="72" rx="3"/>
  <rect class="headlight" x="294" y="118" width="4" height="12" rx="2"/>
  <rect class="headlight" x="294" y="190" width="4" height="12" rx="2"/>

  <path class="edge accent" d="M125 160 H372"/>
  <text class="lbl" x="382" y="160" dominant-baseline="central">+x</text>
  <path class="edge accent" d="M125 160 V46"/>
  <text class="lbl" x="125" y="34" text-anchor="middle" dominant-baseline="central">+y</text>
  <path class="edge" d="M193 142 A70 70 0 0 0 143 92"/>
  <text class="lbl" x="186" y="88" dominant-baseline="central">yaw</text>
  <circle class="bound point" cx="125" cy="160" r="5"/>
  <text class="note" x="64" y="238">base_link (the +z axis points out of the page)</text>

  <!-- Side view -->
  <text class="ttl" x="460" y="24">Side view</text>
  <rect class="car-body" x="490" y="150" width="230" height="60" rx="8"/>
  <rect class="car-glass" x="640" y="156" width="20" height="24" rx="3"/>
  <rect class="headlight" x="714" y="166" width="6" height="8" rx="3"/>
  <circle class="wheel" cx="545" cy="214" r="16"/>
  <circle class="rim" cx="545" cy="214" r="9"/>
  <circle class="hub" cx="545" cy="214" r="3"/>
  <circle class="wheel" cx="675" cy="214" r="16"/>
  <circle class="rim" cx="675" cy="214" r="9"/>
  <circle class="hub" cx="675" cy="214" r="3"/>
  <path class="leader" d="M470 230 H798"/>

  <path class="edge accent" d="M545 230 H800"/>
  <text class="lbl" x="810" y="230" dominant-baseline="central">+x</text>
  <path class="edge accent" d="M545 230 V46"/>
  <text class="lbl" x="545" y="34" text-anchor="middle" dominant-baseline="central">+z</text>
  <path class="edge" d="M579 136 A100 100 0 0 1 639 196"/>
  <text class="lbl" x="600" y="118" dominant-baseline="central">pitch</text>
  <path class="edge" d="M776 220 A8 18 0 1 0 776 240"/>
  <text class="lbl" x="770" y="262" text-anchor="middle" dominant-baseline="central">roll</text>
  <path class="edge" d="M526 78 A20 7 0 1 0 564 78"/>
  <text class="lbl" x="574" y="66" dominant-baseline="central">yaw</text>
  <circle class="bound point" cx="545" cy="230" r="5"/>
  <text class="note" x="470" y="282">base_link (the +y axis points into the page)</text>
</svg>
