<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 546" role="img" aria-labelledby="sensing-interface-title">
  <title id="sensing-interface-title">
    Sensing preprocesses the data of each sensor driver. Camera images, radar objects, and the LiDAR point cloud go to Perception. The LiDAR point cloud, the GNSS pose, the IMU data, and the vehicle
    twist go to Localization. Autoware 2.0.0 defines no Sensing topic for ultrasonics, radar scan, GNSS velocity, and GNSS acceleration.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.ext {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-dasharray: 6 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="546"/>
  <circle class="halo" cx="370" cy="202" r="140"/>
  <circle class="halo cyan" cx="760" cy="353" r="95"/>

  <text class="ttl" x="20" y="14">Inputs</text>
  <text class="ttl" x="250" y="14">Sensing</text>
  <text class="ttl" x="680" y="14">Users</text>

  <rect class="card" x="20" y="26" width="170" height="48" rx="12"/>
  <text class="lbl" x="105" y="41" text-anchor="middle" dominant-baseline="central">Camera driver</text>
  <text class="sub code" x="105" y="61" text-anchor="middle" dominant-baseline="central">Image</text>
  <path class="edge" d="M190 50 H244"/>
  <path class="flow" pathLength="100" d="M190 50 H244"/>
  <path class="edge head" d="M190 50 H244"/>
  <rect class="card" x="250" y="26" width="240" height="48" rx="12"/>
  <text class="lbl" x="370" y="41" text-anchor="middle" dominant-baseline="central">Camera preprocessing</text>
  <text class="sub" x="370" y="61" text-anchor="middle" dominant-baseline="central">Lens distortion correction</text>
  <path class="edge" d="M490 50 H674"/>
  <path class="flow" pathLength="100" d="M490 50 H674"/>
  <path class="edge head" d="M490 50 H674"/>
  <text class="edge-lbl" x="585" y="50" text-anchor="middle" dominant-baseline="central">Image</text>

  <rect class="card" x="20" y="102" width="170" height="48" rx="12"/>
  <text class="lbl" x="105" y="117" text-anchor="middle" dominant-baseline="central">Radar driver</text>
  <text class="sub code" x="105" y="137" text-anchor="middle" dominant-baseline="central">RadarTracks</text>
  <path class="edge" d="M190 126 H244"/>
  <path class="flow" pathLength="100" d="M190 126 H244"/>
  <path class="edge head" d="M190 126 H244"/>
  <rect class="card" x="250" y="102" width="240" height="48" rx="12"/>
  <text class="lbl" x="370" y="117" text-anchor="middle" dominant-baseline="central">Radar preprocessing</text>
  <text class="sub" x="370" y="137" text-anchor="middle" dominant-baseline="central">Noise filter, conversion</text>
  <path class="edge" d="M490 126 H674"/>
  <path class="flow" pathLength="100" d="M490 126 H674"/>
  <path class="edge head" d="M490 126 H674"/>
  <text class="edge-lbl" x="585" y="126" text-anchor="middle" dominant-baseline="central">Objects</text>

  <rect class="card" x="20" y="178" width="170" height="48" rx="12"/>
  <text class="lbl" x="105" y="193" text-anchor="middle" dominant-baseline="central">LiDAR drivers</text>
  <text class="sub code" x="105" y="213" text-anchor="middle" dominant-baseline="central">PointCloud2</text>
  <path class="edge accent" d="M190 202 H244"/>
  <path class="flow flow-accent" pathLength="100" d="M190 202 H244"/>
  <path class="edge accent head" d="M190 202 H244"/>
  <rect class="box primary" x="250" y="178" width="240" height="48" rx="14"/>
  <circle class="icon-bg on" cx="274" cy="202" r="15"/>
  <circle class="icon-dot" cx="269" cy="207" r="2.4"/>
  <path class="icon-line" d="M269 199 A8 8 0 0 1 277 207"/>
  <path class="icon-line" d="M269 193 A14 14 0 0 1 283 207"/>
  <text class="lbl on-primary" x="298" y="193" dominant-baseline="central">Point cloud preprocessing</text>
  <text class="sub on-primary" x="298" y="213" dominant-baseline="central">Filters, concatenation</text>
  <path class="edge accent" d="M490 202 H760 V158"/>
  <path class="flow flow-accent" pathLength="100" d="M490 202 H760 V158"/>
  <path class="edge accent head" d="M490 202 H760 V158"/>
  <path class="edge accent" d="M760 202 V246"/>
  <path class="flow flow-accent" pathLength="100" d="M760 202 V246"/>
  <path class="edge accent head" d="M760 202 V246"/>
  <text class="edge-lbl" x="585" y="202" text-anchor="middle" dominant-baseline="central">Point cloud</text>

  <rect class="card" x="20" y="254" width="170" height="48" rx="12"/>
  <text class="lbl" x="105" y="269" text-anchor="middle" dominant-baseline="central">GNSS driver</text>
  <text class="sub code" x="105" y="289" text-anchor="middle" dominant-baseline="central">NavSatFix, orientation</text>
  <path class="edge" d="M190 278 H244"/>
  <path class="flow" pathLength="100" d="M190 278 H244"/>
  <path class="edge head" d="M190 278 H244"/>
  <rect class="card" x="250" y="254" width="240" height="48" rx="12"/>
  <text class="lbl" x="370" y="269" text-anchor="middle" dominant-baseline="central">GNSS poser</text>
  <text class="sub" x="370" y="289" text-anchor="middle" dominant-baseline="central">Pose in the map frame</text>
  <path class="edge" d="M490 278 H674"/>
  <path class="flow" pathLength="100" d="M490 278 H674"/>
  <path class="edge head" d="M490 278 H674"/>
  <text class="edge-lbl" x="585" y="278" text-anchor="middle" dominant-baseline="central">GNSS pose</text>

  <rect class="card" x="20" y="330" width="170" height="48" rx="12"/>
  <text class="lbl" x="105" y="345" text-anchor="middle" dominant-baseline="central">IMU driver</text>
  <text class="sub code" x="105" y="365" text-anchor="middle" dominant-baseline="central">Imu</text>
  <path class="edge" d="M190 354 H244"/>
  <path class="flow" pathLength="100" d="M190 354 H244"/>
  <path class="edge head" d="M190 354 H244"/>
  <rect class="card" x="250" y="330" width="240" height="48" rx="12"/>
  <text class="lbl" x="370" y="345" text-anchor="middle" dominant-baseline="central">IMU corrector</text>
  <text class="sub" x="370" y="365" text-anchor="middle" dominant-baseline="central">Yaw rate offset and scale</text>
  <path class="edge" d="M490 354 H674"/>
  <path class="flow" pathLength="100" d="M490 354 H674"/>
  <path class="edge head" d="M490 354 H674"/>
  <text class="edge-lbl" x="585" y="354" text-anchor="middle" dominant-baseline="central">IMU data</text>

  <rect class="card" x="20" y="406" width="170" height="48" rx="12"/>
  <text class="lbl" x="105" y="421" text-anchor="middle" dominant-baseline="central">Vehicle interface</text>
  <text class="sub code" x="105" y="441" text-anchor="middle" dominant-baseline="central">VelocityReport</text>
  <path class="edge" d="M190 430 H244"/>
  <path class="flow" pathLength="100" d="M190 430 H244"/>
  <path class="edge head" d="M190 430 H244"/>
  <rect class="card" x="250" y="406" width="240" height="48" rx="12"/>
  <text class="lbl" x="370" y="421" text-anchor="middle" dominant-baseline="central">Velocity converter</text>
  <text class="sub" x="370" y="441" text-anchor="middle" dominant-baseline="central">Report to twist</text>
  <path class="edge" d="M490 430 H674"/>
  <path class="flow" pathLength="100" d="M490 430 H674"/>
  <path class="edge head" d="M490 430 H674"/>
  <text class="edge-lbl" x="585" y="430" text-anchor="middle" dominant-baseline="central">Vehicle twist</text>

  <rect class="box ext" x="20" y="482" width="470" height="48" rx="12"/>
  <text class="lbl" x="255" y="497" text-anchor="middle" dominant-baseline="central">Not defined in Autoware 2.0.0</text>
  <text class="sub" x="255" y="517" text-anchor="middle" dominant-baseline="central">Ultrasonics, radar scan, GNSS velocity, GNSS acceleration</text>
  <rect class="card" x="680" y="26" width="160" height="126" rx="12"/>
  <text class="lbl" x="760" y="89" text-anchor="middle" dominant-baseline="central">Perception</text>
  <rect class="card" x="680" y="252" width="160" height="202" rx="12"/>
  <text class="lbl" x="760" y="353" text-anchor="middle" dominant-baseline="central">Localization</text>
</svg>
