<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="vehicle-footprint-title">
  <title id="vehicle-footprint-title">
    The footprint polygon that Autoware makes from the vehicle dimensions has six points in clockwise order: front left, front right, center right, rear right, rear left, and center left. Its origin
    is base_link, with x forward and y to the left.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-cyan: #00c8ff; --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-green: #00e678; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .area {
  fill: color-mix(in srgb, var(--aw-green) 25%, transparent);
  stroke: var(--aw-c-green);
  stroke-width: 2;
  stroke-dasharray: 6 4;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .car-body {
  fill: url("#aw-grad-car");
} .car-glass {
  fill: url("#aw-grad-car-glass");
  stroke: #ffffffb3;
  stroke-width: 1;
} .wheel {
  fill: #1b1d29;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.35" stop-color="#3f2ee3"/>
      <stop offset="0.75" stop-color="#2a6df2"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid -->
  <rect class="dots" x="0" y="0" width="860" height="300"/>

  <!-- The vehicle, front to the right -->
  <rect class="car-shadow" x="203" y="55" width="420" height="200" rx="6"/>
  <rect class="car-body" x="310" y="-60" width="200" height="420" rx="6" transform="rotate(90 410 150)"/>
  <rect class="car-glass" x="470" y="66" width="22" height="168" rx="3"/>
  <rect class="car-glass" x="222" y="74" width="14" height="152" rx="3"/>
  <rect class="wheel" x="269" y="72" width="44" height="16" rx="4"/>
  <rect class="wheel" x="269" y="212" width="44" height="16" rx="4"/>
  <rect class="wheel" x="510" y="72" width="44" height="16" rx="4"/>
  <rect class="wheel" x="510" y="212" width="44" height="16" rx="4"/>

  <!-- The footprint -->
  <path class="area" d="M620 50 L620 250 L411 250 L200 250 L200 50 L411 50 Z"/>
  <path class="edge accent" d="M291 150 H700"/>
  <text class="lbl" x="710" y="150" dominant-baseline="central">+x</text>
  <path class="edge accent" d="M291 150 V14"/>
  <text class="lbl" x="302" y="18" dominant-baseline="central">+y</text>
  <circle class="bound point" cx="291" cy="150" r="5"/>
  <text class="sub on-primary" x="300" y="170">base_link</text>

  <circle class="bound point" cx="620" cy="50" r="5"/>
  <text class="lbl" x="632" y="36">1</text>
  <circle class="bound point" cx="620" cy="250" r="5"/>
  <text class="lbl" x="632" y="272">2</text>
  <circle class="bound point" cx="411" cy="250" r="5"/>
  <text class="lbl" x="406" y="276">3</text>
  <circle class="bound point" cx="200" cy="250" r="5"/>
  <text class="lbl" x="180" y="272">4</text>
  <circle class="bound point" cx="200" cy="50" r="5"/>
  <text class="lbl" x="180" y="36">5</text>
  <circle class="bound point" cx="411" cy="50" r="5"/>
  <text class="lbl" x="406" y="36">6</text>

  <text class="note" x="660" y="64">1: front left</text>
  <text class="note" x="660" y="86">2: front right</text>
  <text class="note" x="660" y="216">3: center right</text>
  <text class="note" x="660" y="238">4: rear right</text>
  <text class="note" x="20" y="64">5: rear left</text>
  <text class="note" x="20" y="86">6: center left</text>
</svg>
