<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="localization-tf-tree-title">
  <title id="localization-tf-tree-title">
    The tf tree: map is the parent of base_link and viewer. base_link is the parent of the sensor frames. The earth frame above map is optional. No default Autoware launch publishes it.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} .box.ext {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-dasharray: 6 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.dash {
  stroke-dasharray: 6 5;
} .edge.plain {
  marker-end: none;
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and a soft glow -->
  <rect class="dots" x="0" y="0" width="720" height="330"/>
  <circle class="halo" cx="360" cy="200" r="125"/>

  <rect class="box ext" x="300" y="16" width="120" height="44" rx="12"/>
  <text class="code" x="360" y="38" text-anchor="middle" dominant-baseline="central">earth</text>
  <text class="sub" x="436" y="38" dominant-baseline="central">optional, not published by default</text>

  <rect class="card" x="300" y="104" width="120" height="44" rx="12"/>
  <text class="code" x="360" y="126" text-anchor="middle" dominant-baseline="central">map</text>

  <rect class="box primary" x="300" y="192" width="120" height="44" rx="12"/>
  <text class="code on-primary" x="360" y="214" text-anchor="middle" dominant-baseline="central">base_link</text>

  <rect class="box muted" x="500" y="192" width="120" height="44" rx="12"/>
  <text class="code" x="560" y="214" text-anchor="middle" dominant-baseline="central">viewer</text>

  <rect class="card" x="120" y="280" width="120" height="40" rx="12"/>
  <text class="code" x="180" y="300" text-anchor="middle" dominant-baseline="central">sensor A</text>

  <rect class="card" x="300" y="280" width="120" height="40" rx="12"/>
  <text class="code" x="360" y="300" text-anchor="middle" dominant-baseline="central">sensor B</text>

  <rect class="card" x="480" y="280" width="120" height="40" rx="12"/>
  <text class="code" x="540" y="300" text-anchor="middle" dominant-baseline="central">sensor C</text>

  <text class="sub" x="650" y="300" text-anchor="middle" dominant-baseline="central">...</text>

  <path class="edge dash" d="M360 60 V96"/>
  <path class="edge" d="M360 148 V184"/>
  <path class="edge" fill="none" d="M420 126 H560 V184"/>

  <path class="edge plain" d="M360 236 V256"/>
  <path class="edge plain" d="M180 256 H630"/>
  <path class="edge" d="M180 256 V272"/>
  <path class="edge" d="M360 256 V272"/>
  <path class="edge" d="M540 256 V272"/>
</svg>
