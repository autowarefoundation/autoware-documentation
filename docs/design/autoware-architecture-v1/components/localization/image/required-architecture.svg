<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="localization-required-architecture-title">
  <title id="localization-required-architecture-title">
    The Localization component takes sensor messages, map data, and tf as inputs. It outputs the pose, twist, and acceleration with covariance, diagnostics, and the tf from map to base_link.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="820" height="330"/>
  <circle class="halo" cx="400" cy="166" r="150"/>
  <circle class="halo cyan" cx="680" cy="166" r="135"/>

  <!-- Inputs -->
  <rect class="box muted" x="20" y="44" width="180" height="64" rx="12"/>
  <text class="lbl" x="110" y="66" text-anchor="middle" dominant-baseline="central">Sensor messages</text>
  <text class="sub" x="110" y="88" text-anchor="middle" dominant-baseline="central">LiDAR, camera, GNSS, IMU, CAN</text>

  <rect class="box muted" x="20" y="134" width="180" height="64" rx="12"/>
  <text class="lbl" x="110" y="156" text-anchor="middle" dominant-baseline="central">Map data</text>
  <text class="sub" x="110" y="178" text-anchor="middle" dominant-baseline="central">Point cloud map, Lanelet2 map</text>

  <rect class="box muted" x="20" y="224" width="180" height="64" rx="12"/>
  <text class="lbl" x="110" y="246" text-anchor="middle" dominant-baseline="central">tf, static_tf</text>
  <text class="sub" x="110" y="268" text-anchor="middle" dominant-baseline="central">map and base_link frames</text>

  <path class="edge" d="M200 76 H282"/>
  <path class="flow" pathLength="100" d="M200 76 H282"/>
  <path class="edge head" d="M200 76 H282"/>
  <path class="edge" d="M200 166 H282"/>
  <path class="flow" pathLength="100" d="M200 166 H282"/>
  <path class="edge head" d="M200 166 H282"/>
  <path class="edge" d="M200 256 H282"/>
  <path class="flow" pathLength="100" d="M200 256 H282"/>
  <path class="edge head" d="M200 256 H282"/>

  <!-- The component -->
  <rect class="box primary" x="290" y="20" width="220" height="292" rx="18"/>
  <circle class="icon-bg on" cx="400" cy="112" r="18"/>
  <path class="icon-line" d="M400 123 C395 118 392 114 392 109 A8 8 0 0 1 408 109 C408 114 405 118 400 123 Z"/>
  <circle class="icon-dot" cx="400" cy="109" r="2.6"/>
  <text class="lbl on-primary" x="400" y="154" text-anchor="middle" dominant-baseline="central">Localization</text>
  <text class="sub on-primary" x="400" y="178" text-anchor="middle" dominant-baseline="central">Any algorithm that meets</text>
  <text class="sub on-primary" x="400" y="196" text-anchor="middle" dominant-baseline="central">this interface</text>

  <!-- Outputs -->
  <rect class="card" x="600" y="20" width="200" height="50" rx="12"/>
  <text class="lbl" x="700" y="37" text-anchor="middle" dominant-baseline="central">Pose</text>
  <text class="sub" x="700" y="55" text-anchor="middle" dominant-baseline="central">With covariance, map frame</text>

  <rect class="card" x="600" y="80" width="200" height="50" rx="12"/>
  <text class="lbl" x="700" y="97" text-anchor="middle" dominant-baseline="central">Twist</text>
  <text class="sub" x="700" y="115" text-anchor="middle" dominant-baseline="central">With covariance, base_link frame</text>

  <rect class="card" x="600" y="140" width="200" height="50" rx="12"/>
  <text class="lbl" x="700" y="157" text-anchor="middle" dominant-baseline="central">Acceleration</text>
  <text class="sub" x="700" y="175" text-anchor="middle" dominant-baseline="central">With covariance, base_link frame</text>

  <rect class="card" x="600" y="200" width="200" height="50" rx="12"/>
  <text class="lbl" x="700" y="217" text-anchor="middle" dominant-baseline="central">Diagnostics</text>
  <text class="sub" x="700" y="235" text-anchor="middle" dominant-baseline="central">Is the estimate reliable?</text>

  <rect class="card" x="600" y="260" width="200" height="50" rx="12"/>
  <text class="lbl" x="700" y="277" text-anchor="middle" dominant-baseline="central">tf</text>
  <text class="sub" x="700" y="295" text-anchor="middle" dominant-baseline="central">map to base_link</text>

  <path class="edge" d="M510 45 H592"/>
  <path class="flow" pathLength="100" d="M510 45 H592"/>
  <path class="edge head" d="M510 45 H592"/>
  <path class="edge" d="M510 105 H592"/>
  <path class="flow" pathLength="100" d="M510 105 H592"/>
  <path class="edge head" d="M510 105 H592"/>
  <path class="edge" d="M510 165 H592"/>
  <path class="flow" pathLength="100" d="M510 165 H592"/>
  <path class="edge head" d="M510 165 H592"/>
  <path class="edge" d="M510 225 H592"/>
  <path class="flow" pathLength="100" d="M510 225 H592"/>
  <path class="edge head" d="M510 225 H592"/>
  <path class="edge" d="M510 285 H592"/>
  <path class="flow" pathLength="100" d="M510 285 H592"/>
  <path class="edge head" d="M510 285 H592"/>
</svg>
