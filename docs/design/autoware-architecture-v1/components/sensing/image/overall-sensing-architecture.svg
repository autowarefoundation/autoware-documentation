<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" role="img" aria-labelledby="overall-sensing-architecture-title">
  <title id="overall-sensing-architecture-title">
    The sensing component reads the vehicle velocity, GNSS/INS, IMU, LiDAR, camera, and radar data. It preprocesses the data and sends it to localization and perception.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} .box.ext {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-dasharray: 6 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="410"/>
  <circle class="halo" cx="300" cy="200" r="160"/>
  <circle class="halo cyan" cx="640" cy="250" r="150"/>

  <rect class="glass-panel" x="16" y="16" width="828" height="250" rx="18"/>
  <text class="ttl" x="38" y="42">Sensing</text>

  <!-- Sensor inputs -->
  <rect class="box muted" x="38" y="60" width="124" height="44" rx="12"/>
  <circle class="icon-bg" cx="60" cy="82" r="14"/>
  <path class="icon-line" d="M51 85 V81 L55 80 L58 76 H64 L67 80 L69 81 V85 Z"/>
  <circle class="icon-dot" cx="55" cy="86" r="2"/>
  <circle class="icon-dot" cx="65" cy="86" r="2"/>
  <text class="lbl" x="118" y="82" text-anchor="middle" dominant-baseline="central">Vehicle</text>

  <rect class="box muted" x="170" y="60" width="124" height="44" rx="12"/>
  <circle class="icon-bg" cx="192" cy="82" r="14"/>
  <circle class="icon-line" cx="192" cy="82" r="3.5"/>
  <path class="icon-line" d="M184 82 H200"/>
  <rect class="icon-dot" x="181" y="78" width="4" height="8" rx="1"/>
  <rect class="icon-dot" x="199" y="78" width="4" height="8" rx="1"/>
  <text class="lbl" x="250" y="82" text-anchor="middle" dominant-baseline="central">GNSS/INS</text>

  <rect class="box muted" x="302" y="60" width="124" height="44" rx="12"/>
  <circle class="icon-bg" cx="324" cy="82" r="14"/>
  <path class="icon-line" d="M321 85 V74 M321 85 H332 M321 85 L316 90"/>
  <text class="lbl" x="382" y="82" text-anchor="middle" dominant-baseline="central">IMU</text>

  <rect class="box muted" x="434" y="60" width="124" height="44" rx="12"/>
  <circle class="icon-bg" cx="456" cy="82" r="14"/>
  <circle class="icon-line" cx="456" cy="82" r="7"/>
  <path class="icon-line" d="M456 82 L461 77"/>
  <circle class="icon-dot" cx="456" cy="82" r="2.2"/>
  <text class="lbl" x="514" y="82" text-anchor="middle" dominant-baseline="central">LiDAR</text>

  <rect class="box muted" x="566" y="60" width="124" height="44" rx="12"/>
  <circle class="icon-bg" cx="588" cy="82" r="14"/>
  <rect class="icon-line" x="580" y="77" width="16" height="11" rx="2"/>
  <circle class="icon-line" cx="588" cy="82.5" r="3"/>
  <path class="icon-line" d="M585 77 L586 75 H590 L591 77"/>
  <text class="lbl" x="646" y="82" text-anchor="middle" dominant-baseline="central">Camera</text>

  <rect class="box muted" x="698" y="60" width="124" height="44" rx="12"/>
  <circle class="icon-bg" cx="720" cy="82" r="14"/>
  <circle class="icon-dot" cx="715" cy="87" r="2.2"/>
  <path class="icon-line" d="M715 80 A7 7 0 0 1 722 87"/>
  <path class="icon-line" d="M715 74 A13 13 0 0 1 728 87"/>
  <text class="lbl" x="778" y="82" text-anchor="middle" dominant-baseline="central">Radar</text>

  <!-- Sensor data into the preprocessing -->
  <path class="edge" d="M100 104 V162"/>
  <path class="flow" pathLength="100" d="M100 104 V162"/>
  <path class="edge head" d="M100 104 V162"/>
  <text class="edge-lbl" x="100" y="133" text-anchor="middle" dominant-baseline="central">VelocityReport</text>
  <path class="edge" d="M232 104 V162"/>
  <path class="flow" pathLength="100" d="M232 104 V162"/>
  <path class="edge head" d="M232 104 V162"/>
  <text class="edge-lbl" x="232" y="133" text-anchor="middle" dominant-baseline="central">NavSatFix</text>
  <path class="edge" d="M364 104 V162"/>
  <path class="flow" pathLength="100" d="M364 104 V162"/>
  <path class="edge head" d="M364 104 V162"/>
  <text class="edge-lbl" x="364" y="133" text-anchor="middle" dominant-baseline="central">Imu</text>
  <path class="edge accent" d="M496 104 V162"/>
  <path class="flow flow-accent" pathLength="100" d="M496 104 V162"/>
  <path class="edge accent head" d="M496 104 V162"/>
  <text class="edge-lbl" x="496" y="133" text-anchor="middle" dominant-baseline="central">PointCloud2</text>
  <path class="edge" d="M628 104 V162"/>
  <path class="flow" pathLength="100" d="M628 104 V162"/>
  <path class="edge head" d="M628 104 V162"/>
  <text class="edge-lbl" x="628" y="133" text-anchor="middle" dominant-baseline="central">Image</text>
  <path class="edge" d="M760 104 V162"/>
  <path class="flow" pathLength="100" d="M760 104 V162"/>
  <path class="edge head" d="M760 104 V162"/>
  <text class="edge-lbl" x="760" y="124" text-anchor="middle" dominant-baseline="central">RadarScan</text>
  <text class="edge-lbl" x="760" y="142" text-anchor="middle" dominant-baseline="central">RadarTracks</text>

  <!-- Preprocessing -->
  <rect class="card" x="38" y="170" width="124" height="64" rx="12"/>
  <text class="lbl" x="100" y="192" text-anchor="middle" dominant-baseline="central">Velocity</text>
  <text class="sub" x="100" y="213" text-anchor="middle" dominant-baseline="central">converter</text>
  <rect class="card" x="170" y="170" width="124" height="64" rx="12"/>
  <text class="lbl" x="232" y="192" text-anchor="middle" dominant-baseline="central">GNSS poser</text>
  <text class="sub" x="232" y="213" text-anchor="middle" dominant-baseline="central">Fix to map pose</text>
  <rect class="card" x="302" y="170" width="124" height="64" rx="12"/>
  <text class="lbl" x="364" y="192" text-anchor="middle" dominant-baseline="central">IMU corrector</text>
  <text class="sub" x="364" y="213" text-anchor="middle" dominant-baseline="central">Gyro bias, scale</text>
  <rect class="card" x="434" y="170" width="124" height="64" rx="12"/>
  <text class="lbl" x="496" y="192" text-anchor="middle" dominant-baseline="central">Point cloud</text>
  <text class="sub" x="496" y="213" text-anchor="middle" dominant-baseline="central">preprocessor</text>
  <rect class="box ext" x="566" y="170" width="124" height="64" rx="12"/>
  <text class="lbl" x="628" y="192" text-anchor="middle" dominant-baseline="central">Pass-through</text>
  <text class="sub" x="628" y="213" text-anchor="middle" dominant-baseline="central">No sensing node</text>
  <rect class="card" x="698" y="170" width="124" height="64" rx="12"/>
  <text class="lbl" x="760" y="192" text-anchor="middle" dominant-baseline="central">Radar filters</text>
  <text class="sub" x="760" y="213" text-anchor="middle" dominant-baseline="central">Noise, conversion</text>

  <!-- Outputs to localization -->
  <path class="edge" d="M100 234 V332"/>
  <path class="flow" pathLength="100" d="M100 234 V332"/>
  <path class="edge head" d="M100 234 V332"/>
  <path class="edge" d="M232 234 V332"/>
  <path class="flow" pathLength="100" d="M232 234 V332"/>
  <path class="edge head" d="M232 234 V332"/>
  <path class="edge" d="M364 234 V332"/>
  <path class="flow" pathLength="100" d="M364 234 V332"/>
  <path class="edge head" d="M364 234 V332"/>
  <path class="edge accent" d="M470 234 V298 H420 V332"/>
  <path class="flow flow-accent" pathLength="100" d="M470 234 V298 H420 V332"/>
  <path class="edge accent head" d="M470 234 V298 H420 V332"/>
  <path class="edge dash" d="M600 234 V316 H440 V332"/>

  <!-- Outputs to perception -->
  <path class="edge accent" d="M522 234 V332"/>
  <path class="flow flow-accent" pathLength="100" d="M522 234 V332"/>
  <path class="edge accent head" d="M522 234 V332"/>
  <path class="edge" d="M640 234 V332"/>
  <path class="flow" pathLength="100" d="M640 234 V332"/>
  <path class="edge head" d="M640 234 V332"/>
  <path class="edge" d="M760 234 V332"/>
  <path class="flow" pathLength="100" d="M760 234 V332"/>
  <path class="edge head" d="M760 234 V332"/>

  <!-- Users of the sensing data -->
  <rect class="box primary" x="38" y="340" width="408" height="54" rx="12"/>
  <circle class="icon-bg on" cx="196" cy="367" r="16"/>
  <path class="icon-line" d="M196 377 L190 369 A7.5 7.5 0 1 1 202 369 Z"/>
  <circle class="icon-dot" cx="196" cy="364.5" r="2.4"/>
  <text class="lbl on-primary" x="256" y="367" text-anchor="middle" dominant-baseline="central">Localization</text>
  <rect class="box primary" x="470" y="340" width="352" height="54" rx="12"/>
  <circle class="icon-bg on" cx="600" cy="367" r="16"/>
  <path class="icon-line" d="M590 367 Q600 358 610 367 Q600 376 590 367 Z"/>
  <circle class="icon-dot" cx="600" cy="367" r="3"/>
  <text class="lbl on-primary" x="658" y="367" text-anchor="middle" dominant-baseline="central">Perception</text>
</svg>
