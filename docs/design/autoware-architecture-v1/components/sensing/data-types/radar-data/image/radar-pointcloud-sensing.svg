<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 494" role="img" aria-labelledby="radar-pointcloud-sensing-title">
  <title id="radar-pointcloud-sensing-title">
    The radar driver publishes RadarScan. The noise filter removes noise. One branch converts the scan to PointCloud2 for low-level obstacle detection. The static points filter uses the ego odometry
    and sends the dynamic points to radar detection and tracking.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} .box.ext {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-dasharray: 6 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="494"/>
  <circle class="halo" cx="190" cy="230" r="170"/>
  <circle class="halo cyan" cx="715" cy="290" r="125"/>

  <!-- Sensing -->
  <rect class="glass-panel" x="16" y="16" width="540" height="400" rx="18"/>
  <text class="ttl" x="36" y="40">Sensing</text>

  <rect class="box muted" x="40" y="56" width="250" height="44" rx="12"/>
  <circle class="icon-bg" cx="70" cy="78" r="14"/>
  <circle class="icon-dot" cx="65" cy="83" r="2.2"/>
  <path class="icon-line" d="M65 76 A7 7 0 0 1 72 83"/>
  <path class="icon-line" d="M65 70 A13 13 0 0 1 78 83"/>
  <text class="lbl" x="165" y="78" text-anchor="middle" dominant-baseline="central">Radar device</text>

  <path class="edge" d="M165 100 V128"/>
  <path class="flow" pathLength="100" d="M165 100 V128"/>
  <path class="edge head" d="M165 100 V128"/>
  <text class="sub" x="178" y="114" dominant-baseline="central">CAN, CAN-FD, or Ethernet</text>

  <rect class="card" x="40" y="136" width="250" height="44" rx="12"/>
  <text class="lbl" x="165" y="158" text-anchor="middle" dominant-baseline="central">Radar driver</text>

  <path class="edge accent" d="M165 180 V208"/>
  <path class="flow flow-accent" pathLength="100" d="M165 180 V208"/>
  <path class="edge accent head" d="M165 180 V208"/>
  <text class="code" x="178" y="194" dominant-baseline="central">RadarScan</text>

  <rect class="card" x="40" y="216" width="250" height="56" rx="12"/>
  <text class="lbl" x="165" y="236" text-anchor="middle" dominant-baseline="central">Noise filter</text>
  <text class="sub" x="165" y="256" text-anchor="middle" dominant-baseline="central">Amplitude, FOV, and range</text>

  <path class="edge accent" d="M165 272 V322"/>
  <path class="flow flow-accent" pathLength="100" d="M165 272 V322"/>
  <path class="edge accent head" d="M165 272 V322"/>
  <text class="code" x="178" y="297" dominant-baseline="central">RadarScan</text>

  <rect class="card" x="40" y="330" width="250" height="56" rx="12"/>
  <text class="lbl" x="165" y="350" text-anchor="middle" dominant-baseline="central">Static points filter</text>
  <text class="sub" x="165" y="370" text-anchor="middle" dominant-baseline="central">Doppler velocity and ego motion</text>

  <path class="edge accent" d="M290 244 H312"/>
  <path class="flow flow-accent" pathLength="100" d="M290 244 H312"/>
  <path class="edge accent head" d="M290 244 H312"/>
  <rect class="card" x="320" y="216" width="210" height="56" rx="12"/>
  <text class="lbl" x="425" y="236" text-anchor="middle" dominant-baseline="central">Scan to PointCloud2</text>
  <text class="sub" x="425" y="256" text-anchor="middle" dominant-baseline="central">Amplitude, Doppler as intensity</text>

  <!-- Ego odometry from localization -->
  <rect class="box muted" x="40" y="436" width="250" height="44" rx="12"/>
  <text class="code" x="165" y="458" text-anchor="middle" dominant-baseline="central">/localization/kinematic_state</text>
  <path class="edge" d="M165 436 V394"/>
  <path class="flow" pathLength="100" d="M165 436 V394"/>
  <path class="edge head" d="M165 436 V394"/>
  <text class="sub" x="178" y="424" dominant-baseline="central">Odometry</text>

  <!-- Perception -->
  <rect class="glass-panel" x="586" y="16" width="258" height="400" rx="18"/>
  <text class="ttl" x="606" y="40">Perception</text>

  <rect class="card" x="606" y="216" width="218" height="56" rx="12"/>
  <text class="lbl" x="715" y="236" text-anchor="middle" dominant-baseline="central">Low-level obstacle detection</text>
  <text class="sub" x="715" y="256" text-anchor="middle" dominant-baseline="central">e.g. ground segmentation</text>

  <rect class="box ext" x="606" y="330" width="218" height="56" rx="12"/>
  <text class="lbl" x="715" y="350" text-anchor="middle" dominant-baseline="central">Radar detection</text>
  <text class="sub" x="715" y="370" text-anchor="middle" dominant-baseline="central">and tracking from scans</text>

  <path class="edge" d="M530 244 H598"/>
  <path class="flow" pathLength="100" d="M530 244 H598"/>
  <path class="edge head" d="M530 244 H598"/>
  <text class="edge-lbl" x="568" y="228" text-anchor="middle" dominant-baseline="central">PointCloud2</text>

  <path class="edge accent" d="M290 358 H598"/>
  <path class="flow flow-accent" pathLength="100" d="M290 358 H598"/>
  <path class="edge accent head" d="M290 358 H598"/>
  <text class="edge-lbl" x="430" y="342" text-anchor="middle" dominant-baseline="central">RadarScan (dynamic points)</text>
</svg>
