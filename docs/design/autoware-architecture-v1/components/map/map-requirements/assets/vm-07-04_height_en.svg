<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="vm-07-04_height_en-title">
  <title id="vm-07-04_height_en-title">
    A point on the terrain surface. Its ellipsoidal height is the distance down to the WGS84 ellipsoid surface. Its orthometric height is the distance down to the geoid.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.both {
  marker-start: url("#aw-arrow");
} .edge.accent.both {
  marker-start: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .edge.plain {
  marker-end: none;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
  </defs>

  <!-- Surfaces -->
  <path class="edge plain" d="M30 160 C120 90 200 120 260 100 C320 80 380 140 420 130 C470 118 520 70 600 80 C680 90 720 160 830 200"/>
  <text class="note" x="720" y="120" dominant-baseline="central">Terrain surface</text>

  <path class="edge plain dash" d="M30 300 C150 250 260 230 380 236 C500 242 600 210 700 226 C760 236 800 260 830 280"/>
  <text class="note" x="660" y="196" dominant-baseline="central">Geoid</text>

  <path class="bound" d="M30 380 Q430 210 830 380"/>
  <text class="note" x="430" y="330" text-anchor="middle" dominant-baseline="central">Ellipsoid surface (WGS84)</text>

  <!-- The point and its heights -->
  <circle class="bound point" cx="420" cy="130" r="6"/>
  <text class="note" x="420" y="108" text-anchor="middle" dominant-baseline="central">Point</text>

  <path class="edge accent both" d="M432 140 V290"/>
  <text class="edge-lbl" x="440" y="270" dominant-baseline="central">Ellipsoidal height (use this)</text>

  <path class="edge both" d="M408 140 V232"/>
  <text class="edge-lbl" x="400" y="186" text-anchor="end" dominant-baseline="central">Orthometric height (do not use)</text>
</svg>
