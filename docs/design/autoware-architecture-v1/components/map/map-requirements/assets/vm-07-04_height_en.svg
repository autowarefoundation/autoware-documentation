<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="vm-07-04_height_en-title">
  <title id="vm-07-04_height_en-title">A point on the terrain surface. Its ellipsoidal height is the distance down to the WGS84 ellipsoid surface. Its orthometric height is the distance down to the geoid.</title>

  <!-- Surfaces -->
  <path class="edge plain" d="M30 160 C120 90 200 120 260 100 C320 80 380 140 420 130 C470 118 520 70 600 80 C680 90 720 160 830 200"/>
  <text class="note" x="720" y="120" dominant-baseline="central">Terrain surface</text>

  <path class="edge plain dash" d="M30 300 C150 250 260 230 380 236 C500 242 600 210 700 226 C760 236 800 260 830 280"/>
  <text class="note" x="660" y="196" dominant-baseline="central">Geoid</text>

  <path class="bound" d="M30 380 Q430 210 830 380"/>
  <text class="note" x="430" y="330" text-anchor="middle" dominant-baseline="central">Ellipsoid surface (WGS84)</text>

  <!-- The point and its heights -->
  <circle class="bound point" cx="420" cy="130" r="6"/>
  <text class="note" x="432" y="112" dominant-baseline="central">Point</text>

  <path class="edge accent both" d="M432 140 V290"/>
  <text class="edge-lbl" x="440" y="270" dominant-baseline="central">Ellipsoidal height (use this)</text>

  <path class="edge both" d="M408 140 V232"/>
  <text class="edge-lbl" x="400" y="186" text-anchor="end" dominant-baseline="central">Orthometric height</text>
</svg>
