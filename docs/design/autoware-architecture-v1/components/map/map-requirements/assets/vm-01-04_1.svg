<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-04_1-title">
  <title id="vm-01-04_1-title">A road with one lane in each direction. To pass a parked vehicle, the ego vehicle moves across the road center line into the opposite lane.</title>

  <!-- Road surface and lane markings -->
  <rect class="road" x="120" y="20" width="144" height="360"/>
  <path class="mark" d="M132 20 V380"/>
  <path class="mark" d="M192 20 V380"/>
  <path class="mark" d="M252 20 V380"/>
  <path class="mark" d="M222 40 V100 M215 91 L222 100 L229 91"/>

  <!-- Parked vehicle -->
  <rect class="car other" x="144" y="180" width="22" height="40" rx="6"/>
  <rect class="glass" x="147" y="185" width="16" height="9"/>

  <!-- The ego vehicle and its path -->
  <path class="route" d="M162 318 V280 C162 250 222 250 222 220 V180 C222 150 162 150 162 120 V40"/>
  <rect class="car" x="151" y="320" width="22" height="40" rx="6"/>
  <rect class="glass" x="154" y="325" width="16" height="9"/>

  <!-- Notes -->
  <text class="note" x="106" y="204" text-anchor="end">Parked vehicle</text>
  <path class="leader" d="M110 200 L144 200"/>
  <text class="note" x="320" y="204">Path around the vehicle</text>
  <path class="leader" d="M314 200 L226 200"/>
  <text class="note" x="320" y="324">Road center line</text>
  <path class="leader" d="M314 320 L194 320"/>
</svg>
