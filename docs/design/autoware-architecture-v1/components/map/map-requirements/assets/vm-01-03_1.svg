<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="vm-01-03_1-title">
  <title id="vm-01-03_1-title">A road with two lanes in each direction. The vehicle drives in the left lane and can change to the next lane.</title>

  <!-- Road surface and lane markings -->
  <rect class="road" x="60" y="20" width="264" height="340"/>
  <path class="mark" d="M72 20 V360"/>
  <path class="mark dash" d="M132 20 V360"/>
  <path class="mark yellow" d="M192 20 V360"/>
  <path class="mark dash" d="M252 20 V360"/>
  <path class="mark" d="M312 20 V360"/>
  <path class="mark" d="M222 50 V100 M215 91 L222 100 L229 91"/>
  <path class="mark" d="M282 50 V100 M275 91 L282 100 L289 91"/>

  <!-- The ego vehicle and its path -->
  <path class="route" d="M102 288 V238 C102 208 162 208 162 178 V60"/>
  <path class="flow flow-route" d="M102 288 V238 C102 208 162 208 162 178 V60" pathLength="100"/>
  <path class="route head" d="M102 288 V238 C102 208 162 208 162 178 V60"/>
  <g transform="translate(91 290)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>

  <!-- Notes -->
  <text class="note" x="380" y="214">The vehicle can change lanes,</text>
  <text class="note" x="380" y="232">avoid obstacles, and drive out</text>
  <text class="note" x="380" y="250">of its lane in a curve.</text>
</svg>
