<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="vm-01-06_2-title">
  <title id="vm-01-06_2-title">Close-up of a dashed road center line. The linestring is in the middle of the marking.</title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.thick {
  stroke-width: 7;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.good {
  fill: var(--aw-c-green);
}
  </style>

  <!-- Close-up of the road center line -->
  <rect class="road" x="100" y="20" width="280" height="300"/>
  <path class="mark thick" d="M234 20 V90"/>
  <path class="mark thick" d="M240 20 V90"/>
  <path class="mark thick" d="M246 20 V90"/>
  <path class="mark thick" d="M234 130 V200"/>
  <path class="mark thick" d="M240 130 V200"/>
  <path class="mark thick" d="M246 130 V200"/>
  <path class="mark thick" d="M234 240 V310"/>
  <path class="mark thick" d="M240 240 V310"/>
  <path class="mark thick" d="M246 240 V310"/>

  <!-- The linestring -->
  <path class="bound" d="M240 20 L240 120 L240 220 L240 320"/>
  <circle class="bound point" cx="240" cy="20" r="3.5"/>
  <circle class="bound point" cx="240" cy="120" r="3.5"/>
  <circle class="bound point" cx="240" cy="220" r="3.5"/>
  <circle class="bound point" cx="240" cy="320" r="3.5"/>

  <!-- Notes -->
  <text class="note good" x="420" y="104">The linestring is in the</text>
  <text class="note good" x="420" y="122">middle of the marking.</text>
  <path class="leader" d="M414 100 L244 120"/>
</svg>
