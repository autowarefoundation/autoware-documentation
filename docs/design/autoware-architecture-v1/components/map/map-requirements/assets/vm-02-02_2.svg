<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-labelledby="vm-02-02_2-title">
  <title id="vm-02-02_2-title">
    The road lanelet refers to a traffic_sign regulatory element. The regulatory element refers to a stop_line linestring next to the sign and to a traffic_sign linestring with the subtype stop_sign.
  </title>

  <!-- Road: two lanes, left-hand traffic, the lanelet is the upper lane (traffic to the right) -->
  <rect class="road" x="20" y="120" width="820" height="120"/>
  <path class="mark" d="M20 124 H840"/>
  <path class="mark" d="M20 236 H840"/>
  <path class="mark dash" d="M20 180 H840"/>
  <rect class="lanelet" x="20" y="127" width="820" height="50"/>

  <!-- The stop line linestring (no painted line) -->
  <path class="bound" d="M600 127 V177"/>
  <circle class="bound point" cx="600" cy="127" r="4"/>
  <circle class="bound point" cx="600" cy="177" r="4"/>

  <!-- The stop sign and its linestring -->
  <circle class="sign" cx="660" cy="56" r="28"/>
  <text class="sign-text" x="660" y="56" text-anchor="middle" dominant-baseline="central">STOP</text>
  <path class="bound" d="M636 98 H684"/>
  <circle class="bound point" cx="636" cy="98" r="4"/>
  <circle class="bound point" cx="684" cy="98" r="4"/>

  <!-- Notes on the linestrings -->
  <path class="leader" d="M560 60 L598 121"/>
  <text class="note" x="440" y="40" dominant-baseline="central">Linestring</text>
  <text class="code" x="440" y="60" dominant-baseline="central">type: stop_line</text>

  <path class="leader" d="M716 52 L688 94"/>
  <text class="note" x="722" y="40" dominant-baseline="central">Linestring</text>
  <text class="code" x="722" y="60" dominant-baseline="central">type: traffic_sign</text>
  <text class="code" x="722" y="78" dominant-baseline="central">subtype: stop_sign</text>

  <!-- The lanelet -->
  <rect class="box" x="20" y="290" width="180" height="64" rx="10"/>
  <text class="lbl" x="110" y="312" text-anchor="middle" dominant-baseline="central">Lanelet</text>
  <text class="code" x="110" y="334" text-anchor="middle" dominant-baseline="central">subtype: road</text>
  <path class="leader" d="M110 290 V152"/>

  <!-- The regulatory element -->
  <rect class="box primary" x="350" y="290" width="240" height="64" rx="10"/>
  <text class="lbl on-primary" x="470" y="312" text-anchor="middle" dominant-baseline="central">Regulatory element</text>
  <text class="code on-primary" x="470" y="334" text-anchor="middle" dominant-baseline="central">subtype: traffic_sign</text>

  <path class="edge" d="M200 322 H342"/>
  <text class="edge-lbl" x="271" y="322" text-anchor="middle" dominant-baseline="central">regulatory_element</text>
  <path class="edge" d="M520 290 L594 184"/>
  <text class="edge-lbl" x="550" y="248" text-anchor="middle" dominant-baseline="central">ref_line</text>
  <path class="edge" d="M590 306 C680 280 680 150 646 104"/>
  <text class="edge-lbl" x="672" y="268" text-anchor="middle" dominant-baseline="central">refers</text>
</svg>
