<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="vm-06-01_3-title">
  <title id="vm-06-01_3-title">
    Left: a hatched_road_markings polygon covers a buffer zone and shares points with the lanes next to it. Right: at an intersection, the hatched_road_markings polygons at the ends of the median
    strip overlap the intersection_area polygon.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-green: #00e678; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .road {
  fill: #5c6070;
} .shoulder {
  fill: #8d91a0;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .area {
  fill: color-mix(in srgb, var(--aw-green) 25%, transparent);
  stroke: var(--aw-c-green);
  stroke-width: 2;
  stroke-dasharray: 6 4;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>

  <!-- Left: a buffer zone on a straight road -->
  <rect class="road" x="20" y="150" width="300" height="180"/>
  <path class="mark" d="M20 154 H320"/>
  <path class="mark" d="M20 326 H320"/>
  <path class="mark" d="M20 210 H90"/>
  <path class="mark" d="M230 270 H320"/>
  <path class="mark" d="M90 210 H150 L230 270 H170 Z"/>
  <path class="mark" d="M110 210 L190 270 M130 210 L210 270"/>
  <path class="area" d="M90 210 H150 L230 270 H170 Z"/>

  <path class="leader" d="M150 80 L160 234"/>
  <text class="note" x="40" y="50" dominant-baseline="central">Polygon</text>
  <text class="code" x="40" y="70" dominant-baseline="central">type: hatched_road_markings</text>

  <!-- Right: an intersection with a median strip -->
  <rect class="road" x="520" y="20" width="120" height="420"/>
  <rect class="road" x="360" y="170" width="460" height="120"/>
  <rect class="shoulder" x="576" y="20" width="8" height="130"/>
  <rect class="shoulder" x="576" y="310" width="8" height="130"/>
  <path class="mark dash" d="M360 230 H490 M670 230 H820"/>

  <!-- The intersection area -->
  <path class="bound" d="M520 160 H640 V170 H690 V290 H640 V300 H520 V290 H470 V170 H520 Z"/>

  <!-- The hatched markings at the ends of the median strip -->
  <rect class="mark" x="572" y="150" width="16" height="40" rx="8"/>
  <rect class="mark" x="572" y="270" width="16" height="40" rx="8"/>
  <path class="mark" style="stroke-width: 2" d="M573 167 L587 159 M573 175 L587 167 M573 183 L587 175"/>
  <path class="mark" style="stroke-width: 2" d="M573 287 L587 279 M573 295 L587 287 M573 303 L587 295"/>
  <rect class="area" x="568" y="146" width="24" height="48" rx="10"/>
  <rect class="area" x="568" y="266" width="24" height="48" rx="10"/>

  <path class="leader" d="M700 76 L596 162"/>
  <path class="leader" d="M700 76 L596 284"/>
  <text class="note" x="660" y="40" dominant-baseline="central">Polygon</text>
  <text class="code" x="660" y="60" dominant-baseline="central">type: hatched_road_markings</text>

  <path class="leader" d="M420 380 L478 292"/>
  <text class="note" x="340" y="394" dominant-baseline="central">Polygon</text>
  <text class="code" x="340" y="414" dominant-baseline="central">type: intersection_area</text>

  <path class="leader" d="M700 394 L583 380"/>
  <text class="note" x="706" y="394" dominant-baseline="central">Median strip</text>
</svg>
