<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="vm-06-01_3-title">
  <title id="vm-06-01_3-title">Left: a hatched_road_markings polygon covers a buffer zone and shares points with the lanes next to it. Right: at an intersection, the hatched_road_markings polygons at the ends of the median strip overlap the intersection_area polygon.</title>

  <!-- Left: a buffer zone on a straight road -->
  <rect class="road" x="20" y="150" width="300" height="180"/>
  <path class="mark" d="M20 154 H320"/>
  <path class="mark" d="M20 326 H320"/>
  <path class="mark" d="M20 210 H90"/>
  <path class="mark" d="M230 270 H320"/>
  <path class="mark" d="M90 210 H150 L230 270 H170 Z"/>
  <path class="mark" d="M110 210 L190 270 M130 210 L210 270"/>
  <path class="area" d="M90 210 H150 L230 270 H170 Z"/>

  <path class="leader" d="M150 80 L160 234"/>
  <text class="note" x="40" y="50" dominant-baseline="central">Polygon</text>
  <text class="code" x="40" y="70" dominant-baseline="central">type: hatched_road_markings</text>

  <!-- Right: an intersection with a median strip -->
  <rect class="road" x="520" y="20" width="120" height="420"/>
  <rect class="road" x="360" y="170" width="460" height="120"/>
  <rect class="shoulder" x="576" y="20" width="8" height="130"/>
  <rect class="shoulder" x="576" y="310" width="8" height="130"/>
  <path class="mark dash" d="M360 230 H490 M670 230 H820"/>

  <!-- The intersection area -->
  <path class="bound" d="M510 160 H650 V180 H690 V280 H650 V300 H510 V280 H470 V180 H510 Z"/>

  <!-- The hatched markings at the ends of the median strip -->
  <rect class="mark yellow" x="572" y="150" width="16" height="40" rx="8"/>
  <rect class="mark yellow" x="572" y="270" width="16" height="40" rx="8"/>
  <rect class="area" x="568" y="146" width="24" height="48" rx="10"/>
  <rect class="area" x="568" y="266" width="24" height="48" rx="10"/>

  <path class="leader" d="M700 76 L596 162"/>
  <path class="leader" d="M700 76 L596 284"/>
  <text class="note" x="660" y="40" dominant-baseline="central">Polygon</text>
  <text class="code" x="660" y="60" dominant-baseline="central">type: hatched_road_markings</text>

  <path class="leader" d="M420 380 L480 284"/>
  <text class="note" x="340" y="394" dominant-baseline="central">Polygon</text>
  <text class="code" x="340" y="414" dominant-baseline="central">type: intersection_area</text>

  <path class="leader" d="M700 394 L588 380"/>
  <text class="note" x="706" y="394" dominant-baseline="central">Median strip</text>
</svg>
