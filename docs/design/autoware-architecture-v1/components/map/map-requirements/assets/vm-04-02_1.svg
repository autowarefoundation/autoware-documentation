<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-labelledby="vm-04-02_1-title">
  <title id="vm-04-02_1-title">
    Front view of a horizontal and a vertical traffic light. The traffic_light linestring runs along the bottom edge from the left end (point 1) to the right end (point 2). The subtype is
    red_yellow_green. The height tag gives the size of the light. The points have the real 3D position of the light.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.both {
  marker-start: url("#aw-arrow");
} .sidewalk {
  fill: #b9bcc8;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .light-housing {
  fill: #1b1d29;
  stroke: #8d91a0;
  stroke-width: 1.5;
} .light-red {
  fill: #ff3b4e;
} .light-yellow {
  fill: #ffc233;
} .light-green {
  fill: #00e678;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
  </defs>

  <!-- Horizontal traffic light -->
  <rect class="light-housing" x="220" y="70" width="170" height="70" rx="10"/>
  <circle class="light-red" cx="260" cy="105" r="22"/>
  <circle class="light-yellow" cx="305" cy="105" r="22"/>
  <circle class="light-green" cx="350" cy="105" r="22"/>
  <path class="bound" d="M220 140 H390"/>
  <circle class="bound point" cx="220" cy="140" r="5"/>
  <circle class="bound point" cx="390" cy="140" r="5"/>
  <text class="sub" x="214" y="156" text-anchor="end" dominant-baseline="central">1</text>
  <text class="sub" x="396" y="156" dominant-baseline="central">2</text>

  <path class="edge both" d="M196 74 V136"/>
  <text class="edge-lbl" x="188" y="105" text-anchor="end" dominant-baseline="central">height</text>

  <!-- The position of point 1 above the ground -->
  <rect class="sidewalk" x="150" y="330" width="140" height="14"/>
  <text class="sub" x="300" y="337" dominant-baseline="central">ground</text>
  <path class="edge both" d="M220 148 V326"/>
  <text class="note" x="30" y="236" dominant-baseline="central">Give the points</text>
  <text class="note" x="30" y="254" dominant-baseline="central">their real 3D position</text>
  <path class="leader" d="M172 245 H216"/>

  <text class="note" x="30" y="168" dominant-baseline="central">Start point: left end</text>
  <path class="leader" d="M160 168 L214 144"/>
  <text class="note" x="420" y="78" dominant-baseline="central">End point: right end</text>
  <path class="leader" d="M440 88 L394 136"/>

  <path class="leader" d="M300 144 L310 196"/>
  <text class="note" x="310" y="208" dominant-baseline="central">Linestring</text>
  <text class="code" x="310" y="228" dominant-baseline="central">points: 1-2</text>
  <text class="code" x="310" y="246" dominant-baseline="central">type: traffic_light</text>
  <text class="code" x="310" y="264" dominant-baseline="central">subtype: red_yellow_green</text>
  <text class="code" x="310" y="282" dominant-baseline="central">height: 0.5</text>

  <!-- Vertical traffic light -->
  <rect class="light-housing" x="640" y="30" width="70" height="170" rx="10"/>
  <circle class="light-red" cx="675" cy="70" r="22"/>
  <circle class="light-yellow" cx="675" cy="115" r="22"/>
  <circle class="light-green" cx="675" cy="160" r="22"/>
  <path class="bound" d="M640 200 H710"/>
  <circle class="bound point" cx="640" cy="200" r="5"/>
  <circle class="bound point" cx="710" cy="200" r="5"/>
  <text class="sub" x="634" y="216" text-anchor="end" dominant-baseline="central">1</text>
  <text class="sub" x="716" y="216" dominant-baseline="central">2</text>

  <path class="edge both" d="M616 34 V196"/>
  <text class="edge-lbl" x="608" y="115" text-anchor="end" dominant-baseline="central">height</text>

  <path class="leader" d="M675 204 L675 252"/>
  <text class="note" x="640" y="264" dominant-baseline="central">Linestring</text>
  <text class="code" x="640" y="284" dominant-baseline="central">points: 1-2</text>
  <text class="code" x="640" y="302" dominant-baseline="central">type: traffic_light</text>
  <text class="code" x="640" y="320" dominant-baseline="central">subtype: red_yellow_green</text>
  <text class="code" x="640" y="338" dominant-baseline="central">height: 1.2</text>
</svg>
