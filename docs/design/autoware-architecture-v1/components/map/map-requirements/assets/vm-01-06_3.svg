<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="vm-01-06_3-title">
  <title id="vm-01-06_3-title">Incorrect: close-up of a dashed road center line. The linestring is at the edge of the marking, not in the middle.</title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.thick {
  stroke-width: 7;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
}
  </style>

  <!-- Close-up of the road center line -->
  <rect class="road" x="100" y="20" width="280" height="300"/>
  <path class="mark thick" d="M234 20 V90"/>
  <path class="mark thick" d="M240 20 V90"/>
  <path class="mark thick" d="M246 20 V90"/>
  <path class="mark thick" d="M234 130 V200"/>
  <path class="mark thick" d="M240 130 V200"/>
  <path class="mark thick" d="M246 130 V200"/>
  <path class="mark thick" d="M234 240 V310"/>
  <path class="mark thick" d="M240 240 V310"/>
  <path class="mark thick" d="M246 240 V310"/>

  <!-- The linestring -->
  <path class="bound alt" d="M230 20 L230 120 L230 220 L230 320"/>
  <circle class="bound point" cx="230" cy="20" r="3.5"/>
  <circle class="bound point" cx="230" cy="120" r="3.5"/>
  <circle class="bound point" cx="230" cy="220" r="3.5"/>
  <circle class="bound point" cx="230" cy="320" r="3.5"/>

  <!-- Notes -->
  <text class="note bad" x="420" y="104">The linestring is not in the</text>
  <text class="note bad" x="420" y="122">middle of the marking.</text>
  <path class="leader" d="M414 100 L252 120"/>
</svg>
