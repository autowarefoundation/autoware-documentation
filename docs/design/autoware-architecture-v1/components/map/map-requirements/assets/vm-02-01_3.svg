<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="vm-02-01_3-title">
  <title id="vm-02-01_3-title">Incorrect: the stop_line linestring lies in the middle of the white stop line, not on its near edge.</title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-flow-tone: 22%; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .aw-d-arrow--route {
  fill: var(--aw-c-green);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .route {
  fill: none;
  stroke: var(--aw-c-green);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  marker-end: url("#aw-arrow-route");
} .route.plain {
  marker-end: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-route {
  stroke: color-mix(in srgb, var(--aw-c-green) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow-route" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--route" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
  </defs>

  <!-- Road: two lanes, left-hand traffic, the vehicle drives to the right in the upper lane -->
  <rect class="road" x="20" y="80" width="720" height="120"/>
  <path class="mark" d="M20 84 H740"/>
  <path class="mark" d="M20 196 H740"/>
  <path class="mark dash" d="M20 140 H740"/>
  <path class="route plain" d="M300 110 H420"/>
  <path class="route" d="M420 110 H440"/>
  <path class="flow flow-route" pathLength="100" d="M420 110 H440"/>
  <path class="route head" d="M420 110 H440"/>

  <!-- The painted stop line and the linestring in its middle -->
  <path class="mark thick" d="M484 86 V138 M491 86 V138"/>
  <path class="bound alt" d="M487.5 86 V138"/>
  <circle class="bound point" cx="487.5" cy="86" r="4"/>
  <circle class="bound point" cx="487.5" cy="138" r="4"/>

  <!-- Notes -->
  <path class="leader" d="M560 34 L491 82"/>
  <text class="note" x="566" y="34" dominant-baseline="central">Linestring</text>
  <text class="code" x="566" y="54" dominant-baseline="central">type: stop_line</text>
  <text class="note bad" x="566" y="224" dominant-baseline="central">In the middle of the white line</text>
  <path class="leader" d="M560 224 L491 140"/>
</svg>
