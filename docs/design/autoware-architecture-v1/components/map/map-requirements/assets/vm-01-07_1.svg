<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-07_1-title">
  <title id="vm-01-07_1-title">A one-lane road with wide edge lines on both sides. The ego vehicle drives between them.</title>

  <!-- Road surface and wide edge lines -->
  <rect class="road" x="140" y="20" width="240" height="360"/>
  <path class="mark thick" d="M166 20 V380"/>
  <path class="mark thick" d="M172 20 V380"/>
  <path class="mark thick" d="M178 20 V380"/>
  <path class="mark thick" d="M342 20 V380"/>
  <path class="mark thick" d="M348 20 V380"/>
  <path class="mark thick" d="M354 20 V380"/>

  <!-- The ego vehicle and its path -->
  <path class="route" d="M260 308 V160"/>
  <rect class="car" x="249" y="310" width="22" height="40" rx="6"/>
  <rect class="glass" x="252" y="315" width="16" height="9"/>

  <!-- Notes -->
  <text class="note" x="400" y="104">Edge lines</text>
  <path class="leader" d="M394 100 L358 100"/>
</svg>
