<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="vm-02-01_1-title">
  <title id="vm-02-01_1-title">A vehicle drives on a two-lane road toward a white stop line that crosses its lane.</title>

  <!-- Road: two lanes, left-hand traffic, the ego vehicle drives to the right in the upper lane -->
  <rect class="road" x="20" y="80" width="720" height="120"/>
  <path class="mark" d="M20 84 H740"/>
  <path class="mark" d="M20 196 H740"/>
  <path class="mark dash" d="M20 140 H740"/>

  <!-- The painted stop line -->
  <path class="mark thick" d="M484 86 V138 M491 86 V138"/>

  <!-- The ego vehicle -->
  <g transform="translate(329 90) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <path class="route" d="M372 110 H448"/>
  <path class="flow flow-route" pathLength="100" d="M372 110 H448"/>
  <path class="route head" d="M372 110 H448"/>

  <!-- Note -->
  <path class="leader" d="M560 40 L494 84"/>
  <text class="note" x="566" y="40" dominant-baseline="central">Stop line</text>
</svg>
