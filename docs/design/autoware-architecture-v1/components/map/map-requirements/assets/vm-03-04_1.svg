  <path class="mark thick" d="M398 140 L398 108"/>
  <path class="mark thick" d="M386 140 L386 108"/>
  <path class="mark thick" d="M374 140 L374 108"/>
  <path class="mark thick" d="M362 140 L362 108"/>
  <path class="mark thick" d="M350 140 L350 108"/>
  <path class="mark thick" d="M338 140 L338 108"/>
  <path class="mark thick" d="M326 140 L326 108"/>
  <path class="mark thick" d="M450 264 L482 264"/>
  <path class="mark thick" d="M450 252 L482 252"/>
  <path class="mark thick" d="M450 240 L482 240"/>
  <path class="mark thick" d="M450 228 L482 228"/>
  <path class="mark thick" d="M450 216 L482 216"/>
  <path class="mark thick" d="M450 204 L482 204"/>
  <path class="mark thick" d="M450 192 L482 192"/>
  <path class="mark thick" d="M450 180 L482 180"/>
  <path class="mark thick" d="M450 168 L482 168"/>
  <path class="mark thick" d="M450 156 L482 156"/>

