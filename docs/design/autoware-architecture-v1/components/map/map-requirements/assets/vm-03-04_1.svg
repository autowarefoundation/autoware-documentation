  <rect class="light-housing" x="254" y="309" width="40" height="14" rx="4"/>
  <circle class="light-red" cx="262" cy="316" r="4.5"/>
  <circle class="light-yellow" cx="274" cy="316" r="4.5"/>
  <circle class="light-green" cx="286" cy="316" r="4.5"/>
  <rect class="light-housing" x="267" y="84" width="14" height="40" rx="4"/>
