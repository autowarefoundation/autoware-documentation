  <path class="lanelet" d="M320 322 L380 322 L380 440 L320 440 Z"/>
  <path class="lanelet" d="M380 322 L440 322 L440 440 L380 440 Z"/>
  <path class="lanelet" d="M268 150 L268 210 L190 210 L190 150 Z"/>
