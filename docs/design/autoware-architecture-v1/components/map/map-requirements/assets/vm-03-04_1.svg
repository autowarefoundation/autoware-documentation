  <path class="bound" fill="none" d="M440 98 A52 52 0 0 0 492 150 L492 210 A112 112 0 0 1 380 98 Z"/>
  <path class="bound" fill="none" d="M440 98 A172 172 0 0 1 268 270 L268 210 A112 112 0 0 0 380 98 Z"/>
  <path class="bound" fill="none" d="M492 270 L268 270 L268 210 L492 210 Z"/>
  <path class="bound" fill="none" d="M492 270 A52 52 0 0 0 440 322 L380 322 A112 112 0 0 1 492 210 Z"/>
  <path class="bound" fill="none" d="M492 270 A172 172 0 0 1 320 98 L380 98 A112 112 0 0 0 492 210 Z"/>

  <!-- The ego vehicle and its route -->
  <g transform="translate(339 334)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
