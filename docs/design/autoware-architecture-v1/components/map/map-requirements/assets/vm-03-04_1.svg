  <path class="mark dash" d="M380 362 L380 440"/>
  <path class="mark" d="M380 322 L380 362"/>
  <path class="mark thick" d="M320 322 L380 322"/>
  <path class="mark dash" d="M228 210 L190 210"/>
  <path class="mark" d="M268 210 L228 210"/>
  <path class="mark thick" d="M268 150 L268 210"/>
  <path class="mark dash" d="M380 58 L380 20"/>
  <path class="mark" d="M380 98 L380 58"/>
