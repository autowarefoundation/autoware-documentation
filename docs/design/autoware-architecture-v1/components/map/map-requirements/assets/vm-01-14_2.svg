<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-14_2-title">
  <title id="vm-01-14_2-title">Two lanelets in opposite directions lie on top of each other on the narrow road. Both use the same two linestrings.</title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.good {
  fill: var(--aw-c-green);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>

  <!-- Road surface and lane markings -->
  <rect class="road" x="150" y="20" width="84" height="360"/>
  <path class="mark" d="M162 20 V380"/>
  <path class="mark" d="M222 20 V380"/>

  <!-- Two lanelets on the same area -->
  <rect class="lanelet" x="162" y="20" width="60" height="360"/>
  <rect class="lanelet alt" x="162" y="20" width="60" height="360"/>
  <path class="mark" d="M184 230 V170 M177 179 L184 170 L191 179"/>
  <path class="mark" d="M200 170 V230 M193 221 L200 230 L207 221"/>
  <path class="bound" d="M162 20 L162 110 L162 200 L162 290 L162 380"/>
  <circle class="bound point" cx="162" cy="20" r="3.5"/>
  <circle class="bound point" cx="162" cy="110" r="3.5"/>
  <circle class="bound point" cx="162" cy="200" r="3.5"/>
  <circle class="bound point" cx="162" cy="290" r="3.5"/>
  <circle class="bound point" cx="162" cy="380" r="3.5"/>
  <path class="bound" d="M222 20 L222 110 L222 200 L222 290 L222 380"/>
  <circle class="bound point" cx="222" cy="20" r="3.5"/>
  <circle class="bound point" cx="222" cy="110" r="3.5"/>
  <circle class="bound point" cx="222" cy="200" r="3.5"/>
  <circle class="bound point" cx="222" cy="290" r="3.5"/>
  <circle class="bound point" cx="222" cy="380" r="3.5"/>

  <!-- Notes -->
  <text class="note lbl" x="280" y="54">Lanelet (outward)</text>
  <text class="note code" x="280" y="72">subtype: road</text>
  <text class="note code" x="280" y="90">one_way: yes</text>
  <path class="leader" d="M274 50 L205 110"/>
  <text class="note lbl" x="280" y="154">Lanelet (return)</text>
  <text class="note code" x="280" y="172">subtype: road</text>
  <text class="note code" x="280" y="190">one_way: yes</text>
  <path class="leader" d="M274 150 L205 150"/>
  <text class="note good" x="280" y="294">Both lanelets use the same two</text>
  <text class="note good" x="280" y="312">linestrings, in opposite directions.</text>
  <path class="leader" d="M274 290 L222 290"/>
</svg>
