<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="vm-06-01_1-title">
  <title id="vm-06-01_1-title">
    A buffer zone (zebra zone) is a hatched marking on the road. Here it moves the center line of a road between two intersections, so that each direction gets an extra lane for the right turn before
    the next intersection. Traffic drives on the left.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
}
  </style>

  <!-- Road: three lanes wide, between two intersections -->
  <rect class="road" x="20" y="60" width="820" height="180"/>
  <path class="mark" d="M20 64 H840"/>
  <path class="mark" d="M20 236 H840"/>

  <!-- Crosswalks at the two intersections -->
  <path class="mark thick" d="M24 78 H56"/>
  <path class="mark thick" d="M24 94 H56"/>
  <path class="mark thick" d="M24 110 H56"/>
  <path class="mark thick" d="M24 126 H56"/>
  <path class="mark thick" d="M24 142 H56"/>
  <path class="mark thick" d="M24 158 H56"/>
  <path class="mark thick" d="M24 174 H56"/>
  <path class="mark thick" d="M24 190 H56"/>
  <path class="mark thick" d="M24 206 H56"/>
  <path class="mark thick" d="M24 222 H56"/>
  <path class="mark thick" d="M804 78 H836"/>
  <path class="mark thick" d="M804 94 H836"/>
  <path class="mark thick" d="M804 110 H836"/>
  <path class="mark thick" d="M804 126 H836"/>
  <path class="mark thick" d="M804 142 H836"/>
  <path class="mark thick" d="M804 158 H836"/>
  <path class="mark thick" d="M804 174 H836"/>
  <path class="mark thick" d="M804 190 H836"/>
  <path class="mark thick" d="M804 206 H836"/>
  <path class="mark thick" d="M804 222 H836"/>

  <!-- Stop lines: westbound lanes on the left, eastbound lanes on the right -->
  <path class="mark thick" d="M72 120 V234"/>
  <path class="mark thick" d="M788 66 V180"/>

  <!-- Center line on the left, the buffer zone, and the center line on the right -->
  <path class="mark" d="M60 120 H300"/>
  <path class="mark dash" d="M76 180 H440"/>
  <path class="mark" d="M440 180 H800"/>
  <path class="mark dash" d="M560 120 H784"/>

  <path class="mark" d="M300 120 H420 L560 180 H440 Z"/>
  <path
    class="mark"
    d="M320 120 L323.3 130 M345 120 L352.5 142.5 M370 120 L381.7 155 M395 120 L410.8 167.5 M420 120 L440 180 M449.2 132.5 L465 180 M478.3 145 L490 180 M507.5 157.5 L515 180 M536.7 170 L540 180"
  />

  <!-- Lane arrows on the left: westbound, straight or left, and right turn -->
  <path class="mark" d="M172 208 H112 M120 202 L112 208 L120 214 M148 208 H140 V222 M134 216 L140 222 L146 216"/>
  <path class="mark" d="M172 150 H138 V132 M132 138 L138 132 L144 138"/>

  <!-- Lane arrows on the right: eastbound, straight or left, and right turn -->
  <path class="mark" d="M688 92 H748 M740 86 L748 92 L740 98 M712 92 H720 V78 M714 84 L720 78 L726 84"/>
  <path class="mark" d="M688 150 H722 V168 M716 162 L722 168 L728 162"/>

  <!-- Note -->
  <path class="leader" d="M240 30 L358 128"/>
  <text class="note" x="120" y="30" dominant-baseline="central">Buffer zone</text>
</svg>
