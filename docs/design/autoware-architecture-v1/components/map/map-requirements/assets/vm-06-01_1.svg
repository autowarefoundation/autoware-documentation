<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="vm-06-01_1-title">
  <title id="vm-06-01_1-title">A buffer zone (zebra zone) is a hatched marking on the road. Here it moves the center line of the road between the turn lanes at both ends.</title>

  <!-- Road: three lanes wide -->
  <rect class="road" x="20" y="60" width="820" height="180"/>
  <path class="mark" d="M20 64 H840"/>
  <path class="mark" d="M20 236 H840"/>

  <!-- Center line on the left, the buffer zone, and the center line on the right -->
  <path class="mark" d="M20 120 H300"/>
  <path class="mark dash" d="M20 180 H440"/>
  <path class="mark" d="M440 180 H840"/>
  <path class="mark dash" d="M560 120 H840"/>

  <path class="mark" d="M300 120 H420 L560 180 H440 Z"/>
  <path class="mark" d="M328 120 L468 180 M356 120 L496 180 M384 120 L524 180"/>

  <!-- Note -->
  <path class="leader" d="M240 30 L400 140"/>
  <text class="note" x="120" y="30" dominant-baseline="central">Buffer zone</text>
</svg>
