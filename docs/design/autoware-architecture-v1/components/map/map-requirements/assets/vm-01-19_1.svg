  <!-- The ego vehicle and its path -->
  <path class="route" d="M132 394 C132 374.0 150 370.0 180 370.0 H364"/>
  <path class="flow flow-route" d="M132 394 C132 374.0 150 370.0 180 370.0 H364" pathLength="100"/>
  <path class="route head" d="M132 394 C132 374.0 150 370.0 180 370.0 H364"/>
  <g transform="translate(121 396)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>

  <!-- Notes -->
  <text class="note" x="440" y="70">Road</text>
  <path class="leader" d="M434 66 L297.8 144.6"/>
  <text class="note" x="440" y="130">Road shoulder</text>
  <path class="leader" d="M434 126 L304.8 194.1"/>
  <text class="note" x="440" y="190">Sidewalk</text>
  <path class="leader" d="M434 186 L298.5 230.2"/>
  <text class="note" x="440" y="250">Off road</text>
  <path class="leader" d="M434 246 L307.4 270.8"/>
  <text class="note" x="440" y="324">Sidewalk that the vehicle crosses</text>
  <path class="leader" d="M434 320 L253 346"/>
  <text class="note" x="440" y="426">Private area</text>
  <path class="leader" d="M434 422 L374 394"/>
