<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-03-15-3-title">
  <title id="vm-03-15-3-title">The lanelets of a road with bicycle lanes. Each bicycle lane is a bicycle_lane lanelet that shares its linestring with the road lanelet next to it.</title>

  <!-- Sidewalks and the road -->
  <rect class="sidewalk" x="360" y="20" width="30" height="360"/>
  <rect class="sidewalk" x="570" y="20" width="30" height="360"/>
  <rect class="road" x="390" y="20" width="180" height="360"/>
  <path class="mark" d="M420 20 L420 380"/>
  <path class="mark" d="M540 20 L540 380"/>
  <path class="mark dash" d="M480 20 L480 380"/>

  <!-- Lanelets -->
  <rect class="lanelet alt" x="390" y="20" width="30" height="360"/>
  <rect class="lanelet alt" x="540" y="20" width="30" height="360"/>
  <rect class="lanelet" x="420" y="20" width="60" height="360"/>
  <rect class="lanelet" x="480" y="20" width="60" height="360"/>
  <path class="bound" d="M420 20 L420 380"/>
  <path class="bound" d="M540 20 L540 380"/>

  <!-- Notes -->
  <text class="note" x="28" y="80">
    <tspan x="28">Lanelet</tspan>
    <tspan class="code" x="28" dy="17">subtype: bicycle_lane</tspan>
  </text>
  <path class="leader" d="M80.9 76 L405 80"/>
  <path class="leader" d="M80.9 76 L555 110"/>
  <text class="note" x="28" y="210">
    <tspan x="28">Lanelet</tspan>
    <tspan class="code" x="28" dy="17">subtype: road</tspan>
  </text>
  <path class="leader" d="M80.9 206 L450 210"/>
  <path class="leader" d="M80.9 206 L510 240"/>
  <text class="note" x="28" y="330">Shared linestring</text>
  <path class="leader" d="M147.9 326 L418 330"/>
</svg>
