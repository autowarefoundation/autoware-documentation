<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-06_1-title">
  <title id="vm-01-06_1-title">A road with one lane in each direction and a dashed road center line. The ego vehicle and an oncoming vehicle drive in opposite directions.</title>

  <!-- Road surface and lane markings -->
  <rect class="road" x="120" y="20" width="144" height="360"/>
  <path class="mark dash" d="M192 20 V380"/>

  <!-- Vehicles and their paths -->
  <path class="route" d="M162 308 V230"/>
  <path class="flow flow-route" d="M162 308 V230" pathLength="100"/>
  <path class="route head" d="M162 308 V230"/>
  <g transform="translate(151 310)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <path class="route" d="M222 92 V170"/>
  <path class="flow flow-route" d="M222 92 V170" pathLength="100"/>
  <path class="route head" d="M222 92 V170"/>
  <g transform="translate(211 50)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <g transform="rotate(180 11 20)">
      <rect class="car-body npc" x="0" y="0" width="22" height="40" rx="7"/>
      <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
      <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    </g>
  </g>

  <!-- Notes -->
  <text class="note" x="320" y="284">Road center line</text>
  <path class="leader" d="M314 280 L196 280"/>
</svg>
