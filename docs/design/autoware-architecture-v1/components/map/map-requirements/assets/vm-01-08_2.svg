<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="vm-01-08_2-title">
  <title id="vm-01-08_2-title">Each outer linestring is 0.5 m inside the road edge, because the road has no lines on its outer sides.</title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.good {
  fill: var(--aw-c-green);
}
  </style>

  <!-- Road surface and lane markings -->
  <rect class="road" x="120" y="20" width="144" height="360"/>
  <path class="mark dash" d="M192 20 V380"/>

  <!-- Linestrings, 0.5 m from the road edges -->
  <path class="bound" d="M134 20 L134 110 L134 200 L134 290 L134 380"/>
  <circle class="bound point" cx="134" cy="20" r="3.5"/>
  <circle class="bound point" cx="134" cy="110" r="3.5"/>
  <circle class="bound point" cx="134" cy="200" r="3.5"/>
  <circle class="bound point" cx="134" cy="290" r="3.5"/>
  <circle class="bound point" cx="134" cy="380" r="3.5"/>
  <path class="bound" d="M250 20 L250 110 L250 200 L250 290 L250 380"/>
  <circle class="bound point" cx="250" cy="20" r="3.5"/>
  <circle class="bound point" cx="250" cy="110" r="3.5"/>
  <circle class="bound point" cx="250" cy="200" r="3.5"/>
  <circle class="bound point" cx="250" cy="290" r="3.5"/>
  <circle class="bound point" cx="250" cy="380" r="3.5"/>

  <!-- Dimensions -->
  <path class="leader" d="M120 384 L120 402"/>
  <path class="leader" d="M134 384 L134 402"/>
  <path class="leader" d="M120 396 L134 396"/>
  <text class="note" x="127" y="422" text-anchor="middle">0.5 m</text>
  <path class="leader" d="M250 384 L250 402"/>
  <path class="leader" d="M264 384 L264 402"/>
  <path class="leader" d="M250 396 L264 396"/>
  <text class="note" x="257" y="422" text-anchor="middle">0.5 m</text>

  <!-- Notes -->
  <text class="note good" x="320" y="204">Each linestring is 0.5 m</text>
  <text class="note good" x="320" y="222">inside the road edge.</text>
  <path class="leader" d="M314 200 L250 200"/>
</svg>
