<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="vm-06-05_1-title">
  <title id="vm-06-05_1-title">
    A road lanelet ends at a stop line before a T-junction. It refers to a detection_area regulatory element. The regulatory element refers to the stop_line linestring as ref_line and to a
    detection_area polygon on the crossing road as refers.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-green: #00e678; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .on-primary {
  fill: #fff;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.dash {
  stroke-dasharray: 6 5;
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .area {
  fill: color-mix(in srgb, var(--aw-green) 25%, transparent);
  stroke: var(--aw-c-green);
  stroke-width: 2;
  stroke-dasharray: 6 4;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
  </defs>

  <!-- Roads: a road from the left meets a north-south road -->
  <rect class="road" x="300" y="20" width="120" height="420"/>
  <rect class="road" x="20" y="200" width="282" height="120"/>
  <path class="mark" d="M20 204 H304 V20"/>
  <path class="mark" d="M20 316 H304 V440"/>
  <path class="mark" d="M416 20 V440"/>
  <path class="mark dash" d="M20 260 H240"/>
  <path class="mark dash" d="M360 20 V200 M360 320 V440"/>

  <!-- The lanelet up to the stop line (left-hand traffic: the upper lane) -->
  <rect class="lanelet" x="20" y="204" width="218" height="54"/>
  <path class="mark thick" d="M242 204 V258"/>
  <path class="bound" d="M238.5 204 V258"/>
  <circle class="bound point" cx="238.5" cy="204" r="4"/>
  <circle class="bound point" cx="238.5" cy="258" r="4"/>

  <!-- The detection area -->
  <rect class="area" x="306" y="350" width="108" height="70"/>
  <circle class="bound point" cx="306" cy="350" r="4"/>
  <circle class="bound point" cx="414" cy="350" r="4"/>
  <circle class="bound point" cx="414" cy="420" r="4"/>
  <circle class="bound point" cx="306" cy="420" r="4"/>

  <!-- Notes -->
  <path class="leader" d="M150 372 L236 262"/>
  <text class="note" x="40" y="380" dominant-baseline="central">Linestring</text>
  <text class="code" x="40" y="400" dominant-baseline="central">type: stop_line</text>

  <path class="leader" d="M500 396 L418 390"/>
  <text class="note" x="506" y="380" dominant-baseline="central">Polygon</text>
  <text class="code" x="506" y="400" dominant-baseline="central">type: detection_area</text>
  <text class="code" x="506" y="418" dominant-baseline="central">area: yes</text>

  <!-- The lanelet box -->
  <rect class="box" x="20" y="30" width="170" height="56" rx="10"/>
  <text class="lbl" x="105" y="48" text-anchor="middle" dominant-baseline="central">Lanelet</text>
  <text class="code" x="105" y="68" text-anchor="middle" dominant-baseline="central">subtype: road</text>
  <path class="leader" d="M105 86 V232"/>

  <!-- The regulatory element -->
  <rect class="box primary" x="470" y="30" width="270" height="60" rx="10"/>
  <text class="lbl on-primary" x="605" y="51" text-anchor="middle" dominant-baseline="central">Regulatory element</text>
  <text class="code on-primary" x="605" y="71" text-anchor="middle" dominant-baseline="central">subtype: detection_area</text>

  <path class="edge" d="M190 58 H462"/>
  <text class="edge-lbl" x="246" y="58" text-anchor="middle" dominant-baseline="central">regulatory_element</text>
  <path class="edge" d="M480 90 L250 200"/>
  <text class="edge-lbl" x="452" y="110" text-anchor="middle" dominant-baseline="central">ref_line</text>
  <path class="edge" d="M700 90 C700 250 560 340 420 352"/>
  <text class="edge-lbl" x="660" y="250" text-anchor="middle" dominant-baseline="central">refers</text>
</svg>
