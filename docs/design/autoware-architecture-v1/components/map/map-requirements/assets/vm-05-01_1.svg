<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="vm-05-01_1-title">
  <title id="vm-05-01_1-title">
    A crosswalk across a two-lane road. The road lanelet refers to a crosswalk regulatory element. The regulatory element refers to the crosswalk lanelet, the crosswalk polygon, and the stop lines of
    both lanes.
  </title>

  <!-- Road: two lanes, left-hand traffic, the road lanelet is the upper lane (traffic to the right) -->
  <rect class="road" x="20" y="150" width="820" height="120"/>
  <path class="mark" d="M20 154 H840"/>
  <path class="mark" d="M20 266 H840"/>
  <path class="mark dash" d="M20 210 H480 M580 210 H840"/>
  <rect class="lanelet" x="20" y="156" width="820" height="52"/>

  <!-- The crosswalk, its lanelet, and its polygon -->
  <path class="mark thick" d="M500 162 H560 M500 178 H560 M500 194 H560 M500 210 H560 M500 226 H560 M500 242 H560 M500 258 H560"/>
  <rect class="lanelet alt" x="508" y="130" width="44" height="160"/>
  <rect class="area" x="494" y="148" width="72" height="124"/>

  <!-- The stop lines and their linestrings -->
  <path class="mark thick" d="M462 156 V208"/>
  <path class="bound" d="M458.5 156 V208"/>
  <circle class="bound point" cx="458.5" cy="156" r="4"/>
  <circle class="bound point" cx="458.5" cy="208" r="4"/>
  <path class="mark thick" d="M598 212 V264"/>
  <path class="bound" d="M601.5 212 V264"/>
  <circle class="bound point" cx="601.5" cy="212" r="4"/>
  <circle class="bound point" cx="601.5" cy="264" r="4"/>

  <!-- Notes under the road -->
  <path class="leader" d="M380 318 L456 212"/>
  <text class="note" x="280" y="330" dominant-baseline="central">Linestring</text>
  <text class="code" x="280" y="350" dominant-baseline="central">type: stop_line</text>
  <path class="leader" d="M530 318 V294"/>
  <text class="note" x="470" y="330" dominant-baseline="central">Lanelet</text>
  <text class="code" x="470" y="350" dominant-baseline="central">subtype: crosswalk</text>
  <path class="leader" d="M660 318 L568 270"/>
  <text class="note" x="640" y="330" dominant-baseline="central">Polygon</text>
  <text class="sub" x="640" y="350" dominant-baseline="central">the area of the crosswalk</text>

  <!-- The road lanelet -->
  <rect class="box" x="20" y="24" width="170" height="60" rx="10"/>
  <text class="lbl" x="105" y="44" text-anchor="middle" dominant-baseline="central">Lanelet</text>
  <text class="code" x="105" y="64" text-anchor="middle" dominant-baseline="central">subtype: road</text>
  <path class="leader" d="M105 84 V182"/>

  <!-- The regulatory element -->
  <rect class="box primary" x="330" y="24" width="250" height="60" rx="10"/>
  <text class="lbl on-primary" x="455" y="44" text-anchor="middle" dominant-baseline="central">Regulatory element</text>
  <text class="code on-primary" x="455" y="64" text-anchor="middle" dominant-baseline="central">subtype: crosswalk</text>

  <path class="edge" d="M190 54 H322"/>
  <text class="edge-lbl" x="256" y="54" text-anchor="middle" dominant-baseline="central">regulatory_element</text>
  <path class="edge" d="M360 84 L452 150"/>
  <text class="edge-lbl" x="396" y="110" text-anchor="middle" dominant-baseline="central">ref_line</text>
  <path class="edge" d="M455 84 L512 124"/>
  <text class="edge-lbl" x="474" y="104" text-anchor="middle" dominant-baseline="central">refers</text>
  <path class="edge" d="M560 84 L560 142"/>
  <text class="edge-lbl" x="600" y="112" dominant-baseline="central" text-anchor="middle">crosswalk_polygon</text>
  <path class="edge" d="M580 40 C700 40 680 150 608 206"/>
  <text class="edge-lbl" x="690" y="100" text-anchor="middle" dominant-baseline="central">ref_line</text>
</svg>
