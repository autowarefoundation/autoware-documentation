<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="vm-07-01_2-title">
  <title id="vm-07-01_2-title">Incorrect: the map has lanelets only on the route of the vehicle. The lanes that cross the route have no lanelets.</title>

  <!-- The range of the sensors -->
  <circle class="group dashed" cx="430" cy="230" r="215"/>

  <!-- Roads: a crossing of two two-lane roads -->
  <rect class="road" x="370" y="10" width="120" height="440"/>
  <rect class="road" x="20" y="170" width="820" height="120"/>
  <path class="mark dash" d="M20 230 H360 M500 230 H840"/>
  <path class="mark dash" d="M430 10 V160 M430 300 V450"/>
  <path class="mark thick" d="M374 304 H426"/>

  <!-- Lanelets -->
  <path class="lanelet" d="M372 450 V260 Q372 172 460 172 H840 V228 H460 Q428 228 428 260 V450 Z"/>

  <!-- The ego vehicle turns right (left-hand traffic) -->
  <g transform="translate(389 340)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <path class="route" d="M400 330 V262 Q400 200 462 200 H640"/>
  <path class="flow flow-route" pathLength="100" d="M400 330 V262 Q400 200 462 200 H640"/>
  <path class="route head" d="M400 330 V262 Q400 200 462 200 H640"/>

  <path class="leader" d="M700 40 L590 90"/>
  <text class="note" x="706" y="40" dominant-baseline="central">Sensor range</text>
  <text class="note bad" x="20" y="40" dominant-baseline="central">Lanelets only on the route of the vehicle</text>
</svg>
