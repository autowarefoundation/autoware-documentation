<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" role="img" aria-labelledby="vm-06-01_2-title">
  <title id="vm-06-01_2-title">A safety zone is an island marking with a yellow outline and white stripes. Vehicles must not drive through it.</title>

  <rect class="road" x="20" y="40" width="820" height="160"/>
  <path class="mark" d="M20 44 H840"/>
  <path class="mark" d="M20 196 H840"/>

  <!-- The safety zone -->
  <rect class="mark yellow" x="320" y="96" width="260" height="48" rx="24"/>
  <path class="mark" d="M360 136 L376 104 M400 136 L416 104 M440 136 L456 104 M480 136 L496 104 M520 136 L536 104"/>

  <!-- Note -->
  <path class="leader" d="M180 20 L330 106"/>
  <text class="note" x="60" y="20" dominant-baseline="central">Safety zone</text>
</svg>
