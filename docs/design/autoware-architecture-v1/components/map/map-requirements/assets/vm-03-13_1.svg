<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="vm-03-13-1-title">
  <title id="vm-03-13-1-title">A private area joins a road. A vehicle on the road turns into the private area, and a vehicle from the private area crosses the sidewalk and enters the road.</title>

  <!-- The private area -->
  <rect class="road" x="420" y="20" width="120" height="150"/>
  <path class="mark" d="M420 20 L420 160"/>
  <path class="mark" d="M540 20 L540 160"/>
  <path class="mark" d="M480 20 L480 160"/>

  <!-- Sidewalks, road shoulders, and the road -->
  <rect class="sidewalk" x="230" y="160" width="510" height="30"/>
  <rect class="shoulder" x="230" y="190" width="510" height="12"/>
  <rect class="road" x="230" y="202" width="510" height="120"/>
  <rect class="shoulder" x="230" y="322" width="510" height="12"/>
  <rect class="sidewalk" x="230" y="334" width="510" height="30"/>
  <path class="mark" d="M230 202 L740 202"/>
  <path class="mark" d="M230 262 L740 262"/>
  <path class="mark" d="M230 322 L740 322"/>

  <!-- Vehicles and routes -->
  <rect class="car" x="280" y="221" width="40" height="22" rx="6"/>
  <rect class="glass" x="306" y="224" width="9" height="16"/>
  <path class="route" d="M324 232 L420 232 Q450 232 450 202 L450 110"/>
  <rect class="car" x="499" y="40" width="22" height="40" rx="6"/>
  <rect class="glass" x="502" y="66" width="16" height="9"/>
  <path class="route" d="M510 84 L510 252 Q510 292 550 292 L650 292"/>

  <!-- Notes -->
  <text class="note" x="28" y="64">Private area</text>
  <path class="leader" d="M114.4 60 L416 64"/>
  <text class="note" x="28" y="180">Sidewalk</text>
  <path class="leader" d="M87.6 176 L260 175"/>
  <text class="note" x="28" y="290">Road</text>
  <path class="leader" d="M60.8 286 L260 290"/>
</svg>
