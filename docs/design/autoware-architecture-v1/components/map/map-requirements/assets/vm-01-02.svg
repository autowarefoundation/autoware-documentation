<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="vm-01-02-title">
  <title id="vm-01-02-title">Three lane lines: a white dashed line, a white solid line, and a yellow solid line, with the subtype and lane_change tags of each linestring.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.yellow {
  stroke: #ffc233;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>

  <!-- Road surface and lane markings -->
  <rect class="road" x="40" y="20" width="360" height="220"/>
  <path class="mark dash" d="M60 55 H380"/>
  <path class="mark" d="M60 130 H380"/>
  <path class="mark yellow" d="M60 205 H380"/>

  <!-- Notes -->
  <text class="note lbl" x="440" y="41">White dashed line</text>
  <text class="note code" x="440" y="59">subtype: dashed</text>
  <text class="note code" x="440" y="77">lane_change: yes</text>
  <path class="leader" d="M432 37 L384 55"/>
  <text class="note lbl" x="440" y="116">White solid line</text>
  <text class="note code" x="440" y="134">subtype: solid</text>
  <text class="note code" x="440" y="152">lane_change: yes</text>
  <path class="leader" d="M432 112 L384 130"/>
  <text class="note lbl" x="440" y="191">Yellow solid line</text>
  <text class="note code" x="440" y="209">subtype: solid</text>
  <text class="note code" x="440" y="227">lane_change: no</text>
  <path class="leader" d="M432 187 L384 205"/>
</svg>
