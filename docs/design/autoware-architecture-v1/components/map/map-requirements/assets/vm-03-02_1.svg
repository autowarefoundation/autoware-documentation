<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="vm-03-02-1-title">
  <title id="vm-03-02-1-title">A T-junction. A road goes from west to east, and a second road joins it from the south. The road from the south has a stop line.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .sidewalk {
  fill: #b9bcc8;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
}
  </style>

  <!-- Roads -->
  <rect class="road" x="80" y="40" width="600" height="120"/>
  <rect class="road" x="320" y="159" width="120" height="271"/>
  <path class="road" d="M320 160 L304 160 A16 16 0 0 1 320 176 Z"/>
  <path class="road" d="M440 160 L456 160 A16 16 0 0 0 440 176 Z"/>

  <!-- Sidewalks -->
  <rect class="sidewalk" x="80" y="28" width="600" height="12"/>
  <rect class="sidewalk" x="80" y="160" width="224" height="12"/>
  <rect class="sidewalk" x="456" y="160" width="224" height="12"/>
  <rect class="sidewalk" x="308" y="176" width="12" height="254"/>
  <rect class="sidewalk" x="440" y="176" width="12" height="254"/>
  <path class="sidewalk" d="M304 160 A16 16 0 0 1 320 176 L308 176 A4 4 0 0 0 304 172 Z"/>
  <path class="sidewalk" d="M456 160 A16 16 0 0 0 440 176 L452 176 A4 4 0 0 1 456 172 Z"/>

  <!-- Lane markings -->
  <path class="mark dash" d="M80 100 L680 100"/>
  <path class="mark dash" d="M380 180 L380 430"/>
  <path class="mark thick" d="M320 180 L380 180"/>
</svg>
