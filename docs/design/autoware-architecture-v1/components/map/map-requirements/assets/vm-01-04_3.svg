<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-04_3-title">
  <title id="vm-01-04_3-title">Incorrect: each direction has its own linestring at the road center line, and the opposite lane is split, so the lanelets do not have the same length.</title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .lanelet.bad {
  fill: color-mix(in srgb, var(--aw-crimson) 35%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
}
  </style>

  <!-- Road surface and lane markings -->
  <rect class="road" x="120" y="20" width="144" height="360"/>
  <path class="mark" d="M132 20 V380"/>
  <path class="mark" d="M192 20 V380"/>
  <path class="mark" d="M252 20 V380"/>

  <!-- Lanelets: the opposite lane is split at y = 230 -->
  <rect class="lanelet" x="132" y="40" width="60" height="320"/>
  <rect class="lanelet alt" x="192" y="40" width="60" height="190"/>
  <rect class="lanelet" x="192" y="230" width="60" height="130"/>
  <path class="mark" d="M162 230 V170 M155 179 L162 170 L169 179"/>
  <path class="mark" d="M222 110 V170 M215 161 L222 170 L229 161"/>
  <path class="mark" d="M222 265 V325 M215 316 L222 325 L229 316"/>

  <!-- Linestrings: two at the road center line -->
  <path class="bound" d="M132 40 L132 120 L132 200 L132 280 L132 360"/>
  <circle class="bound point" cx="132" cy="40" r="3.5"/>
  <circle class="bound point" cx="132" cy="120" r="3.5"/>
  <circle class="bound point" cx="132" cy="200" r="3.5"/>
  <circle class="bound point" cx="132" cy="280" r="3.5"/>
  <circle class="bound point" cx="132" cy="360" r="3.5"/>
  <path class="bound" d="M187 40 L187 120 L187 200 L187 280 L187 360"/>
  <circle class="bound point" cx="187" cy="40" r="3.5"/>
  <circle class="bound point" cx="187" cy="120" r="3.5"/>
  <circle class="bound point" cx="187" cy="200" r="3.5"/>
  <circle class="bound point" cx="187" cy="280" r="3.5"/>
  <circle class="bound point" cx="187" cy="360" r="3.5"/>
  <path class="bound alt" d="M197 40 L197 135 L197 230"/>
  <circle class="bound point" cx="197" cy="40" r="3.5"/>
  <circle class="bound point" cx="197" cy="135" r="3.5"/>
  <circle class="bound point" cx="197" cy="230" r="3.5"/>
  <path class="bound alt" d="M197 230 L197 295 L197 360"/>
  <circle class="bound point" cx="197" cy="230" r="3.5"/>
  <circle class="bound point" cx="197" cy="295" r="3.5"/>
  <circle class="bound point" cx="197" cy="360" r="3.5"/>
  <path class="bound alt" d="M252 40 L252 135 L252 230"/>
  <circle class="bound point" cx="252" cy="40" r="3.5"/>
  <circle class="bound point" cx="252" cy="135" r="3.5"/>
  <circle class="bound point" cx="252" cy="230" r="3.5"/>
  <path class="bound alt" d="M252 230 L252 295 L252 360"/>
  <circle class="bound point" cx="252" cy="230" r="3.5"/>
  <circle class="bound point" cx="252" cy="295" r="3.5"/>
  <circle class="bound point" cx="252" cy="360" r="3.5"/>
  <path class="bound alt" d="M197 230 H252"/>

  <!-- Length of the lanelets: one for the ego lane, two for the opposite lane -->
  <path class="leader" d="M102 40 L114 40"/>
  <path class="leader" d="M102 360 L114 360"/>
  <path class="leader" d="M108 40 L108 360"/>
  <path class="leader" d="M276 40 L288 40"/>
  <path class="leader" d="M276 222 L288 222"/>
  <path class="leader" d="M282 40 L282 222"/>
  <path class="leader" d="M276 238 L288 238"/>
  <path class="leader" d="M276 360 L288 360"/>
  <path class="leader" d="M282 238 L282 360"/>

  <!-- Notes -->
  <text class="note bad" x="330" y="104">The two directions do not</text>
  <text class="note bad" x="330" y="122">use the same linestring.</text>
  <path class="leader" d="M324 100 L197 96"/>
  <text class="note bad" x="330" y="244">The opposite lane is split, so the</text>
  <text class="note bad" x="330" y="262">lanelets do not have the same length.</text>
  <path class="leader" d="M324 238 L244 230"/>
</svg>
