<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="vm-01-10_2-title">
  <title id="vm-01-10_2-title">A lanelet with a centerline linestring that moves to the right and back with smooth diagonal parts.</title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.good {
  fill: var(--aw-c-green);
}
  </style>

  <!-- Road surface and edge lines -->
  <rect class="road" x="184" y="20" width="144" height="340"/>
  <path class="mark" d="M196 20 V360"/>
  <path class="mark" d="M316 20 V360"/>

  <!-- Lanelets and their bounds -->
  <rect class="lanelet" x="196" y="20" width="120" height="340"/>
  <path class="bound" d="M196 20 L196 76.7 L196 133.3 L196 190 L196 246.7 L196 303.3 L196 360"/>
  <circle class="bound point" cx="196" cy="20" r="3.5"/>
  <circle class="bound point" cx="196" cy="76.7" r="3.5"/>
  <circle class="bound point" cx="196" cy="133.3" r="3.5"/>
  <circle class="bound point" cx="196" cy="190" r="3.5"/>
  <circle class="bound point" cx="196" cy="246.7" r="3.5"/>
  <circle class="bound point" cx="196" cy="303.3" r="3.5"/>
  <circle class="bound point" cx="196" cy="360" r="3.5"/>
  <path class="bound" d="M316 20 L316 76.7 L316 133.3 L316 190 L316 246.7 L316 303.3 L316 360"/>
  <circle class="bound point" cx="316" cy="20" r="3.5"/>
  <circle class="bound point" cx="316" cy="76.7" r="3.5"/>
  <circle class="bound point" cx="316" cy="133.3" r="3.5"/>
  <circle class="bound point" cx="316" cy="190" r="3.5"/>
  <circle class="bound point" cx="316" cy="246.7" r="3.5"/>
  <circle class="bound point" cx="316" cy="303.3" r="3.5"/>
  <circle class="bound point" cx="316" cy="360" r="3.5"/>

  <!-- The centerline -->
  <path class="bound alt" d="M256 360 L256 300 L256 260 L286 220 L286 160 L256 120 L256 70 L256 20"/>
  <circle class="bound point" cx="256" cy="360" r="3.5"/>
  <circle class="bound point" cx="256" cy="300" r="3.5"/>
  <circle class="bound point" cx="256" cy="260" r="3.5"/>
  <circle class="bound point" cx="286" cy="220" r="3.5"/>
  <circle class="bound point" cx="286" cy="160" r="3.5"/>
  <circle class="bound point" cx="256" cy="120" r="3.5"/>
  <circle class="bound point" cx="256" cy="70" r="3.5"/>
  <circle class="bound point" cx="256" cy="20" r="3.5"/>

  <!-- Notes -->
  <text class="note lbl" x="380" y="104">Centerline of the lanelet</text>
  <text class="note" x="380" y="122">A linestring</text>
  <path class="leader" d="M374 100 L258 90"/>
  <text class="note good" x="380" y="244">Smooth shape that the</text>
  <text class="note good" x="380" y="262">vehicle can drive</text>
  <path class="leader" d="M374 240 L278 236"/>
</svg>
