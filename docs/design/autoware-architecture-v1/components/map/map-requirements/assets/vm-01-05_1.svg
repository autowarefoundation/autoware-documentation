<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="vm-01-05_1-title">
  <title id="vm-01-05_1-title">A curved road with one lane in each direction, a dashed road center line, and road shoulders. The ego vehicle follows its lane through the curve.</title>

  <!-- Road surface -->
  <path class="shoulder" d="M82 450 L82 320 A278 278 0 0 1 163.4 123.4 L255.3 31.5 L269.5 45.6 L177.6 137.6 A258 258 0 0 0 102 320 L102 450 Z"/>
  <path class="shoulder" d="M222 450 L222 320 A138 138 0 0 1 262.4 222.4 L354.3 130.5 L368.5 144.6 L276.6 236.6 A118 118 0 0 0 242 320 L242 450 Z"/>
  <path class="road" d="M102 450 L102 320 A258 258 0 0 1 177.6 137.6 L269.5 45.6 L354.3 130.5 L262.4 222.4 A138 138 0 0 0 222 320 L222 450 Z"/>

  <!-- Lane markings -->
  <path class="mark" d="M102 450 L102 320 A258 258 0 0 1 177.6 137.6 L269.5 45.6"/>
  <path class="mark" d="M222 450 L222 320 A138 138 0 0 1 262.4 222.4 L354.3 130.5"/>
  <path class="mark dash" d="M162 450 L162 320 A198 198 0 0 1 220 180 L311.9 88.1"/>

  <!-- The ego vehicle and its path -->
  <path class="route" d="M132 398 L132 320 A228 228 0 0 1 198.8 158.8 L269.5 88.1"/>
  <rect class="car" x="121" y="400" width="22" height="40" rx="6"/>
  <rect class="glass" x="124" y="405" width="16" height="9"/>

  <!-- Notes -->
  <text class="note" x="440" y="70">Road center line</text>
  <path class="leader" d="M434 66 L269.5 130.5"/>
  <text class="note" x="440" y="130">Road</text>
  <path class="leader" d="M434 126 L276.6 165.9"/>
  <text class="note" x="440" y="190">Road shoulder</text>
  <path class="leader" d="M434 186 L283.6 215.3"/>
</svg>
