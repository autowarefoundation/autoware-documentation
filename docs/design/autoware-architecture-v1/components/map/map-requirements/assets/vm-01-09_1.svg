<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 100" role="img" aria-labelledby="vm-01-09_1-title">
  <title id="vm-01-09_1-title">A round speed limit sign that shows 20.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .sign {
  fill: #fff;
  stroke: var(--aw-crimson);
  stroke-width: 5;
} .sign-text {
  font-weight: 700;
  fill: #00002a;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
}
  </style>
  <circle class="sign" cx="60" cy="50" r="30"/>
  <text class="sign-text" x="60" y="50" text-anchor="middle" dominant-baseline="central">20</text>
  <text class="note" x="110" y="55">Speed limit road sign</text>
</svg>
