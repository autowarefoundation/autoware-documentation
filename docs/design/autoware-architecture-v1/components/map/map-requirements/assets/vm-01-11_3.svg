<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="vm-01-11_3-title">
  <title id="vm-01-11_3-title">Incorrect: two lanelets one after the other, each with a centerline. The two centerlines do not meet at the border between the lanelets.</title>

