<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="vm-01-11_3-title">
  <title id="vm-01-11_3-title">Incorrect: two lanelets one after the other, each with a centerline. The two centerlines do not meet at the border between the lanelets.</title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .lanelet.bad {
  fill: color-mix(in srgb, var(--aw-crimson) 35%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
}
  </style>

  <!-- Road surface and edge lines -->
  <rect class="road" x="184" y="20" width="144" height="480"/>
  <path class="mark" d="M196 20 V500"/>
  <path class="mark" d="M316 20 V500"/>

  <!-- Lanelets and their bounds -->
  <rect class="lanelet alt" x="196" y="20" width="120" height="240"/>
  <rect class="lanelet" x="196" y="260" width="120" height="240"/>
  <path class="bound" d="M196 20 L196 80 L196 140 L196 200 L196 260 L196 320 L196 380 L196 440 L196 500"/>
  <circle class="bound point" cx="196" cy="20" r="3.5"/>
  <circle class="bound point" cx="196" cy="80" r="3.5"/>
  <circle class="bound point" cx="196" cy="140" r="3.5"/>
  <circle class="bound point" cx="196" cy="200" r="3.5"/>
  <circle class="bound point" cx="196" cy="260" r="3.5"/>
  <circle class="bound point" cx="196" cy="320" r="3.5"/>
  <circle class="bound point" cx="196" cy="380" r="3.5"/>
  <circle class="bound point" cx="196" cy="440" r="3.5"/>
  <circle class="bound point" cx="196" cy="500" r="3.5"/>
  <path class="bound" d="M316 20 L316 80 L316 140 L316 200 L316 260 L316 320 L316 380 L316 440 L316 500"/>
  <circle class="bound point" cx="316" cy="20" r="3.5"/>
  <circle class="bound point" cx="316" cy="80" r="3.5"/>
  <circle class="bound point" cx="316" cy="140" r="3.5"/>
  <circle class="bound point" cx="316" cy="200" r="3.5"/>
  <circle class="bound point" cx="316" cy="260" r="3.5"/>
  <circle class="bound point" cx="316" cy="320" r="3.5"/>
  <circle class="bound point" cx="316" cy="380" r="3.5"/>
  <circle class="bound point" cx="316" cy="440" r="3.5"/>
  <circle class="bound point" cx="316" cy="500" r="3.5"/>

  <!-- The centerlines -->
  <path class="bound alt" d="M256 500 L256 430 L286 390 L286 350 L256 310 L238 260"/>
  <circle class="bound point" cx="256" cy="500" r="3.5"/>
  <circle class="bound point" cx="256" cy="430" r="3.5"/>
  <circle class="bound point" cx="286" cy="390" r="3.5"/>
  <circle class="bound point" cx="286" cy="350" r="3.5"/>
  <circle class="bound point" cx="256" cy="310" r="3.5"/>
  <circle class="bound point" cx="238" cy="260" r="3.5"/>
  <path class="bound alt" d="M256 260 L256 210 L286 170 L286 130 L256 90 L256 20"/>
  <circle class="bound point" cx="256" cy="260" r="3.5"/>
  <circle class="bound point" cx="256" cy="210" r="3.5"/>
  <circle class="bound point" cx="286" cy="170" r="3.5"/>
  <circle class="bound point" cx="286" cy="130" r="3.5"/>
  <circle class="bound point" cx="256" cy="90" r="3.5"/>
  <circle class="bound point" cx="256" cy="20" r="3.5"/>

  <!-- Notes -->
  <text class="note bad" x="380" y="264">The centerlines are</text>
  <text class="note bad" x="380" y="282">not connected.</text>
  <path class="leader" d="M374 260 L264 260"/>
</svg>
