<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="vm-01-01-title">
  <title id="vm-01-01-title">A road lanelet between its left bound and its right bound. Arrows show its direction. Its tags are subtype road, location urban, and one_way yes.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>

  <!-- Road surface and lane markings -->
  <rect class="road" x="184" y="20" width="84" height="320"/>
  <path class="mark" d="M196 20 V340"/>
  <path class="mark" d="M256 20 V340"/>

  <!-- The lanelet and its bounds -->
  <rect class="lanelet" x="196" y="20" width="60" height="320"/>
  <path class="bound" d="M196 20 L196 100 L196 180 L196 260 L196 340"/>
  <circle class="bound point" cx="196" cy="20" r="3.5"/>
  <circle class="bound point" cx="196" cy="100" r="3.5"/>
  <circle class="bound point" cx="196" cy="180" r="3.5"/>
  <circle class="bound point" cx="196" cy="260" r="3.5"/>
  <circle class="bound point" cx="196" cy="340" r="3.5"/>
  <path class="bound" d="M256 20 L256 100 L256 180 L256 260 L256 340"/>
  <circle class="bound point" cx="256" cy="20" r="3.5"/>
  <circle class="bound point" cx="256" cy="100" r="3.5"/>
  <circle class="bound point" cx="256" cy="180" r="3.5"/>
  <circle class="bound point" cx="256" cy="260" r="3.5"/>
  <circle class="bound point" cx="256" cy="340" r="3.5"/>
  <path class="mark" d="M226 310 V270 M219 279 L226 270 L233 279"/>
  <path class="mark" d="M226 210 V170 M219 179 L226 170 L233 179"/>
  <path class="mark" d="M226 110 V70 M219 79 L226 70 L233 79"/>

  <!-- Notes -->
  <text class="note lbl" x="330" y="60">Lanelet</text>
  <text class="note code" x="330" y="78">subtype: road</text>
  <text class="note code" x="330" y="96">location: urban</text>
  <text class="note code" x="330" y="114">one_way: yes</text>
  <path class="leader" d="M324 56 L240 96"/>
  <text class="note" x="166" y="194" text-anchor="end">Direction</text>
  <path class="leader" d="M172 190 L220 190"/>
  <text class="note" x="166" y="290" text-anchor="end">Left bound</text>
  <path class="leader" d="M172 286 L196 286"/>
  <text class="note" x="300" y="290">Right bound</text>
  <path class="leader" d="M294 286 L256 286"/>
</svg>
