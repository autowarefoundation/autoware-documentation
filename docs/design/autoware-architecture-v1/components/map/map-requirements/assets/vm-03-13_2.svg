<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="vm-03-13-2-title">
  <title id="vm-03-13-2-title">
    The lanelets where a private area joins a road. The lanelets in the private area have location private. The road lanelets have location urban. The sidewalk that the vehicles cross is a walkway
    lanelet, and the road shoulders are road_shoulder lanelets.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-green: #00e678; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .road {
  fill: #5c6070;
} .shoulder {
  fill: #8d91a0;
} .sidewalk {
  fill: #b9bcc8;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .area {
  fill: color-mix(in srgb, var(--aw-green) 25%, transparent);
  stroke: var(--aw-c-green);
  stroke-width: 2;
  stroke-dasharray: 6 4;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>

  <!-- The private area -->
  <rect class="road" x="420" y="20" width="120" height="150"/>
  <path class="mark" d="M420 20 L420 160"/>
  <path class="mark" d="M540 20 L540 160"/>
  <path class="mark" d="M480 20 L480 160"/>

  <!-- Sidewalks, road shoulders, and the road -->
  <rect class="sidewalk" x="230" y="160" width="510" height="30"/>
  <rect class="shoulder" x="230" y="190" width="510" height="12"/>
  <rect class="road" x="230" y="202" width="510" height="120"/>
  <rect class="shoulder" x="230" y="322" width="510" height="12"/>
  <rect class="sidewalk" x="230" y="334" width="510" height="30"/>
  <path class="mark" d="M230 202 L740 202"/>
  <path class="mark" d="M230 262 L740 262"/>
  <path class="mark" d="M230 322 L740 322"/>

  <!-- Road lanelets, location urban -->
  <rect class="lanelet" x="230" y="202" width="510" height="60"/>
  <rect class="lanelet" x="230" y="262" width="510" height="60"/>

  <!-- Road shoulder lanelets -->
  <rect class="bound" x="230" y="190" width="510" height="12"/>
  <rect class="bound" x="230" y="322" width="510" height="12"/>

  <!-- The walkway lanelet -->
  <rect class="area" x="230" y="160" width="510" height="30"/>

  <!-- Lanelets in the private area, location private -->
  <rect class="lanelet alt" x="420" y="20" width="60" height="90"/>
  <rect class="lanelet alt" x="480" y="20" width="60" height="90"/>
  <!-- Each lower private lanelet crosses the sidewalk and turns into the road -->
  <path class="lanelet alt" d="M420 110 L480 110 L480 160 C480 230 450 262 360 262 L360 202 C390 202 420 190 420 160 Z"/>
  <path class="lanelet alt" d="M480 110 L540 110 L540 160 C540 230 560 262 620 262 L620 322 C530 322 480 270 480 160 Z"/>
  <path class="bound" d="M420 110 L540 110"/>

  <!-- Notes -->
  <text class="note" x="28" y="50">
    <tspan x="28">Lanelet</tspan>
    <tspan class="code" x="28" dy="17">subtype: road</tspan>
    <tspan class="code" x="28" dy="17">location: private</tspan>
  </text>
  <path class="leader" d="M80.9 46 L450 60"/>
  <path class="leader" d="M80.9 46 L510 70"/>
  <path class="leader" d="M80.9 46 L450 130"/>
  <path class="leader" d="M80.9 46 L510 135"/>
  <text class="note" x="28" y="150">
    <tspan x="28">Lanelet</tspan>
    <tspan class="code" x="28" dy="17">subtype: walkway</tspan>
  </text>
  <path class="leader" d="M80.9 146 L300 175"/>
  <text class="note" x="28" y="220">
    <tspan x="28">Lanelet</tspan>
    <tspan class="code" x="28" dy="17">subtype: road_shoulder</tspan>
  </text>
  <path class="leader" d="M80.9 216 L290 196"/>
  <text class="note" x="28" y="300">
    <tspan x="28">Lanelet</tspan>
    <tspan class="code" x="28" dy="17">subtype: road</tspan>
    <tspan class="code" x="28" dy="17">location: urban</tspan>
  </text>
  <path class="leader" d="M80.9 296 L290 240"/>
  <path class="leader" d="M80.9 296 L290 300"/>
</svg>
