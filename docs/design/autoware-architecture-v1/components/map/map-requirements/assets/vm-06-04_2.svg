<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="vm-06-04_2-title">
  <title id="vm-06-04_2-title">The road lanelet refers to a no_stopping_area regulatory element. It refers to a no_stopping_area polygon on the lane and, optionally, to a stop_line linestring before the area.</title>

  <!-- Road: two lanes, left-hand traffic, the lanelet is the upper lane (traffic to the right) -->
  <rect class="road" x="320" y="120" width="520" height="120"/>
  <path class="mark" d="M320 124 H840"/>
  <path class="mark" d="M320 236 H840"/>
  <path class="mark dash" d="M320 180 H840"/>
  <rect class="lanelet" x="320" y="126" width="520" height="52"/>

  <!-- The area polygon -->
  <rect class="area warn" x="520" y="128" width="200" height="48"/>
  <path class="mark" d="M520 128 H720 M520 176 H720 M540 176 L580 128 M600 176 L640 128 M660 176 L700 128"/>
  <path class="bound" d="M500 128 V176"/>
  <circle class="bound point" cx="500" cy="128" r="4"/>
  <circle class="bound point" cx="500" cy="176" r="4"/>
  <path class="leader" d="M460 280 L498 180"/>
  <text class="note" x="400" y="290" dominant-baseline="central">Linestring</text>
  <text class="code" x="400" y="308" dominant-baseline="central">type: stop_line (optional)</text>
  <path class="edge" d="M270 90 C380 96 460 100 496 120"/>
  <text class="edge-lbl" x="380" y="106" text-anchor="middle" dominant-baseline="central">ref_line</text>

  <path class="leader" d="M700 76 L690 134"/>
  <text class="note" x="660" y="40" dominant-baseline="central">Polygon</text>
  <text class="code" x="660" y="60" dominant-baseline="central">type: no_stopping_area</text>

  <!-- The lanelet and the regulatory element -->
  <rect class="box primary" x="20" y="40" width="250" height="60" rx="10"/>
  <text class="lbl on-primary" x="145" y="60" text-anchor="middle" dominant-baseline="central">Regulatory element</text>
  <text class="code on-primary" x="145" y="80" text-anchor="middle" dominant-baseline="central">subtype: no_stopping_area</text>

  <rect class="box" x="20" y="220" width="250" height="60" rx="10"/>
  <text class="lbl" x="145" y="240" text-anchor="middle" dominant-baseline="central">Lanelet</text>
  <text class="code" x="145" y="260" text-anchor="middle" dominant-baseline="central">subtype: road</text>
  <path class="leader" d="M270 250 H420 V152"/>

  <path class="edge" d="M145 220 V108"/>
  <text class="edge-lbl" x="145" y="164" text-anchor="middle" dominant-baseline="central">regulatory_element</text>
  <path class="edge" d="M270 60 C450 60 600 70 634 120"/>
  <text class="edge-lbl" x="470" y="72" text-anchor="middle" dominant-baseline="central">refers</text>
</svg>
