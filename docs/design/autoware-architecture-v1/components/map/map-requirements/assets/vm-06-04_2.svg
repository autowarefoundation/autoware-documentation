<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="vm-06-04_2-title">
  <title id="vm-06-04_2-title">
    The road lanelet refers to a no_stopping_area regulatory element. It refers to a no_stopping_area polygon on the lane and, optionally, to a stop_line linestring before the area.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-green: #00e678; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.warn {
  fill: color-mix(in srgb, var(--aw-crimson) 10%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-c-crimson) 70%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .on-primary {
  fill: #fff;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.dash {
  stroke-dasharray: 6 5;
} .aw-d-arrow--route {
  fill: var(--aw-c-green);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .area {
  fill: color-mix(in srgb, var(--aw-green) 25%, transparent);
  stroke: var(--aw-c-green);
  stroke-width: 2;
  stroke-dasharray: 6 4;
} .area.warn {
  fill: color-mix(in srgb, var(--aw-crimson) 22%, transparent);
  stroke: var(--aw-c-crimson);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .route {
  fill: none;
  stroke: var(--aw-c-green);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  marker-end: url("#aw-arrow-route");
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-route" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--route" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
  </defs>

  <!-- Road: two lanes, left-hand traffic, the lanelet is the upper lane (traffic to the right) -->
  <rect class="road" x="320" y="120" width="520" height="120"/>
  <path class="mark" d="M320 124 H840"/>
  <path class="mark" d="M320 236 H840"/>
  <path class="mark dash" d="M320 180 H840"/>
  <rect class="lanelet" x="320" y="126" width="520" height="52"/>
  <!-- Direction of travel in the lanelet, so that the stop line is before the area -->
  <path class="route" d="M748 152 H812"/>

  <!-- The area polygon -->
  <rect class="area warn" x="520" y="128" width="200" height="48"/>
  <path class="mark" d="M520 128 H720 M520 176 H720 M540 176 L580 128 M600 176 L640 128 M660 176 L700 128"/>
  <path class="bound" d="M500 128 V176"/>
  <circle class="bound point" cx="500" cy="128" r="4"/>
  <circle class="bound point" cx="500" cy="176" r="4"/>
  <path class="leader" d="M460 280 L498 180"/>
  <text class="note" x="400" y="290" dominant-baseline="central">Linestring</text>
  <text class="code" x="400" y="308" dominant-baseline="central">type: stop_line (optional)</text>
  <path class="edge" d="M270 90 C380 96 460 100 496 120"/>
  <text class="edge-lbl" x="380" y="106" text-anchor="middle" dominant-baseline="central">ref_line</text>

  <path class="leader" d="M700 76 L690 134"/>
  <text class="note" x="660" y="40" dominant-baseline="central">Polygon</text>
  <text class="code" x="660" y="60" dominant-baseline="central">type: no_stopping_area</text>

  <!-- The lanelet and the regulatory element -->
  <rect class="box primary" x="20" y="40" width="250" height="60" rx="10"/>
  <text class="lbl on-primary" x="145" y="60" text-anchor="middle" dominant-baseline="central">Regulatory element</text>
  <text class="code on-primary" x="145" y="80" text-anchor="middle" dominant-baseline="central">subtype: no_stopping_area</text>

  <rect class="box" x="20" y="220" width="250" height="60" rx="10"/>
  <text class="lbl" x="145" y="240" text-anchor="middle" dominant-baseline="central">Lanelet</text>
  <text class="code" x="145" y="260" text-anchor="middle" dominant-baseline="central">subtype: road</text>
  <path class="leader" d="M270 250 H420 V152"/>

  <path class="edge" d="M145 220 V108"/>
  <text class="edge-lbl" x="145" y="164" text-anchor="middle" dominant-baseline="central">regulatory_element</text>
  <path class="edge" d="M270 60 C450 60 600 70 634 120"/>
  <text class="edge-lbl" x="470" y="72" text-anchor="middle" dominant-baseline="central">refers</text>
</svg>
