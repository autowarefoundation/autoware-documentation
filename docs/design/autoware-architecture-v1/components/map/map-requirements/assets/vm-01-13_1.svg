<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-13_1-title">
  <title id="vm-01-13_1-title">A road without a road center line that is wide enough for the ego vehicle and an oncoming vehicle to pass each other.</title>

  <!-- Road surface and lane markings -->
  <rect class="road" x="120" y="20" width="144" height="360"/>
  <path class="mark" d="M132 20 V380"/>
  <path class="mark" d="M252 20 V380"/>

  <!-- Vehicles and their paths -->
  <path class="route" d="M162 308 V230"/>
  <rect class="car" x="151" y="310" width="22" height="40" rx="6"/>
  <rect class="glass" x="154" y="315" width="16" height="9"/>
  <path class="route" d="M222 92 V170"/>
  <rect class="car npc" x="211" y="50" width="22" height="40" rx="6"/>
  <rect class="glass" x="214" y="76" width="16" height="9"/>

  <!-- Notes -->
  <text class="note" x="320" y="204">No road center line</text>
</svg>
