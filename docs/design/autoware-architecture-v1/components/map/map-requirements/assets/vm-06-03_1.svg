<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="vm-06-03_1-title">
  <title id="vm-06-03_1-title">A no parking and no stopping sign, and a solid yellow line along the curb of the road.</title>

  <!-- The sign -->
  <circle class="sign" cx="170" cy="150" r="56"/>
  <path class="sign" d="M131 111 L209 189 M209 111 L131 189"/>
  <text class="note" x="170" y="236" text-anchor="middle" dominant-baseline="central">No parking and no stopping</text>

  <!-- Road along a sidewalk, with a yellow line along the curb -->
  <rect class="sidewalk" x="320" y="30" width="520" height="70"/>
  <rect class="road" x="320" y="104" width="520" height="150"/>
  <path class="mark yellow" d="M320 110 H840"/>
  <path class="mark dash" d="M320 200 H840"/>
</svg>
