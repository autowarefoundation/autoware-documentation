<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-labelledby="vm-05-04_1-title">
  <title id="vm-05-04_1-title">A fence linestring separates a kindergarten or playground from a road with a crosswalk. The fence linestring is not linked to anything.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .road {
  fill: #5c6070;
} .sidewalk {
  fill: #b9bcc8;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>

  <!-- The area next to the road -->
  <text class="note" x="20" y="24" dominant-baseline="central">Kindergarten or playground</text>
  <rect class="sidewalk" x="20" y="44" width="820" height="110"/>

  <!-- Road: two lanes with a crosswalk -->
  <rect class="road" x="20" y="160" width="820" height="120"/>
  <path class="mark" d="M20 164 H840"/>
  <path class="mark" d="M20 276 H840"/>
  <path class="mark dash" d="M20 220 H560 M660 220 H840"/>
  <path class="mark thick" d="M580 172 H640 M580 188 H640 M580 204 H640 M580 220 H640 M580 236 H640 M580 252 H640 M580 268 H640"/>

  <!-- The fence linestring at the edge of the area -->
  <path class="bound alt" d="M20 156 H840"/>
  <circle class="bound point" cx="40" cy="156" r="4"/>
  <circle class="bound point" cx="430" cy="156" r="4"/>
  <circle class="bound point" cx="820" cy="156" r="4"/>

  <path class="leader" d="M260 318 L300 160"/>
  <text class="note" x="200" y="332" dominant-baseline="central">Linestring</text>
  <text class="code" x="200" y="352" dominant-baseline="central">type: fence</text>
</svg>
