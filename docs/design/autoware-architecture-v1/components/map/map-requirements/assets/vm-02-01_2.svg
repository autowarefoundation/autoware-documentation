<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="vm-02-01_2-title">
  <title id="vm-02-01_2-title">Preferred: the stop_line linestring lies on the edge of the white stop line that the vehicle reaches first.</title>

  <!-- Road: two lanes, left-hand traffic, the vehicle drives to the right in the upper lane -->
  <rect class="road" x="20" y="80" width="720" height="120"/>
  <path class="mark" d="M20 84 H740"/>
  <path class="mark" d="M20 196 H740"/>
  <path class="mark dash" d="M20 140 H740"/>
  <path class="route plain" d="M300 110 H420"/>
  <path class="route" d="M420 110 H440"/>

  <!-- The painted stop line and the linestring on its near edge -->
  <path class="mark thick" d="M484 86 V138 M491 86 V138"/>
  <path class="bound" d="M480.5 86 V138"/>
  <circle class="bound point" cx="480.5" cy="86" r="4"/>
  <circle class="bound point" cx="480.5" cy="138" r="4"/>

  <!-- Notes -->
  <path class="leader" d="M560 34 L484 82"/>
  <text class="note" x="566" y="34" dominant-baseline="central">Linestring</text>
  <text class="code" x="566" y="54" dominant-baseline="central">type: stop_line</text>
  <text class="note good" x="566" y="224" dominant-baseline="central">On the near edge of the white line</text>
  <path class="leader" d="M560 224 L484 140"/>
</svg>
