<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-13_2-title">
  <title id="vm-01-13_2-title">Two lanelets in opposite directions side by side in the middle of the road. They share one linestring, which has no marking on the road.</title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.good {
  fill: var(--aw-c-green);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>

  <!-- Road surface and lane markings -->
  <rect class="road" x="120" y="20" width="144" height="360"/>
  <path class="mark" d="M132 20 V380"/>
  <path class="mark" d="M252 20 V380"/>

  <!-- Lanelets and linestrings -->
  <rect class="lanelet" x="132" y="20" width="60" height="360"/>
  <rect class="lanelet alt" x="192" y="20" width="60" height="360"/>
  <path class="mark" d="M162 230 V170 M155 179 L162 170 L169 179"/>
  <path class="mark" d="M222 170 V230 M215 221 L222 230 L229 221"/>
  <path class="bound" d="M132 20 L132 110 L132 200 L132 290 L132 380"/>
  <circle class="bound point" cx="132" cy="20" r="3.5"/>
  <circle class="bound point" cx="132" cy="110" r="3.5"/>
  <circle class="bound point" cx="132" cy="200" r="3.5"/>
  <circle class="bound point" cx="132" cy="290" r="3.5"/>
  <circle class="bound point" cx="132" cy="380" r="3.5"/>
  <path class="bound" d="M192 20 L192 110 L192 200 L192 290 L192 380"/>
  <circle class="bound point" cx="192" cy="20" r="3.5"/>
  <circle class="bound point" cx="192" cy="110" r="3.5"/>
  <circle class="bound point" cx="192" cy="200" r="3.5"/>
  <circle class="bound point" cx="192" cy="290" r="3.5"/>
  <circle class="bound point" cx="192" cy="380" r="3.5"/>
  <path class="bound" d="M252 20 L252 110 L252 200 L252 290 L252 380"/>
  <circle class="bound point" cx="252" cy="20" r="3.5"/>
  <circle class="bound point" cx="252" cy="110" r="3.5"/>
  <circle class="bound point" cx="252" cy="200" r="3.5"/>
  <circle class="bound point" cx="252" cy="290" r="3.5"/>
  <circle class="bound point" cx="252" cy="380" r="3.5"/>

  <!-- Notes -->
  <text class="note lbl" x="320" y="74">Lanelet</text>
  <text class="note code" x="320" y="92">subtype: road</text>
  <text class="note code" x="320" y="110">one_way: yes</text>
  <path class="leader" d="M314 70 L234 90"/>
  <path class="leader" d="M314 70 L170 100"/>
  <text class="note good" x="320" y="294">The two lanelets share</text>
  <text class="note good" x="320" y="312">one linestring.</text>
  <path class="leader" d="M314 290 L194 290"/>
</svg>
