<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-13_2-title">
  <title id="vm-01-13_2-title">Two lanelets in opposite directions side by side in the middle of the road. They share one linestring, which has no marking on the road.</title>

