<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="vm-04-01_1-title">
  <title id="vm-04-01_1-title">
    A road lanelet turns right at a T-junction. It refers to a traffic_light regulatory element. The regulatory element refers to the stop_line linestring as ref_line, to the traffic_light linestring
    as refers, and to the light_bulbs linestring as light_bulbs.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .on-primary {
  fill: #fff;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.dash {
  stroke-dasharray: 6 5;
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .light-housing {
  fill: #1b1d29;
  stroke: #8d91a0;
  stroke-width: 1.5;
} .light-red {
  fill: #ff3b4e;
} .light-yellow {
  fill: #ffc233;
} .light-green {
  fill: #00e678;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
  </defs>

  <!-- Roads: a road from the left meets a north-south road -->
  <rect class="road" x="300" y="20" width="120" height="420"/>
  <rect class="road" x="20" y="200" width="282" height="120"/>
  <path class="mark" d="M20 204 H304 V20"/>
  <path class="mark" d="M20 316 H304 V440"/>
  <path class="mark" d="M416 20 V440"/>
  <path class="mark dash" d="M20 260 H240"/>
  <path class="mark dash" d="M360 20 V200 M360 320 V440"/>

  <!-- The lanelet (left-hand traffic): it comes from the left in the upper lane and turns right into the road down -->
  <path class="lanelet" d="M240 202 H300 Q418 202 418 320 V440 H362 V320 Q362 258 300 258 H240 Z"/>

  <!-- The stop line and its linestring -->
  <path class="mark thick" d="M240 204 V258"/>
  <path class="bound" d="M236.5 204 V258"/>
  <circle class="bound point" cx="236.5" cy="204" r="4"/>
  <circle class="bound point" cx="236.5" cy="258" r="4"/>
  <path class="leader" d="M150 150 L232 200"/>
  <text class="note" x="40" y="140" dominant-baseline="central">Linestring</text>
  <text class="code" x="40" y="160" dominant-baseline="central">type: stop_line</text>

  <!-- The traffic light and its linestrings -->
  <rect class="light-housing" x="590" y="224" width="150" height="56" rx="10"/>
  <circle class="light-red" cx="625" cy="252" r="17"/>
  <circle class="light-yellow" cx="665" cy="252" r="17"/>
  <circle class="light-green" cx="705" cy="252" r="17"/>
  <path class="bound" d="M625 252 H705"/>
  <circle class="bound point" cx="625" cy="252" r="4"/>
  <circle class="bound point" cx="665" cy="252" r="4"/>
  <circle class="bound point" cx="705" cy="252" r="4"/>
  <path class="bound" d="M590 290 H740"/>
  <circle class="bound point" cx="590" cy="290" r="4"/>
  <circle class="bound point" cx="740" cy="290" r="4"/>

  <path class="leader" d="M580 146 L630 249"/>
  <text class="note" x="430" y="144" dominant-baseline="central">Linestring (ID 11)</text>
  <text class="code" x="430" y="164" dominant-baseline="central">type: light_bulbs</text>
  <text class="code" x="430" y="182" dominant-baseline="central">traffic_light_id: 10</text>

  <path class="leader" d="M640 316 L640 294"/>
  <text class="note" x="620" y="328" dominant-baseline="central">Linestring (ID 10)</text>
  <text class="code" x="620" y="348" dominant-baseline="central">type: traffic_light</text>

  <!-- The lanelet box -->
  <rect class="box" x="440" y="370" width="170" height="56" rx="10"/>
  <text class="lbl" x="525" y="388" text-anchor="middle" dominant-baseline="central">Lanelet</text>
  <text class="code" x="525" y="408" text-anchor="middle" dominant-baseline="central">subtype: road</text>
  <path class="leader" d="M440 398 L404 398"/>

  <!-- The regulatory element -->
  <rect class="box primary" x="470" y="30" width="250" height="60" rx="10"/>
  <text class="lbl on-primary" x="595" y="51" text-anchor="middle" dominant-baseline="central">Regulatory element</text>
  <text class="code on-primary" x="595" y="71" text-anchor="middle" dominant-baseline="central">subtype: traffic_light</text>

  <path class="edge" d="M610 398 H830 V60 H728"/>
  <text class="edge-lbl" x="714" y="386" text-anchor="middle" dominant-baseline="central">regulatory_element</text>
  <path class="edge" d="M480 90 L250 206"/>
  <text class="edge-lbl" x="468" y="114" text-anchor="start" dominant-baseline="central">ref_line</text>
  <path class="edge" d="M640 90 L652 247"/>
  <text class="edge-lbl" x="652" y="140" text-anchor="start" dominant-baseline="central">light_bulbs</text>
  <path class="edge" d="M700 90 C770 150 790 260 746 286"/>
  <text class="edge-lbl" x="768" y="200" text-anchor="middle" dominant-baseline="central">refers</text>
</svg>
