<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="vm-01-15_1-title">
  <title id="vm-01-15_1-title">A curved road with a road shoulder and a sidewalk on each side. Outside the sidewalks is off road.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .shoulder {
  fill: #8d91a0;
} .sidewalk {
  fill: #b9bcc8;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
}
  </style>

  <!-- Road surface -->
  <path class="sidewalk" d="M60 450 L60 320 A300 300 0 0 1 147.9 107.9 L239.8 15.9 L255.3 31.5 L163.4 123.4 A278 278 0 0 0 82 320 L82 450 Z"/>
  <path class="sidewalk" d="M242 450 L242 320 A118 118 0 0 1 276.6 236.6 L368.5 144.6 L384 160.2 L292.1 252.1 A96 96 0 0 0 264 320 L264 450 Z"/>
  <path class="shoulder" d="M82 450 L82 320 A278 278 0 0 1 163.4 123.4 L255.3 31.5 L269.5 45.6 L177.6 137.6 A258 258 0 0 0 102 320 L102 450 Z"/>
  <path class="shoulder" d="M222 450 L222 320 A138 138 0 0 1 262.4 222.4 L354.3 130.5 L368.5 144.6 L276.6 236.6 A118 118 0 0 0 242 320 L242 450 Z"/>
  <path class="road" d="M102 450 L102 320 A258 258 0 0 1 177.6 137.6 L269.5 45.6 L354.3 130.5 L262.4 222.4 A138 138 0 0 0 222 320 L222 450 Z"/>

  <!-- Lane markings -->
  <path class="mark" d="M102 450 L102 320 A258 258 0 0 1 177.6 137.6 L269.5 45.6"/>
