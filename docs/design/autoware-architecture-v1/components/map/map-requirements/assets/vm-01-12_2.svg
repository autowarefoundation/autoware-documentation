<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="vm-01-12_2-title">
  <title id="vm-01-12_2-title">Three lanelets one after the other. Only the middle lanelet has a centerline, and the centerline starts and ends in the middle of the lanelet.</title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.good {
  fill: var(--aw-c-green);
}
  </style>

  <!-- Road surface and edge lines -->
  <rect class="road" x="184" y="20" width="144" height="480"/>
  <path class="mark" d="M196 20 V500"/>
  <path class="mark" d="M316 20 V500"/>

  <!-- Lanelets and their bounds -->
  <rect class="lanelet" x="196" y="20" width="120" height="120"/>
  <rect class="lanelet alt" x="196" y="140" width="120" height="240"/>
  <rect class="lanelet" x="196" y="380" width="120" height="120"/>
  <path class="bound" d="M196 20 L196 80 L196 140 L196 200 L196 260 L196 320 L196 380 L196 440 L196 500"/>
  <circle class="bound point" cx="196" cy="20" r="3.5"/>
  <circle class="bound point" cx="196" cy="80" r="3.5"/>
  <circle class="bound point" cx="196" cy="140" r="3.5"/>
  <circle class="bound point" cx="196" cy="200" r="3.5"/>
  <circle class="bound point" cx="196" cy="260" r="3.5"/>
  <circle class="bound point" cx="196" cy="320" r="3.5"/>
  <circle class="bound point" cx="196" cy="380" r="3.5"/>
  <circle class="bound point" cx="196" cy="440" r="3.5"/>
  <circle class="bound point" cx="196" cy="500" r="3.5"/>
  <path class="bound" d="M316 20 L316 80 L316 140 L316 200 L316 260 L316 320 L316 380 L316 440 L316 500"/>
  <circle class="bound point" cx="316" cy="20" r="3.5"/>
  <circle class="bound point" cx="316" cy="80" r="3.5"/>
  <circle class="bound point" cx="316" cy="140" r="3.5"/>
  <circle class="bound point" cx="316" cy="200" r="3.5"/>
  <circle class="bound point" cx="316" cy="260" r="3.5"/>
  <circle class="bound point" cx="316" cy="320" r="3.5"/>
  <circle class="bound point" cx="316" cy="380" r="3.5"/>
  <circle class="bound point" cx="316" cy="440" r="3.5"/>
  <circle class="bound point" cx="316" cy="500" r="3.5"/>

  <!-- The centerline of the middle lanelet -->
  <path class="bound alt" d="M256 380 L256 340 L286 300 L286 220 L256 180 L256 140"/>
  <circle class="bound point" cx="256" cy="380" r="3.5"/>
  <circle class="bound point" cx="256" cy="340" r="3.5"/>
  <circle class="bound point" cx="286" cy="300" r="3.5"/>
  <circle class="bound point" cx="286" cy="220" r="3.5"/>
  <circle class="bound point" cx="256" cy="180" r="3.5"/>
  <circle class="bound point" cx="256" cy="140" r="3.5"/>

  <!-- Notes -->
  <text class="note" x="380" y="74">Lanelets</text>
  <path class="leader" d="M374 70 L300 80"/>
  <path class="leader" d="M374 70 L300 250"/>
  <path class="leader" d="M374 70 L300 440"/>
  <text class="note good" x="166" y="264" text-anchor="end">The centerline starts</text>
  <text class="note good" x="166" y="282" text-anchor="end">and ends in the middle</text>
  <text class="note good" x="166" y="300" text-anchor="end">of the lanelet.</text>
  <path class="leader" d="M172 260 L252 378"/>
  <path class="leader" d="M172 260 L252 142"/>
</svg>
