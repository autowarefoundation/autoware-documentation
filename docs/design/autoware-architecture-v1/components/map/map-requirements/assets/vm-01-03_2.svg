<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="vm-01-03_2-title">
  <title id="vm-01-03_2-title">Four lanelets side by side. Each lane line is one linestring that the two lanelets next to it share.</title>

  <!-- Road surface and lane markings -->
  <rect class="road" x="60" y="20" width="264" height="340"/>
  <path class="mark" d="M72 20 V360"/>
  <path class="mark dash" d="M132 20 V360"/>
  <path class="mark yellow" d="M192 20 V360"/>
  <path class="mark dash" d="M252 20 V360"/>
  <path class="mark" d="M312 20 V360"/>

  <!-- Lanelets -->
  <rect class="lanelet" x="72" y="20" width="60" height="340"/>
  <rect class="lanelet alt" x="132" y="20" width="60" height="340"/>
  <rect class="lanelet" x="192" y="20" width="60" height="340"/>
  <rect class="lanelet alt" x="252" y="20" width="60" height="340"/>

  <!-- Linestrings: one at each lane line -->
  <path class="bound" d="M72 20 L72 105 L72 190 L72 275 L72 360"/>
  <circle class="bound point" cx="72" cy="20" r="3.5"/>
  <circle class="bound point" cx="72" cy="105" r="3.5"/>
  <circle class="bound point" cx="72" cy="190" r="3.5"/>
  <circle class="bound point" cx="72" cy="275" r="3.5"/>
  <circle class="bound point" cx="72" cy="360" r="3.5"/>
  <path class="bound" d="M132 20 L132 105 L132 190 L132 275 L132 360"/>
  <circle class="bound point" cx="132" cy="20" r="3.5"/>
  <circle class="bound point" cx="132" cy="105" r="3.5"/>
  <circle class="bound point" cx="132" cy="190" r="3.5"/>
  <circle class="bound point" cx="132" cy="275" r="3.5"/>
  <circle class="bound point" cx="132" cy="360" r="3.5"/>
  <path class="bound" d="M192 20 L192 105 L192 190 L192 275 L192 360"/>
  <circle class="bound point" cx="192" cy="20" r="3.5"/>
  <circle class="bound point" cx="192" cy="105" r="3.5"/>
  <circle class="bound point" cx="192" cy="190" r="3.5"/>
  <circle class="bound point" cx="192" cy="275" r="3.5"/>
  <circle class="bound point" cx="192" cy="360" r="3.5"/>
  <path class="bound" d="M252 20 L252 105 L252 190 L252 275 L252 360"/>
  <circle class="bound point" cx="252" cy="20" r="3.5"/>
  <circle class="bound point" cx="252" cy="105" r="3.5"/>
  <circle class="bound point" cx="252" cy="190" r="3.5"/>
  <circle class="bound point" cx="252" cy="275" r="3.5"/>
  <circle class="bound point" cx="252" cy="360" r="3.5"/>
  <path class="bound" d="M312 20 L312 105 L312 190 L312 275 L312 360"/>
  <circle class="bound point" cx="312" cy="20" r="3.5"/>
  <circle class="bound point" cx="312" cy="105" r="3.5"/>
  <circle class="bound point" cx="312" cy="190" r="3.5"/>
  <circle class="bound point" cx="312" cy="275" r="3.5"/>
  <circle class="bound point" cx="312" cy="360" r="3.5"/>

  <!-- Notes -->
  <text class="note good" x="380" y="176">One linestring at each lane line.</text>
  <text class="note good" x="380" y="194">The two lanelets next to it share it.</text>
  <path class="leader" d="M374 172 L252 172"/>
</svg>
