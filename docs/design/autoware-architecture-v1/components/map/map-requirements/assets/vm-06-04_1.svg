<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" role="img" aria-labelledby="vm-06-04_1-title">
  <title id="vm-06-04_1-title">A no stopping zone is a box with hatched markings on the lane. The vehicle must drive through it without stopping.</title>

  <!-- Road: two lanes, left-hand traffic, the vehicle drives to the right in the upper lane -->
  <rect class="road" x="20" y="60" width="820" height="120"/>
  <path class="mark" d="M20 64 H840"/>
  <path class="mark" d="M20 176 H840"/>
  <path class="mark dash" d="M20 120 H840"/>

  <!-- The no stopping zone -->
  <rect class="mark" x="400" y="68" width="220" height="48"/>
  <path class="mark" d="M420 116 L460 68 M470 116 L510 68 M520 116 L560 68 M570 116 L610 68"/>

  <!-- The ego vehicle drives through without stopping -->
  <g transform="translate(209 72) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <path class="route" d="M252 92 H700"/>
  <path class="flow flow-route" pathLength="100" d="M252 92 H700"/>
  <path class="route head" d="M252 92 H700"/>

  <path class="leader" d="M500 30 L506 64"/>
  <text class="note" x="506" y="24" dominant-baseline="central">No stopping zone</text>
</svg>
