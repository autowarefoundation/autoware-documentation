<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="vm-03-02-2-title">
  <title id="vm-03-02-2-title">The lanelets of a T-junction. The lanelet that turns left has turn_direction left. The lanelet that goes straight through the junction has turn_direction straight. The right bound of the left-turn lanelet has no paint, so it is a linestring of type virtual.</title>

  <!-- Roads -->
  <rect class="road" x="170" y="40" width="420" height="120"/>
  <rect class="road" x="320" y="159" width="120" height="241"/>
  <path class="road" d="M320 160 L304 160 A16 16 0 0 1 320 176 Z"/>
  <path class="road" d="M440 160 L456 160 A16 16 0 0 0 440 176 Z"/>

  <!-- Sidewalks -->
  <rect class="sidewalk" x="170" y="28" width="420" height="12"/>
  <rect class="sidewalk" x="170" y="160" width="134" height="12"/>
  <rect class="sidewalk" x="456" y="160" width="134" height="12"/>
  <rect class="sidewalk" x="308" y="176" width="12" height="224"/>
  <rect class="sidewalk" x="440" y="176" width="12" height="224"/>
  <path class="sidewalk" d="M304 160 A16 16 0 0 1 320 176 L308 176 A4 4 0 0 0 304 172 Z"/>
  <path class="sidewalk" d="M456 160 A16 16 0 0 0 440 176 L452 176 A4 4 0 0 1 456 172 Z"/>

  <!-- Lane markings -->
  <path class="mark dash" d="M170 100 L590 100"/>
  <path class="mark dash" d="M380 180 L380 400"/>
  <path class="mark thick" d="M320 180 L380 180"/>

  <!-- Lanelets -->
  <path class="lanelet alt" d="M320 180 L380 180 L380 400 L320 400 Z"/>
  <path class="lanelet alt" d="M460 100 L590 100 L590 160 L460 160 Z"/>
  <path class="lanelet alt" d="M300 100 L170 100 L170 160 L300 160 Z"/>
  <path class="lanelet" d="M300 100 L460 100 L460 160 L300 160 Z"/>
  <path class="lanelet" d="M320 180 A20 20 0 0 0 300 160 L300 100 A80 80 0 0 1 380 180 Z"/>

  <!-- The virtual linestring and the points -->
  <path class="bound alt" fill="none" d="M380 180 A80 80 0 0 0 300 100"/>
  <circle class="bound point" cx="320" cy="180" r="4"/>
  <circle class="bound point" cx="380" cy="180" r="4"/>
  <circle class="bound point" cx="300" cy="160" r="4"/>
  <circle class="bound point" cx="300" cy="100" r="4"/>
  <circle class="bound point" cx="460" cy="160" r="4"/>
  <circle class="bound point" cx="460" cy="100" r="4"/>
  <circle class="bound point" cx="320" cy="400" r="4"/>
  <circle class="bound point" cx="380" cy="400" r="4"/>

  <!-- Directions of travel -->
  <path class="route" d="M350 370 L350 300"/>
  <path class="route" d="M570 130 L490 130"/>
  <path class="route" d="M280 130 L200 130"/>

  <!-- Notes -->
  <text class="note" x="60" y="236"><tspan x="60">Lanelet</tspan><tspan class="code" x="60" dy="17">turn_direction: left</tspan></text>
  <path class="leader" d="M112.9 232 L330 152"/>
  <text class="note" x="560" y="236"><tspan x="560">Lanelet</tspan><tspan class="code" x="560" dy="17">turn_direction: straight</tspan></text>
  <path class="leader" d="M554 232 L420 150"/>
  <text class="note" x="560" y="312"><tspan x="560">Linestring</tspan><tspan class="code" x="560" dy="17">type: virtual</tspan></text>
  <path class="leader" d="M554 308 L369 140"/>
  <text class="note" x="60" y="312">Lanelet</text>
  <path class="leader" d="M112.9 308 L330 360"/>
</svg>
