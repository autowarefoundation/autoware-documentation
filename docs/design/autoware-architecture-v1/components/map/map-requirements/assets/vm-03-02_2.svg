<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="vm-03-02-2-title">
  <title id="vm-03-02-2-title">
    The lanelets of a T-junction. The lanelet that turns left has turn_direction left. The lanelet that goes straight through the junction has turn_direction straight. The right bound of the left-turn
    lanelet has no paint, so it is a linestring of type virtual.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-flow-tone: 22%; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .aw-d-arrow--route {
  fill: var(--aw-c-green);
} .road {
  fill: #5c6070;
} .sidewalk {
  fill: #b9bcc8;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .route {
  fill: none;
  stroke: var(--aw-c-green);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  marker-end: url("#aw-arrow-route");
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-route {
  stroke: color-mix(in srgb, var(--aw-c-green) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow-route" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--route" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
  </defs>

  <!-- Roads -->
  <rect class="road" x="170" y="40" width="420" height="120"/>
  <rect class="road" x="320" y="159" width="120" height="241"/>
  <path class="road" d="M320 160 L304 160 A16 16 0 0 1 320 176 Z"/>
  <path class="road" d="M440 160 L456 160 A16 16 0 0 0 440 176 Z"/>

  <!-- Sidewalks -->
  <rect class="sidewalk" x="170" y="28" width="420" height="12"/>
  <rect class="sidewalk" x="170" y="160" width="134" height="12"/>
  <rect class="sidewalk" x="456" y="160" width="134" height="12"/>
  <rect class="sidewalk" x="308" y="176" width="12" height="224"/>
  <rect class="sidewalk" x="440" y="176" width="12" height="224"/>
  <path class="sidewalk" d="M304 160 A16 16 0 0 1 320 176 L308 176 A4 4 0 0 0 304 172 Z"/>
  <path class="sidewalk" d="M456 160 A16 16 0 0 0 440 176 L452 176 A4 4 0 0 1 456 172 Z"/>

  <!-- Lane markings -->
  <path class="mark dash" d="M170 100 L590 100"/>
  <path class="mark dash" d="M380 180 L380 400"/>
  <path class="mark thick" d="M320 180 L380 180"/>

  <!-- Lanelets -->
  <path class="lanelet alt" d="M320 180 L380 180 L380 400 L320 400 Z"/>
  <path class="lanelet alt" d="M460 100 L590 100 L590 160 L460 160 Z"/>
  <path class="lanelet alt" d="M300 100 L170 100 L170 160 L300 160 Z"/>
  <path class="lanelet" d="M300 100 L460 100 L460 160 L300 160 Z"/>
  <path class="lanelet" d="M320 180 A20 20 0 0 0 300 160 L300 100 A80 80 0 0 1 380 180 Z"/>

  <!-- The virtual linestring and the points -->
  <path class="bound alt" fill="none" d="M380 180 A80 80 0 0 0 300 100"/>
  <circle class="bound point" cx="320" cy="180" r="4"/>
  <circle class="bound point" cx="380" cy="180" r="4"/>
  <circle class="bound point" cx="300" cy="160" r="4"/>
  <circle class="bound point" cx="300" cy="100" r="4"/>
  <circle class="bound point" cx="460" cy="160" r="4"/>
  <circle class="bound point" cx="460" cy="100" r="4"/>
  <circle class="bound point" cx="320" cy="400" r="4"/>
  <circle class="bound point" cx="380" cy="400" r="4"/>

  <!-- Directions of travel -->
  <path class="route" d="M350 370 L350 300"/>
  <path class="flow flow-route" pathLength="100" d="M350 370 L350 300"/>
  <path class="route head" d="M350 370 L350 300"/>
  <path class="route" d="M570 130 L490 130"/>
  <path class="flow flow-route" pathLength="100" d="M570 130 L490 130"/>
  <path class="route head" d="M570 130 L490 130"/>
  <path class="route" d="M280 130 L200 130"/>
  <path class="flow flow-route" pathLength="100" d="M280 130 L200 130"/>
  <path class="route head" d="M280 130 L200 130"/>

  <!-- Notes -->
  <text class="note" x="60" y="236">
    <tspan x="60">Lanelet</tspan>
    <tspan class="code" x="60" dy="17">turn_direction: left</tspan>
  </text>
  <path class="leader" d="M112.9 232 L330 152"/>
  <text class="note" x="560" y="236">
    <tspan x="560">Lanelet</tspan>
    <tspan class="code" x="560" dy="17">turn_direction: straight</tspan>
  </text>
  <path class="leader" d="M554 232 L420 150"/>
  <text class="note" x="560" y="312">
    <tspan x="560">Linestring</tspan>
    <tspan class="code" x="560" dy="17">type: virtual</tspan>
  </text>
  <path class="leader" d="M554 308 L369 140"/>
  <text class="note" x="60" y="312">Lanelet</text>
  <path class="leader" d="M112.9 308 L330 360"/>
</svg>
