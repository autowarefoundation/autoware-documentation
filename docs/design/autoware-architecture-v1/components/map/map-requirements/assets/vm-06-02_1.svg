<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="vm-06-02_1-title">
  <title id="vm-06-02_1-title">A no parking sign, and a dashed yellow line along the curb of the road.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .sidewalk {
  fill: #b9bcc8;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.yellow {
  stroke: #ffc233;
} .sign {
  fill: #fff;
  stroke: var(--aw-crimson);
  stroke-width: 5;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
}
  </style>

  <!-- The sign -->
  <circle class="sign" cx="170" cy="150" r="56"/>
  <path class="sign" d="M131 111 L209 189"/>
  <text class="note" x="170" y="236" text-anchor="middle" dominant-baseline="central">No parking</text>

  <!-- Road along a sidewalk, with a yellow line along the curb -->
  <rect class="sidewalk" x="320" y="30" width="520" height="70"/>
  <rect class="road" x="320" y="104" width="520" height="150"/>
  <path class="mark yellow dash" d="M320 110 H840"/>
  <path class="mark dash" d="M320 200 H840"/>
</svg>
