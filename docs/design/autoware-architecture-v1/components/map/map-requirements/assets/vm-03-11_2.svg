  <rect class="sidewalk" x="652" y="280" width="88" height="12"/>
  <rect class="sidewalk" x="652" y="148" width="88" height="12"/>
  <path class="sidewalk" d="M652 280 A52 52 0 0 0 600 332 L612 332 A40 40 0 0 1 652 292 Z"/>

  <!-- Lane markings -->
  <path class="mark dash" d="M540 372 L540 430"/>
  <path class="mark" d="M540 332 L540 372"/>
  <path class="mark thick" d="M480 332 L540 332"/>
  <path class="mark dash" d="M388 220 L350 220"/>
  <path class="mark" d="M428 220 L388 220"/>
  <path class="mark thick" d="M428 160 L428 220"/>
  <path class="mark dash" d="M540 68 L540 30"/>
  <path class="mark" d="M540 108 L540 68"/>
  <path class="mark thick" d="M600 108 L540 108"/>
  <path class="mark dash" d="M692 220 L740 220"/>
  <path class="mark" d="M652 220 L692 220"/>
  <path class="mark thick" d="M652 280 L652 220"/>

