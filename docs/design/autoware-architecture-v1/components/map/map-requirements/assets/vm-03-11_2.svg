  <path class="mark thick" d="M570 150 L570 118"/>
  <path class="mark thick" d="M558 150 L558 118"/>
  <path class="mark thick" d="M546 150 L546 118"/>
  <path class="mark thick" d="M534 150 L534 118"/>
  <path class="mark thick" d="M522 150 L522 118"/>
  <path class="mark thick" d="M510 150 L510 118"/>
  <path class="mark thick" d="M498 150 L498 118"/>
  <path class="mark thick" d="M486 150 L486 118"/>
  <path class="mark thick" d="M610 274 L642 274"/>
  <path class="mark thick" d="M610 262 L642 262"/>
  <path class="mark thick" d="M610 250 L642 250"/>
  <path class="mark thick" d="M610 238 L642 238"/>
  <path class="mark thick" d="M610 226 L642 226"/>
  <path class="mark thick" d="M610 214 L642 214"/>
  <path class="mark thick" d="M610 202 L642 202"/>
  <path class="mark thick" d="M610 190 L642 190"/>
  <path class="mark thick" d="M610 178 L642 178"/>
  <path class="mark thick" d="M610 166 L642 166"/>

  <!-- Yield lanes -->
  <path class="lanelet alt" d="M428 160 L652 160 L652 220 L428 220 Z"/>
  <path class="lanelet alt" d="M652 280 L428 280 L428 220 L652 220 Z"/>
  <path class="lanelet alt" d="M600 108 A172 172 0 0 1 428 280 L428 220 A112 112 0 0 0 540 108 Z"/>

  <!-- The lanelet of the ego vehicle -->
  <path class="lanelet" d="M480 332 L480 108 L540 108 L540 332 Z"/>
  <g transform="translate(499 344)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
