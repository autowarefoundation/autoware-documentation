    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>

  <!-- The right_of_way regulatory element -->
  <rect class="box" x="20" y="150" width="210" height="58" rx="10"/>
  <text class="lbl" x="125" y="170" text-anchor="middle" dominant-baseline="central">Regulatory element</text>
  <text class="code" x="125" y="190" text-anchor="middle" dominant-baseline="central">subtype: right_of_way</text>
  <path class="edge" d="M230 160 L561 157"/>
  <text class="edge-lbl" x="329.3" y="159.1" text-anchor="middle" dominant-baseline="central">yield</text>
  <path class="edge" d="M230 170 L436 190"/>
