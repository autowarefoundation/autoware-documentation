  <circle class="bound point" cx="242" cy="370" r="3.5"/>
  <circle class="bound point" cx="242" cy="335" r="3.5"/>
  <circle class="bound point" cx="242.3" cy="312.1" r="3.5"/>
  <path class="bound" d="M264 440 L264 405 L264 370 L264 335 L264.2 313.6"/>
