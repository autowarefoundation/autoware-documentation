<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="vm-01-10_1-title">
  <title id="vm-01-10_1-title">The ego vehicle drives in a wide lane and moves to the right for a short distance, then back to the middle of the lane.</title>

  <!-- Road surface and edge lines -->
  <rect class="road" x="184" y="20" width="144" height="340"/>
  <path class="mark" d="M196 20 V360"/>
  <path class="mark" d="M316 20 V360"/>

  <!-- The ego vehicle and its path -->
  <path class="route" d="M256 308 V260 C256 236 286 236 286 212 V150 C286 126 256 126 256 102 V40"/>
  <path class="flow flow-route" d="M256 308 V260 C256 236 286 236 286 212 V150 C286 126 256 126 256 102 V40" pathLength="100"/>
  <path class="route head" d="M256 308 V260 C256 236 286 236 286 212 V150 C286 126 256 126 256 102 V40"/>
  <g transform="translate(245 310)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
</svg>
