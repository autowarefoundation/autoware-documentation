<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="vm-04-03_1-title">
  <title id="vm-04-03_1-title">
    Two traffic lights with a red, a yellow, and a green lamp and a green right arrow lamp. A light_bulbs linestring connects points 1 to 4 at the centers of the lamps. Point 4 has the tags color
    green and arrow right.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .light-housing {
  fill: #1b1d29;
  stroke: #8d91a0;
  stroke-width: 1.5;
} .light-red {
  fill: #ff3b4e;
} .light-yellow {
  fill: #ffc233;
} .light-green {
  fill: #00e678;
} .light-off {
  fill: #4a4d5c;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>

  <!-- Horizontal traffic light with an arrow lamp under the green lamp -->
  <rect class="light-housing" x="200" y="100" width="200" height="130" rx="12"/>
  <circle class="light-red" cx="240" cy="140" r="22"/>
  <circle class="light-yellow" cx="300" cy="140" r="22"/>
  <circle class="light-green" cx="360" cy="140" r="22"/>
  <circle class="light-off" cx="360" cy="194" r="22"/>
  <path class="light-green" d="M347 189 H361 V181 L375 194 L361 207 V199 H347 Z"/>
  <path class="bound" d="M240 140 H360 V194"/>
  <circle class="bound point" cx="240" cy="140" r="5"/>
  <circle class="bound point" cx="300" cy="140" r="5"/>
  <circle class="bound point" cx="360" cy="140" r="5"/>
  <circle class="bound point" cx="360" cy="194" r="5"/>
  <text class="sub" x="240" y="86" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="sub" x="300" y="86" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="sub" x="412" y="140" dominant-baseline="central">3</text>
  <text class="sub" x="412" y="194" dominant-baseline="central">4</text>

  <path class="leader" d="M164 59 H270 V138"/>
  <text class="note" x="30" y="30" dominant-baseline="central">Linestring</text>
  <text class="code" x="30" y="50" dominant-baseline="central">points: 1-4</text>
  <text class="code" x="30" y="68" dominant-baseline="central">type: light_bulbs</text>

  <path class="leader" d="M150 274 L356 198"/>
  <text class="note" x="30" y="270" dominant-baseline="central">Point 4</text>
  <text class="code" x="30" y="290" dominant-baseline="central">color: green</text>
  <text class="code" x="30" y="308" dominant-baseline="central">arrow: right</text>

  <!-- Vertical traffic light with an arrow lamp right of the green lamp -->
  <rect class="light-housing" x="590" y="40" width="130" height="200" rx="12"/>
  <circle class="light-red" cx="630" cy="80" r="22"/>
  <circle class="light-yellow" cx="630" cy="140" r="22"/>
  <circle class="light-green" cx="630" cy="200" r="22"/>
  <circle class="light-off" cx="684" cy="200" r="22"/>
  <path class="light-green" d="M671 195 H685 V187 L699 200 L685 213 V205 H671 Z"/>
  <path class="bound" d="M630 80 V200 H684"/>
  <circle class="bound point" cx="630" cy="80" r="5"/>
  <circle class="bound point" cx="630" cy="140" r="5"/>
  <circle class="bound point" cx="630" cy="200" r="5"/>
  <circle class="bound point" cx="684" cy="200" r="5"/>
  <text class="sub" x="732" y="80" dominant-baseline="central">1</text>
  <text class="sub" x="732" y="140" dominant-baseline="central">2</text>
  <text class="sub" x="630" y="256" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="sub" x="684" y="256" text-anchor="middle" dominant-baseline="central">4</text>
</svg>
