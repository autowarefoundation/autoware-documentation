<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-03-15-2-title">
  <title id="vm-03-15-2-title">A road with an exclusive bicycle lane on each side, outside the lanes for vehicles.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .sidewalk {
  fill: #b9bcc8;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
}
  </style>

  <!-- Sidewalks and the road -->
  <rect class="sidewalk" x="360" y="20" width="30" height="360"/>
  <rect class="sidewalk" x="570" y="20" width="30" height="360"/>
  <rect class="road" x="390" y="20" width="180" height="360"/>
  <path class="mark" d="M420 20 L420 380"/>
  <path class="mark" d="M540 20 L540 380"/>
  <path class="mark dash" d="M480 20 L480 380"/>
  <text class="note" x="160" y="200">Bicycle lane</text>
  <path class="leader" d="M246.4 196 L405 200"/>
  <path class="leader" d="M246.4 196 L555 240"/>
</svg>
