<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-03-15-2-title">
  <title id="vm-03-15-2-title">A road with an exclusive bicycle lane on each side, outside the lanes for vehicles.</title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .sidewalk {
  fill: #b9bcc8;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .mark-text {
  font-size: 13px;
  font-weight: 700;
  fill: #fff;
} .ped-body {
  fill: url("#aw-grad-car-other");
  stroke: #fff;
  stroke-width: 1;
} .ped-head {
  fill: #ffe1d2;
  stroke: #fff;
  stroke-width: 1;
} .bike-wheel {
  fill: #1b1d29;
} .bike-frame {
  fill: none;
  stroke: #c9ccd8;
  stroke-width: 2;
  stroke-linecap: round;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
}
  </style>
  <defs data-aw-standalone="">
    <linearGradient id="aw-grad-car-other" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a50f2d"/>
      <stop offset="0.5" stop-color="#dc143c"/>
      <stop offset="1" stop-color="#ff6a7c"/>
    </linearGradient>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Sidewalks and the road -->
  <rect class="sidewalk" x="360" y="20" width="30" height="360"/>
  <rect class="sidewalk" x="570" y="20" width="30" height="360"/>
  <rect class="road" x="390" y="20" width="180" height="360"/>
  <path class="mark" d="M420 20 L420 380"/>
  <path class="mark" d="M540 20 L540 380"/>
  <path class="mark dash" d="M480 20 L480 380"/>

  <!-- Bicycle-only paint and a bicycle in each bicycle lane -->
  <text class="mark-text" x="405" y="270" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 405 270)">BICYCLE ONLY</text>
  <text class="mark-text" x="555" y="130" text-anchor="middle" dominant-baseline="central" transform="rotate(90 555 130)">BICYCLE ONLY</text>
  <g transform="translate(385 102) rotate(-90 20 8)">
    <ellipse class="car-shadow" cx="20" cy="10" rx="21" ry="6"/>
    <rect class="bike-wheel" x="0" y="6" width="11" height="4" rx="2"/>
    <rect class="bike-wheel" x="29" y="6" width="11" height="4" rx="2"/>
    <path class="bike-frame" d="M8 8 H32 M30 2 V14"/>
    <ellipse class="ped-body" cx="17" cy="8" rx="5.5" ry="7.5"/>
    <circle class="ped-head" cx="22" cy="8" r="3.6"/>
  </g>
  <g transform="translate(535 292) rotate(90 20 8)">
    <ellipse class="car-shadow" cx="20" cy="10" rx="21" ry="6"/>
    <rect class="bike-wheel" x="0" y="6" width="11" height="4" rx="2"/>
    <rect class="bike-wheel" x="29" y="6" width="11" height="4" rx="2"/>
    <path class="bike-frame" d="M8 8 H32 M30 2 V14"/>
    <ellipse class="ped-body" cx="17" cy="8" rx="5.5" ry="7.5"/>
    <circle class="ped-head" cx="22" cy="8" r="3.6"/>
  </g>

  <!-- Notes -->
  <text class="note" x="340" y="200" text-anchor="end">Bicycle lane</text>
  <path class="leader" d="M344 196 L400 196"/>
  <text class="note" x="620" y="200">Bicycle lane</text>
  <path class="leader" d="M616 196 L560 196"/>
</svg>
