<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="vm-01-03_3-title">
  <title id="vm-01-03_3-title">Incorrect: four lanelets side by side, and each lanelet has its own linestrings. Two linestrings lie at each lane line.</title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.yellow {
  stroke: #ffc233;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .lanelet.bad {
  fill: color-mix(in srgb, var(--aw-crimson) 35%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
}
  </style>

  <!-- Road surface and lane markings -->
  <rect class="road" x="60" y="20" width="264" height="340"/>
  <path class="mark" d="M72 20 V360"/>
  <path class="mark dash" d="M132 20 V360"/>
  <path class="mark yellow" d="M192 20 V360"/>
  <path class="mark dash" d="M252 20 V360"/>
  <path class="mark" d="M312 20 V360"/>

  <!-- Lanelets -->
  <rect class="lanelet" x="72" y="20" width="60" height="340"/>
  <rect class="lanelet alt" x="132" y="20" width="60" height="340"/>
  <rect class="lanelet" x="192" y="20" width="60" height="340"/>
  <rect class="lanelet alt" x="252" y="20" width="60" height="340"/>

  <!-- Linestrings: two at each inner lane line. Cyan belongs to the indigo lanelets, light red to the cyan lanelets. -->
  <path class="bound" d="M72 20 L72 105 L72 190 L72 275 L72 360"/>
  <circle class="bound point" cx="72" cy="20" r="3.5"/>
  <circle class="bound point" cx="72" cy="105" r="3.5"/>
  <circle class="bound point" cx="72" cy="190" r="3.5"/>
  <circle class="bound point" cx="72" cy="275" r="3.5"/>
  <circle class="bound point" cx="72" cy="360" r="3.5"/>
  <path class="bound alt" d="M312 20 L312 105 L312 190 L312 275 L312 360"/>
  <circle class="bound point" cx="312" cy="20" r="3.5"/>
  <circle class="bound point" cx="312" cy="105" r="3.5"/>
  <circle class="bound point" cx="312" cy="190" r="3.5"/>
  <circle class="bound point" cx="312" cy="275" r="3.5"/>
  <circle class="bound point" cx="312" cy="360" r="3.5"/>
  <path class="bound" d="M127 20 L127 105 L127 190 L127 275 L127 360"/>
  <circle class="bound point" cx="127" cy="20" r="3.5"/>
  <circle class="bound point" cx="127" cy="105" r="3.5"/>
  <circle class="bound point" cx="127" cy="190" r="3.5"/>
  <circle class="bound point" cx="127" cy="275" r="3.5"/>
  <circle class="bound point" cx="127" cy="360" r="3.5"/>
  <path class="bound alt" d="M137 20 L137 105 L137 190 L137 275 L137 360"/>
  <circle class="bound point" cx="137" cy="20" r="3.5"/>
  <circle class="bound point" cx="137" cy="105" r="3.5"/>
  <circle class="bound point" cx="137" cy="190" r="3.5"/>
  <circle class="bound point" cx="137" cy="275" r="3.5"/>
  <circle class="bound point" cx="137" cy="360" r="3.5"/>
  <path class="bound alt" d="M187 20 L187 105 L187 190 L187 275 L187 360"/>
  <circle class="bound point" cx="187" cy="20" r="3.5"/>
  <circle class="bound point" cx="187" cy="105" r="3.5"/>
  <circle class="bound point" cx="187" cy="190" r="3.5"/>
  <circle class="bound point" cx="187" cy="275" r="3.5"/>
  <circle class="bound point" cx="187" cy="360" r="3.5"/>
  <path class="bound" d="M197 20 L197 105 L197 190 L197 275 L197 360"/>
  <circle class="bound point" cx="197" cy="20" r="3.5"/>
  <circle class="bound point" cx="197" cy="105" r="3.5"/>
  <circle class="bound point" cx="197" cy="190" r="3.5"/>
  <circle class="bound point" cx="197" cy="275" r="3.5"/>
  <circle class="bound point" cx="197" cy="360" r="3.5"/>
  <path class="bound" d="M247 20 L247 105 L247 190 L247 275 L247 360"/>
  <circle class="bound point" cx="247" cy="20" r="3.5"/>
  <circle class="bound point" cx="247" cy="105" r="3.5"/>
  <circle class="bound point" cx="247" cy="190" r="3.5"/>
  <circle class="bound point" cx="247" cy="275" r="3.5"/>
  <circle class="bound point" cx="247" cy="360" r="3.5"/>
  <path class="bound alt" d="M257 20 L257 105 L257 190 L257 275 L257 360"/>
  <circle class="bound point" cx="257" cy="20" r="3.5"/>
  <circle class="bound point" cx="257" cy="105" r="3.5"/>
  <circle class="bound point" cx="257" cy="190" r="3.5"/>
  <circle class="bound point" cx="257" cy="275" r="3.5"/>
  <circle class="bound point" cx="257" cy="360" r="3.5"/>

  <!-- Notes -->
  <text class="note bad" x="380" y="176">Each lanelet has its own linestrings.</text>
  <text class="note bad" x="380" y="194">The lanelets do not share them.</text>
  <path class="leader" d="M374 172 L257 172"/>
</svg>
