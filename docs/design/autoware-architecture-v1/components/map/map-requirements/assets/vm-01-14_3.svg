<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-14_3-title">
  <title id="vm-01-14_3-title">Incorrect: the narrow road is split into a left part and a right part, with a lanelet in each part.</title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .lanelet.bad {
  fill: color-mix(in srgb, var(--aw-crimson) 35%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
}
  </style>

  <!-- Road surface and lane markings -->
  <rect class="road" x="150" y="20" width="84" height="360"/>
  <path class="mark" d="M162 20 V380"/>
  <path class="mark" d="M222 20 V380"/>

  <!-- Two lanelets side by side -->
  <rect class="lanelet" x="162" y="20" width="30" height="360"/>
  <rect class="lanelet alt" x="192" y="20" width="30" height="360"/>
  <path class="mark" d="M176 310 V250 M169 259 L176 250 L183 259"/>
  <path class="mark" d="M205 250 V310 M198 301 L205 310 L212 301"/>
  <path class="bound" d="M162 20 L162 110 L162 200 L162 290 L162 380"/>
  <circle class="bound point" cx="162" cy="20" r="3.5"/>
  <circle class="bound point" cx="162" cy="110" r="3.5"/>
  <circle class="bound point" cx="162" cy="200" r="3.5"/>
  <circle class="bound point" cx="162" cy="290" r="3.5"/>
  <circle class="bound point" cx="162" cy="380" r="3.5"/>
  <path class="bound" d="M192 20 L192 110 L192 200 L192 290 L192 380"/>
  <circle class="bound point" cx="192" cy="20" r="3.5"/>
  <circle class="bound point" cx="192" cy="110" r="3.5"/>
  <circle class="bound point" cx="192" cy="200" r="3.5"/>
  <circle class="bound point" cx="192" cy="290" r="3.5"/>
  <circle class="bound point" cx="192" cy="380" r="3.5"/>
  <path class="bound" d="M222 20 L222 110 L222 200 L222 290 L222 380"/>
  <circle class="bound point" cx="222" cy="20" r="3.5"/>
  <circle class="bound point" cx="222" cy="110" r="3.5"/>
  <circle class="bound point" cx="222" cy="200" r="3.5"/>
  <circle class="bound point" cx="222" cy="290" r="3.5"/>
  <circle class="bound point" cx="222" cy="380" r="3.5"/>

  <!-- Notes -->
  <text class="note lbl bad" x="280" y="162">Incorrect</text>
  <text class="note bad" x="280" y="184">The road is split into a left part</text>
  <text class="note bad" x="280" y="202">and a right part, and the lanelets</text>
  <text class="note bad" x="280" y="220">are side by side.</text>
  <path class="leader" d="M274 180 L192 180"/>
</svg>
