<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-07_2-title">
  <title id="vm-01-07_2-title">A lanelet on a road with wide edge lines. Each linestring is in the middle of its edge line.</title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.thick {
  stroke-width: 7;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.good {
  fill: var(--aw-c-green);
}
  </style>

  <!-- Road surface and wide edge lines -->
  <rect class="road" x="140" y="20" width="240" height="360"/>
  <path class="mark thick" d="M166 20 V380"/>
  <path class="mark thick" d="M172 20 V380"/>
  <path class="mark thick" d="M178 20 V380"/>
  <path class="mark thick" d="M342 20 V380"/>
  <path class="mark thick" d="M348 20 V380"/>
  <path class="mark thick" d="M354 20 V380"/>

  <!-- The lanelet and its linestrings -->
  <rect class="lanelet" x="172" y="20" width="176" height="360"/>
  <path class="bound" d="M172 20 L172 110 L172 200 L172 290 L172 380"/>
  <circle class="bound point" cx="172" cy="20" r="3.5"/>
  <circle class="bound point" cx="172" cy="110" r="3.5"/>
  <circle class="bound point" cx="172" cy="200" r="3.5"/>
  <circle class="bound point" cx="172" cy="290" r="3.5"/>
  <circle class="bound point" cx="172" cy="380" r="3.5"/>
  <path class="bound" d="M348 20 L348 110 L348 200 L348 290 L348 380"/>
  <circle class="bound point" cx="348" cy="20" r="3.5"/>
  <circle class="bound point" cx="348" cy="110" r="3.5"/>
  <circle class="bound point" cx="348" cy="200" r="3.5"/>
  <circle class="bound point" cx="348" cy="290" r="3.5"/>
  <circle class="bound point" cx="348" cy="380" r="3.5"/>

  <!-- Notes -->
  <text class="note good" x="400" y="194">Each linestring is in the</text>
  <text class="note good" x="400" y="212">middle of its edge line.</text>
  <path class="leader" d="M394 190 L348 190"/>
  <path class="leader" d="M394 190 L366 150 L172 150"/>
</svg>
