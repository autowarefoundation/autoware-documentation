<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="vm-03-08-1-title">
  <title id="vm-03-08-1-title">
    The intersection area is a polygon of type intersection_area. Its boundary follows the road border linestrings at the corners and around the median islands, and the lanelet connection boundaries
    across the roads. The lanelets in the intersection start and end at these connection boundaries.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-green: #00e678; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .road {
  fill: #5c6070;
} .sidewalk {
  fill: #b9bcc8;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .area {
  fill: color-mix(in srgb, var(--aw-green) 25%, transparent);
  stroke: var(--aw-c-green);
  stroke-width: 2;
  stroke-dasharray: 6 4;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
}
  </style>

