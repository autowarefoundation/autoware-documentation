<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="vm-01-15_3-title">
  <title id="vm-01-15_3-title">Incorrect: a road shoulder lanelet on a road that has no road shoulder. The strip outside the edge line is a side strip, and outside it is off road.</title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-indigo: var(--aw-indigo); --aw-crimson: #dc143c; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .shoulder {
  fill: #8d91a0;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.bad {
  fill: color-mix(in srgb, var(--aw-crimson) 35%, transparent);
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
}
  </style>

  <!-- Road surface -->
  <path class="shoulder" d="M82 450 L82 320 A278 278 0 0 1 163.4 123.4 L255.3 31.5 L269.5 45.6 L177.6 137.6 A258 258 0 0 0 102 320 L102 450 Z"/>
  <path class="shoulder" d="M222 450 L222 320 A138 138 0 0 1 262.4 222.4 L354.3 130.5 L368.5 144.6 L276.6 236.6 A118 118 0 0 0 242 320 L242 450 Z"/>
  <path class="road" d="M102 450 L102 320 A258 258 0 0 1 177.6 137.6 L269.5 45.6 L354.3 130.5 L262.4 222.4 A138 138 0 0 0 222 320 L222 450 Z"/>

  <!-- Lane markings -->
  <path class="mark" d="M102 450 L102 320 A258 258 0 0 1 177.6 137.6 L269.5 45.6"/>
  <path class="mark" d="M222 450 L222 320 A138 138 0 0 1 262.4 222.4 L354.3 130.5"/>
  <path class="mark" d="M162 450 L162 320 A198 198 0 0 1 220 180 L311.9 88.1"/>

  <!-- A wrong road shoulder lanelet -->
  <path class="lanelet bad" d="M222 450 L222 320 A138 138 0 0 1 262.4 222.4 L354.3 130.5 L368.5 144.6 L276.6 236.6 A118 118 0 0 0 242 320 L242 450 Z"/>

  <!-- Notes -->
  <text class="note" x="440" y="70">Side strip</text>
  <path class="leader" d="M434 66 L258.2 42.8"/>
  <text class="note" x="440" y="130">Off road</text>
  <path class="leader" d="M434 126 L330.3 247.9"/>
  <text class="note bad" x="440" y="300">This road has no road shoulder.</text>
  <text class="note bad" x="440" y="318">Do not add a road shoulder</text>
  <text class="note bad" x="440" y="336">lanelet here.</text>
  <path class="leader" d="M434 296 L234.6 294.6"/>
</svg>
