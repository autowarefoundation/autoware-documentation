<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-14_1-title">
  <title id="vm-01-14_1-title">A narrow road without a road center line. The ego vehicle drives along it outward, and later drives back on it in the return direction.</title>

  <!-- Road surface and lane markings -->
  <rect class="road" x="150" y="20" width="84" height="360"/>
  <path class="mark" d="M162 20 V380"/>
  <path class="mark" d="M222 20 V380"/>

  <!-- The ego vehicle, outward and on return -->
  <path class="route" d="M192 308 V230"/>
  <path class="flow flow-route" d="M192 308 V230" pathLength="100"/>
  <path class="route head" d="M192 308 V230"/>
  <g transform="translate(181 310)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <path class="route" d="M192 92 V170"/>
  <path class="flow flow-route" d="M192 92 V170" pathLength="100"/>
  <path class="route head" d="M192 92 V170"/>
  <g transform="translate(181 50)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <g transform="rotate(180 11 20)">
      <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
      <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
      <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
      <circle class="lidar" cx="11" cy="22" r="3.2"/>
      <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
      <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
    </g>
  </g>

  <!-- Notes -->
  <text class="note lbl" x="280" y="74">Return</text>
  <text class="note" x="280" y="92">The same vehicle, later</text>
  <path class="leader" d="M274 70 L205 70"/>
  <text class="note lbl" x="280" y="334">Outward</text>
  <path class="leader" d="M274 330 L205 330"/>
</svg>
