<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="vm-05-02_1-title">
  <title id="vm-05-02_1-title">
    A crosswalk with a pedestrian traffic light at each end. The crosswalk lanelet refers to a traffic_light regulatory element, which refers to the traffic_light linestrings of both pedestrian
    lights.
  </title>

  <!-- Road: two lanes -->
  <rect class="road" x="20" y="140" width="560" height="120"/>
  <path class="mark" d="M20 144 H580"/>
  <path class="mark" d="M20 256 H580"/>
  <path class="mark dash" d="M20 200 H360 M440 200 H580"/>
  <path class="mark thick" d="M342 146 V198"/>
  <path class="mark thick" d="M458 202 V254"/>

  <!-- The crosswalk and its lanelet -->
  <path class="mark thick" d="M370 152 H430 M370 168 H430 M370 184 H430 M370 200 H430 M370 216 H430 M370 232 H430 M370 248 H430"/>
  <rect class="lanelet alt" x="378" y="110" width="44" height="180"/>

  <!-- Pedestrian traffic light at the top end -->
  <rect class="light-housing" x="318" y="34" width="34" height="64" rx="6"/>
  <circle class="light-off" cx="335" cy="52" r="11"/>
  <circle class="light-red" cx="335" cy="80" r="11"/>
  <path class="bound" d="M318 106 H352"/>
  <circle class="bound point" cx="318" cy="106" r="4"/>
  <circle class="bound point" cx="352" cy="106" r="4"/>

  <!-- Pedestrian traffic light at the bottom end -->
  <rect class="light-housing" x="448" y="302" width="34" height="64" rx="6"/>
  <circle class="light-off" cx="465" cy="320" r="11"/>
  <circle class="light-red" cx="465" cy="348" r="11"/>
  <path class="bound" d="M448 374 H482"/>
  <circle class="bound point" cx="448" cy="374" r="4"/>
  <circle class="bound point" cx="482" cy="374" r="4"/>

  <!-- Notes -->
  <path class="leader" d="M200 70 L314 104"/>
  <text class="note" x="40" y="40" dominant-baseline="central">Linestring</text>
  <text class="code" x="40" y="60" dominant-baseline="central">type: traffic_light</text>
  <text class="code" x="40" y="78" dominant-baseline="central">subtype: red_green</text>
  <text class="code" x="40" y="96" dominant-baseline="central">height: (value)</text>
  <path class="leader" d="M300 340 L444 372"/>
  <text class="note" x="140" y="330" dominant-baseline="central">Linestring</text>
  <text class="code" x="140" y="350" dominant-baseline="central">type: traffic_light</text>

  <!-- The crosswalk lanelet -->
  <rect class="box" x="620" y="160" width="220" height="80" rx="10"/>
  <text class="lbl" x="730" y="180" text-anchor="middle" dominant-baseline="central">Lanelet</text>
  <text class="code" x="730" y="202" text-anchor="middle" dominant-baseline="central">subtype: crosswalk</text>
  <text class="code" x="730" y="220" text-anchor="middle" dominant-baseline="central">participant:pedestrian: yes</text>
  <path class="leader" d="M620 222 L424 222"/>

  <!-- The regulatory element -->
  <rect class="box primary" x="600" y="30" width="240" height="60" rx="10"/>
  <text class="lbl on-primary" x="720" y="50" text-anchor="middle" dominant-baseline="central">Regulatory element</text>
  <text class="code on-primary" x="720" y="70" text-anchor="middle" dominant-baseline="central">subtype: traffic_light</text>

  <path class="edge" d="M780 160 V98"/>
  <text class="edge-lbl" x="780" y="128" text-anchor="middle" dominant-baseline="central">regulatory_element</text>
  <path class="edge" d="M600 60 L360 102"/>
  <text class="edge-lbl" x="480" y="81" text-anchor="middle" dominant-baseline="central">refers</text>
  <path class="edge" d="M640 90 C620 160 600 300 490 368"/>
  <text class="edge-lbl" x="600" y="300" text-anchor="middle" dominant-baseline="central">refers</text>
</svg>
