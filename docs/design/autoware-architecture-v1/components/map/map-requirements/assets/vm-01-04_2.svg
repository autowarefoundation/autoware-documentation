<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="vm-01-04_2-title">
  <title id="vm-01-04_2-title">Two lanelets in opposite directions share the linestring at the road center line, and they have the same length.</title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.good {
  fill: var(--aw-c-green);
}
  </style>

  <!-- Road surface and lane markings -->
  <rect class="road" x="120" y="20" width="144" height="360"/>
  <path class="mark" d="M132 20 V380"/>
  <path class="mark" d="M192 20 V380"/>
  <path class="mark" d="M252 20 V380"/>

  <!-- Lanelets -->
  <rect class="lanelet" x="132" y="40" width="60" height="320"/>
  <rect class="lanelet alt" x="192" y="40" width="60" height="320"/>
  <path class="mark" d="M162 230 V170 M155 179 L162 170 L169 179"/>
  <path class="mark" d="M222 170 V230 M215 221 L222 230 L229 221"/>

  <!-- Linestrings -->
  <path class="bound" d="M132 40 L132 120 L132 200 L132 280 L132 360"/>
  <circle class="bound point" cx="132" cy="40" r="3.5"/>
  <circle class="bound point" cx="132" cy="120" r="3.5"/>
  <circle class="bound point" cx="132" cy="200" r="3.5"/>
  <circle class="bound point" cx="132" cy="280" r="3.5"/>
  <circle class="bound point" cx="132" cy="360" r="3.5"/>
  <path class="bound" d="M192 40 L192 120 L192 200 L192 280 L192 360"/>
  <circle class="bound point" cx="192" cy="40" r="3.5"/>
  <circle class="bound point" cx="192" cy="120" r="3.5"/>
  <circle class="bound point" cx="192" cy="200" r="3.5"/>
  <circle class="bound point" cx="192" cy="280" r="3.5"/>
  <circle class="bound point" cx="192" cy="360" r="3.5"/>
  <path class="bound" d="M252 40 L252 120 L252 200 L252 280 L252 360"/>
  <circle class="bound point" cx="252" cy="40" r="3.5"/>
  <circle class="bound point" cx="252" cy="120" r="3.5"/>
  <circle class="bound point" cx="252" cy="200" r="3.5"/>
  <circle class="bound point" cx="252" cy="280" r="3.5"/>
  <circle class="bound point" cx="252" cy="360" r="3.5"/>

  <!-- Length of the lanelets -->
  <path class="leader" d="M276 40 L288 40"/>
  <path class="leader" d="M276 360 L288 360"/>
  <path class="leader" d="M282 40 L282 360"/>

  <!-- Notes -->
  <text class="note good" x="330" y="104">The two lanelets use</text>
  <text class="note good" x="330" y="122">the same linestring.</text>
  <path class="leader" d="M324 100 L194 120"/>
  <text class="note good" x="330" y="284">The two lanelets have</text>
  <text class="note good" x="330" y="302">the same length.</text>
  <path class="leader" d="M324 280 L282 280"/>
</svg>
