<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="features-crosswalk-title">
  <title id="features-crosswalk-title">A pedestrian walks onto a crosswalk, so the ego vehicle stops before the crosswalk.</title>
  <rect class="sidewalk" x="0" y="14" width="760" height="30"/>

  <!-- Road: two lanes in the same direction. The ego lane is on top. -->
  <rect class="road" x="0" y="44" width="760" height="120"/>
  <line class="mark" x1="0" y1="50" x2="760" y2="50"/>
  <line class="mark" x1="0" y1="158" x2="760" y2="158"/>
  <line class="mark dash" x1="0" y1="104" x2="760" y2="104"/>

  <!-- Crosswalk stripes -->
  <line class="mark thick" x1="500" y1="60" x2="548" y2="60"/>
  <line class="mark thick" x1="500" y1="82" x2="548" y2="82"/>
  <line class="mark thick" x1="500" y1="104" x2="548" y2="104"/>
  <line class="mark thick" x1="500" y1="126" x2="548" y2="126"/>
  <line class="mark thick" x1="500" y1="148" x2="548" y2="148"/>

  <!-- Area after the stop point -->
  <rect class="lanelet bad" x="480" y="63" width="240" height="28"/>

  <!-- Pedestrian who walks onto the crosswalk -->
  <circle class="car other" cx="524" cy="11" r="6"/>
  <rect class="car other" x="518" y="18" width="12" height="18" rx="5"/>
  <path class="edge accent" d="M540 30 L540 64"/>

  <!-- Planned path and stop point -->
  <path class="route" d="M150 77 H460"/>
  <line class="bound alt" x1="480" y1="56" x2="480" y2="98"/>

  <!-- Ego vehicle -->
  <g>
    <rect class="car" x="78" y="62" width="64" height="30" rx="6"/>
    <rect class="glass" x="120" y="66" width="9" height="22" rx="3"/>
  </g>
  <text class="note" x="470" y="184" text-anchor="end" dominant-baseline="central">Stop before the crosswalk</text>
  <line class="leader" x1="480" y1="176" x2="480" y2="100"/>
</svg>
