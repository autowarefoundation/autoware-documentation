<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 730" role="img" aria-labelledby="high-level-planning-diagram-title">
  <title id="high-level-planning-diagram-title">The high-level design of the planning component: mission planning, behavior and motion planning modules, and validation, with inputs from other components and the trajectory output to Control.</title>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="730"/>
  <circle class="halo" cx="517" cy="365" r="220"/>
  <circle class="halo cyan" cx="700" cy="171" r="120"/>
  <circle class="halo cyan" cx="330" cy="574" r="110"/>

  <!-- API layer -->
  <rect class="box muted" x="190" y="16" width="654" height="46" rx="12"/>
  <text class="lbl" x="517" y="39" text-anchor="middle" dominant-baseline="central">API layer</text>

  <!-- Other components on the left -->
  <rect class="box muted" x="16" y="120" width="130" height="50" rx="12"/>
  <text class="lbl" x="81" y="145" text-anchor="middle" dominant-baseline="central">Map</text>
  <rect class="box muted" x="16" y="200" width="130" height="60" rx="12"/>
  <text class="lbl" x="81" y="221" text-anchor="middle" dominant-baseline="central">Human machine</text>
  <text class="lbl" x="81" y="241" text-anchor="middle" dominant-baseline="central">interface</text>
  <rect class="box muted" x="16" y="310" width="130" height="50" rx="12"/>
  <text class="lbl" x="81" y="335" text-anchor="middle" dominant-baseline="central">Perception</text>
  <rect class="box muted" x="16" y="420" width="130" height="50" rx="12"/>
  <text class="lbl" x="81" y="445" text-anchor="middle" dominant-baseline="central">Localization</text>
  <rect class="box muted" x="16" y="530" width="130" height="50" rx="12"/>
  <text class="lbl" x="81" y="555" text-anchor="middle" dominant-baseline="central">System</text>

  <!-- Planning component -->
  <rect class="glass-panel" x="190" y="92" width="654" height="540" rx="18"/>
  <text class="ttl" x="208" y="116">Planning component</text>

  <!-- Mission planning -->
  <rect class="glass-panel" x="208" y="128" width="618" height="86" rx="18"/>
  <circle class="icon-bg" cx="238" cy="148" r="12"/>
  <path class="icon-line" d="M234 155 V141 H243 L240.5 144.5 L243 148 H234"/>
  <text class="ttl" x="258" y="152">Mission planning</text>
  <rect class="card" x="226" y="166" width="140" height="32" rx="10"/>
  <text class="sub" x="296" y="182" text-anchor="middle" dominant-baseline="central">Route planning</text>
  <rect class="card" x="378" y="166" width="140" height="32" rx="10"/>
  <text class="sub" x="448" y="182" text-anchor="middle" dominant-baseline="central">Goal planning</text>
  <rect class="box ext" x="530" y="166" width="140" height="32" rx="10"/>
  <text class="sub" x="600" y="182" text-anchor="middle" dominant-baseline="central">More modules</text>

  <!-- Planning modules: behavior and motion -->
  <rect class="glass-panel" x="208" y="246" width="618" height="238" rx="18"/>
  <circle class="icon-bg" cx="238" cy="266" r="12"/>
  <path class="icon-line" d="M233 272 C233 266 243 266 243 260"/>
  <circle class="icon-dot" cx="233" cy="272" r="2.2"/>
  <circle class="icon-dot" cx="243" cy="260" r="2.2"/>
  <text class="ttl" x="258" y="270">Planning modules</text>
  <text class="sub" x="226" y="288" text-anchor="start" dominant-baseline="central">Behavior</text>
  <rect class="card" x="226" y="300" width="140" height="32" rx="10"/>
  <text class="sub" x="296" y="316" text-anchor="middle" dominant-baseline="central">Lane change</text>
  <rect class="card" x="378" y="300" width="140" height="32" rx="10"/>
  <text class="sub" x="448" y="316" text-anchor="middle" dominant-baseline="central">Intersection</text>
  <rect class="card" x="530" y="300" width="140" height="32" rx="10"/>
  <text class="sub" x="600" y="316" text-anchor="middle" dominant-baseline="central">Crosswalk</text>
  <rect class="card" x="682" y="300" width="140" height="32" rx="10"/>
  <text class="sub" x="752" y="316" text-anchor="middle" dominant-baseline="central">Stop line</text>
  <rect class="card" x="226" y="340" width="140" height="32" rx="10"/>
  <text class="sub" x="296" y="356" text-anchor="middle" dominant-baseline="central">Avoidance</text>
  <rect class="card" x="378" y="340" width="140" height="32" rx="10"/>
  <text class="sub" x="448" y="356" text-anchor="middle" dominant-baseline="central">Pull over</text>
  <rect class="card" x="530" y="340" width="140" height="32" rx="10"/>
  <text class="sub" x="600" y="356" text-anchor="middle" dominant-baseline="central">Parking</text>
  <rect class="box ext" x="682" y="340" width="140" height="32" rx="10"/>
  <text class="sub" x="752" y="356" text-anchor="middle" dominant-baseline="central">More modules</text>
  <text class="sub" x="226" y="392" text-anchor="start" dominant-baseline="central">Motion</text>
  <rect class="card" x="226" y="404" width="140" height="32" rx="10"/>
  <text class="sub" x="296" y="420" text-anchor="middle" dominant-baseline="central">Path planning</text>
  <rect class="card" x="378" y="404" width="140" height="32" rx="10"/>
  <text class="sub" x="448" y="420" text-anchor="middle" dominant-baseline="central">Velocity planning</text>
  <rect class="card" x="530" y="404" width="140" height="32" rx="10"/>
  <text class="sub" x="600" y="420" text-anchor="middle" dominant-baseline="central">Drivable area</text>
  <rect class="card" x="682" y="404" width="140" height="32" rx="10"/>
  <text class="sub" x="752" y="420" text-anchor="middle" dominant-baseline="central">Free space</text>
  <rect class="card" x="226" y="444" width="140" height="32" rx="10"/>
  <text class="sub" x="296" y="460" text-anchor="middle" dominant-baseline="central">Obstacle stop</text>
  <rect class="card" x="378" y="444" width="140" height="32" rx="10"/>
  <text class="sub" x="448" y="460" text-anchor="middle" dominant-baseline="central">Slow down</text>
  <rect class="card" x="530" y="444" width="140" height="32" rx="10"/>
  <text class="sub" x="600" y="460" text-anchor="middle" dominant-baseline="central">ML planner</text>
  <rect class="box ext" x="682" y="444" width="140" height="32" rx="10"/>
  <text class="sub" x="752" y="460" text-anchor="middle" dominant-baseline="central">More modules</text>

  <!-- Validation -->
  <rect class="glass-panel" x="208" y="516" width="618" height="98" rx="18"/>
  <circle class="icon-bg" cx="238" cy="536" r="12"/>
  <path class="icon-line" d="M238 529 L244 531.5 V536 Q244 541 238 543 Q232 541 232 536 V531.5 Z"/>
  <text class="ttl" x="258" y="540">Validation</text>
  <rect class="card" x="226" y="558" width="140" height="32" rx="10"/>
  <text class="sub" x="296" y="574" text-anchor="middle" dominant-baseline="central">Collision check</text>
  <rect class="card" x="378" y="558" width="140" height="32" rx="10"/>
  <text class="sub" x="448" y="574" text-anchor="middle" dominant-baseline="central">TTC check</text>
  <rect class="card" x="530" y="558" width="140" height="32" rx="10"/>
  <text class="sub" x="600" y="574" text-anchor="middle" dominant-baseline="central">Comfort check</text>
  <rect class="box ext" x="682" y="558" width="140" height="32" rx="10"/>
  <text class="sub" x="752" y="574" text-anchor="middle" dominant-baseline="central">More modules</text>

  <!-- Flow inside the planning component -->
  <path class="edge accent" d="M517 214 V240"/>
  <path class="flow flow-accent" pathLength="100" d="M517 214 V240"/>
  <path class="edge accent head" d="M517 214 V240"/>
  <path class="edge accent" d="M517 484 V510"/>
  <path class="flow flow-accent" pathLength="100" d="M517 484 V510"/>
  <path class="edge accent head" d="M517 484 V510"/>

  <!-- Control component -->
  <rect class="box muted" x="190" y="670" width="654" height="46" rx="12"/>
  <text class="lbl" x="517" y="693" text-anchor="middle" dominant-baseline="central">Control</text>
  <path class="edge accent" d="M517 632 V664"/>
  <path class="flow flow-accent" pathLength="100" d="M517 632 V664"/>
  <path class="edge accent head" d="M517 632 V664"/>
  <text class="edge-lbl" x="517" y="648" text-anchor="middle" dominant-baseline="central">Trajectory</text>

  <!-- API layer to and from planning -->
  <path class="edge" d="M400 62 V86"/>
  <path class="flow" pathLength="100" d="M400 62 V86"/>
  <path class="edge head" d="M400 62 V86"/>
  <path class="edge" d="M640 92 V68"/>
  <path class="flow" pathLength="100" d="M640 92 V68"/>
  <path class="edge head" d="M640 92 V68"/>

  <!-- Other components to and from planning -->
  <path class="edge" d="M146 145 H184"/>
  <path class="flow" pathLength="100" d="M146 145 H184"/>
  <path class="edge head" d="M146 145 H184"/>
  <path class="edge both" d="M146 230 H184"/>
  <path class="edge" d="M146 335 H184"/>
  <path class="flow" pathLength="100" d="M146 335 H184"/>
  <path class="edge head" d="M146 335 H184"/>
  <path class="edge" d="M146 445 H184"/>
  <path class="flow" pathLength="100" d="M146 445 H184"/>
  <path class="edge head" d="M146 445 H184"/>
  <path class="edge both" d="M146 555 H184"/>
</svg>
