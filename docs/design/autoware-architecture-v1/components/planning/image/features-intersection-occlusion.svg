<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="features-intersection-occlusion-title">
  <title id="features-intersection-occlusion-title">A large vehicle hides part of the oncoming lane, so the ego vehicle waits before it turns right across that lane.</title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-cyan: #0098c7; --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-crimson: #dc143c; --aw-cyan: #00c8ff; --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-flow-tone: 22%; --aw-green: #00e678; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .aw-d-arrow--route {
  fill: var(--aw-c-green);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.yellow {
  stroke: #ffc233;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .lanelet.bad {
  fill: color-mix(in srgb, var(--aw-crimson) 35%, transparent);
} .area {
  fill: color-mix(in srgb, var(--aw-green) 25%, transparent);
  stroke: var(--aw-c-green);
  stroke-width: 2;
  stroke-dasharray: 6 4;
} .area.warn {
  fill: color-mix(in srgb, var(--aw-crimson) 22%, transparent);
  stroke: var(--aw-c-crimson);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .route {
  fill: none;
  stroke: var(--aw-c-green);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  marker-end: url("#aw-arrow-route");
} .light-housing {
  fill: #1b1d29;
  stroke: #8d91a0;
  stroke-width: 1.5;
} .light-green {
  fill: #00e678;
} .light-off {
  fill: #4a4d5c;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-route {
  stroke: color-mix(in srgb, var(--aw-c-green) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} .car-body {
  fill: url("#aw-grad-car");
} .car-body.other {
  fill: url("#aw-grad-car-other");
} .car-body.npc {
  fill: url("#aw-grad-car-npc");
} .truck-box {
  fill: url("#aw-grad-truck");
  stroke: #ffffffb3;
  stroke-width: 1;
} .truck-rib {
  fill: none;
  stroke: #8d91a0;
  stroke-width: 1;
  opacity: 0.6;
} .car-glass {
  fill: url("#aw-grad-car-glass");
  stroke: #ffffffb3;
  stroke-width: 1;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
} .headlight {
  fill: #9ff3ff;
  filter: url("#aw-glow");
} .lidar {
  fill: url("#aw-grad-ai");
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-route" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--route" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <filter id="aw-glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.35" stop-color="#3f2ee3"/>
      <stop offset="0.75" stop-color="#2a6df2"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-npc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f6375"/>
      <stop offset="0.5" stop-color="#8d91a0"/>
      <stop offset="1" stop-color="#b9bcc8"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-other" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a50f2d"/>
      <stop offset="0.5" stop-color="#dc143c"/>
      <stop offset="1" stop-color="#ff6a7c"/>
    </linearGradient>
    <linearGradient id="aw-grad-truck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb2c0"/>
      <stop offset="0.5" stop-color="#eceef4"/>
      <stop offset="1" stop-color="#b9bcc8"/>
    </linearGradient>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Crossroad. Traffic keeps to the left. The ego lane is the upper lane of the horizontal road. -->
  <rect class="road" x="0" y="130" width="760" height="120"/>
  <rect class="road" x="400" y="0" width="120" height="330"/>
  <line class="mark" x1="0" y1="136" x2="400" y2="136"/>
  <line class="mark" x1="520" y1="136" x2="760" y2="136"/>
  <line class="mark" x1="0" y1="244" x2="400" y2="244"/>
  <line class="mark" x1="520" y1="244" x2="760" y2="244"/>
  <line class="mark" x1="406" y1="0" x2="406" y2="130"/>
  <line class="mark" x1="406" y1="250" x2="406" y2="330"/>
  <line class="mark" x1="514" y1="0" x2="514" y2="130"/>
  <line class="mark" x1="514" y1="250" x2="514" y2="330"/>
  <line class="mark yellow" x1="0" y1="190" x2="400" y2="190"/>
  <line class="mark yellow" x1="520" y1="190" x2="760" y2="190"/>
  <line class="mark yellow" x1="460" y1="0" x2="460" y2="130"/>
  <line class="mark yellow" x1="460" y1="250" x2="460" y2="330"/>

  <!-- Traffic light: green -->
  <rect class="light-housing" x="312" y="94" width="76" height="28" rx="8"/>
  <circle class="light-green" cx="330" cy="108" r="8"/>
  <circle class="light-off" cx="350" cy="108" r="8"/>
  <circle class="light-off" cx="370" cy="108" r="8"/>

  <!-- Area that the large vehicle hides from the ego vehicle -->
  <path class="area warn" d="M640 196 L760 160 V244 H640 Z"/>

  <!-- Large vehicle in the oncoming lane -->
  <g class="truck" transform="translate(568 162) rotate(270 17 55)">
    <rect class="car-shadow" x="0" y="1" width="34" height="110" rx="6"/>
    <rect class="truck-box" x="0" y="30" width="34" height="80" rx="4"/>
    <path class="truck-rib" d="M3 46 H31 M3 62 H31 M3 78 H31 M3 94 H31"/>
    <rect class="car-body npc" x="1" y="0" width="32" height="28" rx="8"/>
    <path class="car-glass" d="M5 9 Q17 5.5 29 9 L27 16 Q17 14 7 16 Z"/>
  </g>

  <!-- Hidden vehicle -->
  <g transform="translate(701 197) rotate(270 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body other" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>
  <path class="edge accent dash" d="M676 217 L650 217"/>

  <!-- Turn that the ego vehicle must not start yet -->
  <path class="lanelet bad" d="M400 149 H400 A101 101 0 0 1 501 250 V316 H473 V250 A73 73 0 0 0 400 177 H400 Z"/>

  <!-- Planned path and stop point -->
  <path class="route" d="M320 163 H384"/>
  <path class="flow flow-route" pathLength="100" d="M320 163 H384"/>
  <path class="route head" d="M320 163 H384"/>
  <line class="bound alt" x1="398" y1="140" x2="398" y2="186"/>

  <!-- Ego vehicle -->
  <g transform="translate(269 143) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <text class="note" x="585" y="290" text-anchor="middle" dominant-baseline="central">Large vehicle</text>
  <line class="leader" x1="585" y1="280" x2="585" y2="236"/>
  <text class="note" x="700" y="290" text-anchor="middle" dominant-baseline="central">Occluded area</text>
  <line class="leader" x1="700" y1="280" x2="700" y2="246"/>
  <text class="note" x="390" y="290" text-anchor="end" dominant-baseline="central">Wait before the turn</text>
  <line class="leader" x1="380" y1="280" x2="398" y2="188"/>
</svg>
