<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="features-intersection-occlusion-title">
  <title id="features-intersection-occlusion-title">A large vehicle hides part of the oncoming lane, so the ego vehicle waits before it turns right across that lane.</title>

  <!-- Crossroad. Traffic keeps to the left. The ego lane is the upper lane of the horizontal road. -->
  <rect class="road" x="0" y="130" width="760" height="120"/>
  <rect class="road" x="400" y="0" width="120" height="330"/>
  <line class="mark" x1="0" y1="136" x2="400" y2="136"/>
  <line class="mark" x1="520" y1="136" x2="760" y2="136"/>
  <line class="mark" x1="0" y1="244" x2="400" y2="244"/>
  <line class="mark" x1="520" y1="244" x2="760" y2="244"/>
  <line class="mark" x1="406" y1="0" x2="406" y2="130"/>
  <line class="mark" x1="406" y1="250" x2="406" y2="330"/>
  <line class="mark" x1="514" y1="0" x2="514" y2="130"/>
  <line class="mark" x1="514" y1="250" x2="514" y2="330"/>
  <line class="mark yellow" x1="0" y1="190" x2="400" y2="190"/>
  <line class="mark yellow" x1="520" y1="190" x2="760" y2="190"/>
  <line class="mark yellow" x1="460" y1="0" x2="460" y2="130"/>
  <line class="mark yellow" x1="460" y1="250" x2="460" y2="330"/>

  <!-- Traffic light: green -->
  <rect class="light-housing" x="312" y="94" width="76" height="28" rx="8"/>
  <circle class="light-green" cx="330" cy="108" r="8"/>
  <circle class="light-off" cx="350" cy="108" r="8"/>
  <circle class="light-off" cx="370" cy="108" r="8"/>

  <!-- Area that the large vehicle hides from the ego vehicle -->
  <path class="area warn" d="M640 196 L760 160 V244 H640 Z"/>

  <!-- Large vehicle in the oncoming lane -->
  <g class="truck" transform="translate(568 162) rotate(270 17 55)">
    <rect class="car-shadow" x="0" y="1" width="34" height="110" rx="6"/>
    <rect class="truck-box" x="0" y="30" width="34" height="80" rx="4"/>
    <path class="truck-rib" d="M3 46 H31 M3 62 H31 M3 78 H31 M3 94 H31"/>
    <rect class="car-body npc" x="1" y="0" width="32" height="28" rx="8"/>
    <path class="car-glass" d="M5 9 Q17 5.5 29 9 L27 16 Q17 14 7 16 Z"/>
  </g>

  <!-- Hidden vehicle -->
  <g transform="translate(701 197) rotate(270 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body other" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>
  <path class="edge accent dash" d="M676 217 L650 217"/>

  <!-- Turn that the ego vehicle must not start yet -->
  <path class="lanelet bad" d="M400 149 H400 A101 101 0 0 1 501 250 V316 H473 V250 A73 73 0 0 0 400 177 H400 Z"/>

  <!-- Planned path and stop point -->
  <path class="route" d="M320 163 H384"/>
  <path class="flow flow-route" pathLength="100" d="M320 163 H384"/>
  <path class="route head" d="M320 163 H384"/>
  <line class="bound alt" x1="398" y1="140" x2="398" y2="186"/>

  <!-- Ego vehicle -->
  <g transform="translate(269 143) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <text class="note" x="585" y="290" text-anchor="middle" dominant-baseline="central">Large vehicle</text>
  <line class="leader" x1="585" y1="280" x2="585" y2="236"/>
  <text class="note" x="700" y="290" text-anchor="middle" dominant-baseline="central">Occluded area</text>
  <line class="leader" x1="700" y1="280" x2="700" y2="246"/>
  <text class="note" x="390" y="290" text-anchor="end" dominant-baseline="central">Wait before the turn</text>
  <line class="leader" x1="380" y1="280" x2="398" y2="188"/>
</svg>
