<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1110" role="img" aria-labelledby="planning-diagram-title">
  <title id="planning-diagram-title">The reference implementation of the planning component: mission planning, scenario planning with lane driving and parking, the velocity smoother, and the planning validator, with the Diffusion Planner as an optional trajectory source.</title>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="1110"/>
  <circle class="halo" cx="306" cy="500" r="230"/>
  <circle class="halo cyan" cx="706" cy="450" r="120"/>
  <circle class="halo" cx="432" cy="930" r="120"/>

  <!-- Input from the AD API -->
  <rect class="box muted" x="176" y="16" width="260" height="54" rx="12"/>
  <text class="lbl" x="306" y="34" text-anchor="middle" dominant-baseline="central">AD API</text>
  <text class="sub" x="306" y="54" text-anchor="middle" dominant-baseline="central">Goal, checkpoints, velocity limit</text>

  <!-- Planning component -->
  <rect class="glass-panel" x="10" y="92" width="840" height="936" rx="18"/>
  <text class="ttl" x="28" y="116">Planning</text>

  <!-- Mission planning -->
  <rect class="glass-panel" x="24" y="128" width="812" height="90" rx="18"/>
  <text class="ttl" x="42" y="152">Mission planning</text>
  <rect class="card" x="176" y="152" width="260" height="50" rx="12"/>
  <circle class="icon-bg" cx="200" cy="177" r="14"/>
  <path class="icon-line" d="M196 184 V170 H205 L202.5 173.5 L205 177 H196"/>
  <text class="lbl" x="306" y="168" text-anchor="middle" dominant-baseline="central">mission_planner</text>
  <text class="sub" x="306" y="188" text-anchor="middle" dominant-baseline="central">Route on the lanelet map</text>
  <path class="edge" d="M306 70 V146"/>
  <path class="flow" pathLength="100" d="M306 70 V146"/>
  <path class="edge head" d="M306 70 V146"/>

  <!-- Scenario planning: the default trajectory source (planning_setting:=rule_based) -->
  <rect class="glass-panel" x="24" y="236" width="812" height="674" rx="18"/>
  <text class="ttl" x="42" y="260">Scenario planning</text>
  <text class="sub" x="42" y="278">Default trajectory source: planning_setting:=rule_based</text>

  <!-- Lane driving scenario -->
  <rect class="glass-panel" x="38" y="292" width="536" height="438" rx="18"/>
  <text class="ttl" x="56" y="316">Lane driving</text>
  <rect class="glass-panel" x="52" y="334" width="508" height="160" rx="18"/>
  <text class="ttl" x="70" y="358">Behavior planning</text>
  <rect class="card" x="72" y="368" width="468" height="46" rx="12"/>
  <circle class="icon-bg" cx="94" cy="391" r="14"/>
  <path class="icon-line" d="M94 398 V392 L89 386 M94 392 L99 386"/>
  <circle class="icon-dot" cx="89" cy="386" r="2"/>
  <circle class="icon-dot" cx="99" cy="386" r="2"/>
  <text class="lbl" x="306" y="382" text-anchor="middle" dominant-baseline="central">behavior_path_planner</text>
  <text class="sub" x="306" y="402" text-anchor="middle" dominant-baseline="central">Path and drivable area: lane change, avoidance, start, goal, ...</text>
  <rect class="card" x="72" y="438" width="468" height="46" rx="12"/>
  <circle class="icon-bg" cx="94" cy="461" r="14"/>
  <rect class="icon-line" x="89.5" y="452.5" width="9" height="17" rx="3"/>
  <circle class="icon-dot" cx="94" cy="457" r="1.7"/>
  <circle class="icon-dot" cx="94" cy="461" r="1.7"/>
  <circle class="icon-dot" cx="94" cy="465" r="1.7"/>
  <text class="lbl" x="306" y="452" text-anchor="middle" dominant-baseline="central">behavior_velocity_planner</text>
  <text class="sub" x="306" y="472" text-anchor="middle" dominant-baseline="central">Velocity for traffic rules: crosswalk, intersection, traffic light, ...</text>
  <path class="edge" d="M306 414 V432"/>
  <path class="flow" pathLength="100" d="M306 414 V432"/>
  <path class="edge head" d="M306 414 V432"/>
  <path class="edge accent" d="M306 202 V362"/>
  <path class="flow flow-accent" pathLength="100" d="M306 202 V362"/>
  <path class="edge accent head" d="M306 202 V362"/>
  <text class="edge-lbl" x="306" y="314" text-anchor="middle" dominant-baseline="central">Route</text>

  <!-- Motion planning -->
  <rect class="glass-panel" x="52" y="510" width="508" height="210" rx="18"/>
  <text class="ttl" x="70" y="534">Motion planning</text>
  <rect class="card" x="72" y="544" width="250" height="40" rx="12"/>
  <circle class="icon-bg" cx="92" cy="564" r="12"/>
  <path class="icon-line" d="M85 567 Q92 556 99 567"/>
  <circle class="icon-dot" cx="85" cy="567" r="1.8"/>
  <circle class="icon-dot" cx="92" cy="561.5" r="1.8"/>
  <circle class="icon-dot" cx="99" cy="567" r="1.8"/>
  <text class="lbl" x="197" y="564" text-anchor="middle" dominant-baseline="central">elastic_band_smoother</text>
  <rect class="card" x="72" y="608" width="250" height="40" rx="12"/>
  <circle class="icon-bg" cx="92" cy="628" r="12"/>
  <path class="icon-line" d="M87 634 C87 628 97 628 97 622"/>
  <circle class="icon-dot" cx="87" cy="634" r="2.2"/>
  <circle class="icon-dot" cx="97" cy="622" r="2.2"/>
  <text class="lbl" x="197" y="628" text-anchor="middle" dominant-baseline="central">path_optimizer</text>
  <rect class="card" x="72" y="672" width="250" height="40" rx="12"/>
  <circle class="icon-bg" cx="92" cy="692" r="12"/>
  <path class="icon-line" d="M85 695 A7 7 0 0 1 99 695"/>
  <path class="icon-line" d="M92 695 L95.5 689.5"/>
  <circle class="icon-dot" cx="92" cy="695" r="1.8"/>
  <text class="lbl" x="197" y="692" text-anchor="middle" dominant-baseline="central">motion_velocity_planner</text>
  <rect class="box muted" x="344" y="602" width="200" height="52" rx="12"/>
  <text class="lbl" x="444" y="619" text-anchor="middle" dominant-baseline="central">surround_obstacle_checker</text>
  <text class="sub" x="444" y="639" text-anchor="middle" dominant-baseline="central">Optional, off by default</text>
  <path class="edge accent" d="M197 484 V538"/>
  <path class="flow flow-accent" pathLength="100" d="M197 484 V538"/>
  <path class="edge accent head" d="M197 484 V538"/>
  <text class="edge-lbl" x="197" y="500" text-anchor="middle" dominant-baseline="central">Path</text>
  <path class="edge" d="M197 584 V602"/>
  <path class="flow" pathLength="100" d="M197 584 V602"/>
  <path class="edge head" d="M197 584 V602"/>
  <path class="edge" d="M197 648 V666"/>
  <path class="flow" pathLength="100" d="M197 648 V666"/>
  <path class="edge head" d="M197 648 V666"/>

  <!-- Parking scenario -->
  <rect class="glass-panel" x="590" y="292" width="232" height="438" rx="18"/>
  <text class="ttl" x="608" y="316">Parking</text>
  <rect class="card" x="606" y="364" width="200" height="46" rx="12"/>
  <text class="lbl" x="706" y="378" text-anchor="middle" dominant-baseline="central">costmap_generator</text>
  <text class="sub" x="706" y="398" text-anchor="middle" dominant-baseline="central">Occupancy grid</text>
  <rect class="card" x="606" y="480" width="200" height="46" rx="12"/>
  <text class="lbl" x="706" y="494" text-anchor="middle" dominant-baseline="central">freespace_planner</text>
  <text class="sub" x="706" y="514" text-anchor="middle" dominant-baseline="central">Path in free space</text>
  <path class="edge" d="M706 410 V474"/>
  <path class="flow" pathLength="100" d="M706 410 V474"/>
  <path class="edge head" d="M706 410 V474"/>
  <path class="edge" d="M436 177 H814 V503 H812"/>
  <path class="flow" pathLength="100" d="M436 177 H814 V503 H812"/>
  <path class="edge head" d="M436 177 H814 V503 H812"/>
  <text class="edge-lbl" x="620" y="177" text-anchor="middle" dominant-baseline="central">Route</text>

  <!-- Scenario selection and velocity smoothing -->
  <rect class="card" x="304" y="754" width="256" height="46" rx="12"/>
  <circle class="icon-bg" cx="328" cy="777" r="14"/>
  <path class="icon-line" d="M321 777 H326 L333 772 M326 777 L333 782"/>
  <circle class="icon-dot" cx="333" cy="772" r="2"/>
  <circle class="icon-dot" cx="333" cy="782" r="2"/>
  <text class="lbl" x="432" y="768" text-anchor="middle" dominant-baseline="central">scenario_selector</text>
  <text class="sub" x="432" y="788" text-anchor="middle" dominant-baseline="central">Lane driving or parking</text>
  <rect class="card" x="304" y="838" width="256" height="46" rx="12"/>
  <circle class="icon-bg" cx="328" cy="861" r="14"/>
  <path class="icon-line" d="M321 866 C327 866 329 856 335 856"/>
  <text class="lbl" x="432" y="852" text-anchor="middle" dominant-baseline="central">velocity_smoother</text>
  <text class="sub" x="432" y="872" text-anchor="middle" dominant-baseline="central">Velocity, acceleration, jerk</text>
  <rect class="box muted" x="38" y="838" width="250" height="46" rx="12"/>
  <text class="lbl" x="163" y="861" text-anchor="middle" dominant-baseline="central">external_velocity_limit_selector</text>
  <path class="edge accent" d="M322 692 H432 V748"/>
  <path class="flow flow-accent" pathLength="100" d="M322 692 H432 V748"/>
  <path class="edge accent head" d="M322 692 H432 V748"/>
  <path class="edge accent" d="M706 526 V777 H566"/>
  <path class="flow flow-accent" pathLength="100" d="M706 526 V777 H566"/>
  <path class="edge accent head" d="M706 526 V777 H566"/>
  <path class="edge accent" d="M432 800 V832"/>
  <path class="flow flow-accent" pathLength="100" d="M432 800 V832"/>
  <path class="edge accent head" d="M432 800 V832"/>
  <path class="edge" d="M288 861 H298"/>
  <path class="flow" pathLength="100" d="M288 861 H298"/>
  <path class="edge head" d="M288 861 H298"/>
  <text class="edge-lbl" x="163" y="808" text-anchor="middle" dominant-baseline="central">Velocity limits from the AD API and modules</text>
  <path class="edge" d="M163 818 V832"/>
  <path class="flow" pathLength="100" d="M163 818 V832"/>
  <path class="edge head" d="M163 818 V832"/>

  <!-- Validation -->
  <rect class="glass-panel" x="24" y="926" width="550" height="86" rx="18"/>
  <text class="ttl" x="42" y="950">Validation</text>
  <rect class="box primary" x="304" y="948" width="256" height="50" rx="12"/>
  <circle class="icon-bg on" cx="330" cy="973" r="15"/>
  <path class="icon-line" d="M330 966 L336 968.5 V973 Q336 978 330 980 Q324 978 324 973 V968.5 Z"/>
  <path class="icon-line" d="M327.5 973 L329.5 975 L333 971"/>
  <text class="lbl on-primary" x="432" y="964" text-anchor="middle" dominant-baseline="central">planning_validator</text>
  <text class="sub on-primary" x="432" y="984" text-anchor="middle" dominant-baseline="central">Checker plugins</text>
  <path class="edge accent" d="M432 884 V942"/>
  <path class="flow flow-accent" pathLength="100" d="M432 884 V942"/>
  <path class="edge accent head" d="M432 884 V942"/>

  <!-- Optional learning-based trajectory source -->
  <rect class="group ai dashed" x="590" y="926" width="246" height="86" rx="16"/>
  <text class="ttl" x="608" y="950">Learning-based</text>
  <rect class="card ai" x="606" y="954" width="214" height="46" rx="12"/>
  <text class="lbl" x="713" y="968" text-anchor="middle" dominant-baseline="central">Diffusion Planner</text>
  <text class="sub" x="713" y="988" text-anchor="middle" dominant-baseline="central">planning_setting:=diffusion_planner</text>
  <path class="edge dash" d="M606 977 H566"/>

  <!-- Output to Control -->
  <rect class="box muted" x="232" y="1050" width="400" height="46" rx="12"/>
  <text class="lbl" x="432" y="1064" text-anchor="middle" dominant-baseline="central">Control</text>
  <text class="sub" x="432" y="1084" text-anchor="middle" dominant-baseline="central">/planning/trajectory</text>
  <path class="edge accent" d="M432 998 V1044"/>
  <path class="flow flow-accent" pathLength="100" d="M432 998 V1044"/>
  <path class="edge accent head" d="M432 998 V1044"/>
</svg>
