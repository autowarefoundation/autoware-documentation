<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1120" role="img" aria-labelledby="planning-diagram-title">
  <title id="planning-diagram-title">
    The reference implementation of the planning component: mission planning, scenario planning with lane driving and parking, the velocity smoother, and the planning validator, with the Diffusion
    Planner as an optional trajectory source.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-group: color-mix(in
    srgb, var(--aw-c-indigo) 6%, var(--md-default-bg-color)); --aw-d-group-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 25%, transparent); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 14%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-cyan) 70%, transparent);
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} .group {
  fill: var(--aw-d-group);
  stroke: var(--aw-d-group-stroke);
  stroke-width: 1.5;
} .group.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 7%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-cyan) 45%, transparent);
} .group.dashed {
  stroke-dasharray: 7 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .card.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 8%, var(--aw-d-node));
  stroke: color-mix(in srgb, var(--aw-c-cyan) 65%, transparent);
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.ai {
  fill: url("#aw-grad-ai");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="1120"/>
  <circle class="halo" cx="306" cy="500" r="230"/>
  <circle class="halo cyan" cx="706" cy="450" r="120"/>
  <circle class="halo" cx="432" cy="940" r="120"/>

  <!-- Inputs from the AD API and from the other components -->
  <rect class="box muted" x="176" y="16" width="260" height="54" rx="12"/>
  <text class="lbl" x="306" y="34" text-anchor="middle" dominant-baseline="central">AD API</text>
  <text class="sub" x="306" y="54" text-anchor="middle" dominant-baseline="central">Goal, checkpoints, velocity limit</text>
  <rect class="box muted" x="456" y="16" width="380" height="54" rx="12"/>
  <text class="lbl" x="646" y="34" text-anchor="middle" dominant-baseline="central">Map, perception, localization, HMI</text>
  <text class="sub" x="646" y="54" text-anchor="middle" dominant-baseline="central">Lanes, objects, obstacles, traffic lights, ego state, approvals</text>
  <path class="edge" d="M646 70 V90"/>

  <!-- Planning component -->
  <rect class="glass-panel" x="10" y="92" width="840" height="946" rx="18"/>
  <text class="ttl" x="28" y="116">Planning</text>

  <!-- Mission planning -->
  <rect class="glass-panel" x="24" y="128" width="812" height="90" rx="18"/>
  <text class="ttl" x="42" y="152">Mission planning</text>
  <rect class="card" x="176" y="152" width="260" height="50" rx="12"/>
  <circle class="icon-bg" cx="200" cy="177" r="14"/>
  <path class="icon-line" d="M196 184 V170 H205 L202.5 173.5 L205 177 H196"/>
  <text class="lbl" x="306" y="168" text-anchor="middle" dominant-baseline="central">mission_planner</text>
  <text class="sub" x="306" y="188" text-anchor="middle" dominant-baseline="central">Route on the lanelet map</text>
  <path class="edge" d="M306 70 V146"/>
  <path class="flow" pathLength="100" d="M306 70 V146"/>
  <path class="edge head" d="M306 70 V146"/>
  <text class="edge-lbl" x="306" y="110" text-anchor="middle" dominant-baseline="central">Goal, checkpoints</text>

  <!-- Scenario planning: the default trajectory source (planning_setting:=rule_based) -->
  <rect class="glass-panel" x="24" y="236" width="812" height="684" rx="18"/>
  <text class="ttl" x="42" y="260">Scenario planning</text>
  <text class="sub" x="796" y="260" text-anchor="end">Default trajectory source: planning_setting:=rule_based</text>

  <!-- Lane driving scenario -->
  <rect class="glass-panel" x="38" y="292" width="536" height="448" rx="18"/>
  <text class="ttl" x="56" y="316">Lane driving</text>
  <rect class="glass-panel" x="52" y="334" width="508" height="160" rx="18"/>
  <text class="ttl" x="70" y="358">Behavior planning</text>
  <rect class="card" x="72" y="368" width="468" height="46" rx="12"/>
  <circle class="icon-bg" cx="94" cy="391" r="14"/>
  <path class="icon-line" d="M94 398 V392 L89 386 M94 392 L99 386"/>
  <circle class="icon-dot" cx="89" cy="386" r="2"/>
  <circle class="icon-dot" cx="99" cy="386" r="2"/>
  <text class="lbl" x="306" y="382" text-anchor="middle" dominant-baseline="central">behavior_path_planner</text>
  <text class="sub" x="306" y="402" text-anchor="middle" dominant-baseline="central">Path and drivable area: lane change, avoidance, start, goal, ...</text>
  <rect class="card" x="72" y="438" width="468" height="46" rx="12"/>
  <circle class="icon-bg" cx="94" cy="461" r="14"/>
  <rect class="icon-line" x="89.5" y="452.5" width="9" height="17" rx="3"/>
  <circle class="icon-dot" cx="94" cy="457" r="1.7"/>
  <circle class="icon-dot" cx="94" cy="461" r="1.7"/>
  <circle class="icon-dot" cx="94" cy="465" r="1.7"/>
  <text class="lbl" x="306" y="452" text-anchor="middle" dominant-baseline="central">behavior_velocity_planner</text>
  <text class="sub" x="306" y="472" text-anchor="middle" dominant-baseline="central">Velocity for traffic rules: crosswalk, intersection, traffic light, ...</text>
  <path class="edge" d="M306 414 V432"/>
  <path class="flow" pathLength="100" d="M306 414 V432"/>
  <path class="edge head" d="M306 414 V432"/>
  <path class="edge accent" d="M306 202 V362"/>
  <path class="flow flow-accent" pathLength="100" d="M306 202 V362"/>
  <path class="edge accent head" d="M306 202 V362"/>
  <text class="edge-lbl" x="306" y="314" text-anchor="middle" dominant-baseline="central">Route</text>

  <!-- Motion planning -->
  <rect class="glass-panel" x="52" y="510" width="508" height="220" rx="18"/>
  <text class="ttl" x="70" y="534">Motion planning</text>
  <rect class="card" x="290" y="544" width="250" height="40" rx="12"/>
  <circle class="icon-bg" cx="310" cy="564" r="12"/>
  <path class="icon-line" d="M303 567 Q310 556 317 567"/>
  <circle class="icon-dot" cx="303" cy="567" r="1.8"/>
  <circle class="icon-dot" cx="310" cy="561.5" r="1.8"/>
  <circle class="icon-dot" cx="317" cy="567" r="1.8"/>
  <text class="lbl" x="425" y="564" text-anchor="middle" dominant-baseline="central">elastic_band_smoother</text>
  <rect class="card" x="290" y="608" width="250" height="40" rx="12"/>
  <circle class="icon-bg" cx="310" cy="628" r="12"/>
  <path class="icon-line" d="M305 634 C305 628 315 628 315 622"/>
  <circle class="icon-dot" cx="305" cy="634" r="2.2"/>
  <circle class="icon-dot" cx="315" cy="622" r="2.2"/>
  <text class="lbl" x="425" y="628" text-anchor="middle" dominant-baseline="central">path_optimizer</text>
  <rect class="card" x="290" y="672" width="250" height="46" rx="12"/>
  <circle class="icon-bg" cx="310" cy="695" r="12"/>
  <path class="icon-line" d="M303 698 A7 7 0 0 1 317 698"/>
  <path class="icon-line" d="M310 698 L313.5 692.5"/>
  <circle class="icon-dot" cx="310" cy="698" r="1.8"/>
  <text class="lbl" x="425" y="686" text-anchor="middle" dominant-baseline="central">motion_velocity_planner</text>
  <text class="sub" x="425" y="706" text-anchor="middle" dominant-baseline="central">Obstacle stop, slow down, cruise, ...</text>
  <rect class="box muted" x="72" y="600" width="200" height="52" rx="12"/>
  <text class="lbl" x="172" y="617" text-anchor="middle" dominant-baseline="central">surround_obstacle_checker</text>
  <text class="sub" x="172" y="637" text-anchor="middle" dominant-baseline="central">Optional, off by default</text>
  <path class="edge accent" d="M415 484 V538"/>
  <path class="flow flow-accent" pathLength="100" d="M415 484 V538"/>
  <path class="edge accent head" d="M415 484 V538"/>
  <text class="edge-lbl" x="423" y="524" dominant-baseline="central">Path</text>
  <path class="edge" d="M415 584 V602"/>
  <path class="flow" pathLength="100" d="M415 584 V602"/>
  <path class="edge head" d="M415 584 V602"/>
  <path class="edge" d="M415 648 V666"/>
  <path class="flow" pathLength="100" d="M415 648 V666"/>
  <path class="edge head" d="M415 648 V666"/>

  <!-- Parking scenario -->
  <rect class="glass-panel" x="590" y="292" width="232" height="448" rx="18"/>
  <text class="ttl" x="608" y="316">Parking</text>
  <rect class="card" x="606" y="364" width="200" height="46" rx="12"/>
  <text class="lbl" x="706" y="378" text-anchor="middle" dominant-baseline="central">costmap_generator</text>
  <text class="sub" x="706" y="398" text-anchor="middle" dominant-baseline="central">Occupancy grid</text>
  <rect class="card" x="606" y="480" width="200" height="46" rx="12"/>
  <text class="lbl" x="706" y="494" text-anchor="middle" dominant-baseline="central">freespace_planner</text>
  <text class="sub" x="706" y="514" text-anchor="middle" dominant-baseline="central">Path in free space</text>
  <path class="edge" d="M706 410 V474"/>
  <path class="flow" pathLength="100" d="M706 410 V474"/>
  <path class="edge head" d="M706 410 V474"/>
  <path class="edge" d="M436 177 H814 V503 H812"/>
  <path class="flow" pathLength="100" d="M436 177 H814 V503 H812"/>
  <path class="edge head" d="M436 177 H814 V503 H812"/>
  <text class="edge-lbl" x="620" y="177" text-anchor="middle" dominant-baseline="central">Route</text>

  <!-- Scenario selection and velocity smoothing -->
  <rect class="card" x="304" y="764" width="256" height="46" rx="12"/>
  <circle class="icon-bg" cx="328" cy="787" r="14"/>
  <path class="icon-line" d="M321 787 H326 L333 782 M326 787 L333 792"/>
  <circle class="icon-dot" cx="333" cy="782" r="2"/>
  <circle class="icon-dot" cx="333" cy="792" r="2"/>
  <text class="lbl" x="432" y="778" text-anchor="middle" dominant-baseline="central">scenario_selector</text>
  <text class="sub" x="432" y="798" text-anchor="middle" dominant-baseline="central">Lane driving or parking</text>
  <rect class="card" x="304" y="848" width="256" height="46" rx="12"/>
  <circle class="icon-bg" cx="328" cy="871" r="14"/>
  <path class="icon-line" d="M321 876 C327 876 329 866 335 866"/>
  <text class="lbl" x="432" y="862" text-anchor="middle" dominant-baseline="central">velocity_smoother</text>
  <text class="sub" x="432" y="882" text-anchor="middle" dominant-baseline="central">Velocity, acceleration, jerk</text>
  <rect class="box muted" x="38" y="848" width="250" height="46" rx="12"/>
  <text class="lbl" x="163" y="871" text-anchor="middle" dominant-baseline="central">external_velocity_limit_selector</text>
  <path class="edge accent" d="M415 718 V758"/>
  <path class="flow flow-accent" pathLength="100" d="M415 718 V758"/>
  <path class="edge accent head" d="M415 718 V758"/>
  <text class="edge-lbl" x="423" y="750" dominant-baseline="central">Trajectory</text>
  <path class="edge accent" d="M706 526 V798 H566"/>
  <path class="flow flow-accent" pathLength="100" d="M706 526 V798 H566"/>
  <path class="edge accent head" d="M706 526 V798 H566"/>
  <text class="edge-lbl" x="706" y="760" text-anchor="middle" dominant-baseline="central">Trajectory</text>
  <path class="edge" d="M624 776 H566"/>
  <text class="edge-lbl" x="628" y="776" dominant-baseline="central">Route</text>
  <path class="edge accent" d="M432 810 V842"/>
  <path class="flow flow-accent" pathLength="100" d="M432 810 V842"/>
  <path class="edge accent head" d="M432 810 V842"/>
  <path class="edge" d="M288 871 H298"/>
  <path class="flow" pathLength="100" d="M288 871 H298"/>
  <path class="edge head" d="M288 871 H298"/>
  <path class="edge dash" d="M230 652 V842"/>
  <text class="edge-lbl" x="230" y="800" text-anchor="middle" dominant-baseline="central">Velocity limit</text>
  <text class="edge-lbl" x="100" y="814" text-anchor="middle" dominant-baseline="central">AD API, other modules</text>
  <path class="edge" d="M100 826 V842"/>

  <!-- Validation -->
  <rect class="glass-panel" x="24" y="936" width="550" height="86" rx="18"/>
  <text class="ttl" x="42" y="960">Validation</text>
  <rect class="box primary" x="304" y="958" width="256" height="50" rx="12"/>
  <circle class="icon-bg on" cx="330" cy="983" r="15"/>
  <path class="icon-line" d="M330 976 L336 978.5 V983 Q336 988 330 990 Q324 988 324 983 V978.5 Z"/>
  <path class="icon-line" d="M327.5 983 L329.5 985 L333 981"/>
  <text class="lbl on-primary" x="432" y="974" text-anchor="middle" dominant-baseline="central">planning_validator</text>
  <text class="sub on-primary" x="432" y="994" text-anchor="middle" dominant-baseline="central">Checker plugins</text>
  <path class="edge accent" d="M432 894 V952"/>
  <path class="flow flow-accent" pathLength="100" d="M432 894 V952"/>
  <path class="edge accent head" d="M432 894 V952"/>

  <!-- Optional learning-based trajectory source -->
  <rect class="group ai dashed" x="590" y="936" width="246" height="86" rx="16"/>
  <text class="ttl" x="608" y="960">Learning-based</text>
  <rect class="card ai" x="606" y="964" width="214" height="46" rx="12"/>
  <text class="lbl" x="713" y="978" text-anchor="middle" dominant-baseline="central">Diffusion Planner</text>
  <text class="sub" x="713" y="998" text-anchor="middle" dominant-baseline="central">planning_setting:=diffusion_planner</text>
  <path class="edge dash" d="M606 987 H566"/>

  <!-- Output to Control -->
  <rect class="box muted" x="232" y="1060" width="400" height="46" rx="12"/>
  <text class="lbl" x="432" y="1074" text-anchor="middle" dominant-baseline="central">Control</text>
  <text class="sub" x="432" y="1094" text-anchor="middle" dominant-baseline="central">/planning/trajectory</text>
  <path class="edge accent" d="M432 1008 V1054"/>
  <path class="flow flow-accent" pathLength="100" d="M432 1008 V1054"/>
  <path class="edge accent head" d="M432 1008 V1054"/>
</svg>
