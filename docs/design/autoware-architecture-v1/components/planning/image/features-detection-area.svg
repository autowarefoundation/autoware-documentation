<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="features-detection-area-title">
  <title id="features-detection-area-title">An object is in a detection area of the map, so the ego vehicle stops at the stop line that belongs to the area.</title>

  <!-- Road: two lanes in the same direction. The ego lane is on top. -->
  <rect class="road" x="0" y="44" width="760" height="120"/>
  <line class="mark" x1="0" y1="50" x2="760" y2="50"/>
  <line class="mark" x1="0" y1="158" x2="760" y2="158"/>
  <line class="mark dash" x1="0" y1="104" x2="760" y2="104"/>

  <!-- Detection area of the map -->
  <path class="area" d="M520 112 L640 110 L670 150 L540 156 Z"/>

  <!-- Objects in the detection area -->
  <g class="obstacle">
    <ellipse class="car-shadow" cx="570" cy="146" rx="13" ry="3"/>
    <rect class="cone-base" x="557" y="141" width="26" height="5" rx="2"/>
    <path class="cone" d="M570 121 L580 142 H560 Z"/>
    <path class="cone-stripe" d="M564.6 132.5 H575.4"/>
  </g>
  <g class="pedestrian">
    <ellipse class="car-shadow" cx="620" cy="149" rx="8" ry="2.5"/>
    <path class="ped-body" d="M613 148 V137 Q613 130 620 130 Q627 130 627 137 V148 Z"/>
    <circle class="ped-head" cx="620" cy="123" r="5.5"/>
  </g>

  <!-- Stop line of the detection area -->
  <line class="mark thick" x1="480" y1="52" x2="480" y2="102"/>

  <!-- Area after the stop line -->
  <rect class="lanelet bad" x="490" y="63" width="230" height="28"/>

  <!-- Planned path up to the stop line -->
  <path class="route" d="M150 77 H466"/>
  <path class="flow flow-route" pathLength="100" d="M150 77 H466"/>
  <path class="route head" d="M150 77 H466"/>

  <!-- Ego vehicle -->
  <g transform="translate(99 57) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <text class="note" x="480" y="24" text-anchor="middle" dominant-baseline="central">Stop line</text>
  <line class="leader" x1="480" y1="32" x2="480" y2="52"/>
  <text class="note" x="600" y="184" text-anchor="middle" dominant-baseline="central">Detection area with objects</text>
  <line class="leader" x1="600" y1="176" x2="600" y2="155"/>
</svg>
