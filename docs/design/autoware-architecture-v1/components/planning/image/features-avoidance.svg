<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="features-avoidance-title">
  <title id="features-avoidance-title">A parked vehicle blocks part of the ego lane, so the ego vehicle plans a path that moves around it.</title>

  <!-- Road: two lanes in the same direction. The ego lane is on top. -->
  <rect class="road" x="0" y="44" width="760" height="120"/>
  <line class="mark" x1="0" y1="50" x2="760" y2="50"/>
  <line class="mark" x1="0" y1="158" x2="760" y2="158"/>
  <line class="mark dash" x1="0" y1="104" x2="760" y2="104"/>

  <!-- Parked vehicle at the road edge -->
  <g>
    <rect class="car npc" x="368" y="47" width="64" height="30" rx="6"/>
    <rect class="glass" x="410" y="51" width="9" height="22" rx="3"/>
  </g>

  <!-- Planned path: shift to the side, pass, and return -->
  <path class="route" d="M150 77 H250 C310 77 310 112 360 112 H450 C500 112 500 77 560 77 H700"/>

  <!-- Ego vehicle -->
  <g>
    <rect class="car" x="78" y="62" width="64" height="30" rx="6"/>
    <rect class="glass" x="120" y="66" width="9" height="22" rx="3"/>
  </g>
  <text class="note" x="400" y="24" text-anchor="middle" dominant-baseline="central">Parked vehicle</text>
  <line class="leader" x1="400" y1="32" x2="400" y2="47"/>
  <text class="note" x="420" y="184" text-anchor="middle" dominant-baseline="central">Avoidance path</text>
  <line class="leader" x1="420" y1="176" x2="420" y2="116"/>
</svg>
