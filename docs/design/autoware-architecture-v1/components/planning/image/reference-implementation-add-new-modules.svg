  <rect class="box ext" x="370.7" y="830" width="118.7" height="24" rx="8"/>
  <text class="sub" x="430" y="842" text-anchor="middle" dominant-baseline="central">New checker</text>
  <path class="edge accent" d="M430 740 V758"/>
  <path class="flow flow-accent" pathLength="100" d="M430 740 V758"/>
  <path class="edge accent head" d="M430 740 V758"/>
  <text class="edge-lbl" x="446" y="749" dominant-baseline="central">trajectory</text>

  <!-- Output to the control component -->
  <path class="edge accent" d="M624 814 H720"/>
  <path class="flow flow-accent" pathLength="100" d="M624 814 H720"/>
