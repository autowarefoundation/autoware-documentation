<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="features-cut-in-title">
  <title id="features-cut-in-title">A vehicle from the next lane cuts in between the ego vehicle and the vehicle ahead, so the ego vehicle slows down.</title>

  <!-- Road: two lanes in the same direction. The ego lane is on top. -->
  <rect class="road" x="0" y="44" width="760" height="120"/>
  <line class="mark" x1="0" y1="50" x2="760" y2="50"/>
  <line class="mark" x1="0" y1="158" x2="760" y2="158"/>
  <line class="mark dash" x1="0" y1="104" x2="760" y2="104"/>

  <!-- Vehicle ahead -->
  <g>
    <rect class="car npc" x="568" y="62" width="64" height="30" rx="6"/>
    <rect class="glass" x="610" y="66" width="9" height="22" rx="3"/>
  </g>
  <path class="edge accent" d="M640 77 L710 77"/>

  <!-- Vehicle that cuts in from the next lane -->
  <g transform="rotate(-14 380 118)">
    <rect class="car other" x="348" y="103" width="64" height="30" rx="6"/>
    <rect class="glass" x="390" y="107" width="9" height="22" rx="3"/>
  </g>
  <path class="edge accent" d="M420 108 L480 92"/>

  <!-- Section where the ego vehicle slows down -->
  <rect class="lanelet alt" x="280" y="63" width="260" height="28"/>

  <!-- Planned path -->
  <path class="route" d="M150 77 H540"/>

  <!-- Ego vehicle -->
  <g>
    <rect class="car" x="78" y="62" width="64" height="30" rx="6"/>
    <rect class="glass" x="120" y="66" width="9" height="22" rx="3"/>
  </g>
  <text class="note" x="380" y="184" text-anchor="middle" dominant-baseline="central">Vehicle that cuts in</text>
  <line class="leader" x1="380" y1="176" x2="380" y2="134"/>
  <text class="note" x="410" y="24" text-anchor="middle" dominant-baseline="central">Slow down and keep a gap</text>
  <line class="leader" x1="410" y1="32" x2="410" y2="62"/>
</svg>
