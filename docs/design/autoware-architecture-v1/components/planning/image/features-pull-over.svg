<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="features-pull-over-title">
  <title id="features-pull-over-title">The goal is on the road shoulder, so the ego vehicle pulls over from the lane to the shoulder and stops at the goal.</title>

  <!-- Road shoulder -->
  <rect class="shoulder" x="0" y="14" width="760" height="30"/>

  <!-- Road: two lanes in the same direction. The ego lane is on top. -->
  <rect class="road" x="0" y="44" width="760" height="120"/>
  <line class="mark" x1="0" y1="50" x2="760" y2="50"/>
  <line class="mark" x1="0" y1="158" x2="760" y2="158"/>
  <line class="mark dash" x1="0" y1="104" x2="760" y2="104"/>

  <!-- Planned path: from the lane to the shoulder -->
  <path class="route" d="M150 77 H260 C340 77 340 29 420 29 H520"/>
  <path class="flow flow-route" pathLength="100" d="M150 77 H260 C340 77 340 29 420 29 H520"/>
  <path class="route head" d="M150 77 H260 C340 77 340 29 420 29 H520"/>

  <!-- Ego vehicle -->
  <g transform="translate(99 57) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>

  <!-- Goal -->
  <circle class="bound point" cx="540" cy="29" r="6"/>
  <text class="note" x="560" y="184" text-anchor="middle" dominant-baseline="central">Goal on the shoulder</text>
  <line class="leader" x1="560" y1="176" x2="542" y2="36"/>
  <text class="note" x="330" y="184" text-anchor="middle" dominant-baseline="central">Pull over path</text>
  <line class="leader" x1="330" y1="176" x2="330" y2="70"/>
</svg>
