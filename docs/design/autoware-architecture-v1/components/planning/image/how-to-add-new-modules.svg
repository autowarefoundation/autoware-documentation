  <text class="lbl" x="716" y="246" text-anchor="middle" dominant-baseline="central">Third-party</text>
  <text class="lbl" x="716" y="266" text-anchor="middle" dominant-baseline="central">planning component</text>
  <path class="edge accent" d="M716 414 V436"/>
  <path class="flow flow-accent" pathLength="100" d="M716 414 V436"/>
