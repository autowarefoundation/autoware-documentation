  <text class="lbl" x="430" y="18" text-anchor="middle" dominant-baseline="central">2. Replace a sub-component</text>
  <rect class="box muted" x="310" y="38" width="240" height="36" rx="12"/>
  <text class="lbl" x="430" y="56" text-anchor="middle" dominant-baseline="central">API layer</text>
  <path class="edge" d="M430 74 V90"/>
  <path class="flow" pathLength="100" d="M430 74 V90"/>
  <path class="edge head" d="M430 74 V90"/>
  <rect class="glass-panel" x="294" y="96" width="272" height="318" rx="18"/>
  <text class="ttl" x="312" y="120">Planning</text>
  <rect class="box ext" x="306" y="136" width="248" height="62" rx="12"/>
