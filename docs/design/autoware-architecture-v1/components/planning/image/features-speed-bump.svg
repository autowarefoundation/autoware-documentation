<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="features-speed-bump-title">
  <title id="features-speed-bump-title">A speed bump is on the road, so the ego vehicle slows down before it and while it drives over it.</title>

  <!-- Road: two lanes in the same direction. The ego lane is on top. -->
  <rect class="road" x="0" y="44" width="760" height="120"/>
  <line class="mark" x1="0" y1="50" x2="760" y2="50"/>
  <line class="mark" x1="0" y1="158" x2="760" y2="158"/>
  <line class="mark dash" x1="0" y1="104" x2="760" y2="104"/>

  <!-- Section where the ego vehicle slows down -->
  <rect class="lanelet alt" x="380" y="63" width="240" height="28"/>

  <!-- Speed bump across the road -->
  <rect class="shoulder" x="500" y="50" width="20" height="108" rx="4"/>

  <!-- Planned path -->
  <path class="route" d="M150 77 H700"/>

  <!-- Ego vehicle -->
  <g>
    <rect class="car" x="78" y="62" width="64" height="30" rx="6"/>
    <rect class="glass" x="120" y="66" width="9" height="22" rx="3"/>
  </g>
  <text class="note" x="510" y="24" text-anchor="middle" dominant-baseline="central">Speed bump</text>
  <line class="leader" x1="510" y1="32" x2="510" y2="50"/>
  <text class="note" x="440" y="184" text-anchor="middle" dominant-baseline="central">Slow down</text>
  <line class="leader" x1="440" y1="176" x2="440" y2="92"/>
</svg>
