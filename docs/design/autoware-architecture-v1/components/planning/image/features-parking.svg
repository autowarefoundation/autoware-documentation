<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="features-parking-title">
  <title id="features-parking-title">The ego vehicle drives forward in a parking lot, then reverses into an empty parking space.</title>
  <style data-aw-standalone="">
    svg { --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-flow-tone: 22%; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .aw-d-arrow--route {
  fill: var(--aw-c-green);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .route {
  fill: none;
  stroke: var(--aw-c-green);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  marker-end: url("#aw-arrow-route");
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-route {
  stroke: color-mix(in srgb, var(--aw-c-green) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} .car-body {
  fill: url("#aw-grad-car");
} .car-body.npc {
  fill: url("#aw-grad-car-npc");
} .car-glass {
  fill: url("#aw-grad-car-glass");
  stroke: #ffffffb3;
  stroke-width: 1;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
} .headlight {
  fill: #9ff3ff;
  filter: url("#aw-glow");
} .lidar {
  fill: url("#aw-grad-ai");
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow-route" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--route" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <filter id="aw-glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.35" stop-color="#3f2ee3"/>
      <stop offset="0.75" stop-color="#2a6df2"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-npc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f6375"/>
      <stop offset="0.5" stop-color="#8d91a0"/>
      <stop offset="1" stop-color="#b9bcc8"/>
    </linearGradient>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Parking lot -->
  <rect class="road" x="0" y="40" width="760" height="260"/>
  <line class="mark" x1="60" y1="200" x2="60" y2="296"/>
  <line class="mark" x1="60" y1="44" x2="60" y2="100"/>
  <line class="mark" x1="140" y1="200" x2="140" y2="296"/>
  <line class="mark" x1="140" y1="44" x2="140" y2="100"/>
  <line class="mark" x1="220" y1="200" x2="220" y2="296"/>
  <line class="mark" x1="220" y1="44" x2="220" y2="100"/>
  <line class="mark" x1="300" y1="200" x2="300" y2="296"/>
  <line class="mark" x1="300" y1="44" x2="300" y2="100"/>
  <line class="mark" x1="380" y1="200" x2="380" y2="296"/>
  <line class="mark" x1="380" y1="44" x2="380" y2="100"/>
  <line class="mark" x1="460" y1="200" x2="460" y2="296"/>
  <line class="mark" x1="460" y1="44" x2="460" y2="100"/>
  <line class="mark" x1="540" y1="200" x2="540" y2="296"/>
  <line class="mark" x1="540" y1="44" x2="540" y2="100"/>
  <line class="mark" x1="620" y1="200" x2="620" y2="296"/>
  <line class="mark" x1="620" y1="44" x2="620" y2="100"/>
  <line class="mark" x1="700" y1="200" x2="700" y2="296"/>
  <line class="mark" x1="700" y1="44" x2="700" y2="100"/>

  <!-- Parked vehicles -->
  <g transform="translate(89 230)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body npc" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>
  <g transform="translate(169 230)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body npc" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>
  <g transform="translate(249 230)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body npc" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>
  <g transform="translate(329 230)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body npc" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>
  <g transform="translate(409 230)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body npc" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>
  <g transform="translate(569 230)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body npc" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>
  <g transform="translate(649 230)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body npc" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>

  <!-- Planned path: forward to the turning point, then backward into the space -->
  <path class="route" d="M240 150 H480 C540 150 560 120 580 106"/>
  <path class="flow flow-route" pathLength="100" d="M240 150 H480 C540 150 560 120 580 106"/>
  <path class="route head" d="M240 150 H480 C540 150 560 120 580 106"/>
  <path class="route" d="M578 120 C578 162 500 160 500 205 V262"/>
  <path class="flow flow-route" pathLength="100" d="M578 120 C578 162 500 160 500 205 V262"/>
  <path class="route head" d="M578 120 C578 162 500 160 500 205 V262"/>
  <g transform="translate(189 130) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <text class="note" x="500" y="318" text-anchor="middle" dominant-baseline="central">Reverse into the empty parking space</text>
  <line class="leader" x1="500" y1="308" x2="500" y2="290"/>
  <text class="note" x="750" y="22" text-anchor="end" dominant-baseline="central">Turning point: forward, then reverse</text>
  <line class="leader" x1="576" y1="33" x2="580" y2="94"/>
</svg>
