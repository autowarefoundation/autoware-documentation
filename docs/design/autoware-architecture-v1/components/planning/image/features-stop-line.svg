<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="features-stop-line-title">
  <title id="features-stop-line-title">The ego vehicle stops at the stop line that the map defines.</title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-crimson: #dc143c; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-flow-tone: 22%; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .aw-d-arrow--route {
  fill: var(--aw-c-green);
} .road {
  fill: #5c6070;
} .mark {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .mark.dash {
  stroke-dasharray: 14 10;
} .mark.thick {
  stroke-width: 7;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.bad {
  fill: color-mix(in srgb, var(--aw-crimson) 35%, transparent);
} .route {
  fill: none;
  stroke: var(--aw-c-green);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  marker-end: url("#aw-arrow-route");
} .sign {
  fill: #fff;
  stroke: var(--aw-crimson);
  stroke-width: 5;
} .sign-text {
  font-weight: 700;
  fill: #00002a;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-route {
  stroke: color-mix(in srgb, var(--aw-c-green) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} .car-body {
  fill: url("#aw-grad-car");
} .car-glass {
  fill: url("#aw-grad-car-glass");
  stroke: #ffffffb3;
  stroke-width: 1;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
} .headlight {
  fill: #9ff3ff;
  filter: url("#aw-glow");
} .lidar {
  fill: url("#aw-grad-ai");
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow-route" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--route" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <filter id="aw-glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.35" stop-color="#3f2ee3"/>
      <stop offset="0.75" stop-color="#2a6df2"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Road: two lanes in the same direction. The ego lane is on top. -->
  <rect class="road" x="0" y="44" width="760" height="120"/>
  <line class="mark" x1="0" y1="50" x2="760" y2="50"/>
  <line class="mark" x1="0" y1="158" x2="760" y2="158"/>
  <line class="mark dash" x1="0" y1="104" x2="760" y2="104"/>

  <!-- Stop line in the ego lane -->
  <line class="mark thick" x1="500" y1="52" x2="500" y2="102"/>
  <!-- Area after the stop line: the planned velocity is zero here until the stop is released -->
  <rect class="lanelet bad" x="506" y="63" width="214" height="28"/>

  <!-- Stop sign -->
  <circle class="sign" cx="560" cy="25" r="23"/>
  <text class="sign-text" x="560" y="25" text-anchor="middle" dominant-baseline="central">STOP</text>

  <!-- Planned path up to the stop line -->
  <path class="route" d="M150 77 H486"/>
  <path class="flow flow-route" pathLength="100" d="M150 77 H486"/>
  <path class="route head" d="M150 77 H486"/>

  <!-- Ego vehicle -->
  <g transform="translate(99 57) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <text class="note" x="500" y="184" text-anchor="middle" dominant-baseline="central">Stop at the stop line, then start again</text>
  <line class="leader" x1="500" y1="176" x2="500" y2="104"/>
</svg>
