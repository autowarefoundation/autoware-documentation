<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="features-path-smoothing-title">
  <title id="features-path-smoothing-title">The upper lane ends, and the ego vehicle follows a smooth path into the lower lane.</title>

  <!-- Road: the upper lane ends and the road becomes one lane -->
  <path class="road" d="M0 44 H360 L460 98 H760 V164 H0 Z"/>
  <line class="mark" x1="0" y1="50" x2="360" y2="50"/>
  <path class="mark" fill="none" d="M360 50 L460 104 H760"/>
  <line class="mark" x1="0" y1="158" x2="760" y2="158"/>
  <line class="mark dash" x1="0" y1="104" x2="340" y2="104"/>

  <!-- Planned path: a smooth curve into the lower lane -->
  <path class="route" d="M150 77 H250 C380 77 380 131 510 131 H700"/>

  <!-- Ego vehicle -->
  <g>
    <rect class="car" x="78" y="62" width="64" height="30" rx="6"/>
    <rect class="glass" x="120" y="66" width="9" height="22" rx="3"/>
  </g>
  <text class="note" x="560" y="24" text-anchor="middle" dominant-baseline="central">Lane ends</text>
  <line class="leader" x1="530" y1="32" x2="430" y2="80"/>
  <text class="note" x="330" y="184" text-anchor="middle" dominant-baseline="central">Smooth path</text>
  <line class="leader" x1="330" y1="176" x2="330" y2="110"/>
</svg>
