<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="features-side-shift-title">
  <title id="features-side-shift-title">An external request shifts the path of the ego vehicle sideways in its lane.</title>

  <!-- Road: two lanes in the same direction. The ego lane is on top. -->
  <rect class="road" x="0" y="44" width="760" height="120"/>
  <line class="mark" x1="0" y1="50" x2="760" y2="50"/>
  <line class="mark" x1="0" y1="158" x2="760" y2="158"/>
  <line class="mark dash" x1="0" y1="104" x2="760" y2="104"/>

  <!-- Original path (lane center) -->
  <line class="leader" x1="150" y1="77" x2="700" y2="77"/>

  <!-- Shifted path -->
  <path class="route" d="M150 77 H260 C340 77 340 94 420 94 H700"/>
  <path class="flow flow-route" pathLength="100" d="M150 77 H260 C340 77 340 94 420 94 H700"/>
  <path class="route head" d="M150 77 H260 C340 77 340 94 420 94 H700"/>

  <!-- Ego vehicle -->
  <g transform="translate(99 57) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <text class="note" x="260" y="24" text-anchor="middle" dominant-baseline="central">Original path</text>
  <line class="leader" x1="260" y1="32" x2="260" y2="74"/>
  <text class="note" x="560" y="184" text-anchor="middle" dominant-baseline="central">Path shifted by the requested lateral offset</text>
  <line class="leader" x1="560" y1="176" x2="560" y2="98"/>
</svg>
