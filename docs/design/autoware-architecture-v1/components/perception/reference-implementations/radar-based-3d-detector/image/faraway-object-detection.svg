<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 676" role="img" aria-labelledby="faraway-object-detection-title">
  <title id="faraway-object-detection-title">
    Radar tracks go through the crossing noise filter and the message converter in Sensing. The detected radar objects then go through the velocity and range filter and the vector map filter, and
    reach the multi-object tracker on the radar channel. Radar fusion to detected objects can also use the detected radar objects, but Autoware does not launch it.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="676"/>
  <circle class="halo" cx="330" cy="196" r="150"/>
  <circle class="halo cyan" cx="330" cy="452" r="140"/>

  <rect class="box muted" x="180" y="12" width="300" height="58" rx="12"/>
  <text class="lbl" x="330" y="32" text-anchor="middle" dominant-baseline="central">Radar tracks</text>
  <text class="code" x="330" y="53" text-anchor="middle" dominant-baseline="central">radar_msgs/msg/RadarTracks</text>

  <!-- Sensing -->
  <rect class="glass-panel" x="150" y="92" width="360" height="208" rx="16"/>
  <text class="ttl" x="170" y="118">Sensing</text>

  <rect class="card" x="180" y="134" width="300" height="58" rx="12"/>
  <text class="lbl" x="330" y="155" text-anchor="middle" dominant-baseline="central">Crossing noise filter</text>
  <text class="code" x="330" y="176" text-anchor="middle" dominant-baseline="central">autoware_radar_tracks_noise_filter</text>

  <rect class="card" x="180" y="222" width="300" height="58" rx="12"/>
  <text class="lbl" x="330" y="243" text-anchor="middle" dominant-baseline="central">Message converter</text>
  <text class="code" x="330" y="264" text-anchor="middle" dominant-baseline="central">autoware_radar_tracks_msgs_converter</text>

  <path class="edge" d="M330 70 V126"/>
  <path class="flow" pathLength="100" d="M330 70 V126"/>
  <path class="edge head" d="M330 70 V126"/>
  <path class="edge" d="M330 192 V214"/>
  <path class="flow" pathLength="100" d="M330 192 V214"/>
  <path class="edge head" d="M330 192 V214"/>

  <!-- Detected objects to the radar filter -->
  <path class="edge accent" d="M330 280 V374"/>
  <path class="flow flow-accent" pathLength="100" d="M330 280 V374"/>
  <path class="edge accent head" d="M330 280 V374"/>
  <text class="edge-lbl" x="330" y="314" text-anchor="middle" dominant-baseline="central">/sensing/radar/detected_objects</text>
  <path class="edge dash" d="M330 330 H572"/>

  <rect class="box muted" x="580" y="300" width="260" height="60" rx="12"/>
  <text class="lbl" x="710" y="319" text-anchor="middle" dominant-baseline="central">Radar fusion to detected objects</text>
  <text class="sub" x="710" y="341" text-anchor="middle" dominant-baseline="central">Available, not launched</text>

  <!-- The radar filter of perception -->
  <rect class="glass-panel" x="150" y="344" width="360" height="216" rx="16"/>
  <text class="ttl" x="490" y="370" text-anchor="end">Radar filter</text>

  <rect class="card" x="180" y="382" width="300" height="58" rx="12"/>
  <text class="lbl" x="330" y="403" text-anchor="middle" dominant-baseline="central">Velocity and range filter</text>
  <text class="code" x="330" y="424" text-anchor="middle" dominant-baseline="central">autoware_object_sorter</text>

  <rect class="card" x="180" y="470" width="300" height="58" rx="12"/>
  <text class="lbl" x="330" y="491" text-anchor="middle" dominant-baseline="central">Vector map filter</text>
  <text class="code" x="330" y="512" text-anchor="middle" dominant-baseline="central">object_lanelet_filter</text>

  <path class="edge" d="M330 440 V462"/>
  <path class="flow" pathLength="100" d="M330 440 V462"/>
  <path class="edge head" d="M330 440 V462"/>

  <!-- Output -->
  <path class="edge accent" d="M330 528 V592"/>
  <path class="flow flow-accent" pathLength="100" d="M330 528 V592"/>
  <path class="edge accent head" d="M330 528 V592"/>
  <text class="edge-lbl" x="330" y="577" text-anchor="middle" dominant-baseline="central">/perception/object_recognition/detection/radar/far_objects</text>

  <rect class="box primary" x="180" y="600" width="300" height="58" rx="12"/>
  <circle class="icon-bg on" cx="214" cy="629" r="17"/>
  <path class="icon-line" d="M205 638 L213 628 L223 622"/>
  <circle class="icon-dot" cx="205" cy="638" r="2.4"/>
  <circle class="icon-dot" cx="213" cy="628" r="2.4"/>
  <circle class="icon-dot" cx="223" cy="622" r="2.4"/>
  <text class="lbl on-primary" x="330" y="619" text-anchor="middle" dominant-baseline="central">Multi-object tracker</text>
  <text class="sub on-primary" x="330" y="641" text-anchor="middle" dominant-baseline="central">radar channel</text>
</svg>
