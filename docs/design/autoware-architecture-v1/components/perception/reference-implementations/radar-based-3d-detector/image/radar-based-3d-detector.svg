<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 800" role="img" aria-labelledby="radar-based-3d-detector-title">
  <title id="radar-based-3d-detector-title">
    In Sensing, radar tracks go through a noise filter and a message converter. The detected radar objects go to the radar filter, then to the multi-object tracker on the radar channel, together with
    the
    LiDAR and camera detections. In the serial launch file, the radar tracked objects go through tracked object filters and the tracker merger adds them to the output of the multi-object tracker.
    Radar fusion to detected objects, which fuses radar objects with the LiDAR and camera detections, and the radar object tracker, which can track the far radar objects for the tracker merger, are
    available but not launched. Detection from radar points is not
    available yet.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; --md-text-font-family: Roboto, system-ui, sans-serif; font-family: var(--md-text-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} .box.ext {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-dasharray: 6 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="800"/>
  <circle class="halo cyan" cx="420" cy="110" r="100"/>
  <circle class="halo" cx="420" cy="560" r="160"/>

  <!-- Sensing -->
  <rect class="glass-panel" x="20" y="16" width="820" height="190" rx="16"/>
  <text class="ttl" x="40" y="42">Sensing</text>

  <rect class="box muted" x="40" y="56" width="160" height="54" rx="12"/>
  <text class="lbl" x="120" y="75" text-anchor="middle" dominant-baseline="central">Radar tracks</text>
  <text class="code" x="120" y="95" text-anchor="middle" dominant-baseline="central">RadarTracks</text>

  <rect class="card" x="240" y="56" width="160" height="54" rx="12"/>
  <text class="lbl" x="320" y="75" text-anchor="middle" dominant-baseline="central">Noise filter</text>
  <text class="sub" x="320" y="95" text-anchor="middle" dominant-baseline="central">Crossing objects</text>

  <rect class="card" x="440" y="56" width="160" height="54" rx="12"/>
  <text class="lbl" x="520" y="75" text-anchor="middle" dominant-baseline="central">Message converter</text>
  <text class="sub" x="520" y="95" text-anchor="middle" dominant-baseline="central">To Autoware objects</text>

  <rect class="box muted" x="640" y="56" width="180" height="54" rx="12"/>
  <text class="lbl" x="730" y="75" text-anchor="middle" dominant-baseline="central">Radar scan</text>
  <text class="code" x="730" y="95" text-anchor="middle" dominant-baseline="central">RadarScan</text>

  <rect class="card" x="640" y="136" width="180" height="50" rx="12"/>
  <text class="lbl" x="730" y="153" text-anchor="middle" dominant-baseline="central">Point cloud filters</text>
  <text class="sub" x="730" y="171" text-anchor="middle" dominant-baseline="central">Static and threshold</text>

  <path class="edge" d="M200 83 H232"/>
  <path class="flow" pathLength="100" d="M200 83 H232"/>
  <path class="edge head" d="M200 83 H232"/>
  <path class="edge" d="M400 83 H432"/>
  <path class="flow" pathLength="100" d="M400 83 H432"/>
  <path class="edge head" d="M400 83 H432"/>
  <path class="edge" d="M730 110 V128"/>
  <path class="flow" pathLength="100" d="M730 110 V128"/>
  <path class="edge head" d="M730 110 V128"/>

  <!-- Detection -->
  <rect class="glass-panel" x="20" y="236" width="820" height="230" rx="16"/>
  <text class="ttl" x="40" y="262">Detection</text>

  <rect class="box muted" x="40" y="280" width="300" height="60" rx="12"/>
  <text class="lbl" x="190" y="299" text-anchor="middle" dominant-baseline="central">Radar fusion to detected objects</text>
  <text class="sub" x="190" y="321" text-anchor="middle" dominant-baseline="central">Available, not launched</text>

  <rect class="card" x="390" y="280" width="180" height="60" rx="12"/>
  <text class="lbl" x="480" y="299" text-anchor="middle" dominant-baseline="central">Radar filter</text>
  <text class="sub" x="480" y="321" text-anchor="middle" dominant-baseline="central">Sorter, lanelet filter</text>

  <rect class="box ext" x="640" y="280" width="180" height="60" rx="12"/>
  <text class="lbl" x="730" y="299" text-anchor="middle" dominant-baseline="central">Radar point detection</text>
  <text class="sub" x="730" y="321" text-anchor="middle" dominant-baseline="central">Not available yet</text>

  <rect class="box muted" x="40" y="390" width="240" height="54" rx="12"/>
  <text class="lbl" x="160" y="409" text-anchor="middle" dominant-baseline="central">LiDAR and camera detection</text>
  <text class="sub" x="160" y="429" text-anchor="middle" dominant-baseline="central">Detected objects</text>

  <path class="edge accent" d="M480 110 V272"/>
  <path class="flow flow-accent" pathLength="100" d="M480 110 V272"/>
  <path class="edge accent head" d="M480 110 V272"/>
  <text class="edge-lbl" x="480" y="180" text-anchor="middle" dominant-baseline="central">Detected objects</text>
  <path class="edge dash" d="M480 222 H190 V272"/>
  <path class="edge dash" d="M730 186 V272"/>
  <path class="edge dash" d="M160 390 V348"/>

  <!-- Tracking -->
  <rect class="glass-panel" x="20" y="496" width="820" height="200" rx="16"/>
  <text class="ttl" x="40" y="522">Tracking</text>

  <rect class="box primary" x="300" y="540" width="240" height="60" rx="12"/>
  <circle class="icon-bg on" cx="328" cy="570" r="17"/>
  <path class="icon-line" d="M319 579 L327 569 L337 563"/>
  <circle class="icon-dot" cx="319" cy="579" r="2.4"/>
  <circle class="icon-dot" cx="327" cy="569" r="2.4"/>
  <circle class="icon-dot" cx="337" cy="563" r="2.4"/>
  <text class="lbl on-primary" x="356" y="560" dominant-baseline="central">Multi-object tracker</text>
  <text class="sub on-primary" x="356" y="581" dominant-baseline="central">Radar and other channels</text>

  <rect class="card" x="580" y="540" width="240" height="60" rx="12"/>
  <text class="lbl" x="700" y="559" text-anchor="middle" dominant-baseline="central">Tracked object filters</text>
  <text class="sub" x="700" y="581" text-anchor="middle" dominant-baseline="central">Serial launch file</text>

  <rect class="card" x="440" y="626" width="260" height="50" rx="12"/>
  <text class="lbl" x="570" y="643" text-anchor="middle" dominant-baseline="central">Tracker merger</text>
  <text class="sub" x="570" y="661" text-anchor="middle" dominant-baseline="central">Serial launch file</text>

  <rect class="box muted" x="40" y="626" width="220" height="50" rx="12"/>
  <text class="lbl" x="150" y="643" text-anchor="middle" dominant-baseline="central">Radar object tracker</text>
  <text class="sub" x="150" y="661" text-anchor="middle" dominant-baseline="central">Available, not launched</text>

  <path class="edge accent" d="M480 340 V532"/>
  <path class="flow flow-accent" pathLength="100" d="M480 340 V532"/>
  <path class="edge accent head" d="M480 340 V532"/>
  <text class="edge-lbl" x="480" y="410" text-anchor="middle" dominant-baseline="central">Far objects</text>
  <path class="edge dash" d="M340 310 H362 V532"/>
  <path class="edge" d="M280 417 H320 V532"/>
  <path class="flow" pathLength="100" d="M280 417 H320 V532"/>
  <path class="edge head" d="M280 417 H320 V532"/>
  <path class="edge" d="M585 110 V512 H700 V532"/>
  <path class="flow" pathLength="100" d="M585 110 V512 H700 V532"/>
  <path class="edge head" d="M585 110 V512 H700 V532"/>
  <text class="edge-lbl" x="585" y="160" text-anchor="middle" dominant-baseline="central">Tracked objects</text>
  <path class="edge dash" d="M480 480 H220 V618"/>
  <path class="edge dash" d="M260 651 H432"/>
  <path class="edge" d="M500 600 V618"/>
  <path class="flow" pathLength="100" d="M500 600 V618"/>
  <path class="edge head" d="M500 600 V618"/>
  <path class="edge" d="M640 600 V618"/>
  <path class="flow" pathLength="100" d="M640 600 V618"/>
  <path class="edge head" d="M640 600 V618"/>

  <!-- Output -->
  <path class="edge accent" d="M330 600 V732"/>
  <path class="flow flow-accent" pathLength="100" d="M330 600 V732"/>
  <path class="edge accent head" d="M330 600 V732"/>
  <text class="edge-lbl" x="330" y="714" text-anchor="middle" dominant-baseline="central">Other launch files</text>
  <path class="edge accent" d="M570 676 V732"/>
  <path class="flow flow-accent" pathLength="100" d="M570 676 V732"/>
  <path class="edge accent head" d="M570 676 V732"/>
  <rect class="box muted" x="300" y="740" width="400" height="46" rx="12"/>
  <text class="lbl" x="500" y="763" text-anchor="middle" dominant-baseline="central">Prediction</text>
</svg>
