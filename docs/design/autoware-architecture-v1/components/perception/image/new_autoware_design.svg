<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" role="img" aria-labelledby="object-recognition-channels-title">
  <title id="object-recognition-channels-title">
    Nine kinds of detectors send detected objects to the multi-object tracker, each on its own input channel. Base 3D detection and LiDAR clustering run by default. The tracker sends tracked objects
    to prediction, and prediction sends predicted objects to Planning.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="600"/>
  <circle class="halo cyan" cx="200" cy="300" r="180"/>
  <circle class="halo" cx="560" cy="318" r="200"/>

  <!-- The detectors -->
  <rect class="glass-panel" x="20" y="16" width="360" height="568" rx="16"/>
  <text class="ttl" x="40" y="42">Detectors and their tracker channels</text>
  <text class="sub" x="40" y="62">Indigo: runs in the default launch file</text>

  <text class="edge-lbl" x="388" y="70" text-anchor="start" dominant-baseline="central">Detected objects</text>

  <rect class="box primary" x="40" y="80" width="320" height="44" rx="12"/>
  <text class="lbl on-primary" x="200" y="94" text-anchor="middle" dominant-baseline="central">Base 3D detection</text>
  <text class="code on-primary" x="200" y="111" text-anchor="middle" dominant-baseline="central">lidar_centerpoint</text>
  <path class="edge" d="M360 102 H432"/>
  <path class="flow" pathLength="100" d="M360 102 H432"/>
  <path class="edge head" d="M360 102 H432"/>

  <rect class="card" x="40" y="134" width="320" height="44" rx="12"/>
  <text class="lbl" x="200" y="148" text-anchor="middle" dominant-baseline="central">Near-object 3D detection</text>
  <text class="code" x="200" y="165" text-anchor="middle" dominant-baseline="central">lidar_centerpoint_short_range</text>
  <path class="edge" d="M360 156 H432"/>
  <path class="flow" pathLength="100" d="M360 156 H432"/>
  <path class="edge head" d="M360 156 H432"/>

  <rect class="card" x="40" y="188" width="320" height="44" rx="12"/>
  <text class="lbl" x="200" y="202" text-anchor="middle" dominant-baseline="central">Camera-only 3D detection</text>
  <text class="code" x="200" y="219" text-anchor="middle" dominant-baseline="central">camera_streampetr</text>
  <path class="edge" d="M360 210 H432"/>
  <path class="flow" pathLength="100" d="M360 210 H432"/>
  <path class="edge head" d="M360 210 H432"/>

  <rect class="card" x="40" y="242" width="320" height="44" rx="12"/>
  <text class="lbl" x="200" y="256" text-anchor="middle" dominant-baseline="central">Camera VRU detection</text>
  <text class="code" x="200" y="273" text-anchor="middle" dominant-baseline="central">camera_vru</text>
  <path class="edge" d="M360 264 H432"/>
  <path class="flow" pathLength="100" d="M360 264 H432"/>
  <path class="edge head" d="M360 264 H432"/>

  <rect class="card" x="40" y="296" width="320" height="44" rx="12"/>
  <text class="lbl" x="200" y="310" text-anchor="middle" dominant-baseline="central">Radar faraway detection</text>
  <text class="code" x="200" y="327" text-anchor="middle" dominant-baseline="central">radar</text>
  <path class="edge" d="M360 318 H432"/>
  <path class="flow" pathLength="100" d="M360 318 H432"/>
  <path class="edge head" d="M360 318 H432"/>

  <rect class="card" x="40" y="350" width="320" height="44" rx="12"/>
  <text class="lbl" x="200" y="364" text-anchor="middle" dominant-baseline="central">Semantic segmentation clustering</text>
  <text class="code" x="200" y="381" text-anchor="middle" dominant-baseline="central">lidar_clustering</text>
  <path class="edge" d="M360 372 H432"/>
  <path class="flow" pathLength="100" d="M360 372 H432"/>
  <path class="edge head" d="M360 372 H432"/>

  <rect class="box primary" x="40" y="404" width="320" height="44" rx="12"/>
  <text class="lbl on-primary" x="200" y="418" text-anchor="middle" dominant-baseline="central">LiDAR clustering</text>
  <text class="code on-primary" x="200" y="435" text-anchor="middle" dominant-baseline="central">lidar_clustering</text>
  <path class="edge" d="M360 426 H432"/>
  <path class="flow" pathLength="100" d="M360 426 H432"/>
  <path class="edge head" d="M360 426 H432"/>

  <rect class="card" x="40" y="458" width="320" height="44" rx="12"/>
  <text class="lbl" x="200" y="472" text-anchor="middle" dominant-baseline="central">Camera-LiDAR fusion clustering</text>
  <text class="code" x="200" y="489" text-anchor="middle" dominant-baseline="central">camera_lidar_fusion</text>
  <path class="edge" d="M360 480 H432"/>
  <path class="flow" pathLength="100" d="M360 480 H432"/>
  <path class="edge head" d="M360 480 H432"/>

  <rect class="card" x="40" y="512" width="320" height="44" rx="12"/>
  <text class="lbl" x="200" y="526" text-anchor="middle" dominant-baseline="central">Irregular object detection</text>
  <text class="code" x="200" y="543" text-anchor="middle" dominant-baseline="central">camera_lidar_fusion_irregular</text>
  <path class="edge" d="M360 534 H432"/>
  <path class="flow" pathLength="100" d="M360 534 H432"/>
  <path class="edge head" d="M360 534 H432"/>

  <!-- The tracker, prediction, and Planning -->
  <rect class="box primary" x="440" y="80" width="180" height="476" rx="12"/>
  <circle class="icon-bg on" cx="530" cy="256" r="20"/>
  <path class="icon-line" d="M520 266 L529 255 L540 249"/>
  <circle class="icon-dot" cx="520" cy="266" r="2.6"/>
  <circle class="icon-dot" cx="529" cy="255" r="2.6"/>
  <circle class="icon-dot" cx="540" cy="249" r="2.6"/>
  <text class="lbl on-primary" x="530" y="298" text-anchor="middle" dominant-baseline="central">Multi-object</text>
  <text class="lbl on-primary" x="530" y="316" text-anchor="middle" dominant-baseline="central">tracker</text>
  <text class="sub on-primary" x="530" y="340" text-anchor="middle" dominant-baseline="central">Up to 12 channels</text>

  <rect class="card" x="680" y="283" width="160" height="70" rx="12"/>
  <text class="lbl" x="760" y="307" text-anchor="middle" dominant-baseline="central">Prediction</text>
  <text class="code" x="760" y="331" text-anchor="middle" dominant-baseline="central">map_based_prediction</text>
  <path class="edge accent" d="M620 318 H672"/>
  <path class="flow flow-accent" pathLength="100" d="M620 318 H672"/>
  <path class="edge accent head" d="M620 318 H672"/>
  <text class="edge-lbl" x="648" y="290" text-anchor="middle" dominant-baseline="central">Tracked</text>
  <text class="edge-lbl" x="648" y="305" text-anchor="middle" dominant-baseline="central">objects</text>

  <rect class="box muted" x="680" y="510" width="160" height="46" rx="12"/>
  <text class="lbl" x="760" y="533" text-anchor="middle" dominant-baseline="central">Planning</text>
  <path class="edge accent" d="M760 353 V502"/>
  <path class="flow flow-accent" pathLength="100" d="M760 353 V502"/>
  <path class="edge accent head" d="M760 353 V502"/>
  <text class="edge-lbl" x="752" y="427" text-anchor="end" dominant-baseline="central">Predicted objects</text>
</svg>
