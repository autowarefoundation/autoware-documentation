<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="traffic-light-recognition-title">
  <title id="traffic-light-recognition-title">
    For each traffic light camera, the map-based detector makes rough regions of interest, the fine detector refines them, the car and pedestrian classifiers find the signal states, and the occlusion
    predictor marks hidden signals. Then multi-camera fusion combines the cameras, the arbiter adds the V2X signals, and the crosswalk estimator completes the pedestrian signals and sends the result
    to Planning.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 14%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-cyan) 70%, transparent);
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .card.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 8%, var(--aw-d-node));
  stroke: color-mix(in srgb, var(--aw-c-cyan) 65%, transparent);
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.ai {
  fill: url("#aw-grad-ai");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="440"/>
  <circle class="halo cyan" cx="505" cy="113" r="100"/>
  <circle class="halo" cx="495" cy="300" r="130"/>

  <!-- The pipeline of each camera -->
  <rect class="glass-panel" x="20" y="16" width="820" height="190" rx="16"/>
  <text class="ttl" x="40" y="42">For each traffic light camera</text>

  <rect class="card" x="40" y="78" width="160" height="70" rx="12"/>
  <text class="lbl" x="120" y="102" text-anchor="middle" dominant-baseline="central">Map-based detector</text>
  <text class="sub" x="120" y="126" text-anchor="middle" dominant-baseline="central">Vector map, route</text>

  <rect class="card ai" x="230" y="78" width="150" height="70" rx="12"/>
  <text class="lbl" x="305" y="102" text-anchor="middle" dominant-baseline="central">Fine detector</text>
  <text class="sub" x="305" y="126" text-anchor="middle" dominant-baseline="central">YOLOX on the image</text>

  <rect class="card ai" x="420" y="58" width="170" height="46" rx="12"/>
  <text class="lbl" x="505" y="81" text-anchor="middle" dominant-baseline="central">Car classifier</text>

  <rect class="card ai" x="420" y="122" width="170" height="46" rx="12"/>
  <text class="lbl" x="505" y="145" text-anchor="middle" dominant-baseline="central">Pedestrian classifier</text>

  <rect class="card" x="630" y="78" width="190" height="70" rx="12"/>
  <text class="lbl" x="725" y="102" text-anchor="middle" dominant-baseline="central">Occlusion predictor</text>
  <text class="sub" x="725" y="126" text-anchor="middle" dominant-baseline="central">LiDAR point cloud</text>

  <path class="edge" d="M200 113 H222"/>
  <path class="flow" pathLength="100" d="M200 113 H222"/>
  <path class="edge head" d="M200 113 H222"/>
  <path class="edge" d="M380 113 H392 V81 H412"/>
  <path class="flow" pathLength="100" d="M380 113 H392 V81 H412"/>
  <path class="edge head" d="M380 113 H392 V81 H412"/>
  <path class="edge" d="M392 113 V145 H412"/>
  <path class="flow" pathLength="100" d="M392 113 V145 H412"/>
  <path class="edge head" d="M392 113 V145 H412"/>
  <path class="edge" d="M590 81 H606 V104 H622"/>
  <path class="flow" pathLength="100" d="M590 81 H606 V104 H622"/>
  <path class="edge head" d="M590 81 H606 V104 H622"/>
  <path class="edge" d="M590 145 H606 V122 H622"/>
  <path class="flow" pathLength="100" d="M590 145 H606 V122 H622"/>
  <path class="edge head" d="M590 145 H606 V122 H622"/>

  <!-- Fusion of all cameras -->
  <rect class="card" x="630" y="260" width="190" height="70" rx="12"/>
  <text class="lbl" x="725" y="284" text-anchor="middle" dominant-baseline="central">Multi-camera fusion</text>
  <text class="sub" x="725" y="308" text-anchor="middle" dominant-baseline="central">All cameras</text>

  <rect class="box primary" x="400" y="260" width="190" height="70" rx="12"/>
  <circle class="icon-bg on" cx="430" cy="295" r="18"/>
  <path class="icon-line" d="M421 287 L429 295 L421 303 M429 295 H440 M436 291 L440 295 L436 299"/>
  <text class="lbl on-primary" x="460" y="285" dominant-baseline="central">Arbiter</text>
  <text class="sub on-primary" x="460" y="306" dominant-baseline="central">Adds V2X signals</text>

  <rect class="card" x="170" y="260" width="190" height="70" rx="12"/>
  <text class="lbl" x="265" y="284" text-anchor="middle" dominant-baseline="central">Crosswalk estimator</text>
  <text class="sub" x="265" y="308" text-anchor="middle" dominant-baseline="central">Pedestrian signals</text>

  <rect class="box muted" x="20" y="272" width="110" height="46" rx="12"/>
  <text class="lbl" x="75" y="295" text-anchor="middle" dominant-baseline="central">Planning</text>

  <rect class="box muted" x="400" y="374" width="190" height="50" rx="12"/>
  <text class="lbl" x="495" y="399" text-anchor="middle" dominant-baseline="central">V2X</text>

  <path class="edge accent" d="M725 148 V252"/>
  <path class="flow flow-accent" pathLength="100" d="M725 148 V252"/>
  <path class="edge accent head" d="M725 148 V252"/>
  <text class="edge-lbl" x="725" y="230" text-anchor="middle" dominant-baseline="central">Signals of each camera</text>
  <path class="edge accent" d="M630 295 H598"/>
  <path class="flow flow-accent" pathLength="100" d="M630 295 H598"/>
  <path class="edge accent head" d="M630 295 H598"/>
  <path class="edge accent" d="M400 295 H368"/>
  <path class="flow flow-accent" pathLength="100" d="M400 295 H368"/>
  <path class="edge accent head" d="M400 295 H368"/>
  <path class="edge accent" d="M170 295 H138"/>
  <path class="flow flow-accent" pathLength="100" d="M170 295 H138"/>
  <path class="edge accent head" d="M170 295 H138"/>
  <path class="edge" d="M495 374 V338"/>
  <path class="flow" pathLength="100" d="M495 374 V338"/>
  <path class="edge head" d="M495 374 V338"/>
</svg>
