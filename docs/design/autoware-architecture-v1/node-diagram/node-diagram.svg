  <!-- System and AD API -->
  <rect class="glass-panel" x="20" y="1048" width="400" height="90" rx="18"/>
  <text class="ttl" x="36" y="1072">System</text>
  <rect class="card" x="36" y="1080" width="210" height="40" rx="12"/>
