<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1154" role="img" aria-labelledby="node-diagram-title">
  <title id="node-diagram-title">
    An overview of the main nodes of Autoware in the default setup of autoware_launch. Sensing and Map feed Localization and Perception. Planning uses the kinematic state, the objects, the traffic
    signals, and the vector map to make the trajectory. Control follows the trajectory and sends commands to the vehicle interface. System and the AD API run beside them.
  </title>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="1154"/>
  <circle class="halo cyan" cx="585" cy="343" r="150"/>
  <circle class="halo" cx="420" cy="652" r="200"/>
  <circle class="halo" cx="270" cy="940" r="120"/>

  <!-- Sensing -->
  <rect class="glass-panel" x="20" y="16" width="400" height="160" rx="18"/>
  <text class="ttl" x="36" y="40">Sensing</text>
  <rect class="card" x="36" y="52" width="176" height="40" rx="12"/>
  <text class="lbl" x="124" y="72" text-anchor="middle" dominant-baseline="central">LiDAR preprocessing</text>
  <rect class="card" x="228" y="52" width="176" height="40" rx="12"/>
  <text class="lbl" x="316" y="72" text-anchor="middle" dominant-baseline="central">IMU corrector</text>
  <rect class="card" x="36" y="112" width="176" height="40" rx="12"/>
  <text class="lbl" x="124" y="132" text-anchor="middle" dominant-baseline="central">GNSS poser</text>
  <rect class="card" x="228" y="112" width="176" height="40" rx="12"/>
  <text class="lbl" x="316" y="132" text-anchor="middle" dominant-baseline="central">Velocity converter</text>

  <!-- Map -->
  <rect class="glass-panel" x="440" y="16" width="380" height="160" rx="18"/>
  <text class="ttl" x="456" y="40">Map</text>
  <rect class="card" x="456" y="52" width="170" height="40" rx="12"/>
  <text class="lbl" x="541" y="72" text-anchor="middle" dominant-baseline="central">Point cloud loader</text>
  <rect class="card" x="638" y="52" width="166" height="40" rx="12"/>
  <text class="lbl" x="721" y="72" text-anchor="middle" dominant-baseline="central">Lanelet2 loader</text>
  <rect class="card" x="456" y="112" width="170" height="40" rx="12"/>
  <text class="lbl" x="541" y="132" text-anchor="middle" dominant-baseline="central">Projection loader</text>
  <rect class="card" x="638" y="112" width="166" height="40" rx="12"/>
  <text class="lbl" x="721" y="132" text-anchor="middle" dominant-baseline="central">Map TF generator</text>

  <!-- Localization -->
  <rect class="glass-panel" x="20" y="236" width="310" height="214" rx="18"/>
  <text class="ttl" x="36" y="260">Localization</text>
  <rect class="card" x="36" y="272" width="144" height="40" rx="12"/>
  <text class="lbl" x="108" y="292" text-anchor="middle" dominant-baseline="central">NDT scan matcher</text>
  <rect class="card" x="194" y="272" width="120" height="40" rx="12"/>
  <text class="lbl" x="254" y="292" text-anchor="middle" dominant-baseline="central">Gyro odometer</text>
  <rect class="box primary" x="36" y="336" width="278" height="40" rx="14"/>
  <circle class="icon-bg on" cx="58" cy="356" r="13"/>
  <circle class="icon-line" cx="58" cy="356" r="5.5"/>
  <circle class="icon-dot" cx="58" cy="356" r="2"/>
  <text class="lbl on-primary" x="175" y="356" text-anchor="middle" dominant-baseline="central">EKF localizer</text>
  <rect class="card" x="36" y="396" width="278" height="40" rx="12"/>
  <text class="lbl" x="175" y="416" text-anchor="middle" dominant-baseline="central">Stop filter</text>
  <path class="edge" d="M108 312 V330"/>
  <path class="flow" pathLength="100" d="M108 312 V330"/>
  <path class="edge head" d="M108 312 V330"/>
  <path class="edge" d="M254 312 V330"/>
  <path class="flow" pathLength="100" d="M254 312 V330"/>
  <path class="edge head" d="M254 312 V330"/>
  <path class="edge" d="M175 376 V390"/>
  <path class="flow" pathLength="100" d="M175 376 V390"/>
  <path class="edge head" d="M175 376 V390"/>

  <!-- Perception -->
  <rect class="glass-panel" x="350" y="236" width="470" height="214" rx="18"/>
  <text class="ttl" x="366" y="260">Perception</text>
  <rect class="card" x="366" y="272" width="200" height="40" rx="12"/>
  <text class="lbl" x="466" y="292" text-anchor="middle" dominant-baseline="central">Ground segmentation</text>
  <rect class="card" x="366" y="330" width="200" height="40" rx="12"/>
  <text class="lbl" x="466" y="350" text-anchor="middle" dominant-baseline="central">Occupancy grid map</text>
  <rect class="card" x="366" y="388" width="200" height="40" rx="12"/>
  <text class="lbl" x="466" y="408" text-anchor="middle" dominant-baseline="central">Traffic light recognition</text>
  <rect class="card" x="590" y="272" width="214" height="40" rx="12"/>
  <text class="lbl" x="697" y="292" text-anchor="middle" dominant-baseline="central">Object detection</text>
  <rect class="card" x="590" y="330" width="214" height="40" rx="12"/>
  <text class="lbl" x="697" y="350" text-anchor="middle" dominant-baseline="central">Multi-object tracker</text>
  <rect class="box primary" x="590" y="388" width="214" height="40" rx="12"/>
  <text class="lbl on-primary" x="697" y="408" text-anchor="middle" dominant-baseline="central">Map-based prediction</text>
  <path class="edge" d="M697 312 V324"/>
  <path class="flow" pathLength="100" d="M697 312 V324"/>
  <path class="edge head" d="M697 312 V324"/>
  <path class="edge" d="M697 370 V382"/>
  <path class="flow" pathLength="100" d="M697 370 V382"/>
  <path class="edge head" d="M697 370 V382"/>

  <!-- Inputs of Localization and Perception -->
  <path class="edge accent" d="M110 176 V230"/>
  <path class="flow flow-accent" pathLength="100" d="M110 176 V230"/>
  <path class="edge accent head" d="M110 176 V230"/>
  <text class="edge-lbl" x="110" y="206" text-anchor="middle" dominant-baseline="central">Sensor data</text>
  <path class="edge accent" d="M372 176 V230"/>
  <path class="flow flow-accent" pathLength="100" d="M372 176 V230"/>
  <path class="edge accent head" d="M372 176 V230"/>
  <text class="edge-lbl" x="372" y="206" text-anchor="middle" dominant-baseline="central">Sensor data</text>
  <path class="edge" d="M700 176 V230"/>
  <path class="flow" pathLength="100" d="M700 176 V230"/>
  <path class="edge head" d="M700 176 V230"/>
  <text class="edge-lbl" x="700" y="206" text-anchor="middle" dominant-baseline="central">Maps</text>
  <path class="edge" d="M460 176 V246 H336"/>
  <path class="flow" pathLength="100" d="M460 176 V246 H336"/>
  <path class="edge head" d="M460 176 V246 H336"/>
  <text class="edge-lbl" x="460" y="206" text-anchor="middle" dominant-baseline="central">Point cloud map</text>

