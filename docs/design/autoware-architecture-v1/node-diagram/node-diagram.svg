  <rect class="glass-panel" x="20" y="536" width="800" height="232" rx="18"/>
  <text class="ttl" x="36" y="560">Planning</text>
  <rect class="card" x="36" y="572" width="140" height="40" rx="12"/>
  <text class="lbl" x="106" y="592" text-anchor="middle" dominant-baseline="central">Mission planner</text>
  <rect class="card" x="210" y="572" width="184" height="40" rx="12"/>
  <text class="lbl" x="302" y="592" text-anchor="middle" dominant-baseline="central">Behavior path planner</text>
  <rect class="card" x="428" y="572" width="212" height="40" rx="12"/>
  <text class="lbl" x="534" y="592" text-anchor="middle" dominant-baseline="central">Behavior velocity planner</text>
  <rect class="card" x="674" y="572" width="128" height="40" rx="12"/>
  <text class="lbl" x="738" y="592" text-anchor="middle" dominant-baseline="central">Path smoother</text>
  <path class="edge" d="M176 592 H204"/>
  <path class="flow" pathLength="100" d="M176 592 H204"/>
  <path class="edge head" d="M176 592 H204"/>
  <path class="edge" d="M394 592 H422"/>
  <path class="flow" pathLength="100" d="M394 592 H422"/>
  <path class="edge head" d="M394 592 H422"/>
  <path class="edge" d="M640 592 H668"/>
  <path class="flow" pathLength="100" d="M640 592 H668"/>
  <path class="edge head" d="M640 592 H668"/>
  <rect class="card" x="674" y="640" width="128" height="40" rx="12"/>
  <text class="lbl" x="738" y="660" text-anchor="middle" dominant-baseline="central">Path optimizer</text>
  <rect class="card" x="456" y="640" width="184" height="40" rx="12"/>
  <text class="lbl" x="548" y="660" text-anchor="middle" dominant-baseline="central">Motion velocity planner</text>
  <rect class="card" x="272" y="640" width="150" height="40" rx="12"/>
  <text class="lbl" x="347" y="660" text-anchor="middle" dominant-baseline="central">Scenario selector</text>
  <rect class="card" x="36" y="640" width="150" height="40" rx="12"/>
  <text class="lbl" x="111" y="660" text-anchor="middle" dominant-baseline="central">Velocity smoother</text>
  <rect class="box primary" x="36" y="708" width="150" height="40" rx="12"/>
  <text class="lbl on-primary" x="111" y="728" text-anchor="middle" dominant-baseline="central">Planning validator</text>
  <path class="edge" d="M738 612 V634"/>
  <path class="flow" pathLength="100" d="M738 612 V634"/>
  <path class="edge head" d="M738 612 V634"/>
  <path class="edge" d="M674 660 H646"/>
  <path class="flow" pathLength="100" d="M674 660 H646"/>
  <path class="edge head" d="M674 660 H646"/>
  <path class="edge" d="M456 660 H428"/>
  <path class="flow" pathLength="100" d="M456 660 H428"/>
  <path class="edge head" d="M456 660 H428"/>
  <path class="edge" d="M272 660 H192"/>
  <path class="flow" pathLength="100" d="M272 660 H192"/>
  <path class="edge head" d="M272 660 H192"/>
  <path class="edge" d="M111 680 V702"/>
  <path class="flow" pathLength="100" d="M111 680 V702"/>
  <path class="edge head" d="M111 680 V702"/>

  <!-- Inputs of Planning -->
  <path class="edge accent" d="M175 436 V530"/>
  <path class="flow flow-accent" pathLength="100" d="M175 436 V530"/>
  <path class="edge accent head" d="M175 436 V530"/>
  <text class="edge-lbl code" x="175" y="500" text-anchor="middle" dominant-baseline="central">/localization/kinematic_state</text>
  <path class="edge" d="M466 428 V530"/>
  <path class="flow" pathLength="100" d="M466 428 V530"/>
  <path class="edge head" d="M466 428 V530"/>
  <text class="edge-lbl code" x="466" y="494" text-anchor="middle" dominant-baseline="central">/perception/traffic_light_</text>
  <text class="edge-lbl code" x="466" y="510" text-anchor="middle" dominant-baseline="central">recognition/traffic_signals</text>
  <path class="edge accent" d="M697 428 V530"/>
  <path class="flow flow-accent" pathLength="100" d="M697 428 V530"/>
  <path class="edge accent head" d="M697 428 V530"/>
  <text class="edge-lbl code" x="697" y="470" text-anchor="middle" dominant-baseline="central">/perception/object_recognition/objects</text>
  <path class="edge" d="M820 96 H844 V600 H826"/>
  <path class="flow" pathLength="100" d="M820 96 H844 V600 H826"/>
  <path class="edge head" d="M820 96 H844 V600 H826"/>
  <text class="edge-lbl code" x="838" y="516" text-anchor="end" dominant-baseline="central">/map/vector_map</text>

