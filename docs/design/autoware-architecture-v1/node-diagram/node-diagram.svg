  <text class="ttl" x="36" y="868">Control</text>
  <rect class="card" x="36" y="880" width="170" height="40" rx="12"/>
  <text class="lbl" x="121" y="900" text-anchor="middle" dominant-baseline="central">Trajectory follower</text>
  <rect class="card" x="222" y="880" width="130" height="40" rx="12"/>
  <text class="lbl" x="287" y="900" text-anchor="middle" dominant-baseline="central">Shift decider</text>
  <rect class="card" x="368" y="874" width="136" height="52" rx="12"/>
  <text class="lbl" x="436" y="891" text-anchor="middle" dominant-baseline="central">Operation mode</text>
  <text class="sub" x="436" y="910" text-anchor="middle" dominant-baseline="central">transition manager</text>
  <rect class="box primary" x="36" y="958" width="468" height="44" rx="14"/>
  <circle class="icon-bg on" cx="60" cy="980" r="15"/>
  <path class="icon-line" d="M60 972 L67 975 V980 Q67 985 60 988 Q53 985 53 980 V975 Z"/>
  <text class="lbl on-primary" x="270" y="980" text-anchor="middle" dominant-baseline="central">Vehicle command gate</text>
  <path class="edge" d="M206 900 H216"/>
  <path class="flow" pathLength="100" d="M206 900 H216"/>
  <path class="edge head" d="M206 900 H216"/>
  <path class="edge accent" d="M121 920 V952"/>
  <path class="flow flow-accent" pathLength="100" d="M121 920 V952"/>
  <path class="edge accent head" d="M121 920 V952"/>
  <path class="edge" d="M287 920 V952"/>
  <path class="flow" pathLength="100" d="M287 920 V952"/>
  <path class="edge head" d="M287 920 V952"/>
  <path class="edge" d="M436 926 V952"/>
  <path class="flow" pathLength="100" d="M436 926 V952"/>
  <path class="edge head" d="M436 926 V952"/>
  <path class="edge accent" d="M116 748 V838"/>
