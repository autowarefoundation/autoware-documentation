<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="generator-selector-title">
  <title id="generator-selector-title">
    Sensing sends sensor data to the generators. The generators send candidate trajectories to the selector. The selector checks the candidates with a safety gate, ranks them, and sends the selected
    trajectory to the controller, which drives the vehicle.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-cyan: #00c8ff; --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-flow-traj-a: #e3e0ff; --aw-flow-traj-b: #d6f7ff; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 14%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-cyan) 70%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-flow-traj-a {
  stop-color: var(--aw-flow-traj-a);
} .aw-flow-traj-b {
  stop-color: var(--aw-flow-traj-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .card.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 8%, var(--aw-d-node));
  stroke: color-mix(in srgb, var(--aw-c-cyan) 65%, transparent);
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.ai {
  fill: url("#aw-grad-ai");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .pill {
  fill: #ffffff24;
  stroke: #ffffff59;
} .pill-text {
  font-size: 12px;
  font-weight: 600;
  fill: #fff;
} .traj {
  fill: none;
  stroke: url("#aw-grad-traj");
  stroke-width: 2.5;
  marker-end: url("#aw-arrow-accent");
} .glow {
  filter: url("#aw-glow");
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .flow.flow-traj {
  stroke: url("#aw-grad-traj-light");
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} .car-body {
  fill: url("#aw-grad-car");
} .car-glass {
  fill: url("#aw-grad-car-glass");
  stroke: #ffffffb3;
  stroke-width: 1;
} .car-shine {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  opacity: 0.75;
} .wheel {
  fill: #1b1d29;
} .rim {
  fill: none;
  stroke: #c9ccd8;
  stroke-width: 2.5;
} .hub {
  fill: #c9ccd8;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
} .headlight {
  fill: #9ff3ff;
  filter: url("#aw-glow");
} .lidar {
  fill: url("#aw-grad-ai");
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <filter id="aw-glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.35" stop-color="#3f2ee3"/>
      <stop offset="0.75" stop-color="#2a6df2"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-traj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5cf0"/>
      <stop offset="1" stop-color="#00c8ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-traj-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-flow-traj-a"/>
      <stop offset="1" class="aw-flow-traj-b"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="900" height="480"/>
  <circle class="halo" cx="610" cy="160" r="150"/>
  <circle class="halo cyan" cx="780" cy="120" r="100"/>
  <circle class="halo" cx="605" cy="390" r="85"/>
  <circle class="halo cyan" cx="150" cy="220" r="110"/>

  <!-- Sensing -->
  <rect class="box primary" x="55" y="36" width="200" height="60" rx="30"/>
  <circle class="icon-bg on" cx="88" cy="66" r="18"/>
  <circle class="icon-dot" cx="82" cy="72" r="2.6"/>
  <path class="icon-line" d="M82 63 A9 9 0 0 1 91 72"/>
  <path class="icon-line" d="M82 56 A16 16 0 0 1 98 72"/>
  <text class="lbl on-primary" x="116" y="57" dominant-baseline="central">Sensing</text>
  <text class="sub on-primary" x="116" y="77" dominant-baseline="central">LiDAR, camera, radar</text>

  <!-- The vehicle: a glass car with a roof LiDAR -->
  <g transform="translate(48 168)">
    <ellipse class="car-shadow" cx="105" cy="86" rx="92" ry="7"/>
    <path class="car-body" d="M8 50 Q8 38 22 36 L52 33 L76 14 Q84 8 96 8 L146 8 Q158 8 166 16 L184 33 Q200 36 202 48 L202 62 Q202 70 194 70 L16 70 Q8 70 8 62 Z"/>
    <path class="car-glass" d="M60 33 L80 17 Q86 13 96 13 L144 13 Q153 13 159 19 L176 33 Z"/>
    <rect class="car-body" x="114" y="13" width="4" height="20"/>
    <path class="car-shine" d="M90 17 L80 29"/>
    <path class="car-shine" d="M26 44 Q105 38 188 42"/>
    <rect class="lidar" x="100" y="1" width="26" height="7" rx="3.5"/>
    <rect class="headlight" x="194" y="42" width="8" height="6" rx="3"/>
    <circle class="wheel" cx="52" cy="70" r="15"/>
    <circle class="rim" cx="52" cy="70" r="8.5"/>
    <circle class="hub" cx="52" cy="70" r="3"/>
    <circle class="wheel" cx="160" cy="70" r="15"/>
    <circle class="rim" cx="160" cy="70" r="8.5"/>
    <circle class="hub" cx="160" cy="70" r="3"/>
  </g>

  <path class="edge" d="M151 166 V104"/>
  <path class="flow" pathLength="100" d="M151 166 V104"/>
  <path class="edge head" d="M151 166 V104"/>
  <path class="edge" d="M151 390 V268"/>
  <path class="flow" pathLength="100" d="M151 390 V268"/>
  <path class="edge head" d="M151 390 V268"/>
  <text class="edge-lbl" x="151" y="290" text-anchor="middle" dominant-baseline="central">Vehicle</text>

  <!-- Controller -->
  <rect class="box primary" x="55" y="390" width="200" height="60" rx="30"/>
  <circle class="icon-bg on" cx="88" cy="420" r="18"/>
  <circle class="icon-line" cx="88" cy="420" r="8"/>
  <path class="icon-line" d="M80 420 H96 M88 420 V428"/>
  <text class="lbl on-primary" x="116" y="411" dominant-baseline="central">Controller</text>
  <text class="sub on-primary" x="116" y="431" dominant-baseline="central">Follows the trajectory</text>

  <!-- Sensing to the generators -->
  <path class="edge accent" d="M255 66 H322"/>
  <path class="flow flow-accent" pathLength="100" d="M255 66 H318"/>
  <path class="edge accent head" d="M255 66 H322"/>
  <text class="edge-lbl" x="288" y="50" text-anchor="middle" dominant-baseline="central">Sensor data</text>

  <!-- The generators -->
  <rect class="glass-panel" x="330" y="22" width="548" height="252" rx="22"/>
  <text class="ttl" x="354" y="50">Generators</text>
  <text class="sub" x="354" y="70">Any module that outputs trajectories. They can run in parallel.</text>

  <rect class="card" x="354" y="90" width="246" height="74" rx="14"/>
  <circle class="icon-bg" cx="386" cy="127" r="18"/>
  <path class="icon-line" d="M380 121 L392 121 M380 121 L386 133 M392 121 L386 133"/>
  <circle class="icon-dot" cx="380" cy="121" r="2.8"/>
  <circle class="icon-dot" cx="392" cy="121" r="2.8"/>
  <circle class="icon-dot" cx="386" cy="133" r="2.8"/>
  <text class="lbl" x="414" y="117" dominant-baseline="central">Robotics approach</text>
  <text class="sub" x="414" y="137" dominant-baseline="central">Rule-based planning stack</text>

  <rect class="card ai" x="616" y="90" width="246" height="74" rx="14"/>
  <circle class="icon-bg ai" cx="648" cy="127" r="18"/>
  <rect class="icon-line" x="640" y="118" width="16" height="7" rx="2"/>
  <rect class="icon-line" x="640" y="129" width="16" height="7" rx="2"/>
  <text class="lbl" x="676" y="117" dominant-baseline="central">Modular E2E</text>
  <text class="sub" x="676" y="137" dominant-baseline="central">Learned perception, planning</text>

  <rect class="card ai" x="354" y="178" width="246" height="74" rx="14"/>
  <circle class="icon-bg ai" cx="386" cy="215" r="18"/>
  <circle class="icon-line" cx="386" cy="215" r="8"/>
  <circle class="icon-dot" cx="383" cy="212" r="1.8"/>
  <circle class="icon-dot" cx="389" cy="212" r="1.8"/>
  <circle class="icon-dot" cx="386" cy="218" r="1.8"/>
  <text class="lbl" x="414" y="205" dominant-baseline="central">Monolithic E2E</text>
  <text class="sub" x="414" y="225" dominant-baseline="central">One network, sensors to path</text>

  <rect class="card ai" x="616" y="178" width="246" height="74" rx="14"/>
  <circle class="icon-bg ai" cx="648" cy="215" r="18"/>
  <circle class="icon-line" cx="648" cy="215" r="8"/>
  <ellipse class="icon-line" cx="648" cy="215" rx="3.8" ry="8"/>
  <path class="icon-line" d="M640 215 H656"/>
  <text class="lbl" x="676" y="205" dominant-baseline="central">World model E2E</text>
  <text class="sub" x="676" y="225" dominant-baseline="central">Learns how scenes evolve</text>

  <!-- Candidate trajectories -->
  <path class="traj" d="M560 276 C560 306 584 304 584 330"/>
  <path class="traj" d="M605 276 C599 300 611 306 605 330"/>
  <path class="traj" d="M650 276 C650 306 626 304 626 330"/>
  <path class="flow flow-traj" pathLength="100" d="M560 276 C560 306 584 304 584 330"/>
  <path class="traj head" d="M560 276 C560 306 584 304 584 330"/>
  <path class="flow flow-traj" pathLength="100" d="M605 276 C599 300 611 306 605 330"/>
  <path class="traj head" d="M605 276 C599 300 611 306 605 330"/>
  <path class="flow flow-traj" pathLength="100" d="M650 276 C650 306 626 304 626 330"/>
  <path class="traj head" d="M650 276 C650 306 626 304 626 330"/>
  <text class="edge-lbl" x="668" y="304" dominant-baseline="central">Candidate trajectories</text>

  <!-- The selector -->
  <rect class="box primary" x="440" y="338" width="330" height="112" rx="18"/>
  <text class="lbl on-primary" x="468" y="364" dominant-baseline="central">Selector</text>
  <text class="sub on-primary" x="468" y="383" dominant-baseline="central">Checks every candidate, then picks one</text>
  <rect class="pill" x="468" y="402" width="124" height="32" rx="16"/>
  <path class="icon-line" d="M486 410 L494 413 V419 Q494 425 486 428 Q478 425 478 419 V413 Z"/>
  <text class="pill-text" x="502" y="418" dominant-baseline="central">Safety gate</text>
  <path class="icon-line" d="M603 412 L609 418 L603 424"/>
  <rect class="pill" x="620" y="402" width="124" height="32" rx="16"/>
  <rect class="icon-dot" x="632" y="419" width="4" height="7" rx="1"/>
  <rect class="icon-dot" x="638" y="414" width="4" height="12" rx="1"/>
  <rect class="icon-dot" x="644" y="409" width="4" height="17" rx="1"/>
  <text class="pill-text" x="656" y="418" dominant-baseline="central">Ranking</text>

  <!-- The selector to the controller -->
  <path class="edge accent glow" d="M440 420 H263"/>
  <path class="flow flow-accent" pathLength="100" d="M440 420 H268"/>
  <path class="edge accent glow head" d="M440 420 H263"/>
  <text class="edge-lbl" x="350" y="404" text-anchor="middle" dominant-baseline="central">Selected trajectory</text>
</svg>
