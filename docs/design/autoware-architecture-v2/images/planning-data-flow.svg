<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 468" role="img" aria-labelledby="planning-data-flow-title">
  <title id="planning-data-flow-title">The planning data flow in Autoware 2.0.0. With planning_setting set to diffusion_planner, the Diffusion Planner sends candidate trajectories to the trajectory modifier, which sends the first candidate to the planning validator. With rule_based, scenario planning sends its trajectory to the planning validator. The validator publishes /planning/trajectory for control. The trajectory selector is not launched.</title>

  <!-- planning_setting:=diffusion_planner -->
  <rect class="group dashed" x="20" y="16" width="524" height="252" rx="16"/>
  <text class="code" x="40" y="42">planning_setting:=diffusion_planner</text>

  <rect class="box ai" x="40" y="60" width="280" height="60" rx="10"/>
  <text class="lbl" x="180" y="80" text-anchor="middle" dominant-baseline="central">autoware_diffusion_planner</text>
  <text class="sub" x="180" y="100" text-anchor="middle" dominant-baseline="central">Generator: a learned planner</text>

  <path class="edge accent" d="M180 120 V178"/>
  <text class="edge-lbl" x="180" y="149" text-anchor="middle" dominant-baseline="central">CandidateTrajectories</text>

  <rect class="box" x="40" y="184" width="280" height="64" rx="10"/>
  <text class="lbl" x="180" y="205" text-anchor="middle" dominant-baseline="central">autoware_trajectory_modifier</text>
  <text class="sub" x="180" y="226" text-anchor="middle" dominant-baseline="central">Modifier and optimizer plugins</text>

  <rect class="box ext" x="340" y="184" width="184" height="64" rx="10"/>
  <text class="lbl" x="432" y="205" text-anchor="middle" dominant-baseline="central">Trajectory selector</text>
  <text class="sub" x="432" y="226" text-anchor="middle" dominant-baseline="central">Not launched in 2.0.0</text>

  <!-- planning_setting:=rule_based -->
  <rect class="group dashed" x="564" y="16" width="276" height="252" rx="16"/>
  <text class="code" x="584" y="42">planning_setting:=rule_based</text>
  <text class="sub" x="584" y="60">The default setting</text>

  <rect class="box" x="584" y="76" width="236" height="64" rx="10"/>
  <text class="lbl" x="702" y="98" text-anchor="middle" dominant-baseline="central">Scenario planning</text>
  <text class="sub" x="702" y="118" text-anchor="middle" dominant-baseline="central">Rule-based planning stack</text>

  <!-- The planning validator and control -->
  <rect class="box" x="300" y="300" width="260" height="60" rx="10"/>
  <text class="lbl" x="430" y="320" text-anchor="middle" dominant-baseline="central">autoware_planning_validator</text>
  <text class="sub" x="430" y="340" text-anchor="middle" dominant-baseline="central">Checks the trajectory</text>

  <path class="edge accent" d="M180 248 V330 H294"/>
  <text class="edge-lbl" x="180" y="292" text-anchor="middle" dominant-baseline="central">Trajectory (first candidate)</text>

  <path class="edge" d="M702 140 V330 H566"/>
  <text class="edge-lbl" x="702" y="204" text-anchor="middle" dominant-baseline="central">Trajectory</text>

  <rect class="box primary" x="340" y="404" width="180" height="48" rx="10"/>
  <text class="lbl on-primary" x="430" y="428" text-anchor="middle" dominant-baseline="central">Control</text>

  <path class="edge accent" d="M430 360 V398"/>
  <text class="code" x="442" y="379" dominant-baseline="central">/planning/trajectory</text>
</svg>
