<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="roadmap-steps-title">
  <title id="roadmap-steps-title">The steps from the traditional robotics stack to Step 1, learned planning, Step 2, learned planning and learned perception, Step 3, a monolithic learned driving model, and Step 4, a learned hybrid model.</title>

  <!-- Start -->
  <rect class="box" x="20" y="304" width="272" height="60" rx="10"/>
  <text class="lbl" x="156" y="324" text-anchor="middle" dominant-baseline="central">Start</text>
  <text class="sub" x="156" y="344" text-anchor="middle" dominant-baseline="central">Traditional robotics stack</text>

  <!-- Step 1 -->
  <rect class="box ai" x="162" y="232" width="272" height="60" rx="10"/>
  <text class="lbl" x="298" y="252" text-anchor="middle" dominant-baseline="central">Step 1</text>
  <text class="sub" x="298" y="272" text-anchor="middle" dominant-baseline="central">Learned planning</text>

  <!-- Step 2 -->
  <rect class="box ai" x="304" y="160" width="272" height="60" rx="10"/>
  <text class="lbl" x="440" y="180" text-anchor="middle" dominant-baseline="central">Step 2</text>
  <text class="sub" x="440" y="200" text-anchor="middle" dominant-baseline="central">Learned planning and learned perception</text>

  <!-- Step 3 -->
  <rect class="box ai" x="446" y="88" width="272" height="60" rx="10"/>
  <text class="lbl" x="582" y="108" text-anchor="middle" dominant-baseline="central">Step 3</text>
  <text class="sub" x="582" y="128" text-anchor="middle" dominant-baseline="central">Learned driving: monolithic model</text>

  <!-- Step 4 -->
  <rect class="box ai" x="588" y="16" width="272" height="60" rx="10"/>
  <text class="lbl" x="724" y="36" text-anchor="middle" dominant-baseline="central">Step 4</text>
  <text class="sub" x="724" y="56" text-anchor="middle" dominant-baseline="central">Learned hybrid model</text>

  <!-- The steps -->
  <path class="edge accent" d="M90 304 V262 H156"/>
  <path class="edge accent" d="M232 232 V190 H298"/>
  <path class="edge accent" d="M374 160 V118 H440"/>
  <path class="edge accent" d="M516 88 V46 H582"/>
</svg>
