<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 432" role="img" aria-labelledby="roadmap-stack-fig02-title">
  <title id="roadmap-stack-fig02-title">What the human and the system must do at SAE Level 3, Level 4, and Level 5, and at Level 4+ of the roadmap. At Level 4+, the human does not drive and the system can dynamically adapt to new scenarios. SAE J3016 defines Levels 0 to 5 only. Level 4+ and the last row are the roadmap's own definitions.</title>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="860" height="432"/>
  <circle class="halo cyan" cx="593" cy="200" r="175"/>
  <circle class="halo" cx="84" cy="222" r="76"/>

  <!-- The levels -->
  <rect class="card" x="168" y="16" width="162" height="44" rx="12"/>
  <text class="lbl" x="249" y="38" text-anchor="middle" dominant-baseline="central">Level 3</text>
  <rect class="card" x="340" y="16" width="162" height="44" rx="12"/>
  <text class="lbl" x="421" y="38" text-anchor="middle" dominant-baseline="central">Level 4</text>
  <rect class="box primary" x="512" y="16" width="162" height="44" rx="12"/>
  <text class="lbl on-primary" x="593" y="38" text-anchor="middle" dominant-baseline="central">Level 4+</text>
  <rect class="card" x="684" y="16" width="162" height="44" rx="12"/>
  <text class="lbl" x="765" y="38" text-anchor="middle" dominant-baseline="central">Level 5</text>

  <!-- What the human must do -->
  <rect class="glass-panel" x="8" y="76" width="844" height="138" rx="18"/>
  <circle class="icon-bg" cx="84" cy="112" r="16"/>
  <circle class="icon-line" cx="84" cy="108.44" r="3.38"/>
  <path class="icon-line" d="M77.78 119.11 Q77.78 113.33 84 113.33 Q90.22 113.33 90.22 119.11"/>
  <text class="lbl" x="84" y="142" text-anchor="middle" dominant-baseline="central">What the human</text>
  <text class="lbl" x="84" y="162" text-anchor="middle" dominant-baseline="central">must do</text>

  <rect class="card ai" x="168" y="88" width="678" height="52" rx="12"/>
  <text x="507" y="114" text-anchor="middle" dominant-baseline="central">The human is not driving when the autonomous driving system is engaged</text>

  <rect class="card" x="168" y="150" width="162" height="52" rx="12"/>
  <text x="249" y="166" text-anchor="middle" dominant-baseline="central">Upon a request, the</text>
  <text x="249" y="186" text-anchor="middle" dominant-baseline="central">human must drive</text>

  <rect class="card ai" x="340" y="150" width="506" height="52" rx="12"/>
  <text x="593" y="176" text-anchor="middle" dominant-baseline="central">The human will not be required to take over driving</text>

  <!-- What the system must do -->
  <rect class="glass-panel" x="8" y="230" width="844" height="138" rx="18"/>
  <circle class="icon-bg" cx="84" cy="266" r="16"/>
  <rect class="icon-line" x="78.67" y="260.67" width="10.67" height="10.67" rx="1.78"/>
  <path class="icon-line" d="M81.33 258 V260.67 M81.33 271.33 V274 M76 263.33 H78.67 M89.33 263.33 H92 M86.67 258 V260.67 M86.67 271.33 V274 M76 268.67 H78.67 M89.33 268.67 H92"/>
  <text class="lbl" x="84" y="296" text-anchor="middle" dominant-baseline="central">What the system</text>
  <text class="lbl" x="84" y="316" text-anchor="middle" dominant-baseline="central">must do</text>

  <rect class="card ai" x="168" y="242" width="506" height="52" rx="12"/>
  <text x="421" y="258" text-anchor="middle" dominant-baseline="central">The system can drive under limited conditions and will not</text>
  <text x="421" y="278" text-anchor="middle" dominant-baseline="central">operate unless all required conditions are met</text>

  <rect class="card" x="684" y="242" width="162" height="52" rx="12"/>
  <text x="765" y="258" text-anchor="middle" dominant-baseline="central">The system can drive</text>
  <text x="765" y="278" text-anchor="middle" dominant-baseline="central">under all conditions</text>

  <rect class="card" x="168" y="304" width="334" height="52" rx="12"/>
  <text x="335" y="320" text-anchor="middle" dominant-baseline="central">The system is limited to a</text>
  <text x="335" y="340" text-anchor="middle" dominant-baseline="central">fixed set of scenarios</text>

  <rect class="card ai" x="512" y="304" width="334" height="52" rx="12"/>
  <text x="679" y="320" text-anchor="middle" dominant-baseline="central">The system can dynamically</text>
  <text x="679" y="340" text-anchor="middle" dominant-baseline="central">adapt to new scenarios</text>

  <!-- Legend -->
  <rect class="card ai" x="168" y="384" width="28" height="16" rx="5"/>
  <text class="sub" x="206" y="392" dominant-baseline="central">The cyan cells apply to Level 4+.</text>
  <text class="sub" x="168" y="418" dominant-baseline="central">SAE J3016 defines Levels 0 to 5 only. Level 4+ and the last row are the roadmap's own definitions.</text>
</svg>
