<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 436" role="img" aria-labelledby="roadmap-generator-selector-title">
  <title id="roadmap-generator-selector-title">The vehicle sends sensor data through the sensor abstraction layer and sensing to the generator. The generator holds robotics, learned, and proprietary models that make candidate trajectories. The selector checks and ranks them, and sends one trajectory to the controller, which drives the vehicle through the vehicle abstraction layer.</title>

  <!-- The vehicle loop on the left -->
  <rect class="box primary" x="20" y="24" width="200" height="48" rx="10"/>
  <text class="lbl on-primary" x="120" y="48" text-anchor="middle" dominant-baseline="central">Sensing</text>

  <rect class="box ext" x="20" y="104" width="200" height="44" rx="10"/>
  <text x="120" y="126" text-anchor="middle" dominant-baseline="central">Sensor abstraction layer</text>

  <rect class="box muted" x="60" y="180" width="120" height="82" rx="10"/>
  <path class="icon" d="M83 234 v-26 q0-8 8-8 h44 l14 14 h10 q6 0 6 6 v14 z"/>
  <circle class="icon" cx="99" cy="236" r="7"/>
  <circle class="icon" cx="143" cy="236" r="7"/>
  <text class="sub" x="120" y="251" text-anchor="middle" dominant-baseline="central">Vehicle</text>

  <rect class="box ext" x="20" y="294" width="200" height="44" rx="10"/>
  <text x="120" y="316" text-anchor="middle" dominant-baseline="central">Vehicle abstraction layer</text>

  <rect class="box primary" x="20" y="370" width="200" height="48" rx="10"/>
  <text class="lbl on-primary" x="120" y="394" text-anchor="middle" dominant-baseline="central">Controller</text>

  <path class="edge" d="M120 180 V154"/>
  <path class="edge" d="M120 104 V78"/>
  <path class="edge" d="M120 370 V344"/>
  <path class="edge" d="M120 294 V268"/>

  <!-- The generator -->
  <rect class="group ai" x="330" y="16" width="510" height="240" rx="16"/>
  <text class="ttl" x="352" y="42">Generator (black box)</text>

  <rect class="box" x="352" y="60" width="225" height="48" rx="10"/>
  <text class="lbl" x="464.5" y="84" text-anchor="middle" dominant-baseline="central">Traditional robotics stack</text>
  <rect class="box ai" x="593" y="60" width="225" height="48" rx="10"/>
  <text class="lbl" x="705.5" y="84" text-anchor="middle" dominant-baseline="central">Learned planning models</text>

  <rect class="box ai" x="352" y="124" width="225" height="48" rx="10"/>
  <text class="lbl" x="464.5" y="148" text-anchor="middle" dominant-baseline="central">Component-based AI models</text>
  <rect class="box ai" x="593" y="124" width="225" height="48" rx="10"/>
  <text class="lbl" x="705.5" y="148" text-anchor="middle" dominant-baseline="central">Proprietary AI models</text>

  <rect class="box ai" x="352" y="188" width="225" height="48" rx="10"/>
  <text class="lbl" x="464.5" y="212" text-anchor="middle" dominant-baseline="central">Learned driving models</text>
  <rect class="box ai" x="593" y="188" width="225" height="48" rx="10"/>
  <text class="lbl" x="705.5" y="212" text-anchor="middle" dominant-baseline="central">Learned hybrid models</text>

  <!-- Sensing to the generator -->
  <path class="edge accent" d="M220 48 H322"/>
  <text class="edge-lbl" x="271" y="48" text-anchor="middle" dominant-baseline="central">Sensor data</text>

  <!-- The selector -->
  <rect class="box primary" x="440" y="330" width="290" height="80" rx="10"/>
  <text class="lbl on-primary" x="585" y="358" text-anchor="middle" dominant-baseline="central">Selector</text>
  <text class="sub on-primary" x="585" y="382" text-anchor="middle" dominant-baseline="central">Safety gate and ranking</text>

  <path class="edge accent" d="M545 256 V322"/>
  <path class="edge accent" d="M585 256 V322"/>
  <path class="edge accent" d="M625 256 V322"/>
  <text class="edge-lbl" x="585" y="290" text-anchor="middle" dominant-baseline="central">Candidate trajectories</text>

  <!-- The selector to the controller -->
  <path class="edge accent" d="M440 394 H228"/>
  <text class="edge-lbl" x="334" y="394" text-anchor="middle" dominant-baseline="central">Selected trajectory</text>
</svg>
