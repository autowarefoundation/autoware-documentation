<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 486" role="img" aria-labelledby="roadmap-stack-fig08-title">
  <title id="roadmap-stack-fig08-title">Step 4, option A: learned perception and learned driving, with localization on an HD map, feed a safety guardian that sends the trajectory to control.</title>

  <!-- The reference design framework and the vehicle types -->
