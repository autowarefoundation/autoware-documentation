<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 486" role="img" aria-labelledby="roadmap-stack-fig06-title">
  <title id="roadmap-stack-fig06-title">Step 3, option A: one learned driving model takes sensing and localization on an HD map, and sends its trajectory to control.</title>

