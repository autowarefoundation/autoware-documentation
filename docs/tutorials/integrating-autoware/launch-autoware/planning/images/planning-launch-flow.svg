  <rect class="box" x="530" y="658" width="378" height="70" rx="10"/>
  <text class="code lbl" x="719" y="675" text-anchor="middle" dominant-baseline="central">behavior_planning.launch.xml</text>
  <text class="sub" x="719" y="693" text-anchor="middle" dominant-baseline="central">behavior_path_planner or path_generator,</text>
  <text class="sub" x="719" y="711" text-anchor="middle" dominant-baseline="central">and behavior_velocity_planner</text>
  <rect class="box" x="530" y="736" width="378" height="70" rx="10"/>
  <text class="code lbl" x="719" y="753" text-anchor="middle" dominant-baseline="central">motion_planning.launch.xml</text>
