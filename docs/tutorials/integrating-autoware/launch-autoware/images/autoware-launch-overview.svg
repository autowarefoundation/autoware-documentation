<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="autoware-launch-overview-title">
  <title id="autoware-launch-overview-title">
    autoware.launch.xml of the autoware_launch repository includes vehicle.launch.xml of tier4_vehicle_launch directly, and one component launch file for each other component. The component files
    include
    the feature launch files of the autoware_*_launch packages, which read the parameter files of the autoware_*_config packages. The sensing component includes the sensing.launch.xml file of the
    sensor kit.
    The system and the API use the tier4_*_launch packages, and vehicle.launch.xml includes vehicle_interface.launch.xml of the vehicle package. The launch files start the nodes of autoware_core and
    autoware_universe and override their default parameters.
  </title>
  <style data-aw-standalone="">
