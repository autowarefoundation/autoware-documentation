  <path class="edge accent head" d="M480 84 V104 H210 V122"/>
  <path class="edge accent" d="M480 84 V104 H774 V122"/>
  <path class="flow flow-accent" pathLength="100" d="M480 84 V104 H774 V122"/>
  <path class="edge accent head" d="M480 84 V104 H774 V122"/>
  <path class="edge accent" d="M210 184 V254 H38 V369 H58"/>
  <path class="flow flow-accent" pathLength="100" d="M210 184 V254 H38 V369 H58"/>
  <path class="edge accent head" d="M210 184 V254 H38 V369 H58"/>
  <path class="edge accent" d="M210 184 V254 H38 V574 H58"/>
