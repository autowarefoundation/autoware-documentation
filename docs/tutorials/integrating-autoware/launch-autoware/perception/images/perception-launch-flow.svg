  <path class="edge accent" d="M210 184 V254 H38 V635 H58"/>
  <path class="flow flow-accent" pathLength="100" d="M210 184 V254 H38 V635 H58"/>
  <path class="edge accent head" d="M210 184 V254 H38 V635 H58"/>
  <path class="edge accent" d="M774 184 V222 H622 V397.0 H634"/>
  <path class="flow flow-accent" pathLength="100" d="M774 184 V222 H622 V397.0 H634"/>
  <path class="edge accent head" d="M774 184 V222 H622 V397.0 H634"/>
  <text class="edge-lbl code" x="492" y="94" text-anchor="start" dominant-baseline="central">launch_perception:=true</text>
</svg>
