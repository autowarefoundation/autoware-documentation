  <text class="sub" x="190" y="165" text-anchor="middle" dominant-baseline="central">autoware_launch</text>
  <text class="sub" x="360" y="147" dominant-baseline="central">Passes launch_sensing_driver as launch_driver,</text>
  <text class="sub" x="360" y="165" dominant-baseline="central">and the mirror.param.yaml file of the vehicle</text>

