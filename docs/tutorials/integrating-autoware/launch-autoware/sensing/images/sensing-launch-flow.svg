  <text class="code" x="238" y="697" text-anchor="middle" dominant-baseline="central">&lt;sensor_model&gt;_launch</text>
  <text class="sub" x="448" y="688" dominant-baseline="central">The sample sensor kit has this file, but sensing.launch.xml does not include it.</text>
