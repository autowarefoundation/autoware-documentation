  <text class="code lbl" x="504" y="861" dominant-baseline="central">gyro_bias_estimator.launch.xml</text>
  <text class="sub" x="504" y="879" dominant-baseline="central">autoware_imu_corrector</text>
  <rect class="card" x="72" y="916" width="332" height="52" rx="12"/>
  <circle class="icon-bg" cx="101" cy="942" r="15"/>
  <path class="icon-line" d="M96.3125 934.5 H102.875 L106.625 938.25 V949.5 H96.3125 Z M99.125 942 H103.812 M99.125 945.75 H103.812"/>
  <text class="code lbl" x="128" y="933" dominant-baseline="central">gnss.launch.xml</text>
  <text class="code" x="128" y="951" dominant-baseline="central">&lt;sensor_model&gt;_launch</text>
  <rect class="box" x="448" y="916" width="476" height="48" rx="12"/>
  <circle class="icon-bg" cx="477" cy="940" r="15"/>
  <path class="icon-line" d="M477 931.562 L484.5 935.781 V944.219 L477 948.438 L469.5 944.219 V935.781 Z M469.5 935.781 L477 940 L484.5 935.781 M477 940 V948.438"/>
  <text class="lbl" x="504" y="931" dominant-baseline="central">GNSS driver: ublox_gps or septentrio_gnss_driver</text>
  <text class="sub" x="504" y="949" dominant-baseline="central">Selected by gnss_receiver, if launch_driver is true</text>
  <rect class="card" x="448" y="972" width="476" height="48" rx="12"/>
  <circle class="icon-bg" cx="477" cy="996" r="15"/>
  <path class="icon-line" d="M472.312 988.5 H478.875 L482.625 992.25 V1003.5 H472.312 Z M475.125 996 H479.812 M475.125 999.75 H479.812"/>
  <text class="code lbl" x="504" y="987" dominant-baseline="central">gnss_poser.launch.xml</text>
  <text class="sub" x="504" y="1005" dominant-baseline="central">autoware_gnss_poser</text>
  <rect class="card" x="72" y="1040" width="332" height="52" rx="12"/>
  <circle class="icon-bg" cx="101" cy="1066" r="15"/>
  <path class="icon-line" d="M96.3125 1058.5 H102.875 L106.625 1062.25 V1073.5 H96.3125 Z M99.125 1066 H103.812 M99.125 1069.75 H103.812"/>
  <text class="code lbl" x="128" y="1057" dominant-baseline="central">vehicle_velocity_converter.launch.xml</text>
  <text class="sub" x="128" y="1075" dominant-baseline="central">autoware_vehicle_velocity_converter</text>
  <text class="sub" x="448" y="1057" dominant-baseline="central">Converts /vehicle/status/velocity_status into</text>
  <text class="sub" x="448" y="1075" dominant-baseline="central">/sensing/vehicle_velocity_converter/twist_with_covariance</text>
  <text class="sub" x="480" y="1134" text-anchor="middle" dominant-baseline="central">The files of the sensor kit come from sample_sensor_kit_launch. Your sensor kit can include other files.</text>

