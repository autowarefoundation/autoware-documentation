  <path class="icon-line" d="M66.75 46.5625 L78.4375 54 L66.75 61.4375 Z"/>
  <text class="code lbl on-primary" x="100" y="45" dominant-baseline="central">autoware.launch.xml</text>
  <text class="sub on-primary" x="100" y="63" dominant-baseline="central">autoware_launch</text>
  <rect class="card" x="40" y="128" width="260" height="56" rx="12"/>
  <text class="code lbl" x="170" y="147" text-anchor="middle" dominant-baseline="central">component_map.launch.xml</text>
  <text class="sub" x="170" y="165" text-anchor="middle" dominant-baseline="central">autoware_launch</text>

  <!-- Executor selection -->
  <rect class="card" x="380" y="128" width="280" height="56" rx="12"/>
  <text class="code lbl" x="520" y="147" text-anchor="middle" dominant-baseline="central">agnocast_env.launch.xml</text>
  <text class="sub" x="520" y="165" text-anchor="middle" dominant-baseline="central">autoware_agnocast_wrapper</text>
  <text class="sub" x="676" y="147" dominant-baseline="central">Selects the executor and gives</text>
  <text class="sub" x="676" y="165" dominant-baseline="central">ld_preload_value to the nodes</text>

  <!-- Map namespace -->
  <rect class="glass-panel" x="20" y="236" width="920" height="482" rx="18"/>
  <text class="ttl" x="36" y="262">Namespace /map</text>
  <text class="sub" x="924" y="258" text-anchor="end" dominant-baseline="central">Launch files: autoware_map_launch. Parameter files: autoware_map_config.</text>
