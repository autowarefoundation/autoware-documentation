  <text class="code lbl" x="666" y="519" dominant-baseline="central">vector_map_tf_generator</text>
  <text class="sub" x="666" y="537" dominant-baseline="central">autoware_map_tf_generator</text>
  <rect class="card" x="236" y="572" width="316" height="52" rx="12"/>
  <circle class="icon-bg" cx="265" cy="598" r="15"/>
