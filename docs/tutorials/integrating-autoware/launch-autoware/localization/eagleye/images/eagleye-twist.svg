<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="eagleye-twist-title">
  <title id="eagleye-twist-title">
    Eagleye takes GNSS, wheel odometry, and IMU data and sends a twist with covariance to the EKF. NDT takes the 3D LiDAR data and sends a pose with covariance to the EKF.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .on-primary {
  fill: #fff;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="760" height="340"/>
  <circle class="halo cyan" cx="300" cy="110" r="100"/>
  <circle class="halo" cx="666" cy="170" r="88"/>

  <!-- Inputs -->
  <rect class="box muted" x="24" y="24" width="172" height="48" rx="12"/>
  <circle class="icon-bg" cx="53" cy="48" r="15"/>
  <path class="icon-line" d="M53 56.4375 Q45.5 48 47.375 44.25 Q53 36.75 58.625 44.25 Q60.5 48 53 56.4375 Z"/>
  <circle class="icon-dot" cx="53" cy="45.1875" r="2.25"/>
  <text class="lbl" x="80" y="48" dominant-baseline="central">GNSS</text>
  <rect class="box muted" x="24" y="92" width="172" height="48" rx="12"/>
  <circle class="icon-bg" cx="53" cy="116" r="15"/>
  <circle class="icon-line" cx="53" cy="116" r="7.5"/>
  <path class="icon-line" d="M45.5 116 H60.5 M53 108.5 V123.5"/>
  <text class="lbl" x="80" y="116" dominant-baseline="central">Wheel odometry</text>
  <rect class="box muted" x="24" y="160" width="172" height="48" rx="12"/>
  <circle class="icon-bg" cx="53" cy="184" r="15"/>
  <circle class="icon-line" cx="53" cy="184" r="3.75"/>
  <path class="icon-line" d="M53 175.562 V178.375 M53 189.625 V192.438 M44.5625 184 H47.375 M58.625 184 H61.4375"/>
  <text class="lbl" x="80" y="184" dominant-baseline="central">IMU</text>
  <rect class="box muted" x="24" y="262" width="172" height="48" rx="12"/>
  <circle class="icon-bg" cx="53" cy="286" r="15"/>
  <path class="icon-line" d="M44.5625 286 Q53 277.562 61.4375 286 Q53 294.438 44.5625 286 Z"/>
  <circle class="icon-dot" cx="53" cy="286" r="2.625"/>
  <text class="lbl" x="80" y="286" dominant-baseline="central">3D LiDAR</text>

  <!-- Estimators -->
  <rect class="card" x="250" y="24" width="150" height="184" rx="14"/>
  <text class="lbl" x="325" y="107" text-anchor="middle" dominant-baseline="central">Eagleye</text>
  <text class="code" x="325" y="125" text-anchor="middle" dominant-baseline="central">eagleye_rt</text>
  <rect class="card" x="250" y="248" width="150" height="72" rx="14"/>
  <text class="lbl" x="325" y="275" text-anchor="middle" dominant-baseline="central">NDT</text>
  <text class="code" x="325" y="293" text-anchor="middle" dominant-baseline="central">ndt_scan_matcher</text>
  <rect class="box primary" x="596" y="24" width="140" height="296" rx="14"/>
  <text class="lbl on-primary" x="666" y="163" text-anchor="middle" dominant-baseline="central">EKF</text>
  <text class="code on-primary" x="666" y="181" text-anchor="middle" dominant-baseline="central">ekf_localizer</text>

  <!-- Lines -->
  <text class="lbl" x="497" y="44" text-anchor="middle" dominant-baseline="central">Twist with covariance</text>
  <text class="code" x="497" y="62" text-anchor="middle" dominant-baseline="central">/localization/</text>
  <text class="code" x="497" y="78" text-anchor="middle" dominant-baseline="central">twist_estimator/</text>
  <text class="code" x="497" y="94" text-anchor="middle" dominant-baseline="central">twist_with_covariance</text>
  <text class="lbl" x="497" y="212" text-anchor="middle" dominant-baseline="central">Pose with covariance</text>
  <text class="code" x="497" y="230" text-anchor="middle" dominant-baseline="central">/localization/</text>
  <text class="code" x="497" y="246" text-anchor="middle" dominant-baseline="central">pose_estimator/</text>
  <text class="code" x="497" y="262" text-anchor="middle" dominant-baseline="central">pose_with_covariance</text>

  <!-- Lines: optional ones first, the main flow on top -->
  <path class="edge" d="M196 48 H244"/>
  <path class="flow" pathLength="100" d="M196 48 H244"/>
  <path class="edge head" d="M196 48 H244"/>
  <path class="edge" d="M196 116 H244"/>
  <path class="flow" pathLength="100" d="M196 116 H244"/>
  <path class="edge head" d="M196 116 H244"/>
  <path class="edge" d="M196 184 H244"/>
  <path class="flow" pathLength="100" d="M196 184 H244"/>
  <path class="edge head" d="M196 184 H244"/>
  <path class="edge" d="M196 286 H244"/>
  <path class="flow" pathLength="100" d="M196 286 H244"/>
  <path class="edge head" d="M196 286 H244"/>
  <path class="edge" d="M400 284 H590"/>
  <path class="flow" pathLength="100" d="M400 284 H590"/>
  <path class="edge head" d="M400 284 H590"/>
  <path class="edge accent" d="M400 116 H590"/>
  <path class="flow flow-accent" pathLength="100" d="M400 116 H590"/>
  <path class="edge accent head" d="M400 116 H590"/>
</svg>
