<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="tutorial-vehicle-sensor-kit-base-link-title">
  <title id="tutorial-vehicle-sensor-kit-base-link-title">
    A side view of tutorial_vehicle with the CAD dimensions from base_link to sensor_kit_base_link: 1600 mm forward from the rear axle, and 270 mm plus 1151.595 mm up from the ground.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.both {
  marker-start: url("#aw-arrow");
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .car-body {
  fill: url("#aw-grad-car");
} .car-glass {
  fill: url("#aw-grad-car-glass");
  stroke: #ffffffb3;
  stroke-width: 1;
} .car-shine {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  opacity: 0.75;
} .wheel {
  fill: #1b1d29;
} .rim {
  fill: none;
  stroke: #c9ccd8;
  stroke-width: 2.5;
} .hub {
  fill: #c9ccd8;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
} .lidar {
  fill: url("#aw-grad-ai");
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.35" stop-color="#3f2ee3"/>
      <stop offset="0.75" stop-color="#2a6df2"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- Background: a faint dot grid -->
  <rect class="dots" x="0" y="0" width="900" height="520"/>
  <!-- Driving direction -->
  <path class="edge" d="M270 100 H200"/>
  <text class="sub" x="282" y="100" dominant-baseline="central">Front</text>
  <!-- Ground -->
  <ellipse class="car-shadow" cx="460" cy="444" rx="270" ry="8"/>
  <!-- The vehicle, front to the left -->
  <rect class="car-body" x="200" y="262" width="500" height="120" rx="32"/>
  <rect class="car-body" x="188" y="246" width="528" height="18" rx="8"/>
  <path class="car-shine" d="M224 300 Q450 292 676 300"/>
  <rect class="car-glass" x="404" y="306" width="96" height="10" rx="5"/>
  <!-- Sensor mast with the top LiDAR -->
  <rect class="car-body" x="300" y="177" width="48" height="71" rx="6"/>
  <rect class="lidar" x="308" y="150" width="32" height="27" rx="5"/>
  <!-- Cargo -->
  <rect class="box muted" x="430" y="196" width="52" height="50" rx="4"/>
  <rect class="box muted" x="490" y="150" width="78" height="96" rx="4"/>
  <!-- Handle at the rear -->
  <path class="leader" d="M704 246 V206 H724 V246"/>
  <!-- Wheels -->
  <circle class="wheel" cx="290" cy="390" r="50"/>
  <circle class="rim" cx="290" cy="390" r="30"/>
  <circle class="hub" cx="290" cy="390" r="9"/>
  <circle class="wheel" cx="620" cy="390" r="50"/>
  <circle class="rim" cx="620" cy="390" r="30"/>
  <circle class="hub" cx="620" cy="390" r="9"/>
  <!-- Frames -->
  <circle class="bound point" cx="324" cy="177" r="5"/>
  <text class="note code" x="356" y="132" dominant-baseline="central">sensor_kit_base_link</text>
  <path class="leader" d="M328 173 L354 140"/>
  <circle class="bound point" cx="620" cy="440" r="5"/>
  <text class="note code" x="632" y="460" dominant-baseline="central">base_link</text>
  <!-- Extension lines -->
  <path class="leader" d="M140 440 H800"/>
  <path class="leader" d="M308 177 H140 M290 390 H140"/>
  <path class="leader" d="M620 390 H800"/>
  <path class="leader" d="M324 182 V492 M620 445 V492"/>
  <!-- Height of sensor_kit_base_link above the wheel centers -->
  <path class="edge both" d="M150 179 V388"/>
  <text class="code" x="140" y="284" text-anchor="end" dominant-baseline="central">1151.595 mm</text>
  <!-- Height of the wheel centers above the ground -->
  <path class="edge both" d="M780 392 V438"/>
  <text class="code" x="792" y="415" dominant-baseline="central">270 mm</text>
  <!-- Distance from the rear axle to sensor_kit_base_link -->
  <path class="edge both" d="M326 484 H618"/>
  <text class="code" x="472" y="502" text-anchor="middle" dominant-baseline="central">1600 mm</text>
</svg>
