<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="path-optimizer-drivable-area-check-title">
  <title id="path-optimizer-drivable-area-check-title">
    On a right turn, the four corner points of the MPT footprint are inside the drivable area, but one side of the footprint crosses the road boundary. A check of only the corner points does not find
    this.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-crimson: var(--aw-crimson); --aw-c-cyan: #0098c7; --aw-c-green: #00a352; --aw-c-indigo: var(--aw-indigo); --aw-car-shadow: #00002a40; --aw-crimson: #dc143c; --aw-cyan: #00c8ff; --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-flow-tone: 22%; --aw-flow-traj-a: #e3e0ff; --aw-flow-traj-b: #d6f7ff; --aw-green: #00e678; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .road {
  fill: #5c6070;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .lanelet.alt {
  fill: color-mix(in srgb, var(--aw-cyan) 40%, transparent);
} .lanelet.bad {
  fill: color-mix(in srgb, var(--aw-crimson) 35%, transparent);
} .area {
  fill: color-mix(in srgb, var(--aw-green) 25%, transparent);
  stroke: var(--aw-c-green);
  stroke-width: 2;
  stroke-dasharray: 6 4;
} .area.warn {
  fill: color-mix(in srgb, var(--aw-crimson) 22%, transparent);
  stroke: var(--aw-c-crimson);
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.alt {
  stroke: #ff7076;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .note.bad {
  fill: var(--aw-c-crimson);
} .aw-flow-traj-a {
  stop-color: var(--aw-flow-traj-a);
} .aw-flow-traj-b {
  stop-color: var(--aw-flow-traj-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .traj {
  fill: none;
  stroke: url("#aw-grad-traj");
  stroke-width: 2.5;
  marker-end: url("#aw-arrow-accent");
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-traj {
  stroke: url("#aw-grad-traj-light");
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} .car-body {
  fill: url("#aw-grad-car");
} .car-body.npc {
  fill: url("#aw-grad-car-npc");
} .cone {
  fill: url("#aw-grad-cone");
  stroke: #fff;
  stroke-width: 1;
  stroke-linejoin: round;
} .cone-stripe {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
} .cone-base {
  fill: #c2410c;
} .car-glass {
  fill: url("#aw-grad-car-glass");
  stroke: #ffffffb3;
  stroke-width: 1;
} .car-shadow {
  fill: var(--aw-car-shadow);
  filter: url("#aw-soft");
} .headlight {
  fill: #9ff3ff;
  filter: url("#aw-glow");
} .lidar {
  fill: url("#aw-grad-ai");
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <filter id="aw-glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="aw-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <linearGradient id="aw-grad-car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.35" stop-color="#3f2ee3"/>
      <stop offset="0.75" stop-color="#2a6df2"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="aw-grad-car-npc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f6375"/>
      <stop offset="0.5" stop-color="#8d91a0"/>
      <stop offset="1" stop-color="#b9bcc8"/>
    </linearGradient>
    <linearGradient id="aw-grad-cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5560f"/>
      <stop offset="1" stop-color="#ffa25c"/>
    </linearGradient>
    <linearGradient id="aw-grad-traj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5cf0"/>
      <stop offset="1" stop-color="#00c8ff"/>
    </linearGradient>
    <linearGradient id="aw-grad-traj-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-flow-traj-a"/>
      <stop offset="1" class="aw-flow-traj-b"/>
    </linearGradient>
    <filter id="aw-soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid -->
  <rect class="dots" x="0" y="0" width="900" height="560"/>

  <!-- The road: it goes up and turns to the right -->
  <path class="road" d="M200 560 V260 Q200 100 360 100 H900 V240 H430 Q340 240 340 330 V560 Z"/>
  <path class="bound" fill="none" d="M200 560 V260 Q200 100 360 100 H900"/>
  <path class="bound" fill="none" d="M340 560 V330 Q340 240 430 240 H900"/>

  <!-- Other objects -->
  <g transform="translate(222 176)">
    <ellipse class="car-shadow" cx="0" cy="24" rx="15" ry="4"/>
    <rect class="cone-base" x="-13" y="19" width="26" height="5" rx="2"/>
    <path class="cone" d="M-10 19 L0 -2 L10 19 Z"/>
    <path class="cone-stripe" d="M-5 9 H5"/>
  </g>
  <g transform="translate(749 186) rotate(90 11 20)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body npc" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
  </g>

  <!-- The trajectory -->
  <path class="traj" fill="none" d="M270 430 V300 Q270 170 420 170 H880"/>
  <path class="flow flow-traj" pathLength="100" d="M270 430 V300 Q270 170 420 170 H880"/>

  <!-- Vehicle footprints at points of the trajectory -->
  <rect class="lanelet" x="263" y="330" width="14" height="40" rx="3"/>
  <rect class="lanelet" x="293" y="196" width="14" height="40" rx="3" transform="rotate(45 300 216)"/>
  <rect class="lanelet" x="452" y="163" width="40" height="14" rx="3"/>
  <!-- The MPT footprint and the part of it outside the drivable area -->
  <path class="lanelet alt" d="M236 410 L306 410 L580 214 L540 140 Z"/>
  <path class="area warn" d="M340 385.7 L543.7 240 H430 Q340 240 340 330 Z"/>

  <!-- The four corner points that the default check uses -->
  <circle class="bound point" cx="236" cy="410" r="7"/>
  <circle class="bound point" cx="306" cy="410" r="7"/>
  <circle class="bound point" cx="580" cy="214" r="7"/>
  <circle class="bound point" cx="540" cy="140" r="7"/>

  <!-- The ego vehicle -->
  <g transform="translate(248 432) scale(2)">
    <rect class="car-shadow" x="0" y="1" width="22" height="40" rx="7"/>
    <rect class="car-body" x="0" y="0" width="22" height="40" rx="7"/>
    <path class="car-glass" d="M4 10 Q11 7 18 10 L16.5 15.5 Q11 14 5.5 15.5 Z"/>
    <rect class="car-glass" x="5.5" y="29" width="11" height="5" rx="2"/>
    <circle class="lidar" cx="11" cy="22" r="3.2"/>
    <rect class="headlight" x="3" y="1" width="4" height="2" rx="1"/>
    <rect class="headlight" x="15" y="1" width="4" height="2" rx="1"/>
  </g>
  <path class="leader" d="M352 490 H298"/>
  <text class="note" x="358" y="490" dominant-baseline="central">Ego vehicle</text>

  <!-- Notes -->
  <path class="leader" d="M150 76 L231 403 M150 76 L300 404 M150 76 L533 141 M150 76 L573 211"/>
  <text class="note" x="24" y="48" dominant-baseline="central">Outside drivable area check points:</text>
  <text class="note" x="24" y="66" dominant-baseline="central">the four corners of the footprint</text>
  <path class="leader" d="M480 290 L620 330"/>
  <text class="note" x="626" y="336" dominant-baseline="central">MPT footprint</text>
  <path class="leader" d="M420 290 L520 420"/>
  <text class="note bad" x="460" y="440" dominant-baseline="central">The polygon check for the drivable area is off by default.</text>
  <text class="note bad" x="460" y="460" dominant-baseline="central">Then the path optimizer does not know that this part</text>
  <text class="note bad" x="460" y="480" dominant-baseline="central">of the footprint is outside the drivable area.</text>
</svg>
