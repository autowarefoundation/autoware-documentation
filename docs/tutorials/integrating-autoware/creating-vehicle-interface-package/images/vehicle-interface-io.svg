<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" role="img" aria-labelledby="vehicle-interface-io-title">
  <title id="vehicle-interface-io-title">
    Planning and Control send the trajectory, the control command, and the signal commands through the vehicle command gate to the vehicle interface. The vehicle interface talks to the vehicle and
    returns the steering, actuation, velocity, and signal reports to Control, Localization, and the optional adapter. The adapter converts the control command and the actuation status to an actuation
    command for the vehicle interface.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} .box.ext {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-dasharray: 6 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.both {
  marker-start: url("#aw-arrow");
} .edge.accent.both {
  marker-start: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="960" height="704"/>
  <circle class="halo" cx="500" cy="440" r="140"/>
  <circle class="halo cyan" cx="800" cy="420" r="120"/>
  <!-- Center column: from planning to the vehicle interface -->
  <rect class="box muted" x="400" y="16" width="200" height="44" rx="10"/>
  <text class="lbl" x="500" y="38" text-anchor="middle" dominant-baseline="central">Planning</text>
  <rect class="card" x="360" y="92" width="280" height="58" rx="12"/>
  <text class="lbl" x="500" y="112" text-anchor="middle" dominant-baseline="central">Trajectory</text>
  <text class="code" x="500" y="130" text-anchor="middle" dominant-baseline="central">autoware_planning_msgs/msg/Trajectory</text>
  <rect class="box muted" x="420" y="182" width="160" height="44" rx="10"/>
  <text class="lbl" x="500" y="204" text-anchor="middle" dominant-baseline="central">Control</text>
  <rect class="card" x="360" y="258" width="280" height="74" rx="12"/>
  <text class="lbl" x="500" y="277" text-anchor="middle" dominant-baseline="central">Vehicle control command</text>
  <text class="code" x="500" y="295" text-anchor="middle" dominant-baseline="central">autoware_control_msgs/msg/Control</text>
  <text class="code" x="500" y="313" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/GearCommand</text>
  <rect class="box" x="400" y="362" width="200" height="40" rx="10"/>
  <text class="lbl" x="500" y="382" text-anchor="middle" dominant-baseline="central">Vehicle command gate</text>
  <rect class="box primary" x="360" y="434" width="280" height="60" rx="12"/>
  <circle class="icon-bg on" cx="394" cy="464" r="16"/>
  <circle class="icon-line" cx="394" cy="464" r="7.5"/>
  <path class="icon-line" d="M386.5 464 H401.5 M394 464 V471.5"/>
  <text class="lbl on-primary" x="510" y="464" text-anchor="middle" dominant-baseline="central">Vehicle interface</text>
  <rect class="card" x="360" y="540" width="280" height="128" rx="12"/>
  <text class="lbl" x="500" y="559" text-anchor="middle" dominant-baseline="central">Vehicle signal reports</text>
  <text class="code" x="500" y="577" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/</text>
  <text class="code" x="500" y="595" text-anchor="middle" dominant-baseline="central">GearReport</text>
  <text class="code" x="500" y="613" text-anchor="middle" dominant-baseline="central">HazardLightsReport</text>
  <text class="code" x="500" y="631" text-anchor="middle" dominant-baseline="central">TurnIndicatorsReport</text>
  <text class="code" x="500" y="649" text-anchor="middle" dominant-baseline="central">ControlModeReport</text>
  <path class="edge accent" fill="none" d="M500 60 V84"/>
  <path class="flow flow-accent" pathLength="100" d="M500 60 V84"/>
  <path class="edge accent head" fill="none" d="M500 60 V84"/>
  <path class="edge accent" fill="none" d="M500 150 V174"/>
  <path class="flow flow-accent" pathLength="100" d="M500 150 V174"/>
  <path class="edge accent head" fill="none" d="M500 150 V174"/>
  <path class="edge accent" fill="none" d="M500 226 V250"/>
  <path class="flow flow-accent" pathLength="100" d="M500 226 V250"/>
  <path class="edge accent head" fill="none" d="M500 226 V250"/>
  <path class="edge accent" fill="none" d="M500 332 V354"/>
  <path class="flow flow-accent" pathLength="100" d="M500 332 V354"/>
  <path class="edge accent head" fill="none" d="M500 332 V354"/>
  <path class="edge accent" fill="none" d="M500 402 V426"/>
  <path class="flow flow-accent" pathLength="100" d="M500 402 V426"/>
  <path class="edge accent head" fill="none" d="M500 402 V426"/>
  <path class="edge" fill="none" d="M500 494 V532"/>
  <path class="flow" pathLength="100" d="M500 494 V532"/>
  <path class="edge head" fill="none" d="M500 494 V532"/>
  <!-- Left column, top: other command sources and the MRM state -->
  <rect class="card" x="16" y="112" width="240" height="64" rx="12"/>
  <text class="lbl" x="136" y="135" text-anchor="middle" dominant-baseline="central">Other controls</text>
  <text class="sub" x="136" y="153" text-anchor="middle" dominant-baseline="central">Emergency, external, joystick, ...</text>
  <rect class="box muted" x="16" y="200" width="240" height="52" rx="10"/>
  <text class="lbl" x="136" y="217" text-anchor="middle" dominant-baseline="central">System</text>
  <text class="sub" x="136" y="235" text-anchor="middle" dominant-baseline="central">Diagnostic graph and MRM handler</text>
  <rect class="card" x="16" y="270" width="240" height="48" rx="12"/>
  <text class="lbl" x="136" y="285" text-anchor="middle" dominant-baseline="central">MRM state</text>
  <text class="code" x="136" y="303" text-anchor="middle" dominant-baseline="central">/system/fail_safe/mrm_state</text>
  <path class="edge" fill="none" d="M256 144 H290 V372 H392"/>
  <path class="flow" pathLength="100" d="M256 144 H290 V372 H392"/>
  <path class="edge head" fill="none" d="M256 144 H290 V372 H392"/>
  <path class="edge" fill="none" d="M136 252 V262"/>
  <path class="flow" pathLength="100" d="M136 252 V262"/>
  <path class="edge head" fill="none" d="M136 252 V262"/>
  <path class="edge" fill="none" d="M256 294 H276 V392 H392"/>
  <path class="flow" pathLength="100" d="M256 294 H276 V392 H392"/>
  <path class="edge head" fill="none" d="M256 294 H276 V392 H392"/>
  <!-- Left column, bottom: the optional adapter (Type B) and the vehicle -->
  <rect class="box ext" x="16" y="400" width="220" height="60" rx="10"/>
  <text class="lbl" x="126" y="421" text-anchor="middle" dominant-baseline="central">Adapter (optional)</text>
  <text class="code" x="126" y="439" text-anchor="middle" dominant-baseline="central">raw_vehicle_cmd_converter</text>
  <path class="edge dash" fill="none" d="M500 414 H244"/>
  <text class="edge-lbl" x="306" y="414" text-anchor="middle" dominant-baseline="central">Control command</text>
  <path class="edge dash" fill="none" d="M360 446 H244"/>
  <text class="edge-lbl" x="300" y="446" text-anchor="middle" dominant-baseline="central">Actuation status</text>
  <rect class="card" x="16" y="504" width="220" height="92" rx="12"/>
  <text class="lbl" x="126" y="523" text-anchor="middle" dominant-baseline="central">Actuation command</text>
  <text class="sub" x="126" y="541" text-anchor="middle" dominant-baseline="central">Acceleration, brake, steering</text>
  <text class="code" x="126" y="559" text-anchor="middle" dominant-baseline="central">tier4_vehicle_msgs/msg/</text>
  <text class="code" x="126" y="577" text-anchor="middle" dominant-baseline="central">ActuationCommandStamped</text>
  <path class="edge dash" fill="none" d="M126 460 V496"/>
  <path class="edge dash" fill="none" d="M236 550 H324 V468 H352"/>
  <rect class="card" x="16" y="626" width="220" height="56" rx="12"/>
  <text class="lbl" x="126" y="645" text-anchor="middle" dominant-baseline="central">Vehicle communication</text>
  <text class="sub" x="126" y="663" text-anchor="middle" dominant-baseline="central">Vehicle-specific protocol</text>
  <path class="edge both" fill="none" d="M360 484 H342 V654 H244"/>
  <!-- Right column: signal commands and reports to control and localization -->
  <rect class="card" x="672" y="84" width="272" height="96" rx="12"/>
  <text class="lbl" x="808" y="105" text-anchor="middle" dominant-baseline="central">Vehicle signal commands</text>
  <text class="code" x="808" y="123" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/</text>
  <text class="code" x="808" y="141" text-anchor="middle" dominant-baseline="central">HazardLightsCommand</text>
  <text class="code" x="808" y="159" text-anchor="middle" dominant-baseline="central">TurnIndicatorsCommand</text>
  <path class="edge" fill="none" d="M600 38 H808 V76"/>
  <path class="flow" pathLength="100" d="M600 38 H808 V76"/>
  <path class="edge head" fill="none" d="M600 38 H808 V76"/>
  <path class="edge" fill="none" d="M672 132 H648 V372 H608"/>
  <path class="flow" pathLength="100" d="M672 132 H648 V372 H608"/>
  <path class="edge head" fill="none" d="M672 132 H648 V372 H608"/>
  <rect class="card" x="672" y="254" width="272" height="74" rx="12"/>
  <text class="lbl" x="808" y="273" text-anchor="middle" dominant-baseline="central">Steering status</text>
  <text class="code" x="808" y="291" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/</text>
  <text class="code" x="808" y="309" text-anchor="middle" dominant-baseline="central">SteeringReport</text>
  <rect class="card" x="672" y="346" width="272" height="92" rx="12"/>
  <text class="lbl" x="808" y="365" text-anchor="middle" dominant-baseline="central">Actuation status</text>
  <text class="sub" x="808" y="383" text-anchor="middle" dominant-baseline="central">Acceleration, brake, steering</text>
  <text class="code" x="808" y="401" text-anchor="middle" dominant-baseline="central">tier4_vehicle_msgs/msg/</text>
  <text class="code" x="808" y="419" text-anchor="middle" dominant-baseline="central">ActuationStatusStamped</text>
  <rect class="card" x="672" y="458" width="272" height="92" rx="12"/>
  <text class="lbl" x="808" y="477" text-anchor="middle" dominant-baseline="central">Velocity status</text>
  <text class="code" x="808" y="495" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/</text>
  <text class="code" x="808" y="513" text-anchor="middle" dominant-baseline="central">VelocityReport</text>
  <text class="sub" x="808" y="531" text-anchor="middle" dominant-baseline="central">Converted to TwistWithCovarianceStamped</text>
  <rect class="box muted" x="728" y="590" width="160" height="44" rx="10"/>
  <text class="lbl" x="808" y="612" text-anchor="middle" dominant-baseline="central">Localization</text>
