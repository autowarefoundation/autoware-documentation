<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 704" role="img" aria-labelledby="vehicle-interface-io-title">
  <title id="vehicle-interface-io-title">
    Planning and Control send the trajectory, the control command, and the signal commands through the vehicle command gate to the vehicle interface. The vehicle interface talks to the vehicle, uses
    an optional adapter for actuation commands, and returns the steering, actuation, velocity, and signal reports to Control and Localization.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-code-font-family: Roboto
    Mono, ui-monospace, monospace; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} .box.ext {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-dasharray: 6 5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .code {
  font-family: var(--md-code-font-family);
  font-size: 12px;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.both {
  marker-start: url("#aw-arrow");
} .edge.accent.both {
  marker-start: url("#aw-arrow-accent");
} .edge.plain {
  marker-end: none;
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="920" height="704"/>
  <circle class="halo" cx="460" cy="440" r="140"/>
  <circle class="halo cyan" cx="760" cy="420" r="120"/>

  <!-- Center column: from planning to the vehicle interface -->
  <rect class="box muted" x="360" y="16" width="200" height="44" rx="10"/>
  <text class="lbl" x="460" y="38" text-anchor="middle" dominant-baseline="central">Planning</text>
  <rect class="card" x="320" y="92" width="280" height="58" rx="12"/>
  <text class="lbl" x="460" y="112" text-anchor="middle" dominant-baseline="central">Trajectory</text>
  <text class="code" x="460" y="130" text-anchor="middle" dominant-baseline="central">autoware_planning_msgs/msg/Trajectory</text>
  <rect class="box muted" x="380" y="182" width="160" height="44" rx="10"/>
  <text class="lbl" x="460" y="204" text-anchor="middle" dominant-baseline="central">Control</text>
  <rect class="card" x="320" y="258" width="280" height="74" rx="12"/>
  <text class="lbl" x="460" y="277" text-anchor="middle" dominant-baseline="central">Vehicle control command</text>
  <text class="code" x="460" y="295" text-anchor="middle" dominant-baseline="central">autoware_control_msgs/msg/Control</text>
  <text class="code" x="460" y="313" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/GearCommand</text>
  <rect class="box" x="360" y="362" width="200" height="40" rx="10"/>
  <text class="lbl" x="460" y="382" text-anchor="middle" dominant-baseline="central">Vehicle command gate</text>
  <rect class="box primary" x="320" y="434" width="280" height="60" rx="12"/>
  <circle class="icon-bg on" cx="354" cy="464" r="16"/>
  <circle class="icon-line" cx="354" cy="464" r="7.5"/>
  <path class="icon-line" d="M346.5 464 H361.5 M354 464 V471.5"/>
  <text class="lbl on-primary" x="470" y="464" text-anchor="middle" dominant-baseline="central">Vehicle interface</text>
  <rect class="card" x="320" y="540" width="280" height="128" rx="12"/>
  <text class="lbl" x="460" y="559" text-anchor="middle" dominant-baseline="central">Vehicle signal reports</text>
  <text class="code" x="460" y="577" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/</text>
  <text class="code" x="460" y="595" text-anchor="middle" dominant-baseline="central">GearReport</text>
  <text class="code" x="460" y="613" text-anchor="middle" dominant-baseline="central">HazardLightsReport</text>
  <text class="code" x="460" y="631" text-anchor="middle" dominant-baseline="central">TurnIndicatorsReport</text>
  <text class="code" x="460" y="649" text-anchor="middle" dominant-baseline="central">ControlModeReport</text>
  <path class="edge accent" fill="none" d="M460 60 V84"/>
  <path class="flow flow-accent" pathLength="100" d="M460 60 V84"/>
  <path class="edge accent head" fill="none" d="M460 60 V84"/>
  <path class="edge accent" fill="none" d="M460 150 V174"/>
  <path class="flow flow-accent" pathLength="100" d="M460 150 V174"/>
  <path class="edge accent head" fill="none" d="M460 150 V174"/>
  <path class="edge accent" fill="none" d="M460 226 V250"/>
  <path class="flow flow-accent" pathLength="100" d="M460 226 V250"/>
  <path class="edge accent head" fill="none" d="M460 226 V250"/>
  <path class="edge accent" fill="none" d="M460 332 V354"/>
  <path class="flow flow-accent" pathLength="100" d="M460 332 V354"/>
  <path class="edge accent head" fill="none" d="M460 332 V354"/>
  <path class="edge accent" fill="none" d="M460 402 V426"/>
  <path class="flow flow-accent" pathLength="100" d="M460 402 V426"/>
  <path class="edge accent head" fill="none" d="M460 402 V426"/>
  <path class="edge" fill="none" d="M460 494 V532"/>
  <path class="flow" pathLength="100" d="M460 494 V532"/>
  <path class="edge head" fill="none" d="M460 494 V532"/>

  <!-- Left column: other command sources, the adapter, and the vehicle -->
  <rect class="card" x="16" y="112" width="240" height="64" rx="12"/>
  <text class="lbl" x="136" y="135" text-anchor="middle" dominant-baseline="central">Other controls</text>
  <text class="sub" x="136" y="153" text-anchor="middle" dominant-baseline="central">Emergency, external, joystick, ...</text>
  <rect class="box muted" x="16" y="200" width="240" height="52" rx="10"/>
  <text class="lbl" x="136" y="217" text-anchor="middle" dominant-baseline="central">System</text>
  <text class="sub" x="136" y="235" text-anchor="middle" dominant-baseline="central">Diagnostic graph and MRM handler</text>
  <rect class="card" x="16" y="270" width="240" height="48" rx="12"/>
  <text class="lbl" x="136" y="285" text-anchor="middle" dominant-baseline="central">MRM state</text>
  <text class="code" x="136" y="303" text-anchor="middle" dominant-baseline="central">/system/fail_safe/mrm_state</text>
  <path class="edge" fill="none" d="M256 144 H290 V372 H352"/>
  <path class="flow" pathLength="100" d="M256 144 H290 V372 H352"/>
  <path class="edge head" fill="none" d="M256 144 H290 V372 H352"/>
  <path class="edge" fill="none" d="M136 252 V262"/>
  <path class="flow" pathLength="100" d="M136 252 V262"/>
  <path class="edge head" fill="none" d="M136 252 V262"/>
  <path class="edge" fill="none" d="M256 294 H276 V392 H352"/>
  <path class="flow" pathLength="100" d="M256 294 H276 V392 H352"/>
  <path class="edge head" fill="none" d="M256 294 H276 V392 H352"/>
  <rect class="box ext" x="168" y="440" width="112" height="48" rx="10"/>
  <text class="lbl" x="224" y="455" text-anchor="middle" dominant-baseline="central">Adapter</text>
  <text class="sub" x="224" y="473" text-anchor="middle" dominant-baseline="central">Optional</text>
  <path class="edge both" fill="none" d="M320 464 H288"/>
  <rect class="card" x="16" y="516" width="240" height="92" rx="12"/>
  <text class="lbl" x="136" y="535" text-anchor="middle" dominant-baseline="central">Actuation command</text>
  <text class="sub" x="136" y="553" text-anchor="middle" dominant-baseline="central">Acceleration, brake, steering</text>
  <text class="code" x="136" y="571" text-anchor="middle" dominant-baseline="central">tier4_vehicle_msgs/msg/</text>
  <text class="code" x="136" y="589" text-anchor="middle" dominant-baseline="central">ActuationCommandStamped</text>
  <path class="edge" fill="none" d="M224 488 V508"/>
  <path class="flow" pathLength="100" d="M224 488 V508"/>
  <path class="edge head" fill="none" d="M224 488 V508"/>
  <rect class="card" x="16" y="630" width="240" height="56" rx="12"/>
  <text class="lbl" x="136" y="649" text-anchor="middle" dominant-baseline="central">Vehicle communication</text>
  <text class="sub" x="136" y="667" text-anchor="middle" dominant-baseline="central">Vehicle-specific protocol</text>
  <path class="edge both" fill="none" d="M320 482 H300 V658 H264"/>

  <!-- Right column: reports to control and localization -->
  <rect class="card" x="632" y="84" width="272" height="96" rx="12"/>
  <text class="lbl" x="768" y="105" text-anchor="middle" dominant-baseline="central">Vehicle signal commands</text>
  <text class="code" x="768" y="123" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/</text>
  <text class="code" x="768" y="141" text-anchor="middle" dominant-baseline="central">HazardLightsCommand</text>
  <text class="code" x="768" y="159" text-anchor="middle" dominant-baseline="central">TurnIndicatorsCommand</text>
  <path class="edge" fill="none" d="M560 38 H768 V76"/>
  <path class="flow" pathLength="100" d="M560 38 H768 V76"/>
  <path class="edge head" fill="none" d="M560 38 H768 V76"/>
  <path class="edge" fill="none" d="M632 132 H608 V372 H568"/>
  <path class="flow" pathLength="100" d="M632 132 H608 V372 H568"/>
  <path class="edge head" fill="none" d="M632 132 H608 V372 H568"/>
  <rect class="card" x="632" y="254" width="272" height="74" rx="12"/>
  <text class="lbl" x="768" y="273" text-anchor="middle" dominant-baseline="central">Steering status</text>
  <text class="code" x="768" y="291" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/</text>
  <text class="code" x="768" y="309" text-anchor="middle" dominant-baseline="central">SteeringReport</text>
  <rect class="card" x="632" y="346" width="272" height="92" rx="12"/>
  <text class="lbl" x="768" y="365" text-anchor="middle" dominant-baseline="central">Actuation status</text>
  <text class="sub" x="768" y="383" text-anchor="middle" dominant-baseline="central">Acceleration, brake, steering</text>
  <text class="code" x="768" y="401" text-anchor="middle" dominant-baseline="central">tier4_vehicle_msgs/msg/</text>
  <text class="code" x="768" y="419" text-anchor="middle" dominant-baseline="central">ActuationStatusStamped</text>
  <rect class="card" x="632" y="458" width="272" height="92" rx="12"/>
  <text class="lbl" x="768" y="477" text-anchor="middle" dominant-baseline="central">Velocity status</text>
  <text class="code" x="768" y="495" text-anchor="middle" dominant-baseline="central">autoware_vehicle_msgs/msg/</text>
  <text class="code" x="768" y="513" text-anchor="middle" dominant-baseline="central">VelocityReport</text>
  <text class="sub" x="768" y="531" text-anchor="middle" dominant-baseline="central">Converted to TwistWithCovarianceStamped</text>
  <rect class="box muted" x="688" y="590" width="160" height="44" rx="10"/>
  <text class="lbl" x="768" y="612" text-anchor="middle" dominant-baseline="central">Localization</text>
