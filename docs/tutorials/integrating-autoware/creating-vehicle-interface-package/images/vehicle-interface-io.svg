  <path class="edge head" fill="none" d="M600 464 H618 V504 H624"/>
  <path class="edge" fill="none" d="M768 254 V204 H548"/>
  <path class="flow" pathLength="100" d="M768 254 V204 H548"/>
  <path class="edge head" fill="none" d="M768 254 V204 H548"/>
