<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="ackermann-kinematic-model-title">
  <title id="ackermann-kinematic-model-title">
    An Ackermann vehicle seen from above, first with the front wheels straight and then steered to the right, where the axes of all wheels meet at one center of rotation. The inputs are the speed v at
    the rear axle and the steering angle phi.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .edge.dash {
  stroke-dasharray: 6 5;
} .edge.plain {
  marker-end: none;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .wheel {
  fill: #1b1d29;
}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="960" height="430"/>
  <circle class="halo" cx="170" cy="240" r="140"/>
  <circle class="halo cyan" cx="640" cy="240" r="150"/>

  <!-- Straight ahead -->
  <text class="ttl" x="40" y="30">Straight ahead</text>
  <rect class="box" x="80" y="334" width="180" height="12" rx="6"/>
  <rect class="wheel" x="68" y="300" width="24" height="80" rx="8"/>
  <rect class="wheel" x="248" y="300" width="24" height="80" rx="8"/>
  <rect class="box" x="100" y="132" width="140" height="16" rx="8"/>
  <path class="edge plain" d="M80 140 L108 140 M232 140 L260 140"/>
  <path class="edge plain" d="M108 140 L128.0 200.0 L212.0 200.0 L232 140"/>
  <circle class="bound point" cx="108.0" cy="140.0" r="4"/>
  <circle class="bound point" cx="232.0" cy="140.0" r="4"/>
  <circle class="bound point" cx="128.0" cy="200.0" r="4"/>
  <circle class="bound point" cx="212.0" cy="200.0" r="4"/>
  <rect class="wheel" x="68" y="100" width="24" height="80" rx="8"/>
  <rect class="wheel" x="248" y="100" width="24" height="80" rx="8"/>
  <path class="edge accent" d="M170 340 V262"/>
  <circle class="bound point" cx="170" cy="340" r="6"/>
  <text class="lbl" x="184" y="280" dominant-baseline="central">v</text>

  <!-- Steering to the right -->
  <text class="ttl" x="480" y="30">Steering to the right</text>
  <rect class="box" x="520" y="334" width="180" height="12" rx="6"/>
  <rect class="wheel" x="508" y="300" width="24" height="80" rx="8"/>
  <rect class="wheel" x="688" y="300" width="24" height="80" rx="8"/>
  <rect class="box" x="540" y="132" width="140" height="16" rx="8"/>
  <path class="edge plain" d="M520 140 L548 140 M672 140 L700 140"/>
  <path class="edge plain" d="M548 140 L535.3 202.0 L613.2 163.2 L672 140"/>
  <circle class="bound point" cx="548.0" cy="140.0" r="4"/>
  <circle class="bound point" cx="672.0" cy="140.0" r="4"/>
  <circle class="bound point" cx="535.3" cy="202.0" r="4"/>
  <circle class="bound point" cx="613.2" cy="163.2" r="4"/>
  <rect class="wheel" x="508" y="100" width="24" height="80" rx="8" transform="rotate(30 520 140)"/>
  <rect class="wheel" x="688" y="100" width="24" height="80" rx="8" transform="rotate(50 700 140)"/>
  <path class="leader" d="M520 140 L866.4 340 M700 140 L866.4 340 M700 340 H866.4"/>
  <circle class="bound point" cx="866.4" cy="340" r="6"/>
  <text class="note" x="866.4" y="364" text-anchor="middle" dominant-baseline="central">Center of rotation</text>
  <path class="edge plain dash" d="M610 140 V50"/>
  <path class="edge plain" d="M610 140 L665.4 69.0"/>
  <path class="edge accent" fill="none" d="M610 84 A56 56 0 0 1 644.4 95.8"/>
  <text class="lbl" x="640" y="62" text-anchor="middle" dominant-baseline="central">φ</text>
  <text class="note" x="610" y="410" text-anchor="middle" dominant-baseline="central">φ is negative here: Autoware counts a counterclockwise steering angle as positive.</text>
  <path class="edge accent" d="M610 340 V262"/>
  <circle class="bound point" cx="610" cy="340" r="6"/>
  <text class="lbl" x="624" y="280" dominant-baseline="central">v</text>
</svg>
