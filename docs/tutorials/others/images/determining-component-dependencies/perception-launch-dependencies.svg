<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1140" role="img" aria-labelledby="perception-launch-dependencies-title">
  <title id="perception-launch-dependencies-title">
    Dependencies of autoware_perception_launch in Autoware 2.0.0: it runs 44 perception packages, which depend on 55 more packages of libraries, messages, and GPU tools, and it needs autoware_cmake to
    build and autoware_lint_common to test.
  </title>
