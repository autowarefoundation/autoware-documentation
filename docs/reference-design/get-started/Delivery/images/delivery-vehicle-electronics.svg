<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="delivery-vehicle-electronics-title">
  <title id="delivery-vehicle-electronics-title">
    The electronic control units of the Autoware AW1 delivery vehicle seen from above: a motor controller at each wheel, the NXP S32G3 gateway, two control modules, the i.MX8M infotainment unit, and
    the AGX Orin autonomy computer.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} .box.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 14%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-cyan) 70%, transparent);
} .box.muted {
  fill: color-mix(in srgb, var(--aw-d-fg) 5%, var(--aw-d-bg));
  stroke: color-mix(in srgb, var(--aw-d-fg) 20%, transparent);
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .icon {
  fill: var(--aw-d-muted);
} .note {
  font-size: 13px;
  fill: var(--aw-d-fg);
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .card.ai {
  fill: color-mix(in srgb, var(--aw-cyan) 8%, var(--aw-d-node));
  stroke: color-mix(in srgb, var(--aw-c-cyan) 65%, transparent);
}
  </style>
  <defs data-aw-standalone="">
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="900" height="450"/>
  <circle class="halo" cx="250" cy="205" r="160"/>
  <circle class="halo cyan" cx="700" cy="250" r="140"/>

  <!-- Wheels -->
  <rect class="icon" x="130" y="22" width="90" height="26" rx="8"/>
  <rect class="icon" x="130" y="358" width="90" height="26" rx="8"/>
  <rect class="icon" x="690" y="22" width="90" height="26" rx="8"/>
  <rect class="icon" x="690" y="358" width="90" height="26" rx="8"/>

  <!-- The vehicle body, from above -->
  <rect class="glass-panel" x="50" y="38" width="800" height="334" rx="64"/>
  <text class="ttl" x="450" y="66" text-anchor="middle">Vehicle, top view</text>

  <!-- Motor controllers, one for each in-wheel motor -->
  <rect class="box" x="100" y="78" width="150" height="54" rx="12"/>
  <text class="lbl" x="175" y="96" text-anchor="middle" dominant-baseline="central">Motor control</text>
  <text class="sub" x="175" y="115" text-anchor="middle" dominant-baseline="central">In-wheel motor</text>
  <rect class="box" x="100" y="286" width="150" height="54" rx="12"/>
  <text class="lbl" x="175" y="304" text-anchor="middle" dominant-baseline="central">Motor control</text>
  <text class="sub" x="175" y="323" text-anchor="middle" dominant-baseline="central">In-wheel motor</text>
  <rect class="box" x="650" y="78" width="150" height="54" rx="12"/>
  <text class="lbl" x="725" y="96" text-anchor="middle" dominant-baseline="central">Motor control</text>
  <text class="sub" x="725" y="115" text-anchor="middle" dominant-baseline="central">In-wheel motor</text>
  <rect class="box" x="650" y="286" width="150" height="54" rx="12"/>
  <text class="lbl" x="725" y="304" text-anchor="middle" dominant-baseline="central">Motor control</text>
  <text class="sub" x="725" y="323" text-anchor="middle" dominant-baseline="central">In-wheel motor</text>

  <!-- Gateway and control modules -->
  <rect class="box primary" x="100" y="178" width="200" height="56" rx="12"/>
  <text class="lbl on-primary" x="200" y="197" text-anchor="middle" dominant-baseline="central">Gateway/controls</text>
  <text class="sub on-primary" x="200" y="216" text-anchor="middle" dominant-baseline="central">NXP S32G3</text>
  <rect class="box muted" x="326" y="178" width="120" height="56" rx="12"/>
  <text class="lbl" x="386" y="197" text-anchor="middle" dominant-baseline="central">Control module</text>
  <text class="sub" x="386" y="216" text-anchor="middle" dominant-baseline="central">See the note</text>
  <rect class="box muted" x="466" y="178" width="120" height="56" rx="12"/>
  <text class="lbl" x="526" y="197" text-anchor="middle" dominant-baseline="central">Control module</text>
  <text class="sub" x="526" y="216" text-anchor="middle" dominant-baseline="central">See the note</text>

  <!-- Infotainment and autonomy -->
  <rect class="box" x="610" y="142" width="200" height="54" rx="12"/>
  <text class="lbl" x="710" y="160" text-anchor="middle" dominant-baseline="central">Infotainment</text>
  <text class="sub" x="710" y="179" text-anchor="middle" dominant-baseline="central">i.MX8M based</text>
  <rect class="card ai" x="610" y="216" width="200" height="54" rx="12"/>
  <text class="lbl" x="710" y="234" text-anchor="middle" dominant-baseline="central">Autonomy</text>
  <text class="sub" x="710" y="253" text-anchor="middle" dominant-baseline="central">AGX Orin based</text>

  <!-- Note -->
  <text class="note" x="450" y="412" text-anchor="middle" dominant-baseline="central">Control modules: steering, braking, BMS, DCDC, OBC, access, and lighting.</text>
</svg>
