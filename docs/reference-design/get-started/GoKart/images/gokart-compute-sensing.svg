  <rect class="card" x="530" y="390" width="170" height="64" rx="14"/>
  <circle class="icon-bg" cx="556" cy="422.0" r="15"/>
  <rect class="icon-line" x="550" y="416.0" width="12" height="12" rx="2"/>
  <path class="icon-line" d="M553 413V416M559 413V416M553 428V431M559 428V431"/>
  <text class="lbl" x="580" y="413.0" dominant-baseline="central">Nucleo L432KC</text>
