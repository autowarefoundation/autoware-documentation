  <text class="edge-lbl" x="472" y="330" text-anchor="middle" dominant-baseline="central">USB</text>
  <path class="edge accent" d="M645 390 V284"/>
  <path class="flow flow-accent" pathLength="100" d="M645 390 V284"/>
  <path class="edge accent head" d="M645 390 V284"/>
  <text class="edge-lbl" x="657" y="337" text-anchor="start" dominant-baseline="central">USB-TTL</text>
  <path class="edge" d="M750 422 H704"/>
  <text class="edge-lbl" x="727" y="404" text-anchor="middle" dominant-baseline="central">I2C</text>

  <!-- Computer -->
  <rect class="box primary" x="490" y="200" width="200" height="80" rx="18"/>
  <circle class="icon-bg on" cx="522" cy="240" r="18"/>
  <rect class="icon-line" x="513" y="231" width="18" height="12" rx="2"/>
  <path class="icon-line" d="M510 248H534"/>
  <text class="lbl on-primary" x="550" y="230" dominant-baseline="central">Computer</text>
  <text class="sub on-primary" x="550" y="250" dominant-baseline="central">Computing unit</text>

