<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" role="img" aria-labelledby="gokart-tech-info-chart-title">
  <title id="gokart-tech-info-chart-title">
    Tech-info radar chart of the Go-Kart: payload 2, cost 1, communication 2, vehicle speed 2, traffic density 1, distance between disengagements 1, power consumption 1, camera 2, GPS 1, LiDAR 1, and
    radar 0.
  </title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-cyan: #00c8ff; --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-muted: var(--md-default-fg-color--light); --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .lanelet {
  fill: color-mix(in srgb, var(--aw-indigo) 38%, transparent);
  stroke: none;
} .bound {
  fill: none;
  stroke: var(--aw-cyan);
  stroke-width: 2.5;
} .bound.point {
  fill: var(--aw-cyan);
  stroke: none;
} .leader {
  fill: none;
  stroke: var(--aw-d-muted);
  stroke-width: 1;
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .glow {
  filter: url("#aw-glow");
}
  </style>
  <defs data-aw-standalone="">
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <filter id="aw-glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="820" height="660"/>
  <circle class="halo" cx="410" cy="360" r="230"/>
  <circle class="halo cyan" cx="580" cy="210" r="110"/>

  <!-- Panel and heading -->
  <rect class="glass-panel" x="20" y="20" width="780" height="620" rx="22"/>
  <text class="ttl" x="44" y="52">Tech-info chart</text>
  <text class="sub" x="44" y="72">Go-Kart. Each axis has a value from 0 to 5.</text>

  <!-- Grid: one ring for each value from 1 to 5, and one spoke for each axis -->
  <path class="leader" d="M410.0 322.0 L430.5 328.0 L444.6 344.2 L447.6 365.4 L438.7 384.9 L420.7 396.5 L399.3 396.5 L381.3 384.9 L372.4 365.4 L375.4 344.2 L389.5 328.0 Z"/>
  <path class="leader" d="M410.0 284.0 L451.1 296.1 L479.1 328.4 L485.2 370.8 L467.4 409.8 L431.4 432.9 L388.6 432.9 L352.6 409.8 L334.8 370.8 L340.9 328.4 L368.9 296.1 Z"/>
  <path class="leader" d="M410.0 246.0 L471.6 264.1 L513.7 312.6 L522.8 376.2 L496.2 434.7 L442.1 469.4 L377.9 469.4 L323.8 434.7 L297.2 376.2 L306.3 312.6 L348.4 264.1 Z"/>
  <path class="leader" d="M410.0 208.0 L492.2 232.1 L548.3 296.9 L560.5 381.6 L524.9 459.5 L452.8 505.8 L367.2 505.8 L295.1 459.5 L259.5 381.6 L271.7 296.9 L327.8 232.1 Z"/>
  <path class="leader" d="M410.0 170.0 L512.7 200.2 L582.8 281.1 L598.1 387.0 L553.6 484.4 L463.5 542.3 L356.5 542.3 L266.4 484.4 L221.9 387.0 L237.2 281.1 L307.3 200.2 Z"/>
  <path class="leader" d="M410 360 L410.0 170.0"/>
  <path class="leader" d="M410 360 L512.7 200.2"/>
  <path class="leader" d="M410 360 L582.8 281.1"/>
  <path class="leader" d="M410 360 L598.1 387.0"/>
  <path class="leader" d="M410 360 L553.6 484.4"/>
  <path class="leader" d="M410 360 L463.5 542.3"/>
  <path class="leader" d="M410 360 L356.5 542.3"/>
  <path class="leader" d="M410 360 L266.4 484.4"/>
  <path class="leader" d="M410 360 L221.9 387.0"/>
  <path class="leader" d="M410 360 L237.2 281.1"/>
  <path class="leader" d="M410 360 L307.3 200.2"/>
  <text class="edge-lbl" x="402" y="360.0" text-anchor="end" dominant-baseline="central">0</text>
  <text class="edge-lbl" x="402" y="322.0" text-anchor="end" dominant-baseline="central">1</text>
  <text class="edge-lbl" x="402" y="284.0" text-anchor="end" dominant-baseline="central">2</text>
  <text class="edge-lbl" x="402" y="246.0" text-anchor="end" dominant-baseline="central">3</text>
  <text class="edge-lbl" x="402" y="208.0" text-anchor="end" dominant-baseline="central">4</text>
  <text class="edge-lbl" x="402" y="170.0" text-anchor="end" dominant-baseline="central">5</text>

  <!-- Go-Kart -->
  <path class="lanelet" d="M410.0 284.0 L430.5 328.0 L479.1 328.4 L485.2 370.8 L438.7 384.9 L420.7 396.5 L399.3 396.5 L352.6 409.8 L372.4 365.4 L375.4 344.2 L410.0 360.0 Z"/>
  <path class="bound glow" d="M410.0 284.0 L430.5 328.0 L479.1 328.4 L485.2 370.8 L438.7 384.9 L420.7 396.5 L399.3 396.5 L352.6 409.8 L372.4 365.4 L375.4 344.2 L410.0 360.0 Z"/>
  <circle class="bound point" cx="410.0" cy="284.0" r="4.5"/>
  <circle class="bound point" cx="430.5" cy="328.0" r="4.5"/>
  <circle class="bound point" cx="479.1" cy="328.4" r="4.5"/>
  <circle class="bound point" cx="485.2" cy="370.8" r="4.5"/>
  <circle class="bound point" cx="438.7" cy="384.9" r="4.5"/>
  <circle class="bound point" cx="420.7" cy="396.5" r="4.5"/>
  <circle class="bound point" cx="399.3" cy="396.5" r="4.5"/>
  <circle class="bound point" cx="352.6" cy="409.8" r="4.5"/>
  <circle class="bound point" cx="372.4" cy="365.4" r="4.5"/>
  <circle class="bound point" cx="375.4" cy="344.2" r="4.5"/>
  <circle class="bound point" cx="410.0" cy="360.0" r="4.5"/>

  <!-- Axis names and values -->
  <text class="lbl" x="410.0" y="119.0" text-anchor="middle" dominant-baseline="central">Payload</text>
  <text class="sub" x="410.0" y="137.0" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="lbl" x="525.7" y="153.0" text-anchor="start" dominant-baseline="central">Cost</text>
  <text class="sub" x="525.7" y="171.0" text-anchor="start" dominant-baseline="central">1</text>
  <text class="lbl" x="604.7" y="262.1" text-anchor="start" dominant-baseline="central">Communication</text>
  <text class="sub" x="604.7" y="280.1" text-anchor="start" dominant-baseline="central">2</text>
  <text class="lbl" x="621.8" y="381.5" text-anchor="start" dominant-baseline="central">Vehicle speed</text>
  <text class="sub" x="621.8" y="399.5" text-anchor="start" dominant-baseline="central">2</text>
  <text class="lbl" x="571.7" y="491.1" text-anchor="start" dominant-baseline="central">Traffic density</text>
  <text class="sub" x="571.7" y="509.1" text-anchor="start" dominant-baseline="central">1</text>
  <text class="lbl" x="470.3" y="568.3" text-anchor="start" dominant-baseline="central">Distance between</text>
  <text class="lbl" x="470.3" y="585.3" text-anchor="start" dominant-baseline="central">disengagements</text>
  <text class="sub" x="470.3" y="603.3" text-anchor="start" dominant-baseline="central">1</text>
  <text class="lbl" x="349.7" y="568.3" text-anchor="end" dominant-baseline="central">Power consumption</text>
  <text class="sub" x="349.7" y="586.3" text-anchor="end" dominant-baseline="central">1</text>
  <text class="lbl" x="248.3" y="491.1" text-anchor="end" dominant-baseline="central">Camera</text>
  <text class="sub" x="248.3" y="509.1" text-anchor="end" dominant-baseline="central">2</text>
  <text class="lbl" x="198.2" y="381.5" text-anchor="end" dominant-baseline="central">GPS</text>
  <text class="sub" x="198.2" y="399.5" text-anchor="end" dominant-baseline="central">1</text>
  <text class="lbl" x="215.3" y="262.1" text-anchor="end" dominant-baseline="central">LiDAR</text>
  <text class="sub" x="215.3" y="280.1" text-anchor="end" dominant-baseline="central">1</text>
  <text class="lbl" x="294.3" y="153.0" text-anchor="end" dominant-baseline="central">Radar</text>
  <text class="sub" x="294.3" y="171.0" text-anchor="end" dominant-baseline="central">0</text>
</svg>
