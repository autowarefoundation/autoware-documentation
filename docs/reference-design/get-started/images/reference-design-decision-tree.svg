<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="reference-design-decision-tree-title">
  <title id="reference-design-decision-tree-title">A decision tree that picks a reference design from the technology maturity, the environment, the location, and the vehicle size.</title>
  <style data-aw-standalone="">
    svg { --aw-c-cyan: #0098c7; --aw-c-indigo: var(--aw-indigo); --aw-d-accent: var(--aw-c-cyan); --aw-d-bg: color-mix(in
    srgb, var(--aw-c-indigo) 2%, var(--md-default-bg-color)); --aw-d-fg: var(--md-default-fg-color); --aw-d-line: #8d90a3; --aw-d-muted: var(--md-default-fg-color--light); --aw-d-node: var(--md-default-bg-color); --aw-d-node-stroke: color-mix(in
    srgb, var(--aw-c-indigo) 45%, transparent); --aw-flow-tone: 22%; --aw-glass-a: #ffffffd9; --aw-glass-b: #f0f6ff8c; --aw-halo-opacity: 0.22; --aw-heading-font-family: Outfit, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; --aw-indigo: #3f2ee3; --md-default-bg-color: #fff; --md-default-fg-color: #000000de; --md-default-fg-color--light: #0000008c; font-family: var(--aw-heading-font-family); background-color: var(--aw-d-bg, #fff); } .aw-d-arrow {
  fill: var(--aw-d-line);
} .aw-d-arrow--accent {
  fill: var(--aw-d-accent);
} .box {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.5;
} .box.primary {
  fill: url("#aw-grad-primary");
  stroke: none;
} text {
  font-size: 14px;
  fill: var(--aw-d-fg);
} .lbl {
  font-weight: 600;
} .sub {
  font-size: 12px;
  fill: var(--aw-d-muted);
} .ttl {
  font-size: 12px;
  font-weight: 700;
  fill: var(--aw-d-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
} .on-primary {
  fill: #fff;
} .on-primary.sub {
  fill: #ffffffc7;
} .edge-lbl {
  font-size: 12px;
  fill: var(--aw-d-muted);
  paint-order: stroke;
  stroke: var(--aw-d-bg);
  stroke-width: 5px;
  stroke-linejoin: round;
} .edge {
  fill: none;
  stroke: var(--aw-d-line);
  stroke-width: 1.6;
  marker-end: url("#aw-arrow");
} .edge.accent {
  stroke: var(--aw-d-accent);
  stroke-width: 2;
  marker-end: url("#aw-arrow-accent");
} .aw-glass-a {
  stop-color: var(--aw-glass-a);
} .aw-glass-b {
  stop-color: var(--aw-glass-b);
} .aw-dot {
  fill: var(--aw-d-fg);
  opacity: 0.12;
} .dots {
  fill: url("#aw-dots");
} .halo {
  fill: url("#aw-grad-halo");
  opacity: var(--aw-halo-opacity);
} .halo.cyan {
  fill: url("#aw-grad-halo-cyan");
} .glass-panel {
  fill: url("#aw-grad-glass");
  stroke: color-mix(in srgb, var(--aw-c-cyan) 45%, transparent);
  stroke-width: 1.5;
} .card {
  fill: var(--aw-d-node);
  stroke: var(--aw-d-node-stroke);
  stroke-width: 1.2;
  filter: url("#aw-shadow");
} .icon-bg {
  fill: url("#aw-grad-primary");
} .icon-bg.on {
  fill: #ffffff2e;
} .icon-line {
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
} .icon-dot {
  fill: #fff;
} .flow {
  fill: none;
  stroke: color-mix(in srgb, var(--aw-d-line) var(--aw-flow-tone), #fff);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 6 44;
  animation: aw-flow 2.4s linear infinite;
} .flow.flow-accent {
  stroke: color-mix(in srgb, var(--aw-d-accent) var(--aw-flow-tone), #fff);
} .edge.head, .edge.accent.head, .traj.head, .route.head {
  stroke: none;
} @keyframes aw-flow {
  from {
    stroke-dashoffset: 6;
  }

  to {
    stroke-dashoffset: -94;
  }
} @media (prefers-reduced-motion: reduce) {.flow {
    display: none;
    animation: none;
  }}
  </style>
  <defs data-aw-standalone="">
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <marker id="aw-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="aw-d-arrow aw-d-arrow--accent" d="M0,0.5 L10,5 L0,9.5 z"/>
    </marker>
    <pattern id="aw-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="aw-dot" cx="2" cy="2" r="1.1"/>
    </pattern>
    <linearGradient id="aw-grad-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="aw-glass-a"/>
      <stop offset="1" class="aw-glass-b"/>
    </linearGradient>
    <radialGradient id="aw-grad-halo">
      <stop offset="0" stop-color="#3f2ee3" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f2ee3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-grad-halo-cyan">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2ee3"/>
      <stop offset="1" stop-color="#2a6df2"/>
    </linearGradient>
    <filter id="aw-shadow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background: a faint dot grid and soft glows -->
  <rect class="dots" x="0" y="0" width="900" height="690"/>
  <circle class="halo" cx="155" cy="300" r="150"/>
  <circle class="halo cyan" cx="710" cy="200" r="130"/>
  <circle class="halo" cx="710" cy="520" r="120"/>

  <!-- Outcomes -->
  <rect class="glass-panel" x="540" y="24" width="340" height="646" rx="22"/>
  <text class="ttl" x="560" y="54">Reference designs</text>

  <!-- Start -->
  <rect class="box primary" x="95" y="24" width="120" height="40" rx="20"/>
  <text class="lbl on-primary" x="155" y="44" text-anchor="middle" dominant-baseline="central">Start</text>
  <path class="edge accent" d="M155 64 V96"/>
  <path class="flow flow-accent" pathLength="100" d="M155 64 V96"/>
  <path class="edge accent head" d="M155 64 V96"/>

  <!-- Decision: Technology maturity? -->
  <rect class="box primary" x="40" y="100" width="230" height="56" rx="16"/>
  <circle class="icon-bg on" cx="70" cy="128" r="16"/>
  <text class="lbl on-primary" x="70" y="128" text-anchor="middle" dominant-baseline="central">?</text>
  <text class="lbl on-primary" x="98" y="128" dominant-baseline="central">Technology maturity?</text>
  <path class="edge accent" d="M155 156 V226"/>
  <path class="flow flow-accent" pathLength="100" d="M155 156 V226"/>
  <path class="edge accent head" d="M155 156 V226"/>
  <text class="edge-lbl" x="167" y="191" dominant-baseline="central">TRL-6 or less</text>

  <!-- Decision: Environment? -->
  <rect class="box primary" x="40" y="230" width="230" height="56" rx="16"/>
  <circle class="icon-bg on" cx="70" cy="258" r="16"/>
  <text class="lbl on-primary" x="70" y="258" text-anchor="middle" dominant-baseline="central">?</text>
  <text class="lbl on-primary" x="98" y="258" dominant-baseline="central">Environment?</text>
  <path class="edge accent" d="M155 286 V396"/>
  <path class="flow flow-accent" pathLength="100" d="M155 286 V396"/>
  <path class="edge accent head" d="M155 286 V396"/>
  <text class="edge-lbl" x="167" y="341" dominant-baseline="central">Outdoor</text>

  <!-- Decision: Location? -->
  <rect class="box primary" x="40" y="400" width="230" height="56" rx="16"/>
  <circle class="icon-bg on" cx="70" cy="428" r="16"/>
  <text class="lbl on-primary" x="70" y="428" text-anchor="middle" dominant-baseline="central">?</text>
  <text class="lbl on-primary" x="98" y="428" dominant-baseline="central">Location?</text>
  <path class="edge accent" d="M155 456 V566"/>
  <path class="flow flow-accent" pathLength="100" d="M155 456 V566"/>
  <path class="edge accent head" d="M155 456 V566"/>
  <text class="edge-lbl" x="167" y="511" dominant-baseline="central">City</text>

  <!-- Decision: Size? -->
  <rect class="box primary" x="40" y="570" width="230" height="56" rx="16"/>
  <circle class="icon-bg on" cx="70" cy="598" r="16"/>
  <text class="lbl on-primary" x="70" y="598" text-anchor="middle" dominant-baseline="central">?</text>
  <text class="lbl on-primary" x="98" y="598" dominant-baseline="central">Size?</text>

  <!-- TRL-7 or higher -->
  <path class="edge" d="M270 128 C420 128 404 118 554 118"/>
  <text class="edge-lbl" x="412" y="123" text-anchor="middle" dominant-baseline="central">TRL-7 or higher</text>
  <rect class="card" x="560" y="93" width="300" height="50" rx="14"/>
  <circle class="icon-bg" cx="588" cy="118" r="16"/>
  <path class="icon-line" d="M579 125 V116 L585 120 V116 L591 120 V110 H596 V125 Z"/>
  <text class="lbl" x="614" y="109" dominant-baseline="central">Example production platforms</text>
  <text class="sub" x="614" y="128" dominant-baseline="central">See the table on this page</text>

  <!-- Indoor only -->
  <path class="edge" d="M270 258 C420 258 404 218 554 218"/>
  <text class="edge-lbl" x="412" y="238" text-anchor="middle" dominant-baseline="central">Indoor only</text>
  <rect class="card" x="560" y="193" width="300" height="50" rx="14"/>
  <circle class="icon-bg" cx="588" cy="218" r="16"/>
  <rect class="icon-line" x="580" y="212" width="16" height="11" rx="3"/>
  <circle class="icon-dot" cx="584.5" cy="217.5" r="1.8"/>
  <circle class="icon-dot" cx="591.5" cy="217.5" r="1.8"/>
  <path class="icon-line" d="M588 212 V208 M583 223 V227 M593 223 V227"/>
  <text class="lbl" x="614" y="209" dominant-baseline="central">LSA, racing robots, Go-Kart</text>
  <text class="sub" x="614" y="228" dominant-baseline="central">Low-speed and development platforms</text>

  <!-- Mixed indoor and outdoor -->
  <path class="edge" d="M270 258 C420 258 404 298 554 298"/>
  <text class="edge-lbl" x="412" y="278" text-anchor="middle" dominant-baseline="central">Mixed indoor and outdoor</text>
  <rect class="card" x="560" y="273" width="300" height="50" rx="14"/>
  <circle class="icon-bg" cx="588" cy="298" r="16"/>
  <rect class="icon-line" x="580" y="292" width="16" height="11" rx="3"/>
  <circle class="icon-dot" cx="584.5" cy="297.5" r="1.8"/>
  <circle class="icon-dot" cx="591.5" cy="297.5" r="1.8"/>
  <path class="icon-line" d="M588 292 V288 M583 303 V307 M593 303 V307"/>
  <text class="lbl" x="614" y="289" dominant-baseline="central">LSA</text>
  <text class="sub" x="614" y="308" dominant-baseline="central">Low-speed autonomy guideline</text>

  <!-- Off-road -->
  <path class="edge" d="M270 428 C420 428 404 368 554 368"/>
  <text class="edge-lbl" x="412" y="398" text-anchor="middle" dominant-baseline="central">Off-road</text>
  <rect class="card" x="560" y="343" width="300" height="50" rx="14"/>
  <circle class="icon-bg" cx="588" cy="368" r="16"/>
  <path class="icon-line" d="M578 375 L585 364 L589 369 L593 362 L598 375 Z"/>
  <text class="lbl" x="614" y="359" dominant-baseline="central">Off-road vehicle design</text>
  <text class="sub" x="614" y="378" dominant-baseline="central">OrV guideline</text>

  <!-- Closed campus -->
  <path class="edge" d="M270 428 C420 428 404 428 554 428"/>
  <text class="edge-lbl" x="412" y="428" text-anchor="middle" dominant-baseline="central">Closed campus</text>
  <rect class="card" x="560" y="403" width="300" height="50" rx="14"/>
  <circle class="icon-bg" cx="588" cy="428" r="16"/>
  <rect class="icon-line" x="580" y="422" width="16" height="11" rx="3"/>
  <circle class="icon-dot" cx="584.5" cy="427.5" r="1.8"/>
  <circle class="icon-dot" cx="591.5" cy="427.5" r="1.8"/>
  <path class="icon-line" d="M588 422 V418 M583 433 V437 M593 433 V437"/>
  <text class="lbl" x="614" y="419" dominant-baseline="central">LSA</text>
  <text class="sub" x="614" y="438" dominant-baseline="central">Low-speed autonomy guideline</text>

  <!-- Highway -->
  <path class="edge" d="M270 428 C420 428 404 488 554 488"/>
  <text class="edge-lbl" x="412" y="458" text-anchor="middle" dominant-baseline="central">Highway</text>
  <rect class="card" x="560" y="463" width="300" height="50" rx="14"/>
  <circle class="icon-bg" cx="588" cy="488" r="16"/>
  <path class="icon-line" d="M579 492 V488 L582 483 H594 L597 488 V492 Z"/>
  <circle class="icon-dot" cx="583" cy="494" r="2.2"/>
  <circle class="icon-dot" cx="593" cy="494" r="2.2"/>
  <text class="lbl" x="614" y="479" dominant-baseline="central">PoV reference design</text>
  <text class="sub" x="614" y="498" dominant-baseline="central">Privately owned vehicles</text>

  <!-- Large size -->
  <path class="edge" d="M270 598 C420 598 404 568 554 568"/>
  <text class="edge-lbl" x="412" y="583" text-anchor="middle" dominant-baseline="central">Large size</text>
  <rect class="card" x="560" y="543" width="300" height="50" rx="14"/>
  <circle class="icon-bg" cx="588" cy="568" r="16"/>
  <rect class="icon-line" x="579" y="560" width="18" height="14" rx="3"/>
  <path class="icon-line" d="M579 567 H597"/>
  <circle class="icon-dot" cx="583" cy="576" r="2"/>
  <circle class="icon-dot" cx="593" cy="576" r="2"/>
  <text class="lbl" x="614" y="559" dominant-baseline="central">Bus</text>
  <text class="sub" x="614" y="578" dominant-baseline="central">For example, the ITRI bus</text>

  <!-- Sedan size -->
  <path class="edge" d="M270 598 C420 598 404 628 554 628"/>
  <text class="edge-lbl" x="412" y="613" text-anchor="middle" dominant-baseline="central">Sedan size</text>
  <rect class="card" x="560" y="603" width="300" height="50" rx="14"/>
  <circle class="icon-bg" cx="588" cy="628" r="16"/>
  <path class="icon-line" d="M579 632 V628 L582 623 H594 L597 628 V632 Z"/>
  <circle class="icon-dot" cx="583" cy="634" r="2.2"/>
  <circle class="icon-dot" cx="593" cy="634" r="2.2"/>
  <text class="lbl" x="614" y="619" dominant-baseline="central">RoboTaxi</text>
  <text class="sub" x="614" y="638" dominant-baseline="central">Point-to-point service</text>
</svg>
