site_name: Autoware Documentation
site_url: https://autowarefoundation.github.io/autoware-documentation/
repo_url: https://github.com/autowarefoundation/autoware
edit_uri: https://github.com/autowarefoundation/autoware-documentation/edit/main/docs/
docs_dir: docs
copyright: Copyright &copy; 2026 The Autoware Foundation

theme:
  name: material
  variant: modern
  custom_dir: overrides
  features:
    #    - navigation.expand # Until we simplify the navigation
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.tracking
  favicon: assets/images/autoware-foundation.png
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: autoware/logo
    repo: fontawesome/brands/github
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra:
  version:
    provider: mike

extra_css:
  - assets/css/theme.css
  - assets/css/extra.css
  - https://use.fontawesome.com/releases/v7.1.0/css/all.css

extra_javascript:
  - assets/js/mathjax.js
  - assets/js/hidden-page-nav.js
  - assets/js/header-home-link.js
  - https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - awesome-nav
  - exclude:
      regex:
        - ^(?!(.*/)?assets/).*\.(?!(.*\.)?md|(.*\.)?svg|(.*\.)?png|(.*\.)?gif|(.*\.)?jpg|(.*\.)?pdf).*$
        - ^(.*/)?[^.]*$
  - macros:
      include_dir: docs
      include_yaml:
        autoware_interfaces: yaml/autoware-interfaces.yaml
  - minify:
      minify_html: true
  - mkdocs-video
  - redirects:
      redirect_maps:
        index.md: home/index.md
  # https://zensical.org/docs/setup/search/
  - search:
      separator: '[\s\-_,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - fontawesome_in_markdown
  - footnotes
  - md_in_html
  - mdx_math
  - mdx_truly_sane_lists:
      nested_indent: 2
  - plantuml_markdown:
      server: http://www.plantuml.com/plantuml
      format: svg
      cachedir: .cache/plantuml
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: "#"
      toc_depth: 3
