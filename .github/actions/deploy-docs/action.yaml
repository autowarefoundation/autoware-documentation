# A copy of autowarefoundation/autoware-github-actions/deploy-docs@v1 for Zensical.
# The shared action installs Python 3.10, but Zensical 0.0.68 and later need Python 3.11 or later.
# Use the shared action again when it accepts a Python version.
name: deploy-docs
description: Build the site with Zensical and deploy it to the gh-pages branch with mike.

inputs:
  token:
    description: The token that pushes to gh-pages and comments on the pull request.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Zensical and mike
      run: |
        pip3 install -U wheel
        pip3 install -r mkdocs-requirements.txt
      shell: bash

    - name: Set git config
      uses: autowarefoundation/autoware-github-actions/set-git-config@v1
      with:
        token: ${{ inputs.token }}

    - name: Set docs version name
      id: set-docs-version-name
      run: |
        DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
          VERSION_NAME="pr-$PR_NUMBER"
        elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
          PR_NUMBER=""
          VERSION_NAME="${GITHUB_REF#refs/tags/}"
        else
          PR_NUMBER=""
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Add branch- prefix for non-default branches
          if [ "$BRANCH_NAME" = "$DEFAULT_BRANCH" ]; then
            VERSION_NAME="$BRANCH_NAME"
          else
            VERSION_NAME="branch-$BRANCH_NAME"
          fi
        fi

        echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

        # Replace invalid character '/' by '-'
        echo "version-name=${VERSION_NAME//\//-}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Deploy docs
      run: |
        git fetch
        mike deploy --push ${{ steps.set-docs-version-name.outputs.version-name }}
      shell: bash

    - name: Create comment body
      if: ${{ steps.set-docs-version-name.outputs.pr-number != '' }}
      id: create-comment-body
      run: |
        site_url=$(grep -oP "site_url:\s+\K(.*)" mkdocs.yaml)
        # site_url ends with a slash, which Zensical needs for versioned URLs.
        base_url="${site_url%/}/${{ steps.set-docs-version-name.outputs.version-name }}/"
        comment_lines=$(${GITHUB_ACTION_PATH}/create-doc-comment.sh "$base_url" "origin/$GITHUB_BASE_REF")

        # Output multiline strings: https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "comment-body<<$EOF" >> $GITHUB_OUTPUT
        echo "$comment_lines" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: Find PR comment
      if: ${{ steps.set-docs-version-name.outputs.pr-number != '' }}
      id: find-comment
      uses: peter-evans/find-comment@v4
      with:
        issue-number: ${{ steps.set-docs-version-name.outputs.pr-number }}
        comment-author: github-actions[bot]
        body-includes: Documentation URL

    - name: Update PR comment
      if: ${{ steps.set-docs-version-name.outputs.pr-number != '' }}
      uses: peter-evans/create-or-update-comment@v5
      with:
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        issue-number: ${{ steps.set-docs-version-name.outputs.pr-number }}
        token: ${{ inputs.token }}
        body: |
          ${{ steps.create-comment-body.outputs.comment-body }}
        edit-mode: replace
