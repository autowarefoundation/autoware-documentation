name: deploy-docs

on:
  push:
    branches:
      - main
      - galactic
    paths:
      - mkdocs.yaml
      - "**/*.md"
      - "**/*.svg"
      - "**/*.png"
      - "**/*.jpg"
    tags:
      - "[0-9]+.[0-9]+*"
  pull_request_target:
    types:
      - synchronize
      - labeled
  workflow_dispatch:

permissions: {}

jobs:
  # The label approves one commit, so a new commit removes it. A maintainer adds it again after a review.
  remove-label-on-new-commit:
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'tag:deploy-docs') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu

          gh pr edit "$PR_NUMBER" --remove-label tag:deploy-docs

  # Publishes the site that build-docs-pr built for the head commit at the time the label is added.
  # It runs only the code of the base branch. The built site is copied as data and never run.
  deploy-docs-pr:
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'tag:deploy-docs' && github.event.pull_request.state == 'open' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      VERSION_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      # The base branch, not the pull request: its scripts publish the site.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: repository
          persist-credentials: false

      # The site that is copied in comes from untrusted code, so the token is not kept in gh-pages/.git.
      - name: Check out gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: false

      - name: Find the build of the labeled commit
        id: find-build
        run: |
          set -eu

          # Wait up to 20 minutes, in case the label is added while the build still runs.
          # Runs are listed newest first. Only a run of this pull request's branch counts.
          for _ in $(seq 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-docs-pr.yaml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
              --jq '.workflow_runs[] | select(.head_repository.full_name == env.HEAD_REPO and .head_branch == env.HEAD_REF) | "\(.id) \(.status) \(.conclusion)"')
            running=false
            failure=""
            while read -r run_id status conclusion; do
              [ -n "$run_id" ] || continue
              run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
              if [ "$status" = "action_required" ] || [ "$conclusion" = "action_required" ]; then
                echo "::error::The build of $HEAD_SHA waits for a maintainer to approve the workflows of the fork: $run_url. Approve it, then add the label again."
                exit 1
              elif [ "$status" != "completed" ]; then
                running=true
              elif [ "$conclusion" = "success" ]; then
                artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=docs-pr-$PR_NUMBER" \
                  --jq '[.artifacts[] | select(.expired | not)] | length')
                if [ "$artifacts" -gt 0 ]; then
                  echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                failure="The build $run_url has no site for this pull request. Its site expires after 7 days. Re-run the build, then add the label again."
              elif [ -z "$failure" ]; then
                failure="The build of $HEAD_SHA did not succeed ($conclusion): $run_url"
              fi
            done <<<"$runs"

            if [ "$running" = "false" ] && [ -n "$failure" ]; then
              echo "::error::$failure"
              exit 1
            fi
            sleep 20
          done

          echo "::error::No finished build-docs-pr run for $HEAD_SHA after 20 minutes. Add the label again after the build."
          exit 1
        shell: bash

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: docs-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/site
          run-id: ${{ steps.find-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Publish docs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        working-directory: gh-pages
        run: |
          set -eu

          # git gets the token on the command line of each call, and never in gh-pages/.git/config,
          # because the files of the pull request sit in that tree.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          auth_header="http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"

          # Another workflow can update gh-pages at the same time, so start again from its new state if the push fails.
          for _ in $(seq 5); do
            python3 ../repository/tools/gh-pages-versions/publish_preview.py \
              "$RUNNER_TEMP/site" . "$VERSION_NAME" --default-branch "$DEFAULT_BRANCH"
            git add --all -- "$VERSION_NAME" versions.json
            if git diff --cached --quiet; then
              echo "The preview is already up to date."
              exit 0
            fi
            git commit --quiet -m "Deployed ${HEAD_SHA:0:9} to $VERSION_NAME"
            if git -c "$auth_header" push origin HEAD:gh-pages; then
              exit 0
            fi
            git -c "$auth_header" fetch --depth=1 origin gh-pages
            git reset --hard FETCH_HEAD
          done

          echo "::error::Could not push to gh-pages."
          exit 1
        shell: bash

      - name: Create comment body
        id: create-comment-body
        run: |
          set -eu

          site_url=$(grep -oP "^site_url:\s+\K(.*)" repository/mkdocs.yaml)

          # The files of the published commit, not of a later push. The preview is already
          # published, so a failure here only leaves the list of changed pages out.
          if ! changed_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA?per_page=100" --jq '.files[].filename'); then
            echo "::warning::Could not list the changed files, so the comment links the preview only."
            changed_files=""
          fi
          comment_body=$(printf '%s\n' "$changed_files" |
            python3 repository/tools/gh-pages-versions/preview_comment.py "$site_url/$VERSION_NAME/" "$HEAD_SHA")

          # Output multiline strings: https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "comment-body<<$EOF"
            echo "$comment_body"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Find PR comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Documentation URL

      - name: Update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ${{ steps.create-comment-body.outputs.comment-body }}
          edit-mode: replace

  deploy-docs-push:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy docs
        uses: autowarefoundation/autoware-github-actions/deploy-docs@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          latest: false
          mkdocs-requirements-txt: mkdocs-requirements.txt

  deploy-docs-workflow-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy docs
        uses: autowarefoundation/autoware-github-actions/deploy-docs@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          latest: false
          mkdocs-requirements-txt: mkdocs-requirements.txt

  delete-old-version-docs:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: deploy-docs-push
    permissions:
      contents: write
    uses: ./.github/workflows/delete-old-version-docs.yaml
    with:
      # keep-lines is left at the default of the called workflow.
      dry-run: false
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # deploy-docs-pr is not listed, because publish_preview.py already writes versions.json in order.
  reorder-versions-json:
    needs:
      - deploy-docs-push
      - deploy-docs-workflow-dispatch
      - delete-old-version-docs
    permissions:
      contents: write
    if: |
      always() &&
      (
        needs.deploy-docs-push.result == 'success' ||
        needs.deploy-docs-workflow-dispatch.result == 'success' ||
        needs.delete-old-version-docs.result == 'success'
      )
    uses: ./.github/workflows/reorder-versions.yaml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
