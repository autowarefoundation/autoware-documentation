name: deploy-docs

# Builds the site of the default branch and of every pull request, and keeps each one as an artifact.
# The publish-docs workflow puts these artifacts and the releases together on the site.

on:
  push:
    branches:
      - main
    paths:
      - mkdocs.yaml
      - mkdocs-requirements.txt
      - main.py
      - overrides/**
      - .github/actions/build-docs/**
      - "**/.nav.yml"
      - yaml/**
      - "**/*.md"
      - "**/*.js"
      - "**/*.css"
      - "**/*.svg"
      - "**/*.png"
      - "**/*.jpg"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A pull request from a branch of this repository is published as a preview by the publish-docs workflow.
  # A pull request from a fork only keeps its site as an artifact, which comment-docs-artifact links on the pull request.
  deploy-docs-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build docs
        id: build
        uses: ./.github/actions/build-docs
        with:
          artifact-name: docs-pr-${{ github.event.pull_request.number }}

      - name: Explain how to view the site
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          ARTIFACT_URL: ${{ steps.build.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "::notice::The site is not published for a pull request from a fork. Download it from the run summary: $ARTIFACT_URL"
          {
            echo "## Documentation preview"
            echo
            echo "This pull request comes from a fork, so the site is built but not published."
            echo
            echo "1. Download the site: [docs-pr-$PR_NUMBER]($ARTIFACT_URL). You must be signed in to GitHub."
            echo "2. Unzip it to a new folder."
            echo "3. In that folder, run \`python3 -m http.server 8000\`."
            echo "4. Open <http://localhost:8000/>."
            echo
            echo "The site is kept for 90 days."
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  deploy-docs-main:
    if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-main
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build docs
        uses: ./.github/actions/build-docs
        with:
          artifact-name: docs-${{ github.event.repository.default_branch }}
