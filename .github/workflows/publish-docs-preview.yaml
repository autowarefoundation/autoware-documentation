name: publish-docs-preview

# Publishes the site that build-docs-preview built to Cloudflare Pages.
# GitHub runs this workflow from the default branch, so a pull request cannot change it.
# It checks out no code and treats the built site as data.

on:
  workflow_run:
    workflows:
      - build-docs-preview
    types:
      - completed

permissions: {}

jobs:
  publish-docs-preview:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - name: Publish docs preview
        uses: autowarefoundation/autoware-github-actions/publish-docs-preview@v1
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project: autoware-documentation-preview
